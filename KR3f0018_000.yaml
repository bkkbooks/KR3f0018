front:
  text: 御製律厯淵源序
  hash: sha256:a836d04583d1eac482cb4a5b7f1ba05d044af80ff6e7aec1beb4b0db8f5b72b2
  markers:
  - {type: page-break, offset: 0, content: '', id: KR3f0018_WYG_000-1a, image: WYG0790/WYG0790-0001a.png}
body:
  text: 粵稽前古堯有羲和之咨舜有后夔之命周有商高之訪逮及厯代史書莫不志律厯備數度用以敬天授民格神和人行於邦國而周於鄉閭典至重也我皇考聖祖仁皇帝生知好學天縱多能萬幾之暇留心律厯算法積數十年博考繁賾搜抉奧微參伍錯綜一以貫之爰指授莊親王等率同詞臣於大內蒙養齋編纂每日進呈親加改正彙輯成書總一百卷名為律厯淵源凡為三部區其編次一曰厯象考成其編有二上編曰揆天察紀論本體之象以明理也下編曰明時正度密致用之術列立成之表以著法也一曰律呂正義其編有三上編曰正律審音所以定尺考度求律本也下編曰和聲定樂所以因律製器審八音也續編曰協均度曲所以窮五聲二變相和相應之源也一曰數理精藴其編有二上編曰立綱明體所以解周髀探河洛闡幾何明比例下編曰分條致用以線面體括九章極於借衰割圜求體變化於比例規比例數借根方諸法蓋表數備矣洪惟我國家聲靈逺屆文軌大同自極西歐羅巴諸國專精世業各獻其技於閶闔之下典籍圖表燦然畢具我皇考兼綜而裁定之故凡古法之歲久失傳擇焉而不精與西洋之侏􅍣詰屈語焉而不詳者咸皆條理分明本末昭晰其精當詳悉雖專門名家莫能窺萬一所謂惟聖者能之豈不信歟夫理與數合符而不離得其數則理不外焉此圖書所以開易範之先也以線體例絲管之别以弧角求經緯之度若此類者皆數法之精而律厯之要斯在故三書相為表裏齊七政正五音而必通乎九章之義所由試之而不忒用之而有效也書成纂修諸臣請序而傳之恭惟聖學高深豈易鑽仰顧朕夙承庭訓於此書之大指微義提命殷勤歲月斯久尊其所聞敬效一詞之贊蓋是書也豈惟皇考手澤之存實稽古準今集其大成高出前代垂千萬世不易之法將欲協時正日同律度量衡求之是書則可以建天地而不悖俟聖人而不惑矣雍正元年十月朔敬書欽定四庫全書子部六御製厯象考成總目天文算法類一推步之屬上編十六卷下編十卷表十六卷臣等謹案御製厯象考成四十二卷康熙五十二年聖祖仁皇帝御定律厯淵源之第一部也按推步之術古法無徵所可考者漢太初術以下至明大統術而已自利瑪竇入中國測驗漸密而辨爭亦遂日起終明之世朝議堅守門户訖未嘗用也國朝聲教覃敷極西諸國皆纍譯而至其術愈推愈精又與崇禎新法算法圖表不合而作新法算書時歐邏巴人自祕其學立説復深隱不可解聖祖仁皇帝乃特命諸臣詳考法原定著此書分上下二編上編曰揆天察紀下編曰明時正度集中西之大同建天地而不悖精微廣大殊非管蠡之見所能測今據其可以仰窺者與新法算書互校如黃道斜交赤道而出其內外其相距之度即二至太陽距赤道之緯度新法算書用西人第谷所測定為二十三度三十一分三十秒今則纍測夏至午正太陽髙度得黃赤大距為二十三度二十九分三十秒較第谷所測度少二分蓋黃赤二道由逺而近其所以古多今少漸次移易之故非巧算所能及故當隨時密測以合天行者也又時差之根其故有二一因太陽之實行而時刻為之進退蓋以髙卑為加減之限也一因赤道之升度而時刻為之消長蓋以分至為加減之限也新法算書合二者以立表名曰日差然髙卑每年有行分則宫度引數必不能相同合立一表歲久必不可用今分為二表加減二次而於法為密矣又新法算書推算日食三差以黃平象限為本然三差並生於太隂而太隂之經緯度為白道經緯度當以白平象限為本太隂在此度即無東西差而南北差最大與髙下差等若在此度以東則差而早宜有減差在此度以西則差而遲宜有加差其加減有時而與黃平象限同有時而與黃平象限異故定交角有反其加減之用也又厯來算術定月食初虧復圓方位東西南北主黃道之經緯而言非謂地平經緯之東西南北也惟月實行之度在初宫六宫望時又為子正則黃道經緯之東西南北與地平經度合否則黃道升降有邪正而加時距午有逺近兩經緯回然各别所推之東西南北必不與地平之方位相符今實指其在月體之上下左右為衆目所共睹較舊法更為親切又新法算書言五星古圖以地為心新圖以日為心然第谷推步均數惟火星以日為心若以地為心立算其得數亦與之同知第谷乃虛立巧算之法而五星本天實皆以地為心蓋金水二星以日為心者乃其本輪非本天也土木火三星以日為心者乃次輪上星行距日之迹亦非本天也至若弧三角之法新法算書所載圖説殊多龎雜而正􅋃又遺黃赤互求之法今以正􅋃約之為對邊對角及垂􅋃矢較三比例則周天經緯皆可互求而操之有要矣此皆訂正新法算書之大端其餘與新法算書相同者亦推衍精密無差纍黍洵乎大聖人之制作萬世無出其範圍者矣乾隆四十九年六月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀雍正二年五月十七日奉旨開載纂修編校諸臣職名承旨纂修和碩莊親王臣允祿和碩誠親王臣允祉彚編日講官起居注詹事府少詹事兼翰林院侍講學士加一級臣何國宗翰林院編修臣梅玨成分校原任湖南巡撫都察院右副都御史臣魏廷珍翰林院編修臣王蘭生原進士臣方苞考測會考府郎中臣成德參領臣阿齊圖原任吏部員外郎臣顧琮工部員外郎加一級臣照海食員外郎俸欽天監五官正臣明安圖兵部主事加一級臣平安福建汀州府知府臣何國棟江西袁州府知府臣李英翰林院筆帖式加一級臣豐盛額校算兵部郎中兼管欽天監左監副事加二級臣何國柱刑部員外郎臣倫大理欽天監左監副臣四格內閣中書臣黃茂欽天監博士加一級臣潘汝瑛山東莒州知州臣陳永年廣東西寧縣知縣臣薩海京衛武學教授臣胡振舉人揀選知縣臣髙澤會考府筆帖式臣傅明安吏部筆帖式臣戴嵩安候補筆帖式臣黑都生員臣秦寧生員臣五德寶護軍臣楊格校録翰林院侍讀臣吳孝登翰林院侍講臣留保刑部郎中加一級臣朱嵩户部主事臣黑赫禮部主事臣穆繼倫刑部主事臣玉羾工部主事加一級臣色合立户部司庫加一級臣穆成格工部司庫臣伍大夀行人司行人加一級臣顧陳垿湖廣黃州府同知臣郎瀚江南通州知州加一級臣白映棠河南孟津縣知縣加一級臣陳永貞監生候選州同知臣張嘉論生員臣焦繼謨
