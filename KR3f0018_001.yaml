body:
  text: 欽定四庫全書御製厯象考成上編卷一厯理總論天象地體厯元黃赤道經緯度歲差天象虞書堯典曰欽若昊天厯象日月星辰楚詞天問曰圜則九重孰營度之後世厯家謂天有十二重非天實有如許重數蓋言日月星辰運轉於天各有所行之道即楚詞所謂圜也欲明諸圜之理必詳諸圜之動欲考諸圜之動必以至靜不動者準之然後得其盈縮蓋天道靜專者也天行動直者也至靜者自有一天與地相為表裏故羣動者運於其間而不息若無至靜者以驗至動則聖人亦無所成其能矣人恆在地面測天而七政之行無不可得者正為以靜驗動故也十二重天最外者為至靜不動次為宗動南北極赤道所由分也次為南北歲差次為東西歲差此二重天其動甚微厯家姑置之而不論焉次為三垣二十八宿經星行焉次為填星所行次為歲星所行次為熒惑所行次則太陽所行黃道是也次為太白所行次為辰星所行最內者則太隂所行白道是也要以去地之逺近而為諸天之內外然所以知去地之逺近者則又從諸曜之掩食及行度之遲疾而得之蓋凡為所掩食者必在上而掩之食之者必在下月體能蔽日光而日為之食是日逺月近之徵也月能掩食五星而月與五星又能掩食恆星是五星髙於月而卑於恆星也五星又能互相掩食是五星各有逺近也又宗動天以渾灝之氣挈諸天左旋其行甚速故近宗動天者左旋速而右移之度遲漸遠宗動天則左旋較遲而右移之度轉速今右移之度惟恆星最遲土木次之火又次之日金水較速而月最速是又以次而近之證也是故恆星與宗動相較而歲差生焉太陽與恆星相㑹而歲實生焉黃道與赤道出入而節氣生焉太陽與太隂循環而朔望盈虛生焉黃道與白道交錯而薄蝕生焉五星與太陽離合而遲速順逆生焉地心與諸圜之心不同而盈縮生焉厯代專家多方測量立法布算積久愈詳已得其大體其間或有豪芒之差諸說不無同異者蓋因儀器仰測穹蒼失之纎微年久則著雖有聖人莫能預定惟立窮源竟委之法隨時實測取其精密附近之數折中用之每數十年而一修正斯為治厯之通術而古聖欽若之道庶可復於今日矣地體欲明天道之流行先達地球之圓體日月星辰每日出入平地一次而天下大地必非同時出入居東方者先見居西方者後見東西相去萬八千里則東方人見日為午正者西方人見日為卯正也周天三百六十度每度當地上二百里是故推驗大地經緯度分皆與天應測緯度者用午正日晷或測南北二極測經度則必於月蝕取之蓋月蝕與日蝕異日之食限分數隨地不同月之食限分數天下皆同但入限有晝夜人有見不見耳此處食甚於子者處其東三十度必食甚於丑處其西三十度必食甚於亥是故相去九十度則此見食於子而彼見食於酉相去百八十度則此見食於子而彼當食於午雖食而不可見矣設如午酉子卯為日天甲乙丙丁為地球日在午人居甲者日正在其天頂得午時人居丙者日却在其天頂對衝而得子時東去甲九十度居丁者得酉時而西去甲九十度居乙者又得卯時矣夫居甲丙者以酉乙丁卯為地平而居乙丁者則又以午甲丙子為地平蓋大地皆以日到天頂為午正也是故測東西之經度者兩地同測月食虧復時刻或相約於同夜測月與某星同經度分為其時刻分秒相隔一時則東西相去六千里如測南北之緯度則於兩地測北極出地之度所差一度即相去二百里此皆地球圓體之明驗也厯元治厯者必有起算之端是謂厯元其法有二一則逺溯古初冬至七曜齊元之日為元自漢太初以來諸厯所用之積年是也一則截算為元若元授時厯以至元辛巳天正冬至為元今時憲厯以崇禎元年戊辰天正冬至為元是也二者雖同為起算之端然積年實不如截算之簡易也夫所謂七曜齊元者乃溯上古冬至之時歲月日時皆㑹甲子日月如合璧五星如聨珠是以為造厯之元使果有此雖萬世遵用可矣而草一史所載諸家厯元無一同者是其所用積年之久近皆非有所承受但以巧算取之而已當其立法之初亦必有所驗於近測遂援之以立術於是溯而上之至於數千萬年之逺庶幾各曜之躔次可以齊同然既欲其上合厯元又欲其不違近測竒零分秒之數決不能齊勢不能不稍為遷就以求其巧合其始也據近測以求積年其既也且將因積年而改近測矣杜預云治厯者當順天以求合不當為合以驗天積年之法是為合以驗天也安得為立法之盡善乎若夫截算之法不用積年虛率而一以實測為憑誠為順天求合之道治厯者所當取法也今定康熙二十三年甲子天正冬至次日壬申子正初刻為厯元即康熙二十二年十一月初五日子正初刻七政皆從此起算其應用諸數皆係實測庶數有可徵而理有所據矣黃赤道天包地外圜轉不息南北兩極為運行之樞紐地居天中體圓而靜人環地面以居隨其所至適見天體之半中華之地面近北故北極常現南極常隱平分兩極之中橫帶天腰者為赤道赤道距天頂之度即北極出地之度也赤道以北為內為隂以南為外為陽斜交赤道而半出其南半出其北者為黃道乃太陽一歲所躔之軌迹也黃赤道相交之兩界為春秋分距赤道南二十三度半為冬至距赤道北二十三度半為夏至七政所行之道紛然不齊惟恃黃赤二道以為推測之本蓋太陽循黃道東行而出入於赤道之南北太隂與五星各循本道東行而又出入於黃道之南北故弦赤二道之位定則晝夜永短寒暑進退以及晦朔弦望薄蝕朓朒皆從此可稽矣經緯度恆星七政各有經緯度蓋天周弧線縱橫交加即如布帛之經緯然故以東西為經南北為緯然有在天之經緯有隨地之經緯在天則為赤道為黃道隨地則為地平赤道均分三百六十度平分之為半周各一百八十度四分之為象限各九十度六分之為紀限各六十度十二分之為宮為時各三十度是為赤經從經度出弧線與赤道十字相交各引長之㑹於南北極皆成全圜亦分為三百六十度兩極相距各一百八十度兩極距赤道俱九十度是為赤緯依緯度作圜與赤道平行名距等圈此圈大小不一距赤道近則大距赤道逺則小其度亦三百六十俱與赤道之度相應也赤道之用有動有靜動者隨天左旋與黃道相交日躔之南北於是乎限靜者太虛之位亘古不移晝夜之時刻於是乎紀焉黃道之宮度並如赤道其與赤道相交之兩㸃為春秋分相距皆半周平分兩交之中為冬夏至距兩交各一象限六分象限為節氣各十五度是為黃經從經度出弧線與黃道十字相交各引長之周於天體即成全圜其各圜相湊之處不在赤道之南北兩極而别有其樞心是為黃極黃極之距赤極即兩道相距之度其距黃道亦皆九十度是為黃緯而月與五星出入黃道之南北者悉於是而辨焉故凡南北圈過赤道極者必與赤道成直角而不能與黃道成直角其過黃道極者亦必與黃道成直角而不能與赤道成直角惟過黃赤兩極之圈其過黃赤道也必當冬夏二至之度所以並成直角名為極至交圈又若赤道度為主而以黃道度準之則互形大小何也渾圓之體當腰之度最寬漸近兩端則漸狹距等圈之度也二至時黃道以腰度當赤道距等圈之度故黃道一度當赤道一度有餘二分時兩道雖皆腰度然赤道平而黃道斜故黃道一度當赤道一度不足也此所謂同升之差而七政升降之斜正伏見之先後皆由是而推焉至於地平經緯則以各人所居之天頂為極蓋人所居之地不同故天頂各異而經緯從而變也地在天中體圓而小隨人所立凡目力所極適得大圓之一半則地雖圓而與平體無異故謂之地平乃諸曜出沒之界晝夜晦明之交也地平亦分三百六十度四分之為四方子午卯酉各相距九十度二十四分之為二十四向各十五度是為地平經從經度出弧線上㑹於天頂並皆九十度從地平下至天頂之衝亦九十度是為地平緯又名髙弧髙弧從地平正午上㑹天頂者其全圜必過赤道南北兩極名為子午圈乃諸曜出入地平適中之界而北極之髙下晷影之長短中星之推移皆由是而測焉是故經緯相求黃赤互變因黃赤而求地平或因地平而求黃赤乃厯象之要務推測之所取準也歲差歲差者太陽每歲與恆星相距之分也如今年冬至太陽躔某宿度至明年冬至時不能復躔原宿度而有不及之分但其差甚微古人初未之覺至晉虞喜始知之因立歲差法厯代治厯者宗焉而所定之數各家不同喜以五十年差一度劉宋何承天以百年差一度祖冲之以四十五年差一度隋劉焯以七十五年差一度唐傅仁均以五十五年差一度僧一行以八十二年差一度惟宋楊忠輔以六十七年差一度以周天三百六十度每度六十分每分六十秒約之得每年差五十二秒半元郭守敬因之較諸家為密今新法實測晷影驗之中星得七十年有餘而差一度每年差五十一秒此所差之數在古法為冬至西移之度新法為恆星東行之度徵之天象恆星原有動移則新法之理長也詳恆星厯理御製厯象考成上編卷一
