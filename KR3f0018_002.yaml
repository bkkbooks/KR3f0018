body:
  text: 欽定四庫全書御製厯象考成上編卷二弧三角形上弧三角形總論弧三角形綱領弧三角形凡例正弧三角形論正弧三角形圖說正弧三角形八線勾股比例圖說正弧三角形用次形圖說正弧三角形邊角相求法正弧三角形設例七則弧三角形總論弧三角形者球面弧線所成也古厯家有黄赤相準之率大約就渾儀度之僅得大概未能形諸算術惟元郭守敬以弧矢命算黄赤相求始有定率視古為密但其法用三乘方取數甚難自西人利瑪竇湯若望等翻譯厯書始有曲線三角形之法三弧度相交成三角形其三弧三角各有相應之八線弧與弧相交即線與線相遇而勾股比例生焉於是乎有黄道可以知赤道有赤道可以知黄道有經可以知緯有緯可以知經厯象之法至此而備勾股之用至此而極矣弧三角形綱領凡弧三角形皆在球面球面之腰圍一線謂之大圈如甲乙丙丁為子午規戊己為赤道庚辛為黄道壬乙癸丁為地平規如此之類皆為大圈其周度皆相等故可以相為比例凡圈皆有極極距圈皆九十度如赤道則有南北極黄道則有黄極若圈不相等則為距等圈如子丑二圈其四圍之距大圈皆相等而與大圈平行雖亦為三百六十度其分則小於大圈距大圈愈逺距極愈近則其圈愈小至極一㸃而止不能與大圈為比例故弧三角形之角度邊度皆大圈之度也凡兩弧相交所成角相距皆半周一百八十度名其角度則必取其兩弧各足象限九十度其對角之弧即為本角之度如甲乙丙丁為黄道甲戊丙己為赤道甲丙二處相交相距各半周一百八十度即如春秋分試於甲丙弧之各平分九十度處作丁己乙戊垂弧凡言垂弧皆曲線畫圖於平面不能顯出故作虚線以别之則丁己弧為甲丁己三角形之甲角度亦為丙丁己三角形之丙角度其乙戊弧為甲乙戊三角形之甲角度亦為丙乙戊三角形之丙角度即如冬夏至之大距為春秋分之角度葢甲丙為極則丁己乙戊為腰圈所謂大圈者是也凡弧三角形之三弧不足九十度者必引長至九十度其對角之弧方為本角之度如甲乙丙弧三角形三弧皆不足九十度則将甲乙弧引長至丁甲丙弧引長至戊作丁戊弧其丁戊弧之度即甲角之度也又将乙甲弧引長至己乙丙弧引長至庚作己庚弧其己庚弧之度即乙角之度也又将丙甲弧引長至辛丙乙弧引長至壬作辛壬弧其辛壬弧之度即丙角之度也凡弧三角形其角適足九十度者為直角為正弧三角形甲圖是也大於九十度者為鈍角不及九十度者為鋭角俱為斜弧三角形乙圖丙圖是也因三邊皆弧故與直線三角形不同直線三角形有一直角或一鈍角餘二角必銳弧三角形則有一直角二銳角者如丁形有一直角二鈍角者如戊形有一直角一鈍角一銳角者如己形有二直角一銳角者如庚形有二直角一鈍角者如辛形有三角俱直者如壬形有一鈍角二銳角者如癸形有三角俱鈍者如子形有一銳角二鈍角者如丑形而弧三角之形勢大概盡於此數端矣弧三角形凡例一直線三角形之三角相加成一百八十度弧三角形之三角相加最小者亦必大於一百八十度但不得滿五百四十度因其有三鈍角每一鈍角不得滿一百八十度故三鈍角不得滿五百四十度一直線三角形知兩角即知其所餘一角弧三角形雖知兩角其餘一角非算不知一直線三角形之邊小則咫尺大則千百萬里實有尺度之可量弧三角形之邊俱係弧度必在半周一百八十度之内但合三邊不得滿三百六十度葢三百六十度則成全圜而不得成角矣一直線三角形之八線惟用於角弧三角形之八線并用於邊角之八線與邊之八線相求仍以勾股為比例也一直線三角形兩形之三邊各相等者為相等形兩形之三角各相等者為同式形弧三角形則但有相等形而無同式形葢以兩形之三角同其三邊必各相同也一直線三角形可以三邊求角不可以三角求邊而弧三角形既可以三邊求角又可以三角求邊一弧三角形三角三弧共六件知三件可求其餘理與直線三角形同一正弧三角形除直角外二角三弧共五件知二件可求其餘理與直線三角形同一斜弧三角形作垂弧分為兩正弧三角形與直線三角形作中垂線之理同一弧三角形所知之三件有弧角相對者即用弧角為比例理與直線三角形同一正弧三角形弧角不相對者則用次形法一斜弧三角形知三邊求角者用總較法知三角求邊者先用次形法将角易為邊邊易為角然後用總較法一斜弧三角形知兩邊一角而角在兩邊之間者用總較法或用垂弧法知兩角一邊而邊在兩角之間者先用次形法将角易為邊邊易為角然後用總較法或用垂弧法正弧三角形論正弧三角形必有一直角者葢因南北二極為赤道之樞紐皆距赤道九十度故凡過南北二極經圈與赤道相交所成之角俱為直角其相當之弧皆九十度又凡有一圈即有兩極其過兩極經圈與本圈相交亦必為直角其所成三角形必皆為正弧三角形夫正弧三角形所知之三件弧角相對者用弧角之八線所成勾股為比例而弧角不相對者則用次形盖以弧角之八線所成勾股比例不生於本形而生於次形而次形者乃以本形與象限相減之餘度所成故用本形之餘弦餘切即用次形之正弦正切也其法可易弧為角易角為弧若斜弧三角形可易大形為小形易大邊為小邊易鈍角成銳角邊與角雖不相對可易為相對且知三角即可以求邊其理實一以貫之也今以黄道赤道與過極經圈所成之三角形設例而正弧三角形比例推算之法無不統於是矣正弧三角形圖說設黄赤大距二十三度三十分如甲乙丙丁為赤道甲戊丙己為黄道相交於甲丙甲為春分丙為秋分戊為夏至己為冬至庚為北極辛為南極庚戊乙辛己丁為二極二至交圈戊至乙己至丁俱二十三度三十分為黄赤大距今作庚壬癸辛為過南北二極經圈與黄道交於壬與赤道交於癸成甲癸壬正弧三角形甲為黄道赤道交角當戊乙弧二十三度三十分癸為直角葢庚辛二極即赤道之極皆距赤道九十度故凡過南北極經圈與赤道所成之角皆為直角其相當之弧皆九十度又如子丑為黄道兩極若從子丑二處作子寅卯丑過黄極經圈與黄道交於卯與赤道交於寅成甲寅卯正弧三角形則卯亦為直角葢子丑為黄道兩極皆距黄道九十度故凡過黄極經圈與黄道所成之角皆為直角其相當之弧皆九十度由此推之凡有一圈必有兩極其過兩極圈與本圈相交必為直角其所成三角形必皆為正弧三角形可知矣正弧三角形八線勾股比例圖說設黄道四十五度甲為黄道赤道交角甲乙為黄道四十五度甲丙為赤道同升度乙丙為黄赤距度成甲乙丙正弧三角形甲丁甲戊皆象限丁戊為黄赤大距二十三度三十分即甲角度己為北極庚為南極己丁庚壬為二極二至交圈甲為春分丁為夏至辛為秋分壬為冬至癸為地心己乙丙庚為過南北二極經圈其甲乙丙三角形之八線各成相當比例之勾股形丁子為甲角之正弦子癸為甲角之餘弦丑戊為甲角之正切丑癸為甲角之正割戊癸丁癸皆為半徑成丑戊癸及丁子癸同式兩勾股形乙寅為乙丙距緯弧之正弦乙卯為甲乙黄道弧之正弦将兩正弦之寅卯二處作虚線聨之成乙寅卯勾股形兩正弦之末立於各半徑寅卯二處而寅卯二處皆未抵於弧界故不得為正弦今以虚線聨之者為眀勾股之理也辰丙為乙丙距緯弧之正切丙己為甲丙赤道弧之正弦将正切正弦之辰巳二處作虚線聨之成辰丙巳勾股形午甲為甲乙黄道弧之正切未甲為甲丙赤道弧之正切将兩正切之午未二處作虚線聨之成午未甲勾股形此三勾股形與前二勾股形皆為同式形夫甲癸辛原係一線如将甲癸辛平視之則甲癸辛合成一㸃而辛癸卯己甲五角皆合為一角甲戊象限亦成一直線而戊癸半徑寅卯聨線丙己正弦未甲正切亦皆合為一線矣赤道既平置則黄道斜倚従辛視之甲丁象限亦成一直線而丁癸半徑乙卯正弦辰巳聨線午甲正切亦皆合為一線矣夫五勾股形既同角而各股皆合為赤道之一線各弦皆合為黄道之一線則各勾必皆與赤道徑線相交成直角而自将平行故皆為相當比例之勾股形而可以互相比例也正弧三角形用次形圖說如甲乙丙形可易為乙己丁次形葢甲戊甲丁己丙己戊四弧皆象限九十度於甲丁象限弧内減去甲乙弧餘乙丁弧即次形之乙丁邊於己丙象限弧内減去乙丙弧餘己乙弧即次形之己乙邊於己戊象限弧内減去丁戊弧即甲角度餘己丁弧即次形之己丁邊於甲戊象限弧内減去甲丙弧餘丙戊弧即次形之己角度是次形之三邊一角即本形三邊一角之餘度而用弦形之餘弦餘切實即用次形之正弦正切也弦次形之丁角為直角與本形之丙角等乙為交角其度又等故算乙己丁形即得甲乙丙形也又甲乙丙形可易為己庚辛次形葢庚丁為象限弧與己戊等則庚己與丁戊等丁戊即甲角度故本形之甲角即次形之庚己邊乙辛壬庚乙壬皆為象限弧與甲丁等則壬丁即與甲乙等故本形之甲乙邊即次形之庚角庚壬與庚丁俱象限故壬丁弧為庚角度乙壬與乙辛既皆為象限則辛壬弧即乙角之度故象限内減去乙角之辛壬弧餘即次形之庚辛邊丙戊弧即己角之度故於甲戊象限弧内減去甲丙弧餘丙戊弧即次形之己角又次形之辛角為直角與本形之丙角等次形之辛己邊與本形之乙丙邊等辛乙與己丙等故辛己與乙丙等故算己庚辛形亦得甲乙丙形也正弧三角形邊角相求法正弧三角形邊角相求錯綜變換共三十則用黄赤交角所生八線勾股比例者九用黄道交極圏角所生八線勾股比例者亦九用次形者十二依題比類列目於前按法循序設問於後以便觀覽有直角有黄赤交角有黄道求距緯第一有直角有黄赤交角有黄道求赤道并見第一有直角有黄赤交角有黄道求黄道交極圏角并見第一有直角有黄赤交角有赤道求距緯第二有直角有黄赤交角有赤道求黄道并見第二有直角有黄赤交角有赤道求黄道交極圏角并見第二有直角有黄赤交角有距緯求黄道第三有直角有黄赤交角有距緯求赤道并見第三有直角有黄赤交角有距緯求黄道交極圏角并見第三有直角有黄道有赤道求黄赤交角第四有直角有黄道有赤道求距緯并見第四有直角有黄道有赤道求黄道交極圏角并見第四有直角有黄道有距緯求黄赤交角第五有直角有黄道有距緯求赤道并見第五有直角有黄道有距緯求黄道交極圏角并見第五有直角有赤道有距緯求黄赤交角第六有直角有赤道有距緯求黄道并見第六有直角有赤道有距緯求黄道交極圏角并見第六有直角有黄道交極圏角有黄道求赤道與第一之理同有直角有黄道交極圏角有黄道求距緯與第一之理同有直角有黄道交極圏角有黄道求黄赤交角與第一之理同有直角有黄道交極圏角有距緯求赤道與第二之理同有直角有黄道交極圏角有距緯求黄道與第二之理同有直角有黄道交極圏角有距緯求黄赤交角與第二之理同有直角有黄道交極圏角有赤道求黄道與第三之理同有直角有黄道交極圏角有赤道求距緯與第三之理同有直角有黄道交極圏角有赤道求黄赤交角與第三之理同有直角有黄赤交角有黄道交極圏角求黄道第七有直角有黄赤交角有黄道交極圏角求赤道并見第七有直角有黄赤交角有黄道交極圏角求距緯并見第七設如黄赤交角二十三度三十分黄道弧四十五度求距緯度及赤道度併黄