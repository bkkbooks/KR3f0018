丙之比同於戊癸與丑戊之比也求甲乙黄道度則用次形法以半徑一千萬為一率甲丙弧四十二度三十一分二十二秒之餘弦七百三十七萬零九十八為二率乙丙弧一十六度二十二分三十八秒之餘弦九百五十九萬四千二百六十七為三率求得四率七百零七萬一千零六十八為甲乙弧之餘弦檢表得四十五度即甲乙黄道弧之度也如圖甲乙丙正弧三角形之次形為乙己丁葢甲丙弧之餘弦即乙己丁次形之己角之正弦為丙辰而乙丙弧之餘弦即乙己丁次形之乙己弧之正弦為乙未又甲乙弧之餘弦即乙己丁次形之乙丁弧之正弦為乙子而丙辰癸勾股形與乙子未勾股形為同式形故丙癸與丙辰之比同於乙未與乙子之比也求黄道交極圈之乙角則與求黄赤交角之理同葢乙角即如黄赤交角乙丙即如赤道甲丙即如距緯其勾股比例同也設如黄赤交角二十三度三十分黄道交極圈角七十二度五十四分三十四秒求黄道度及赤道度併距緯度各㡬何第七甲乙丙正弧三角形甲為黄赤交角丙為直角乙為黄道交極圈角求甲乙黄道弧則用次形法以乙角七十二度五十四分三十四秒之正切三千二百五十二萬四千六百八十三為一率半徑一千萬為二率甲角二十三度三十分之餘切二千二百九十九萬八千四百二十五為三率求得四率七百零七萬一千零六十八為甲乙弧之餘弦檢表得四十五度即甲乙黄道弧之度也如圖甲乙丙正弧三角形之次形為乙己丁葢乙角之正切亦即乙己丁次形之乙角之正切為寅壬而甲角之餘切即乙己丁次形之丁己弧之正切為丑丁又甲乙弧之餘弦即乙己丁次形之丁乙弧之正弦為丁子而寅壬癸勾股形與丑丁子勾股形為同式形故寅壬與壬癸之比同於丑丁與丁子之比也求甲丙赤道弧亦用次形法以甲角二十三度三十分之正弦三百九十八萬七千四百九十一為一率乙角七十二度五十四分三十四秒之餘弦二百九十三萬八千八百二十為二率半徑一千萬為三率求得四率七百三十七萬零九十八為甲丙弧之餘弦檢表得四十二度三十一分二十二秒即甲丙赤道弧之度也如圖甲乙丙正弧三角形之次形為己庚辛葢甲角之正弦亦即己庚辛次形之庚己弧之正弦為庚己而乙角之餘弦即己庚辛次形之庚辛弧之正弦為庚午又甲丙弧之餘弦即己庚辛次形之己角之正弦為卯辰而庚午己勾股形與卯辰癸勾股形為同式形故庚己與庚午之比同於卯癸與卯辰之比也求乙丙距緯弧亦用次形法以乙角七十二度五十四分三十四秒之正弦九百五十五萬八千四百一十七為一率半徑一千萬為二率甲角二十三度三十分之餘弦九百一十七萬零六百零一為三率求得四率九百五十九萬四千二百六十七為乙丙弧之餘弦檢表得一十六度二十二分三十八秒即乙丙距緯弧之度也如圖甲乙丙正弧三角形之次形為乙己丁葢乙角之正弦亦即乙己丁次形之乙角之正弦為辛酉而甲角之餘弦即乙己丁次形之己丁弧之正弦為巳申又乙丙弧之餘弦即乙己丁次形之己乙弧之正弦為己未而辛酉癸勾股形與巳申未勾股形為同式形故辛酉與辛癸之比同於巳申與巳未之比也御製厯象考成上編卷二
