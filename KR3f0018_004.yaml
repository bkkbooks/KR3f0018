body:
  text: 欽定四庫全書御製歷象考成上編卷四日躔歷理南北真線北極髙度地半徑差黃赤距緯清蒙氣差測歲實以定平行本天髙卑為盈縮之原求兩心差及最髙最髙行及本輪均輪半徑求盈縮差時差原名日差曚影刻分晝夜永短節氣時刻南北真線辨方定位厯象首務蓋必先定南北然後可以候中星步日躔然南北之大勢雖若昜知而立線定向必豪釐不失乃得其真即用指南針亦有所偏向不可為準其所偏向又隨地不同故欲得南北之真線者必以測量星日為主法於春秋分日植表於案令極平取日影自午前至午後視表末影所至隨作點為識次聯諸點成一直線即東西線取東西線之正中作垂線即南北線也或不拘何日植表取影自午前至午後視表末影所至隨作點為識次取與表心最近之一點為午正表影乃太陽出地平最髙之度依此點向表心作直線即南北線也又法用方案令極平作圜數層植表於圜心以取日影凡影圜上者皆作點識之乃視午前午後兩點同在一圜上者作直線聯之即東西線取東西線之正中向圜心作垂線即南北線也又法植表取日影别用儀器測得午前日軌髙度作點於影末又測得午後日軌髙度與午前等亦作點於影末乃以兩點作直線聯之即東西線取東西線之正中向表作垂線即南北線也又法於冬至日前後用儀器測勾陳第五星初昏時此星在北極之西候其漸轉而西至不復西而止至五更後此星在北極之東候其漸轉而東至不復東而止兩表視線之正中即南北線也蓋勾陳第五星冬至日酉時在極西卯時在極東他星則離極右逺故止取此星可以得東西之準他時非不可測但或日永夜短卯酉二時星不可見故必於冬至日前後測之也又法取恆星之大者用兩儀器測之一測其髙度一測其地平經度視此星在東時測其髙度若干隨測其地平經度俟此星轉而西測其髙度與在東時等者復測其地平經度此兩經度之正中即南北線此法與前同然不拘冬至他日皆可用較前法為簡便也北極髙度北極為天之樞紐居其所而不移其出地有髙下者因人所居之地南北之不同也是故寒暑之進退晝夜之永短因之而各異焉蓋厯法以日躔出入赤道之度定諸節氣而北極出地之度即赤道距天頂之度倘推測不精髙度差至一分則春秋分必差一時而冬夏至必差一二日日躔既差則月離五星之經緯無不謬矣故測北極出地之髙下最宜精密不容或略也授時厯測得京師北極出地四十度七十五分以周天三百六十度每度六十分約之為四十度零九分五十一秒新法算書京師北極出地三十九度五十五分今測得暢春園北極出地三十九度五十九分三十秒法於冬至日前後用儀器測勾陳大星出地之度酉時此星在北極之上候其漸轉而髙至不復髙而止為最髙之度卯時此星在北極之下候其漸轉而低至不復低而止為最低之度乃以所測最高最低之度折中取之即北極出地之度也蓋北極無星其髙低不可得而見故取星之環繞北極上下者測之惟勾陳大星冬至酉時在最髙卯時在最低可以得髙低之準也又法取恆星之大者測其最髙為若干度若此星為赤道以南之星則以其距赤道之緯與其髙相加得若干即赤道之髙度若此星為赤道以北之星則以其距赤道之緯與其髙相減得若干即赤道之髙度既得赤道之髙與一象限九十度相減餘若干即北極出地之度也此法較之前法為少煩蓋因赤道南北之星距赤道之緯俱係測得北極之髙度而後可得而恆星有歲差其緯度亦有增損然存此法與前法參互考驗可也地半徑差凡求七曜出地之髙度必用測量乃測量所得之數與推步所得之數往往不合蓋推步所得者七曜距地心之髙度而測量所得者七曜距地面之髙度也距地心之髙度為真髙距地面之髙度為視髙人在地面不在地心故視髙必小於真髙以有地半徑之差也或有大於真髙者則清蒙氣所為也蓋七曜恆星雖皆麗於天而其髙下又各不等惟恆星天為最髙其距地最逺地半徑甚微故無視髙真髙之差若夫七曜諸天則皆有地半徑差今欲求太陽之真髙必先得地半徑差欲求地半徑差必先得地半徑與日天半徑之比例今隨時測太陽之髙度求得地半徑與日天半徑之比例最髙為一與一千一百六十二最卑為一與一千一百二十一比舊定地半徑與日天半徑之比例最髙少二十二最卑多二十一蓋太陽髙卑之故由於兩心差然最髙之髙於本天半徑最卑之卑於本天半徑者非兩心差之全數而止及其半詳見本輪均輪半徑篇舊表日天半徑乃依兩心差全數所定故最髙較實測則多最卑較實測必少也如圖甲為地心乙為地面甲乙為地半徑乙丙為地平丁戊己為太陽天庚辛壬癸為恆星天戊為太陽人從地面乙測之對恆星天於壬其視髙為壬乙丙角若從地心甲計之則見太陽於戊者對恆星天於辛其真髙為辛甲癸角此兩髙之差為乙戊甲角即地半徑之差然又時時不同者其故有二一太陽距地平近其差角大漸髙則漸小一太陽在本天上又有髙卑髙則距地心逺其差角小卑則距地心近其差角大如戊甲線其長短時時不同其所以逺近之故詳見於後今約為最髙與中距及最卑三限太陽本天髙卑細推之每日不同然用以求差角所差甚微故止用三限於夏至春秋分冬至時各以所測地面上太陽之髙度求太陽距地心之戊甲線太陽夏至前後行最髙限春秋分前後行中距限冬至前後行最卑限故於三時測之康熙五十四年乙未五月二十九日甲子午正夏至後八日也以本日太陽躔本天之最髙為距地心之最逺在暢春園測得太陽髙七十三度一十六分零二十三微同時於廣東廣州府測得太陽髙九十度零六分二十一秒四十八微以之立法甲為地心乙為暢春園地面庚為天頂子為廣州府地面丑為天頂戊為太陽寅為赤道寅庚弧三十九度五十九分三十秒為暢春園赤道距天頂之度寅丑弧二十三度一十分為廣州府赤道距天頂之度赤道距天頂數俱係實測所得以兩處赤道距天頂度相減餘一十六度四十九分三十秒為庚丑弧即庚甲丑角以暢春園髙度與一象限相減餘一十六度四十三分五十九秒三十七微為庚乙戊角於廣州府髙度內減去一象限餘六分二十一秒四十八微即戊子丑角戊在天頂丑北先用乙甲子三角形此形有甲角一十六度四十九分三十秒又有乙甲及子甲邊俱地半徑命為一千萬乃以甲角折半之正弦倍之得二九二五九七七為乙子邊又以甲角與半周相減餘數半之得八十一度三十五分一十五秒為乙角亦即子角次用乙戊子三角形此形有乙子邊二九二五九七七有戊乙子角八十一度四十分四十五秒二十三秒半周內減去甲乙子角又減去庚乙戊角餘即戊乙子角有戊子乙角九十八度一十八分二十三秒一十二微半周內減去甲子乙角又減去戊子丑角餘即戊子乙角即有乙戊子角五十一秒二十五微求得戊子邊一一六一三二二三八三九次用戊子甲三角形此形有戊子邊有子甲邊地平徑一千萬有戊子甲之外角六分二十一秒四十八微即戊子丑角求得戊甲邊一一六二二六四二五一二為太陽在本天最髙時距地心之逺以地半徑較之其比例如一與一千一百六十二也乙甲一千萬與一一六二二六四二五一二之比同於一與一千一百六十二有餘之比末用乙戊甲三角形乙甲邊為一戊甲邊為一一六二戊乙甲之外角一十六度四十三分五十九秒三十七微即庚乙戊角求得乙戊甲角五十一秒零五微為最髙限太陽髙七十三度一十六分之地半徑差以加暢春園視髙七十三度一十六分零二十三微得七十三度一十六分五十一秒二十八微為暢春園太陽之真髙也於乙戊子角五十一秒二十五微內減去乙戊甲角五十一秒零五微餘二十微為甲戊子角乃最髙限太陽髙九十度零六分二十一秒之地半徑差即八十九度五十三分三十九秒之地半徑差以減廣州府視髙九十度零六分二十一秒四十八微視髙過九十度故減得九十度零六分二十一秒二十八微為廣州府太陽之真髙也又康熙五十五年丙申三月初五日丙申午正春分後八日也以本日太陽躔本天之中距為距地心之適中在暢春園測得太陽髙五十三度零三分三十八秒一十微同時於廣東廣州府測得太陽髙六十九度五十四分零八秒三十八微減去緯差一十四秒餘六十九度五十三分五十四秒三十八微測得廣州府子午線在京師之西三度三十三分其午正時乃京師午正初刻十四分也夫太陽距緯度夏至時每日止差四十餘秒其一刻所差甚微可不論若春分時每日差至二十四分則十四分時可差一十四秒又春分後太陽自卑而髙緯度既差一十四秒則午正之髙度亦多一十四秒故必於所測之度減去緯差始為與京師子午相當地面之髙度也此即東西里差詳後節氣時刻篇以之立法庚為暢春園天頂丑為廣州府天頂戊為太陽寅為赤道乙甲子三角形之三邊三角俱與前圖等以暢春園髙度與一象限相減餘三十六度五十六分二十一秒五十微為庚乙戊角以廣州府髙度與一象限相減餘二十度零六分零五秒二十二微為戊子丑角先用乙戊子三角形此形有乙子邊二九二五九七七有戊乙子角六十一度二十八分二十三秒一十微半周內減去甲乙子角又減去庚乙戊角餘即戊乙子角有戊子乙角一百一十八度三十分五十秒二十二微半周內減去甲子乙角加入戊子丑角即戊子乙角即有乙戊子角四十六秒二十八微求得戊子邊一一四一三一二九九次用戊子甲三角形此形有戊子邊有子甲邊地半徑一千萬有戊子甲之外角二十度零六分零五秒二十二微即戊子丑角求得戊甲邊一一四二一八六七七三為太陽在本天中距時距地心之逺以地半徑較之其比例如一與一千一百四十二也末用乙戊甲三角形乙甲邊為一戊甲邊為一一四二戊乙甲之外角三十六度五十六分二十一秒五十微即庚乙戊角求得乙戊甲角一分四十八秒三十二微為中距限太陽髙五十三度零三分三十八秒之地半徑差以加暢春園視髙五十三度零三分三十八秒一十微得五十三度零五分二十六秒四十二微為暢春園太陽之真髙也於乙戊甲角一分四十八秒三十二微內減去乙戊子角四十六秒二十八微餘一分零二秒零四微為子戊甲角乃中距限太陽髙六十九度五十四分零八秒之地半徑差以加廣州府視髙六十九度五十四分零八秒三十八微得六十九度五十五分一十秒四十二微為廣州府太陽之真高也今若以最髙太陽距地心一一六二與中距太陽距地心一一四二相減餘二為兩限距地心之較則最卑限太陽距地心之逺為一一二二然中距太陽距地心如弦本天半徑如股圖見後求盈縮差篇其距最髙之差應少距最卑之差應多故最卑限太陽距地心當不足一一二二欲以實測求之奈冬至後太陽躔本天最卑時髙弧僅二十六度餘蒙氣差甚大難得其真今以太陽最髙與本天半徑比例數一一七九二八見交食厯理求日月距地與地半徑之比例篇與地半徑比例數一一六二之比即同於太陽最卑與本天半徑比例數九八二七九二與地半徑比例數一一二一之比是為最卑限太陽距地心之逺也既得三限距地心之逺即各用為一邉即戊甲地半徑為一邊即乙甲為一太陽出地逐度之髙即戊點與象限相加為一角即甲乙戊角成戊乙甲三角形求得乙戊甲角為三限太陽自地平至天頂逐度之地半徑差以列表黃赤距緯黃道斜交赤道而出其內外其相距最逺之度即二至太陽距赤道之緯度古今所測不同授時厯測得二十三度九十分三十秒以周天三百六十度每度六十分約之為二十三度三十三分三十二秒新法厯書用西人第谷所測為二十三度三十一分三十秒今自康熙五十三年以來於暢春園纍測夏至午正太陽髙度得視髙七十三度二十九分十餘秒加地半徑差五十秒得實髙七十三度三十分減去本處之赤道髙五十度零三十秒餘二十三度二十九分三十秒為黃道赤道相距最逺之率因用正弧三角形法推得日躔黃道每度每分之距緯以立表如圖甲乙為黃道一象限甲丙為赤道一象限甲為春分乙為夏至乙丙為大距二十三度二十九分三十秒即甲角之度設丁點為立夏距甲春分四十五度求丁戊距緯若干則用甲丁戊正弧三角形此形有甲角乙丙大距度二十三度二十九分三十秒有甲丁黃道四十五度有戊直角九十度今以戊直角九十度之正弦一千萬與甲角乙丙大距度二十三度二十九分三十秒之正弦三九八六一五七之比即同於甲丁黃道四十五度之正弦七七一六八與丁戊距緯一十六度二十二分一十七秒之正弦二八一八六三九之比也既得立夏之距緯度則立春立秋立冬之距緯度亦同按法於甲乙一象限內逐度逐分求其距緯則其餘三象限之距緯度亦得矣清蒙氣差清蒙氣差從古未聞明萬厯間西人第谷始發之其言曰清蒙氣者地中遊氣時時上騰其質輕微不能隔礙人目却能映小為大升卑為髙故日月在地平上比於中天則大星座在地平上比於中天則廣此映小為大也定望時地在日月之間人在地面無兩見之理而恆得兩見或日未西沒而已見月食於東日已東出而尚見月食於西此升卑為髙也又曰清蒙之氣有厚薄有髙下氣盛則厚而髙氣微則薄而下而升像之髙下亦因之而殊其所以有厚薄有髙下者地勢殊也若海或江湖水氣多則清蒙氣必厚且髙也故欲定七政之緯宜先定本地之清蒙差第谷言其國北極出地五十五度有竒測得地平上最大之差三十四分自地平以上其差漸少至四十五度其差五秒更髙則無差矣此即新法厯書所用之表也近日西人又言於北極出地四十八度地方測得太陽髙四十五度時蒙氣差尚有一分餘自地平至天頂皆有蒙氣差即此觀之益見蒙氣差之隨地不同而第谷之言為不妄矣今述其測量推算之法於左使觀者知蒙氣差表之所自立云假如太陽髙一十度三十四分四十二秒距正午八十三度地平經度於時日躔降婁宫三度三十六分距赤道北一度二十六分如圖甲為地心乙為天頂丙為太陽丁為北極乙戊為子午規乙丙己為髙弧丙己為太陽實髙弧庚己為視髙弧今用丁乙丙斜弧三角形此形有北極距天頂之丁乙弧五十度零三十秒有太陽距北極之丁丙弧八十八度三十四分以距緯一度二十六分減象限九十度得之有丁乙丙角九十七度己乙戊角八十三度為太陽距正午之度與半周相減即得丁乙丙角求太陽實距天頂之乙丙弧法以乙丙弧引長從丁作丁辛垂弧兩弧相交於心為直角遂成丁辛乙丁辛丙兩正弧三角形先用丁辛乙正弧三角形以半徑一千萬與乙角八十三度之正弦九九二五四六二之比同於乙丁弧五十度零三十秒之正弦七六六一三七九與丁辛弧之正弦七六四二七三之比得丁辛弧四十九度三十分零七秒又以半徑一千萬與乙角八十三度之餘弦一二一八六九三之比同於乙丁弧五十度零三十秒之正切一一九二一五六與乙辛弧之正切一四五二八一一之比得乙辛弧八度一十五分五十八秒次用丁辛丙正弧三角形以丁丙弧八十八度三十四分之正弦九九九六八七一與丁辛弧四十九度三十分零七秒之正弦七六四二七三之比同於半徑一千萬與丙角正弦七六六六五三之比得丙角四十九度三十一分二十二秒又以丙角四十九度三十一分二十二秒之正切一一七一七九二七與半徑一千萬之比同於丁辛弧四十九度三十分零七秒之正切一一七九三二與辛丙弧之正弦九九九二六三九之比得辛丙弧八十七度四十八分零五秒於辛丙弧內減去乙辛弧八度一十五分五十八秒餘乙丙弧七十九度三十二分零七秒為太陽實距天頂之度以乙丙弧與乙己弧九十度相減餘丙己弧一十度二十七分五十三秒為太陽之實髙乃以實髙與視髙一十度三十四分四十二秒相減餘六分四十九秒加地半徑差二分五十七秒得九分四十六秒為地平上一十度三十五分之蒙氣差按法求得逐度之差數以立表測歲實以定平行太陽之實行每日不同步日躔者必以平行為根而求平行之法則在於定歲實歲實者太陽循黃道右旋一周而復於原界之日時也或自今年冬至至明年冬至或自今年春分至明年春分古厯定太陽每日所行為一度故周天為三百六十五度四分度之一其後漸覺後天以為歲實太強自漢以來每次修厯必有所減以合當時實測故每日之平行雖定為一度而天周與歲實訖無定率也今法定天周為三百六十度故太陽每日之行不及一度其分秒之進退視歲實之消長得歲實即得每日之平行矣數歲以來於二分二至遣人各省分測得歲實為三百六十五日五時三刻三分四十五秒即三百六十五日十分日之二分四二一八七五乃置天周三百六十度為實以歲實三百六十五日五時三刻三分四十五秒為法實如法而一得太陽每日平行五十九分零八秒一十九微四十九纎五十九忽三十九芒即十分度之九分八五六四七三六五八既得太陽每日之平行遞加之得十日百日之平行遞析之得每時每分之平行以立表每日二十四時每時六十分測歲實之法古人皆測冬至然冬至之時刻難定不如用春秋分時得數為真蓋冬至時黃道與赤道平行其緯度一日所差不過數十秒儀器無從分别春秋分黃道與赤道斜交其緯度一日差二十四分其差易見且求平行須用平行歲實而測量止能得視行惟二分時去中距不逺其平行實行之差甚微可以不計况冬至時太陽之地平緯度少清蒙之氣甚大古來歲實難得確準此其故也康熙五十四年乙未二月十六日癸未午正於暢春園測得太陽髙五十度零三十二秒三十五微加地半徑差一分五十六秒零五微得實髙五十度零二分二十八秒四十微與赤道髙五十度零三十秒相減餘一分五十八秒四十微為太陽在赤道北之緯度即知春分時刻在午正前也如圖甲為春分乙為太陽丙為赤道乙丁為午正太陽實髙丙丁為赤道髙乙丙為太陽距赤道北緯度用甲乙丙正弧三角形此形有甲角大距度二十三度二十九分三十秒有丙直角有乙丙緯度一分五十八秒四十微求甲乙弧為太陽過春分之經度法用甲角正弦三九八六一五七與丙直角正弦一千萬之比同於乙丙弧正弦五七五三與甲乙弧正弦一四四三三之比得甲乙弧四分五十七秒四十三微用變時法以一日之平行五十九分零八秒二十微為一率二分時太陽之實行與平行相近故即用平行為一率若他節氣須用本日之實行為一率二十四時化為一千四百四十分為二率甲乙弧四分五十七秒四十三微為三率得四率一百二十分四十九秒一十二微以每時六十分收之得二時零四十九秒一十二微為春分距午正前之時即已初三刻一十四分一十秒四十八微春分也康熙五十五年丙申二月二十七日戊子午正於暢春園測得太陽髙四十九度五十四分四十九秒五十一微加地半徑差一分五十六秒一十七微得實髙四十九度五十六分四十六秒零八微與赤道髙五十度零三十秒相減餘三分四十三秒五十二微為太陽在赤道南之緯度即知春分時刻在午正後也依法用甲乙丙正弧三角形求得乙甲弧九分二十一秒三十九微為太陽未到春分之經度變時得三時四十七分五十五秒四十八微為春分距午正後之時即申初三刻二分五十五秒四十八微春分也乃總計兩春分相距得三百六十五日五時三刻三分四十五秒即為歲實本天髙卑為盈縮之原太陽行天每歲一周萬古不忒宜其每日平行而無有盈縮乃徵之目下實測則春分至秋分行天半周而厯日多秋分至春分行天半周而厯日少其在本天所行之度原均而人居地上所見時日不同今即其不平行之數求其所以然之故則惟有本天髙卑之説能盡之本天髙卑之法有二一為不同心天一為本輪立名雖異而理則同故髙卑之距盈縮之度皆不謀而合焉不同心天之法蓋以天包地外以地為心太陽本天亦包乎地外而不以地為心因其有兩心之差而髙卑判焉如圖甲為地心乙丙丁戊為黃道己為太陽本天心庚辛壬癸為太陽本天其癸庚辛大半周逺於地為髙辛壬癸小半周近於地為卑戊為春分丙為秋分乙為夏至丁為冬至自春分厯夏至以至秋分太陽自癸厯庚以至辛行本天之大半周故厯日多而自地心甲立算其自戊厯乙以至丙止行黃道之半周故為行縮自秋分厯冬至以至春分太陽自辛厯壬以至癸行本天之小半周故厯日少而自地心甲立算其自丙厯丁以至戊亦行黃道之半周故為行盈夫日在本天原自平行因自地心甲立算而不以太陽本天心已立算遂有髙卑盈縮之異故髙卑為盈縮之原而兩心之差又髙卑之所由生也本輪之法蓋以本天與地同心而本天之周又有一本輪本輪心循本天周向東而行日在本輪之周向西而行兩行之度相等輪心東行太陽西行二者亦有微差然積至周歲才差一分雖謂相等可也太陽在本輪之下半周去地近為卑則順輪心行故見其速於平行在本輪之上半周去地逺為髙則背輪心行故見其遲於平行在本輪之左右去地不逺不近為髙卑適中故名中距其行與平行等如圖甲為地心即本天心乙丙丁戊為本天其本輪循本天東行由丁向戊而乙而丙而復於丁為平行度即經度太陽循本輪西行由下而左而上而右而復於下本輪以近地心為下逺地心為上為自行度名引數如本輪心在丁則太陽在本輪之下如辛去地心甲最近是為最卑本輪心在乙則太陽在本輪之上如己去地心甲最逺是為最髙最髙最卑之點皆對本輪心與地心成一直線其平行實行同度故為盈縮起算之端如本輪心由丁向戊太陽由本輪下向左順輪心行能益東行之度故較平行度為盈至半象限後所益漸少逮輪心行一象限至戊太陽亦行輪周一象限至壬即無所益而復於平行是為中距然而積盈之多正在中距蓋平行至戊而太陽在壬從地心甲立算則太陽當本天之子子戊弧以本輪之半徑為正切為盈差之極大也從中距而後太陽行本輪之上半周背輪心行故實行漸縮然因有積盈之度方以次漸消其實行仍在平行前逮行滿一象限至最髙為極縮而積盈之度始消盡無餘其實行與平行乃合為一線故自最卑至最髙半周俱為盈厯也如本輪心由乙向丙太陽由本輪上向右背輪心行能損東行之度故較平行度為縮至半象限後所損漸少逮輪心行一象限至丙太陽亦行輪周一象限至庚即無所損而復於平行是為中距然而積縮之多亦在中距蓋平行至丙而太陽在庚從地心甲立算則太陽當本天之丑丑丙弧亦以本輪之半徑為正切為縮差之極大也從中距而後太陽行本輪之下半周順輪心行故實行漸盈然因有積縮之度方以次相補其實行仍在平行後逮行滿一象限至最卑為極盈而積縮之度始補足無缺其實行與平行乃合為一線故自最髙至最卑半周俱為縮厯也此本輪之法於盈縮之理最為顯著然謂與不同心天之理同何也試於本輪上己庚辛壬諸點聨為一圜此圜必不以甲為心而以癸為心遂成不同心天之形其癸甲兩心之差即本輪之半徑故求得兩心之差而本輪之徑自見明於本輪之故而盈縮之理益彰然則其理相通其用相輔並存其説實可以參稽而互證也求兩心差及最髙新法厯書用春分秋分立夏三節氣相距日時推得兩心差為三五八四一六最髙在夏至後五度三十分然而未詳何年月日永年表載康熙丁酉年最卑在冬至後七度四十三分四十九秒今以丁酉年實測節氣時刻依法推算得兩心差為三五八九七七最卑在冬至後八度三十八分二十五秒五十五微皆與原數不合蓋今之春分秋分立夏皆不正當最髙最卑中距之度用兩心差以推其時刻與實測不合則用實測之時刻以推兩心差亦必與原數不合而最髙最卑所在亦必不合矣因思太陽在最髙最卑二點平行與實行合為一線本天與黃道皆平分為兩半周太陽厯半周歲而適行半周天其度分即髙卑所在自最卑厯周歲四分之一至中距應行九十度其實行之過於九十度者即積盈之度自最髙厯周歲四分之一至中距亦應行九十度其實行之不及九十度者即積縮之度檢其正切即兩心差之數也今以丁酉年逐日實測日躔度分求得最髙過夏至最卑過冬至各七度四十四分三十六秒四十八微又自太陽過最髙之日分加周歲四分之一求其時刻之實行不及中距二度零三分零九秒四十微檢其正切得三五八四一六皆與歷書所載相合是故用兩心差之全數以推盈縮維中距與實測合最髙前後兩象限則失之小最卑前後兩象限則失之大所以又用均輪以消息其數方與實測相符今於其相合者得最髙及兩心差所自來於其不相合者得本輪均輪所由設推算之法并述於左用實測最髙最卑中距求兩心差及最髙所在如康熙五十六年丁酉二至後暢春園逐日測午正太陽髙度求其經度用實行推得五月二十一日甲戌辰正一刻零四十秒四十五微交未宫七度五月二十二日乙亥已初一刻一十四分五十七秒二十七微交未宫八度十一月二十七日丁丑子正一刻一十二分五十七秒四十一微交丑宫七度本日夜子初三刻一十二分二十七秒四十七微交丑宫八度夫未宫七度至丑宫七度厯一百八十二日一十六時一十二分一十六秒五十六微大於半周歲一時一十七分五十四秒二十六微而未宫八度至丑宫八度厯一百八十二日一十四時二十七分三十秒二十微小於半周歲二十六分五十二秒一十微乃以此兩數立法以求最髙所在如圖甲為地心即宗動天心乙丙丁戊為黃道與宗動天相應同以甲為心也乙為夏至丙為秋分丁為冬至戊為春分又設己點為心作庚辛壬癸圈為不同心天庚為最髙當黃道之子壬為最卑當黃道之丑則寅卯為其中距距最髙子最卑丑各九十度過巳甲兩心作庚丑線則平分本天與黃道各為兩半周故厯半周歲一百八十二日一十四時五十四分二十二秒三十微適行半周天一百八十度若夫夏至乙則在最髙前有加差時刻早冬至丁則在最卑前有減差時刻遲故夏至至冬至大於半周歲而秋分丙在最髙後有減差時刻遲春分戊在最卑後有加差時刻早故秋分至春分小於半周歲今未宫七度至丑宫七度大於半周歲未宫八度至丑宫八度小於半周歲即知未宫七度在最髙前如辰未宫八度在最髙後如巳丑宫七度在最卑前如午丑宫八度在最卑後如未今以大於半周歲之一時一十七分五十四秒二十六微與小於半周歲之二十六分五十二秒一十微相併得一時四十四分四十六秒三十六微與辰巳或午未一度之比同於大於半周歲之一時一十七分五十四秒二十六微與辰子或午丑四十四分三十六秒四十八微之比而得辰子或午丑與乙辰或丁午之七度相加得乙子或丁丑七度四十四分三十六秒四十八微即最髙過夏至最卑過冬至之度亦即中距過春秋分之度也丙寅弧卯戊弧皆與乙子弧相等此所得之數比永年表丁酉年前冬至最卑度多四十七秒比戊戌年前冬至最卑度少一十五秒蓋最髙每歲行六十一秒今合最髙最卑取數立算則其所得為中距過秋分之度較之丁酉年前冬至固應差四分之三較之戊戌年前冬至固應差四分之一是所測與永年表合矣又用比例法求得本年五月二十二日乙亥寅初初刻一分三十七秒四十五微過最髙加周歲四分之一九十一日七時二十七分一十一秒一十五微得秋分後丙午日巳正一刻一十三分四十九秒過中距在黃道應從最髙子行九十度至寅為辰宫七度四十四分三十六秒四十八微而在本天則從最髙庚行九十度至辛當黃道之申今以實測求其經度在辰宫五度四十一分二十七秒零八微即申點之度不及中距二度零三分零九秒四十微即申寅弧當辛甲寅角與甲辛巳角等檢其正切得三五八四一六為已甲兩心差亦即本輪半徑與厯書所載同用實測春分秋分立夏求兩心差及最髙所在如康熙五十六年丁酉暢春園測得春分為二月初八日癸巳亥初二刻六分四十七秒立夏為三月二十四日己卯亥正二刻一分三十六秒秋分為八月十九日庚子申初二刻四分零三秒則春分距立夏得四十六日三刻九分四十九秒以每日平行五十九分零八秒二十微乘之得平行度四十五度二十二分三十八秒一十六微春分距秋分得一百八十六日七十一刻一十二分一十六秒以每日平行五十九分零八秒二十微乘之得平行度一百八十四度零四分零三秒五十八微如圖甲為地心乙丙丁戊為黃道戊為春分己為夏至丙為秋分庚為冬至辛為立夏戊辛弧四十五度又以壬點為心作子丑寅卯圈為不同心天春分時太陽