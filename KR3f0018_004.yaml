於丁丁乙弧即平行實行之差設推得某日申正太陽平行乙未到酉宫尚一度餘因行盈厯實行大於平行故平行乙雖未至酉宫而實行丁巳交酉宫若以平行乙所臨之時刻為交宫之時刻則為申正太陽入酉宫是為平時然平行乙雖臨於申正而太陽丙實在其東一度餘即丁乙弧故必以此一度餘變時約得五分為時差以減申正得申初三刻十分大陽入酉宫是為用時也又如夏至後本輪心平行六十一度餘至乙太陽從本輪最髙自行五十四度餘至丙從地心甲作實行線至丙割黃道於丁丁乙弧為平行實行之差設推得某日辰正太陽平行乙巳入巳宫一度餘因行縮厯實行小於平行故平行乙雖入巳宫一度餘而實行丁方交巳宫初度若以平行乙所臨之時刻為交宫之時刻則為辰正太陽入巳宫是為平時然平行乙雖臨於辰正而太陽丙實在其西一度餘故必以此一度餘變時約得五分為時差以加辰正得辰正初刻五分太陽入巳宫是為用時也準此論之凡最卑後半周實行皆大於平行則用時在平時東其時差宜減最髙後半周實行皆小於平行則用時在平時西其時差宜加此以最髙卑為時差加減之限黃道上事也然時刻以赤道為主黃道上之用時猶非赤道上之用時何也黃道與赤道斜交二分之後黃道如弦赤道如股從赤極出線至赤道成直角勾股形故黃道一度赤道一度不足赤道度少則時刻增矣右旋度少則左旋度多故時刻增二至之後黃道以腰圍大圈之度當赤道距等小圈之度故黃道一度赤道一度有餘赤道度多則時刻減矣右旋度多則左旋度少故時刻減如圖甲為北極乙戊丙為赤道乙丁丙為黃道乙為春分丙為秋分丁為夏至春分後太陽實行四十五度至已赤道上與已相等之度為庚庚距乙亦四十五度與已相當之度為辛辛庚弧為赤道少於黃道之度得二度二十九分是為升度差如推得太陽本日實行距春分四十五度而即以四十五度之點當某位為某時者是以赤道之庚點命時也如庚點當午位即為午時而實度之辛點實在其西故必以辛庚升度差變時為時差以加於平時得用時如庚點當午正末即午正末為平時以時差加之得辛點在未初為用時秋分後與春分後同又如夏至後太陽實行四十五度至已赤道上與已相等之度為庚庚距戊為四十五度與巳相當之度為辛庚辛弧為赤道多於黃道之度得二度二十九分是為升度差如推得太陽本日實行距夏至四十五度而即以四十五度之點當某位為某時者是以赤道之庚點命時也如庚點當午位即為午時而實度之辛點實在其東故必以庚辛升度差變時為時差以減於平時得用時如庚點當午初即午初為平時以時差減之得辛點在已正為用時冬至後與夏至後同準此論之凡分後兩象限用時皆在平時西其時差宜加至後兩象限用時皆在平時東其時差宜減此以分至為時差加減之限赤道上事也是二者一以髙卑為加減之限一以分至為加減之限若以太陽實行宫度求得赤道同升度與平行宫度相減餘度變時為時差逐度立表以加減平時而得用時是合兩次加減為一次加減然而宫度引數又因逐年最髙卑有行分不能相同合立一表慮歲久不可用故仍分作二表一以太陽均數變時用引數查之一以升度差變時用實行查之依法加減兩次庶平時與用時相較之分可得其真數也曚影刻分曚影者古所謂晨昏分也太陽未出之先已入之後距地平一十八度皆有光故以一十八度為曚影限然北極出地有髙下太陽距赤道有南北故曚影刻分隨時隨地不同其隨時不同者二分之刻分少二至之刻分多也隨地不同者愈北則刻分愈多愈南則刻分愈少也若夫北極出地五十度則夏至之夜半猶有光愈髙則漸不夜矣南至赤道下則二分之刻分極少而二至之刻分相等赤道以南反是如圖甲為天頂乙丙為地平丁戊為地平下一十八度曚影限乙丁及丙戊皆一十八度已為北極庚為南極辛壬為赤道癸子為夏至距等圈丑寅為冬至距等圈二分時日行辛壬赤道出入於卯交曚影限於辰則日在卯辰弧地平上皆有光故以卯辰為曚引之刻分也若冬至時日行丑寅距等圈出入於已交曚厯限於午則日在巳午弧地平上皆有光故以巳午為曚影之刻分而巳午與赤道相當之弧為未申其度多於卯辰故冬至之刻分多於二分也夏至時日行癸子距等圈出入於酉交曚影限於戌則日在酉戌弧地平上皆有光故以酉戌為曚影之刻分而酉戌與赤道相當之弧為亥乾其度更多於未申故夏至之刻分不惟多於二分而更多於冬至也夫冬至相當之未申弧度多於二分相當之卯辰弧度其故易知若夏至相當之亥乾弧度多於冬至相當之未申弧度其故則難知蓋未申亥乾二分皆係與赤道相當之正弦非弧度也正弦之數近圜心則疏疏則所當之度少近圜周則密密則所當之度多試於赤道上之未申亥乾四點各作垂線引至圜周其割圜周之點為坎艮震巽而坎艮弧為未申弧相當之度未卯為坎己弧之正弦卯申為已艮弧之正弦以未卯與卯申相加成未申以坎已與巳艮相加成坎艮故坎艮弧為未申相當之度震巽弧為亥乾弧相當之度卯乾為巳巽弧之正弦卯亥為巳震弧之正弦以卯乾與卯亥相減餘亥乾以已巽與已震相減餘震巽故震巽弧為亥乾相當之度以震巽弧與坎艮弧相較則度之多少自見矣如求二分之曚影刻分則用甲巳辰斜弧三角形求巳角為赤道之辛卯辰弧此形有甲巳邊五十度零五分為北極距天頂之度以京師北極出地三十九度五十五分立法有已辰邊九十度有甲辰邊一百零八度用三邊求角法求得巳角一百一十三度四十五分三十六秒即辛卯辰弧變時得六時六刻五分每度變時之四分內減去半晝分辛卯六時即日出卯至午正辛或午正辛至日入卯之時刻也餘卯辰六刻五分為二分時之曚影刻分也如求冬至之曚影刻分則用甲巳午斜弧三角形求巳角為赤道之辛未申弧此形有甲巳邊五十度零五分為北極距天頂之度有巳午邊一百一十三度二十九分三十秒巳申象限九十度加申午距緯二十三度二十九分三十秒有甲午邊一百零八度用三邊求角法求得已角九十四度二十分零六秒即辛未申弧變時得六時一刻二分內減去半晝分辛未四時二刻五分即日出巳至午正丑或午正丑至日入巳之時刻也餘未申六刻一十二分為冬至時之曚影刻分也如求夏至之曚影刻分則用甲巳戌斜弧三角形求巳角為赤道之辛亥乾弧此形有甲巳邊五十度零五分為北極距天頂之度有巳戌邊六十六度三十分三十秒已乾象限九十度內減去戌乾距緯二十三度二十九分三十秒有甲戌弧一百零八度用三邊求角法求得巳角一百四十三度二十三分零五秒即辛亥乾弧變時得九時二刻五分內減去半晝分辛亥七時一刻一十分即日出酉至午正癸或午正癸至日入酉之時刻也餘亥乾八刻九分為夏至時之曚影刻分也其餘各節氣皆倣此推之晝夜永短晝夜由於日之出入因人所居有南北故見日之出入早晚隨時各異而晝夜之永短生焉中土居赤道之北赤道斜倚於天頂之南南極入地北極出地故惟春秋分見日出入於卯酉而晝夜平分若秋分以後則出入於卯酉之南隨天左旋之度地平上者少地平下者多故晝短夜永春分以後則出入於卯酉之北隨天左旋之度地平上者多地平下者少故晝永夜短所居之地愈北則永短之差愈多廣州府北極出地二十三度一十分夏晝冬夜各五十三刻一十一分夏夜冬晝各四十二刻零四分其較一十一刻零七分京師北極出地三十九度五十五分夏晝冬夜各五十九刻零五分夏夜冬晝各三十六刻一十分其較二十二刻一十分北極愈髙其較愈多及至北極之下則赤道當地平夏則有晝而無夜冬則有夜而無晝蓋以半年為晝半年為夜矣所居之地愈南則永短之差漸少以至於赤道之下則兩極當地平而晝夜常均並無永短蓋一歲中為四時者各二矣以日當天頂為夏日去天頂逺為冬赤道既當天頂而太陽一歲必兩躔赤道是兩夏也一躔天頂南二十三度餘一躔天頂北二十三度餘是兩冬也春秋亦如之晝夜永短以南北而異若東西雖相去千萬里苟南北極之髙度同則晝夜之永短亦同故謂之南北里差亦名地平緯差其推步之法以本地北極出地髙度為主求得各節氣日出入時刻即得晝夜時刻也如圖甲乙丙為子午規甲丙為地平丁為北極丁丙三十九度五十五分為京師北極之髙戊為卯正酉正之位巳戊庚為赤道春秋分太陽正當赤道日出於戊為卯正中於巳為午正復入於戊為酉正地平上戊巳之度與地平下戊庚之度等故晝夜平分各四十八刻辛為夏至辛壬癸為赤道距等圈古名晝長規即夏至太陽隨天西轉一周之軌壬當卯正酉正之位子為冬至子丑寅為赤道距等圈古名晝短規即冬至太陽隨天西轉一周之軌丑當卯正酉正之位夏至日出於辰在卯正前壬辰為日出距卯正之弧與赤道之戊巳度等中於辛為午正復入於辰在酉正後地平上辰辛之度多於地平下辰癸之度故晝永夜短冬至日出於未在卯正後未丑為日出距卯正之弧與赤道之申戊度等亦即與夏至日出距卯正之戊己度等中於子為午正復入於未在酉正前地平上未子之度少於地平下未寅之度故晝短夜永冬至時地平上未子之度與夏至時地平下辰癸之度等冬至時地平下未寅之度與夏至時地平上辰辛之度等故冬之夜同於夏之晝冬之晝同於夏之夜也今求戊巳之度以丁戊半徑一千萬與丁丙北極髙三十九度五十五分之正切丁戌八三六六二四二之比即同於辰巳距緯弧二十三度二十九分三十秒之正切巳亥四三四六三九五與戊巳弧之正弦三六三六二九九之比渾圓從外視之則弧與正弦俱合為一線得戊巳二十一度一十九分二十四秒戌丁戊三角形與亥巳戊三角形為同式形其巳角與丁角同為直角戌角與戊角為平行線上交錯之角必等故相當之邊皆可為比例變時得五刻一十分在夏至時為卯前酉後分以減卯正得日出寅正二刻五分以加酉正得日入戌初一刻一十分復倍卯前分得一十一刻五分與四十八刻相加得五十九刻五分為晝刻與四十八刻相減得三十六刻一十分為夜刻也在冬至時為卯後酉前分以加卯正得日出辰初一刻一十分以減酉正得日入申正二刻五分復倍卯後分得一十一刻五分與四十八刻相減得三十六刻一十分為晝刻與四十八刻相加得五十九刻五分為夜刻也其餘節氣各用其距緯之正切為比例即得日出入距卯酉之弧但自春分至秋分半歲日出皆在卯前日入皆在酉後其變時加減並與夏至同自秋分至春分半歲日出皆在卯後日入皆在酉前其變時加減並與冬至同各省各國並依此法推之節氣時刻古厯節氣之日時有二其一取周歲之日三百六十五日有竒二十四分之得一十五日有餘為節為氣其日相等以之頒厯授時置閏成歲置閏之法以無中氣者為閏月名為恆氣言其各節氣之日皆一定而不易且歲歲有常也其一取周天之度古三百六十五度四分度之一二十四分之得一十五度有餘為節為氣其度相等以步躔離推朓朒名為定氣言以日躔之度為定而不問日時之多寡也因日行有盈縮故各節氣度數雖等而日時不等今頒厯亦用定氣以日躔右旋一十五度為一氣故冬至至小寒止一十四日有餘夏至至小暑則一十六日不足且每年不同蓋有加減可推務求密合於天行也然一歲之中同一節氣而京師各省時刻不同者此則東西之里差亦名地平經差而非天行之故蓋地體渾圎與天相應而人居地面各以所見日中為午正今以京師為主在京師東者見日出入皆早其日中必在京師午正之前在京師西者見日出入皆遲其日中必在京師午正之後故東方節氣遲者非日躔之縮乃其見日早也西方節氣早者非日躔之盈乃其見日遲也其時刻之差視偏度之多寡每偏一度得時之四分偏東者加偏西者減要以京師西之節氣時刻加減之即得各省之節氣時刻御製厯象考成上編卷四
