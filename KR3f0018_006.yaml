body:
  text: 欽定四庫全書御製厯象考成上編卷六交食厯理一日食月食合交食總論朔望有平實之殊朔望用時求日月距地與地半徑之比例日月視徑求日月實徑與地徑之比例地影半徑交食總論太隂及於黃白二道之交因生薄蝕故名交食然白道出入黃道南北太隂每月必兩次過交而或食或否何也月追及於日而無距度為朔距日一百八十度為望此皆為東西同經其入交也正當黃道而無緯度是為南北同緯雖入交而非朔望則同緯而不同經當朔望而不入交則同經而不同緯皆無食必經緯同度而後有食也蓋合朔時月在日與地之間人目仰觀與日月一線參直則月掩蔽日光即為日食望時地在日與月之間亦一線參直地蔽日光而生暗影其體尖圓是為暗虛月入其中則為月食也按日為陽精星月皆借光焉月去日逺去人近合朔之頃特能下蔽人目而不能上侵日體故食分時刻南北迥殊東西異視也若夫月食則月入暗虛純為晦魄故九有同觀但時刻有先後耳至於推步之法日食須用髙下南北東西三差委曲詳密而月食惟論入影之先後淺深無諸視差之繁故先總論交食之理次論月食乃及日食因日食立法較難故後論加詳焉如圖合朔時月在地與日之間人在地面居甲者見月全掩日居乙者見月掩日之半居丙者但見日月兩周相切而不相掩故日食隨地不同乃月蔽人日不見日光而日體初無異也如地在日月之間日大地小地向日之面為晝背日之面則生尖影人在影中不見日光為夜望時月入影中而不能借日光全為晦魄故月食為普天同視也朔望有平實之殊日月相會為朔相對為望而朔望又有平實之殊平朔望者日月之平行度相會相對也實朔望者日月之實行度相會相對也故平朔望與實朔望相距之時刻以兩實行相距之度為準蓋兩實行相距之度以兩均數相加減而得而兩朔望相距之時刻則以兩實行相距之度變為時刻以加減平朔望而得實朔望故兩實行相距無定度則兩朔望相距亦無定時也如圖甲為地心即日月本天心乙為月本輪心丙為日本輪心日月止用本輪者因明平實之理取其易於辨析也兩輪心俱在甲乙丙及甲乙丁直線上為平朔望而丙為黃道上平朔之度丁為黃道上平望之度如日在本輪之戊月在本輪之己或在本輪之庚俱在甲己戊辛及甲庚壬直線上則為實朔望而辛為黃道上實朔之度壬為黃道上實望之度也如平朔望在丙在丁而日在戊月在己或在庚則日之實行度在辛相對之度在壬而辛丙及壬丁皆為加均乃實行過於平行之度月之實行度朔在癸望在子而癸丙及子丁皆為減均乃實行不及平行之度故以辛丙加均與癸丙減均相併得癸辛弧為兩實行相距之度亦即實朔距平朔之度以壬丁加均與子丁減均相併得子壬弧為兩實行相距之度亦即實望距平望之度也此日為加均月為減均故日實行在月實行之前為實朔望在平朔望之後必計月得若干時分而後行過癸辛弧及子壬弧始能與日相會相對故以癸辛弧及子壬弧變為時分以加平朔望而得實朔望也若日為減均月為加均則日實行在月實行之後而實朔望在平朔望之前即以實行相距之時分減平朔望而得實朔望其理亦同也如平朔望在丙在丁而日在戊月在己或在庚則日之實行度在辛相對之度在壬而辛丙及壬丁皆為減均乃實行不及平行之度月之實行度朔在癸望在子而癸丙及子丁亦皆為減均乃實行不及平行之度故以辛丙減均與癸丙減均相減餘辛癸弧為兩實行相距之度亦即實朔距平朔之度以壬丁減均與子丁減均相減餘壬子弧為兩實行相距之度亦即實望距平望之度也此日之減均大於月之減均故日實行在月實行之後而實朔望在平朔望之前必計月己行過與日相會相對若干時分為辛癸弧及壬子弧故以辛癸弧及壬子弧變為時分以減平朔望而得實朔望也若日之減均小於月之減均則日實行在月實行之前而實朔望在平朔望之後即以實行相距之時分加平朔望而得實朔望其理亦同也如平朔望在丙在丁而日在戊月在己或在庚則日之實行度在辛相對之度在壬而辛丙及壬丁皆為加均乃實行過於平行之度月之實行度朔在癸望在子而癸丙及子丁亦皆為加均乃實行過於平行之度故以辛丙加均與癸丙加均相減餘辛癸弧為兩實行相距之度亦即實朔距平朔之度也以壬丁加均與子丁加均相減餘壬子弧為兩實行相距之度亦即實望距平望之度也此日之加均大於月之加均故日實行在月實行之前而實朔望在平朔望之後必計月得若干時分而後行過辛癸弧及壬子弧始能與日相會相對故以辛癸弧及壬子弧變為時分以加平朔望而得實朔望也若日之加均小於月之加均則日實行在月實行之後而實朔望在平朔望之前即以實行相距之時分減平朔望而得實朔望其理亦同也朔望用時太陽與太隂實行相會相對為實朔望但實朔望之時刻按諸測驗猶有數分之差或早或遲差至一刻以其猶非用時也蓋實朔望固兩曜實會實對之度而推算時刻則仍以平行所臨之位為時皆依黃道而定今推平行與實行既有盈縮差則時刻亦有增減又時刻以赤道為主而黃道赤道既有升度差則時刻亦有進退故必以本時太陽均數與升度差俱變為時分以加減實朔望之時刻為朔望用時乃與測驗吻合此即日躔時差加減之理也求日月距地與地半徑之比例太陽太隂距地之逺近日躔月離地半徑差篇言之詳矣顧求地半徑差止用最髙最卑中距三限而交食之日月視徑以及影徑影差則逐度不同且太隂在最髙兩弦尤髙太陰在最卑兩弦尤卑交食在朔望其髙卑皆不及兩弦故欲求日月逐度之髙必先定最髙最卑中距之距地心線今依日月諸輪之行求得太陽在最髙距地心一一七九二八本半天徑加本輪半徑減均輪半徑其與地半徑之比例為一與一千一百六十二詳日躔厯理中距距地心一六四二一求均數時並求太陽距地心之邉即得其與地半徑之比例為一與一千一百四十二最卑距地心九八二七九二本天半徑減本輪半徑加均輪半徑其與地半徑之比例為一與一千一百二十一太陰在最髙朔望時距地心一一七二五本天半徑加負圈半徑減均輪半徑又減次輪半徑又減次均輪半徑即得俱詳月離二三均數圖其與地半徑之比例為一與五十八又百分之一十六中距朔望時距地心九九二二七三求初均數時並求太陰距地心之邉內減次均輪半徑即得蓋朔望時無二三均但距地心少次均輪半徑耳其與地半徑之比例為一與五十六又百分之七十二詳月離地半徑差篇最髙最卑皆以此為比例最卑朔望時距地心九五九二五本天半徑減負圈半徑加均輪半徑又加次輪半徑減次均輪半徑即得其與地半徑之比例為一與五十四又百分之八十四如求太陽在最髙前後四十度距地心與地半徑之比例則以太陽最髙距地心一一七九二八為一率一千一百六十二為二率太陽在最髙前後四十度之距地心線一一三九八九八為三率得四率一千一百五十七即當時日距地與地半徑之比例也求月距地之法倣此日月視徑日月之徑為食分淺深之原所關甚大但人目所見者非實徑乃視徑也實徑為一定之數而視徑則隨時不同蓋凡物逺則見小近則見大日月之行有髙卑其去地之逺近逐日不同故其視徑之小大亦不等數年以來精推實測得太陽最髙之徑為二十九分五十九秒最卑之徑為三十一分零五秒比舊定日徑最髙少一秒最卑多五秒朔望時太陰最髙之徑為三十一分四十七秒最卑之徑為三十三分四十二秒比舊定月徑最髙多一分一十七秒最卑少五十八秒而以日月髙卑比例推算今數為密兹將測算之術詳著於篇測太陽徑一法用正表倒表各取日中之影求其髙度兩髙度之較即太陽之徑也蓋正表之影乃太陽上邊之光射及表之上邉其所得為太陽上邊距地平之髙度倒表之影乃太陽下邊之光射及表之下邊其所得為太陽下邉距地平之髙度故兩髙度之較即太陽之徑也一法用儀器測得太陽午正之髙度復用正表測影亦求其髙度兩髙度之較即太陽之半徑也蓋儀器所得者太陽中心之度表影所得者太陽上邊之度故兩髙度相較即得太陽之半徑也一法用中表正表各取日中之影求其髙度兩髙度之較即太陽之半徑也蓋中表係橫梁上下皆空太陽上邊之光射橫梁之下面太陽下邊之光射橫梁之上面其所生之影必當太陽之中心故以中表所測之髙度與正表所得太陽上邊之髙度相較即得半徑也一法治一暗室令甚黝黑於室頂上開小圓孔徑一寸或半寸以透日光孔面頂平不可欹側室內置平案孔中心懸垂線至案中線正午時日光射於案上必成撱圓形爰從案上對垂線處量至撱圓形之前後兩界垂線至前界加孔之半徑為前影垂線至後界減去孔之半徑為後影乃以垂線即孔距案面為一率前後影各為二率半徑一千萬為三率得四率並查八線表之餘切線得前後影之兩髙度相減之較即太陽之全徑也蓋太陽上邊之光從孔南界射入至案為撱圓形之前界與正表之理同太陽下邊之光從孔北界射入至案為撱圓形之後界與倒表之理同故兩髙度之較即為太陽之徑也至於前後影必加減孔之半徑者因量影時俱對孔之中心起算然前影則自孔之南界入在中心之前而後影則自孔之北界入在中心之後較之中心並差一半徑故必須加減半徑而後立算也測太陰徑一法春秋分望時用版或墻為表以其西界當正午線人在表北依不動之處候太隂之西周切於正午線看時辰表是何時刻俟太陰體過完其東周才離正午線復看時辰表是何時刻乃計太陰過正午線共得幾何時刻以時刻變度每時之四分為一度內減本時分之太陰行度餘即太陰之徑也一法兩人各用儀器候太陰當正午時同時並測一測其上弧髙度一測其下弧髙度兩髙度之較即太隂之徑也一法用附近恆星以紀限儀測其距太陰左右兩弧之度其兩距度之較即太陰之徑也以上諸法逐時測量即得太陽太陰自髙及卑之各半徑以立表又法不用逐時測量止測得最髙最卑時之兩半徑相減用其較數與本輪之矢度為比例即可得髙卑間之各半徑數也如太陽最髙之徑為二十九分五十九秒最卑之徑為三十一分零五秒相差一分零六秒化為六十六秒今求距髙卑前後六十度之視徑則命本輪徑為二千萬為一率六十度之矢五百萬為二率徑差六十六秒為三率得四率一十六秒半以加最髙之徑二十九分五十九秒得三十分一十五秒半為最髙前後六十度之視徑以減最卑之徑三十一分零五秒得三十分四十八秒半為最卑前後六十度之視徑也太陰之法並同求日月實徑與地徑之比例日月地三體各有大小之比例日最大地次之月最小新法厯書載日徑為地徑之五倍有餘月徑為地徑之百分之二十七強今依其法用日月髙卑兩限各數推之所得實徑之數日徑為地徑之五倍又百分之七月徑為地徑之百分之二十七弱皆與舊數大致相符足徵其説之有據而非誣也凡明暗兩體相對明體施光暗體受之其背即生黑影若兩體同大則其影成平行長圓柱形其徑與原體相同其長至於無窮而無盡也如甲圖然若明體小暗體大則其影漸大成圓墩形其徑雖與原體相同其長至於無窮其底之大亦無窮也如乙圖然惟明體大暗體小則其影漸小成尖圓體其徑與原體等其下漸小而盡成鋭角如丙圖然使日小於地或與地等則地所生之影宜如甲乙兩圖其長無窮今地影不能掩熒惑何况嵗星以上諸星是地影之長有盡必如丙圖而日之大於地也其理明矣又凡人目視物近則見大逺則見小如丁戊與己庚兩物同大人目視之成兩三角形丁戊近目其兩腰短故底之對角大己庚逺目其兩腰長故底之對角小若去人目有逺近而視之若等則逺者必大近者必小今仰觀日月其徑略等而日去地甚逺月去地甚近則月必小於日也可知矣夫地徑小於日而地影之徑又漸小於地月過地影則食食時月入影中多厯時刻而後生光則月必小於地影月既小於地影則其必小於地也又何疑焉求日實徑之法如圖甲為地心乙為日心甲乙為兩心相距乙甲丙角為日視半徑角乙丙為日半徑用甲乙丙直角三角形此形有丙直角有甲角十四分五十九秒三十微為日在最髙之視半徑有乙甲邊一千一百六十二為日在最髙距地心之數求得乙丙五又百分之七為日實半徑即為地半徑之五倍又百分之七也求月實徑之法倣此地影半徑太陽照地而生地影太陰過影而生薄蝕凡食分之淺深食時之久暫皆視地影半徑之大小其所係固非輕也但地影半徑之大小隨時變易其故有二一緣太陽距地有逺近距地逺者影巨而長距地近者影細而短此由太陽而變易者也一緣地影為尖圓體近地粗而逺地細太陰行最卑距地近則過影之粗處其徑大行最髙距地逺則過影之細處其徑小此由太陰而變易者也今依太陽在最髙所生之大影為率而以太陰從髙及卑各距地心之地半徑數求其相當之影半徑為影半徑表復求得太陽從髙及卑所生之各影各求其太陰在中距所當之影半徑俱與太陽在最髙所生之大影相較餘為影差列於本表之下用時以太陰引數宫度查得影半徑復以太陽引數宫度查得影差以減影半徑即得所求之地影實半徑也如圖甲為地球乙丙皆為太陽乙為最髙丙為最卑太陽從最髙乙發光則地影長大為丁己戊從最卑丙發光則地影短小為丁庚戊太陰遇丁己戊大影而在最髙辛則其所當之影徑如辛壬在最卑癸則其所當之影徑如癸子若太陰遇丁庚戊小影而在最髙辛則其所當之影徑如丑寅在最卑癸則其所當之影徑如卯辰其兩半徑之較為辛丑與癸卯是所謂影差也求地影半徑有二法一用推算一用測量而推算所得之數比測量所得之數常多數分蓋因太陽光大能侵削地影故也如甲為地球乙丙丙丁為太陽實半徑從乙丁作兩線切地球戊己兩邊而交於庚則成戊庚己影然太陽光芒常溢於原體之外如辛壬從辛壬作兩線切地球戊己兩邊而交於癸則成戊癸己影而小於戊庚己影論其實則推算之數為真欲合仰觀則測量之數為準故地影表所列之數皆小於推算之數也推算之法命地半徑甲己為一百分則太陽實半徑丙丁為五百零七分太陽實徑為地徑之五倍又百分之七今以地半徑為一百分則太陽實半徑為五百零七分以甲己與丙丁相減餘丙子四百零七乃以丙子四百零七為一率太陽在最髙距地心之丙甲一十一萬六千二百即地半徑之一千一百六十二倍為二率甲己地半徑一百為三率得四率甲庚二萬八千五百五十為地影之長蓋丙子甲勾股形與甲己庚勾股形為同式形故其相當各界皆可為比例也既得甲庚地影之長乃求得甲庚己角一十二分零二秒又於甲庚地影之長內減去太陰在中距朔望時距地心之甲丑五千六百七十二即地半徑之五十六倍又百分之七十二餘二萬二千八百七十八為丑庚於是用丑庚寅直角三角形求得丑寅八十有餘又用甲丑寅直角三角形求得甲角四十八分三十四秒為太陰在中距時所過地影之半徑查地影半徑表為四十四分四十三秒多三分五十一秒測量之法如康熙五十六年丁酉八月十七日月食其實引為二宫三度四十一分零三秒距地心五十七地半徑零百分之四十一測得緯度在黃道北三十六分一十八秒月半徑為一十六分一十秒食分為二十三分三十秒乃以黃道緯度三十六分一十八秒求得白道緯度三十六分二十六秒為食甚距緯與食分二十三分三十秒相加得五十九分五十六秒內減月半徑一十六分一十秒餘四十三分四十六秒為地影半徑查地影半徑表為四十三分五十四秒相差八秒乃本時太陽之影差也表數乃太陽在最髙之影今太陽在八宫故差八秒如圖子丑寅為黃道卯辰己為白道卯子寅己為地影午丑為地影半徑未申酉為月未辰為月半徑月行白道從卯至辰距地影心丑最近是為食甚午酉即為食分辰戌為黃道緯度辰丑即白道緯度用辰丑戌正弧三角形此形有辰角與黃白交角等有戌直角有辰戌邊求得辰丑為食甚距緯以午酉食分與辰丑距緯相加成亥丑內減與月半徑未辰相等之亥午餘午丑即為地影之半徑也推算所得之數既大於測量所得之數則太陽光大之能侵削地影可知矣然不得太陽之光分雖逐時測量又有影差雜於其內則地影之大小終不能得其真今立法以太陰在中距之地影半徑四十四分四十三秒為準前測月食實引二宫三度近中距而其影略與表合故以中距之地影為準求太陽之光分命地半徑甲巳為一百分則太陰在中距朔望時距地心之甲丑為五千六百七十二丑甲寅角即為四十四分四十三秒用甲丑寅直角三角形求得丑寅為七十三小餘七八甲寅為五千六百七十二小餘四八又用甲巳寅直角三角形巳為直角求得巳甲寅角為八十八度五十九分二十四秒於象限內減去巳甲寅角又減去丑甲寅角餘一十五分五十三秒為卯甲己角乃用卯甲己直角三角形已為直角求得甲卯為一百又千分之一甲卯內減去與丑寅相等之甲辰餘二十六小餘二二一為辰卯於是以卯辰寅勾股形辰寅與甲丑等與卯甲庚勾股形為比例得甲庚二萬一千六百三十二即地影之長又以甲己庚勾股形與丙丁庚勾股形為比例得丙丁六百三十七即太陽之光分為地半徑之六倍又百分之三十七也既得丙丁太陽之光分又得甲庚地影之長乃於甲庚內減太陰在最髙距地心之甲巳五千八百一十六餘己庚一萬五千八百一十六以甲卯庚勾股形與巳午庚勾股形為比例得巳午七十三小餘一一又用甲巳午直角三角形求得甲角四十三分一十三秒為太陰在最髙所過地影之半徑於甲庚內減太陰在最卑距地心之甲未五千四百八十四餘未庚一萬六千一百四十八以甲卯庚勾股形與未申庚勾股形為比例得未申七十四小餘六五又用甲未申直角三角形求得甲角四十六分四十八秒為太陰在最卑所過地影之半徑比舊表最髙多一十三秒最卑少一十二秒蓋舊表固由實測要亦準於太隂之髙卑今測太陰之在最髙較舊數為稍卑故月徑大而影徑亦大太陰之在最卑較舊數為稍髙故月徑小而影徑亦小然月徑約以三十分為十分影徑差一十二秒食分止差四秒固不失為密合况影徑隨月徑而大小尤不致舛謬也於是以隨時太陰距地心之地半徑數各與地影之長相減以求得地影之半徑線又各求其相當之角即得太陰隨時之影半徑以立表求影差之法用太陽在最髙所生之長影求得太陰在中距時所當之影半徑四十四分四十三秒為率而以太陽在最卑所生之短影亦求得太陰在中距所當之影半徑為四十四分零八秒相差三十五秒為太陽最髙最卑兩限之影差其餘影差俱依此例推之御製厯象考成上編卷六
