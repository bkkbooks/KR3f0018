body:
  text: 欽定四庫全書御製厯象考成上編卷七交食厯理二専論月食太隂食根月食分秒月食五限時刻見食先後定月食方位繪月食圖太陰食限食限者推太陰交周度距交若干為入食限之始也太陰半徑與地影半徑相切即入食之限故以兩半徑相併之數當黃白兩道之距緯度而求其相當之經度得距交一十一度一十六分四十五秒為必食之限距交一十二度一十六分五十五秒為可食之限蓋必食者無不食可食者或食或不食也二者皆實望之限若論平望其限尤寬得距交一十四度五十四分即為有食之限矣解之如左地影半徑最小者四十二分三十八秒太陰半徑最小者一十五分五十三秒三十微相併得五十八分三十一秒三十微黃白距緯度在此數以內者月必食以此數當距緯求其經度則用黃白大距四度五十八分三十秒之正切與半徑為比例即得一十一度一十六分四十五秒為必食之限如圖甲乙為黃道甲丙為白道甲為二道之交乙為地影心丙為月心兩周相切於丁乙丁丙為兩半徑之共數若距度在此數以內則月周侵入地影內而見食故用甲乙丙正弧三角形求甲丙交周度距交若干此形有丙直角有甲角黃白大距度四度五十八分三十秒有乙丙兩半徑相併五十八分三十一秒三十微今以甲角正切與半徑之比同於乙丙距緯正切與甲丙經度正弦之比而得一十一度一十六分四十五秒為甲丙距交之度也地影半徑最大者四十六分四十八秒太陰半徑最大者一十六分五十一秒相併得一度零三分三十九秒黃白距緯度在此數以內者月可食以此數當距緯按前法求經度得一十二度一十六分五十五秒為可食之限其或不食者何也蓋必兩半徑俱最大而後得食若有一半徑略小即兩周不得相切而不食矣平望之限又寬於實望之限而為一十四度五十四分何也蓋太陽最大之均數二度零三分一十一秒太陰最大之均數四度五十八分二十七秒相併得七度零一分三十八秒為兩實行相距最逺之度如圖甲為地心乙為黃道上平望之點日之實行正對之度在丙乙丙弧為二度零三分一十一秒月之實行度在丁丁乙弧為四度五十八分二十七秒兩實行相併得丁丙弧七度零一分三十八秒為日實行正對之點與月實行相距之度逮月實行逐及於日實行正對之丙則曰正對之點又行三十一分餘至戊月更行至戊則日正對之點又行二分餘至己月必又行至己方為實望共計乙己弧得二度三十七分有餘為實望距平望之數以此數與實望之限相加得一十四度五十四分乃為平望之食限也月食分秒月食分數之淺深視黃白距緯之多少距緯愈少太陰心與地影心相去愈近則太陰入影愈深故用太陰半徑地影半徑相併而與距緯相較併徑大於距緯之較即為月食之分若併徑小於距緯則月不食若太陰恰當交點而無距緯則併徑全為食分為月食之最深也但太陰與地影之半徑分秒皆係弧度而論食分則以太陰全徑直線計之其法命太陰全徑為十分以太陰視徑分秒與併徑距緯之較之比無距緯者即以併徑為比同於太陰全徑與食分之比也如圖甲乙為黃道丙乙為白道乙為二道之交丙甲丁戊己庚皆為黃白距度辛甲壬戊癸庚子乙皆為地影半徑丙丑丁寅己卯乙辰皆為太陰半徑如太陰心在丙地影心在甲丙丑辛甲兩半徑相併小於丙甲距緯則太陰不入於影故不食也如太陰心在丁地影心在戊丁寅壬戊兩半徑相併大於丁戊距緯其較為壬寅即太陰入影之分也又如太陰心在己地影心在庚己卯癸庚兩半徑相併大於巳庚距緯其較為癸卯與太陰全徑相等即太陰入影之分此為月食十分蓋月體全入影中才食既而即生光也又太陰恰當交點全無距緯太陰心地影心相會於乙即以子乙乙辰兩半徑相併為太陰入影之分月食遇此其食分為最深也設太陰在最髙其視半徑一十五分五十三秒三十微地影半徑四十三分一十三秒相併得五十九分零六秒三十微乃以太陰視徑三十一分四十七秒為一率併徑五十九分零六秒三十微為二率太陰全徑十分為三率得四率一十八分三十七秒為月食之最大分也月食五限時刻月食五限一曰食甚乃月入影最深之限也一曰初虧月將入影兩周初切也一曰食既月全入影其光盡掩也是二者在食甚前一曰生光月將出影其光初吐也一曰復圓月全出影兩周方離也是二者在食甚後月食十分以上者有五限十分以下者止三限無食既與生光也其時刻之多寡則由於入影之淺深過影之遲速蓋距緯有寬狹寬則入影淺而時刻少狹則入影深而時刻多又月與影之半徑各有小大月大影小則過影速而時刻少月小影大則過影遲而時刻多抑且自行有遲疾遲則出影遲疾則出影速故雖距緯同半徑同而自行不同即時刻亦不同也其食甚前後各限相距之時刻恆等而食甚又非實望之時所差雖微而理則實異夫地影之心即太陽正對之點地影心距交之黃道經度與月心距交之白道經度等是為東西同經即為實望然月心與影心斜距猶逺惟從白極出弧線過影心至白道與白道成直角月心臨此直角之點乃為食甚蓋惟此時月心與影心相距甚近食分最深也如圖甲乙為黃道甲丙為白道甲為交點丙為實望之度丁戊己庚為地影乙為影心甲乙與甲丙等辛壬癸子丑為五限月心所在辛為初虧戊為初虧之點壬為食既丁為食既之點癸為食甚癸乙為食甚距緯較丙乙為近此線引長必過白極故與白道成直角子為生光庚為生光之點丑為復圓己為復圓之點癸丙為食甚距實望之弧辛癸為初虧距食甚之弧與復圓距食甚之癸丑弧等壬癸為食既距食甚之弧與生光距食甚之癸子弧等故求得食甚前兩限距食甚之時刻以減食甚時刻得食甚前兩限之時刻以加食甚時刻得食甚後兩限之時刻也若以丙為食甚則丙乙之距大於癸乙必非入影最深之處而前後各限之距俱不相等矣推食甚時刻求癸丙弧法用乙甲癸正弧三角形此形有癸直角有甲角有甲乙黃道度與甲丙交周度等求得甲癸以甲癸與甲丙相減得癸丙乃用變時法以一時之月實行與一時之比同於癸丙度分與食分之比即得時之若干分秒而行癸丙弧為食甚距實望之時分加減實望時刻即得食甚之時刻矣推初虧復圓時刻用辛乙癸正弧三角形此形有癸直角有癸乙弧有辛戊月半徑與戊乙影半徑相加之辛乙弧求得辛癸為初虧距食甚之弧亦用一時之月實行比例得時分以減食甚時刻得初虧時刻以加食甚時刻得復圓時刻也推食既生光時刻用壬乙癸正弧三角形此形有癸直角有癸乙弧有丁壬月半徑與丁乙影半徑相減之壬乙弧求得壬癸為食既距食甚之弧亦用一時之月實行比例得時分以減食甚時刻得食既時刻以加食甚時刻得生光時刻也見食先後月食深淺分數天下皆同而虧復各限時刻不同者非月入影有先後乃人居地面有東西也蓋日之所之為時隨人所居各以見日出入為東西日中為南為子午而平分時刻故其地同居一子午線者雖南北懸殊北極出地髙下不同而時刻不異若東西易地雖北極同髙而西方見食必先東方見食必後也凡東西差一度則時差四分今以京師為主視各省之子午線在京師東者以時差加在京師西者以時差減皆加減京師各限時刻為各省各限時刻也是故欲定各省之時刻必先定各省之子午線而欲定各省之子午線非分測各省之月食其道無由也定月食方位厯來厯書定月食初虧復圓方位距緯在黃道北初虧東南復圓西南在黃道南初虧東北復圓西北食八分以上則初虧正東復圓正西此東西南北主黃道之經緯言非謂地平經度之東西南北也惟月實行之度在初宫六宫初度望時又為子正則黃道經緯之東西南北與地平經度合否則黃道升降有斜正而加時距午有逺近故兩經緯迥然各别而所推之東西南北必不與地平之方位相符不如實指其在月體之上下左右為衆目所共覩乃為親切也其法從天頂作髙弧過月心至地平即分月體為左右兩半周乂平分為上下兩象限即成左上左下右上右下四象限而黃道在地平上之半周亦平分為東西兩象限乃於初虧復圓二限各求其黃道交髙弧之角若月當黃道無距緯而交角滿九十度則初虧正左復圓正右在黃道西象限而交角在四十五度以上初虧左稍偏上復圓右稍偏下交角在四十五度以下初虧上稍偏左復圓下稍偏右在黃道東象限者反是若月在交前後有距緯則又須求得緯差角與髙弧交角相加減為定交角然後可定其上下左右也加減之法月距黃道北而在西象限初虧為加復圓為減在東象限初虧為減復圓為加月距黃道南者反是乃視定交角為相加者在九十度以內則虧復之上下左右如前論若過九十度為鈍角則易象限之上下又或定交角為相減者而交角內減去差角則虧復之上下左右如前論若差角內減去交角則易象限之左右也求黃道髙弧交角如圖甲乙丙為子午規甲為天頂乙丙為地平甲丁戊為髙弧己庚辛為黃道壬庚癸為赤道庚為春分子為北極子丑丁為過極經圈丁庚為月距春分黃道度丑庚為月距春分赤道度壬丑為月距正午赤道度即食甚時太陽距子正赤道度壬庚為春分距正午赤道度月實行度在丁求黃道與髙弧相交之丁角先用庚辛癸斜弧三角形求黃道交地平之辛角此形有庚角為春分角有癸角為赤道髙減半周之餘有庚癸春分距地平弧為春分距正午之餘求得辛角為黃道交地平之角并求得庚辛弧為黃道距地平之邊乃以丁庚月距春分度與庚辛弧相加得丁辛弧因用丁辛戊正弧三角形求丁角此形有丁辛弧有辛角有戊直角即求得丁角為黃道與髙弧相交之角也緯差角者初虧復圓時月與地影兩心相距之線與黃道相交之角也如圖甲乙丙為黃道丁戊巳為白道乙為地影心庚戊辛皆為月心乙戊為距緯即食其時兩心相距之數乙庚為併徑即初虧時兩心相距之數壬庚為距緯乙辛亦併徑為復圓時兩心相距之數癸辛為距緯如月適當黃道無距緯則初虧復圓時兩心相距之線與甲乙丙黃道相合而無差角矣因有緯度故乙庚兩心相距之線與甲乙丙黃道相離即成甲乙庚角乙戊之距愈寬其差角愈大也法以乙庚併徑之正弦與初虧距緯壬庚之正弦為比同於半徑一千萬與乙角之正弦為比即初虧之緯差角也又以乙辛併徑之正弦與復圓距緯癸辛之正弦為比同於半徑一千萬與乙角之正弦為比即復圓之緯差角也月正當交點無距緯則無緯差角如圖甲乙丙為黃道一象限庚為初虧月心辛為復圓月心如在黃道西象限則黃道左昂右低而甲乙丑或丙乙卯交角在四十五度以上故初虧子點在月體之左稍偏上復圓寅點在月體之右稍偏下也如交角在四十五度以下則初虧為上稍偏左復圓為下稍偏右若在黃道東象限則黃道左低右昂而甲乙卯或丙乙丑交角在四十五度以下故初虧子點在月體之下稍偏左復圓寅點在月體之上稍偏右也如交角在四十五度以上則初虧為左稍偏下復圓為右稍偏上如月距黃道之南而在黃道東象限如圖甲乙卯或丙乙丑為黃道交髙弧之角庚乙甲為初虧緯差角辛乙丙為復圓緯差角因月距黃道之南初虧時宜以庚乙甲緯差角與甲乙卯交角相加得卯乙庚為定交角在四十五度以上故初虧子點在月體之左稍偏下復圓時須以辛乙丙緯差角與丙乙丑交角相減餘丑乙辛為定交角在四十五度以下故復圓寅點在月體之上稍偏右也若在黃道西象限則初虧之緯差角為減復圓之緯差角為加與此相反如月距黃道之北而在黃道東象限如圖甲乙卯或丙乙丑為黃道交髙弧之角庚乙甲為初虧緯差角辛乙丙為復圓緯差角因月距黃道之北初虧時宜以庚乙甲緯差角與甲乙卯交角相減餘卯乙庚為定交角在四十五度以下故初虧子點在月體之下稍偏左復圓時須以辛乙內緯差角與內乙丑交角相加得丑乙辛為定交角在四十五度以上故復圓寅點在月體之右稍偏上也若在黃道西象限則初虧之緯差角為加復圓之緯差角為減與此相反繪月食圖凡繪月食圖先作橫豎二線直角相交橫線當黃道豎線當黃道經圈用地影半徑為度於中心作圜以象暗虛又以月半徑與地影半徑相減用其餘數為度作內虛圈為食既生光之限又以兩半徑相併為度作外虛圈為初虧復圓之限次視實交周在初宫十一宫於外虛圈上周黃經線右取黃白大距五度作識實交周在五宫六宫於外虛圈上周黃經線左取黃白大距五度作識乃自所識作線過圜心至外虛圈下周即為白道經圈於此線上自圜心取食其距緯度作識即食甚時月心所在從此作橫線與白道經圈相交成直角即為白道而白道割外虛圈右周之點乃初虧時月心所在割內虛圈右周之點乃食既時月心所在割內虛圈左周之點乃生光時月心所在割外虛圈左周之點乃復圓時月心所在也末以五限月心所到之點為心月半徑為度作各小圜以象月體即初虧食既食甚生光復圓之象俱備矣如圖甲乙豎線如黃道經圈丙丁橫線如黃道戊己庚圈為地影甲丙乙丁外虛圈為初虧復圓之限其丙辛半徑為月與地影兩半徑相併之數壬癸內虛圈為食既生光之限其癸辛半徑為月與地影兩半徑相較之數設實交周五宫或六宫則於外虛圈上周甲乙經線之左取黃白大距五度如子從子作線過圜心辛至下周丑為白道經圈於子丑白道經圈上自圜心辛向上取食甚距緯度如寅辛此寅點即食甚時月心所在也此以實交周五宫為例其緯在北故自圜心辛向上取寅點若實交周是六宫其緯在南則自圜心辛向下取寅點乃從寅取直角作卯辰線與子丑白道經圈相交即為白道而白道割外虛圈右周卯點為初虧限割內虛圈右周巳點為食既限割內虛圈左周午點為生光限割外虛圈左周辰點為復圓限於卯巳寅午辰五點各為心月半徑為度作圜以象月體即見月心在卯其周正切暗虛而光將缺是為初虧月心至巳其體全入暗虛而光盡掩是為食既月心至寅其體深入暗虛兩心相距甚近是為食甚月心至午其體將出暗虛而光初吐是為生光月心至辰其體全出暗虛而光才滿是為復圓也御製歷象考成上編卷七
