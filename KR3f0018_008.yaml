body:
  text: 欽定四庫全書御製厯象考成上編卷八交食厯理三太陽食限日食三限時刻黃平象限白象限之同異日食三差求黃平象限及黃道髙弧交角并太陽髙弧求白平象限及白道髙弧交角并太陰髙弧求東西南北差求日食食甚用時食甚交周食甚實緯求日食食甚真時及食甚視緯求日食初虧復圓用時求日食初虧復圓真時日食分秒定日食方位繪日食圖太陽食限日食之限不同於月食月食惟以太陰地影兩視半徑相併之數當黃白二道之距緯推距交之經度即為食限日食因有南北差其視緯度隨地隨時不同故太陽太陰兩視半徑不能定食限也夫最大之南北差一度零一分太陽最大之視半徑一十五分三十二秒三十微太陰最大之視半徑一十六分五十一秒兩視半徑相併得三十二分二十三秒三十微與南北差一度零一分相加得一度三十三分二十三秒三十微為視緯度以推距交經度得一十八度一十五分一十三秒為可食之限太陽最小之視半徑一十四分五十九秒三十微太陰最小之視半徑一十五分五十三秒三十微兩視半徑相併得三十分五十三秒與南北差一度零一分相加得一度三十一分五十三秒為視緯度以推距交經度得一十七度五十六分五十六秒為必食之限然在黃道北者必食在黃道南者或食或不食在黃道北者亦非普天之下皆見食但必有見食之地耳蓋視差因地里之南北而殊而視緯又因實緯之南北而異故食限不可一槩而論也今以北極髙一十六度至四十六度之地而定食限則太陰距黃道北平朔之限得二十度五十二分實朔之限得一十八度一十五分太陰距黃道南平朔之限得八度五十一分實朔之限得六度一十四分要之視差之故多端食限不過得其大槩欲定食之有無必按法求得本地本時視緯度與太陽太陰兩視半徑相較若兩視半徑相併之數大於視緯者為有食小於視緯者為不食也如圖甲乙為黃道丙丁為白道戊為實交巳庚為視白道辛為視交太陽從甲乙黃道行太陰實循丙丁白道行因髙下差變髙為下遂生南北差視之如循巳庚行也如太陽在壬太陰距黃道北在癸距戊交約一十八度去太陽甚逺因視差之故見太陰在子巳與太陽兩周相切故北緯以距交一十八度為有食之始也如太陽在丑太陰距黃道南在寅距戊交約六度雖無視差己與太陽兩周相切故南緯以距交六度為有食之始也至於平朔之限又寬於實朔者因實朔距平朔之行度約二度三十七分故以此數與實朔之限相加乃為平朔之限與太陰食限之理同日食三限時刻日食止有三限一曰初虧一曰食甚一曰復圓而無食既生光蓋太陽太陰之視徑略相等食甚之最大者不過食既方食甚即生光故止求三限時刻三限時刻維何曰用時曰近時曰真時此三者雖為三限所同而三限之中尤以食甚為本故今發眀三限時刻先詳食甚時刻次及初虧而復圓如之食甚之理大槩與月食同但月食以太陰實經度當最近地影心之㸃為食甚故以實望交周求得食甚交周相減為交周升度差以月實行比例得時分加減實望用時即得食甚時刻而無用時近時真時之名日食因有東西差詳後日食三差篇必以太陰視經度當最近太陽之㸃為食甚其實經度與視經度既不同而實行與視行又不同故先以實朔交周求得食甚交周相減為交周升度差以月實行比例得時分加減實朔用時為食甚用時詳後求食甚用時篇次以食甚用時求得東西差詳後求東西南北差篇仍以月實行比例得時分加減食甚用時為食甚近時又以食甚近時求得東西差與用時東西差相較得視行然後以視行與用時東西差比例得時分加減食甚用時方為食甚真時詳後求食甚真時篇是則食甚用時者乃在天實行日月相掩最深之時刻食甚真時者乃人目所見日月相掩最深之時刻而食甚近時者所以定視行以求用時與真時相距之時分者也夫食甚既有用時近時真時則初虧復圓亦必有用時近時真時乃今求日食初虧復圓用時則不以初虧復圓距食甚之時分加減食甚用時而以初虧復圓距食甚之時分加減食甚真時為初虧復圓用時詳後求初虧復圓用時篇次以初虧復圓用時求得東西差與食甚之東西差相較得視行乃以視行與初虧復圓距食甚之度比例得時分加減食甚真時即為初虧復圓真時詳後求初虧復圓真時篇然而不用近時者蓋為近時所以求視行今食甚巳有東西差則與初虧復圓東西差相較即可以得視行故不必又求近時也要之求日食三限時刻必先求食甚真時而欲求食甚真時必先求食甚用時有食甚用時然後可以知三差之大小而三限時刻皆由此次第生焉此日食所以異於月食也如圖甲乙為黃道甲丙為白道甲為交㸃丁為太陽戊為太陰甲巳為實朔交周與甲丁等故巳㸃為實朔用時之度然丁巳相距猶逺試自白極過太陽丁作丁戊垂弧與白道成直角則丁戊之距必近於丁巳故戊㸃為食甚用時之度甲戊為食甚交周丁戊為食甚實緯戊巳為交周升度差以一小時之月實行與戊巳交周升度差相比得時分加減巳㸃實朔用時得戊㸃為食甚用時此太陰在兩交後由甲向丙故甲巳度多甲戊度少應減戊巳距時若太陰在兩交前由丙向甲則丙巳度少丙戊度多應加戊巳距時既得食甚用時如戊則自用時求近時今太陰實經度雖在戊因有東西差而用時之視經度却在庚則尚在食甚前故求得庚戊東西差以一小時之月實行相比得時分加於戊點食甚用時得辛點為食甚近時庚戊與戊辛等若使辛點近時之東西差與戊點用時之東西差等則實經度在辛視經度即在戊而近時即為真時又何用求真時然近時實經度雖在辛而近時之東西差復不同於用時之東西差故近時之視經度却又在壬則仍在食甚前夫食甚用時因東西差而見太陰在庚食甚近時又因東西差而見太陰在壬是自戊點食甚用時至辛點食甚近時止見太陰行庚壬之分故以庚壬視行與戊辛弧所變時分之比即同於庚戊東西差與戊癸弧所變時分之比加於戊點食甚用時得癸點為食甚真時蓋食甚真時之東西差如戊癸必使太陰實經度在癸而視經度乃在戊方為人目所見日月相掩最深之時刻也此太陰視經度在實經度西故加東西差所變時分若太陰視經度在實經度東則減東西差所變時分詳下二篇又如子為初虧限太陰所在丑為復圓限太陰所在丁子丁丑皆太陽太陰兩視半徑相併之數今命丁戊為食甚視緯丁戊原係食甚實緯今借為食甚視緯以明其理用正弧三角形求得子戊或戊丑為初虧復圓距食甚之弧子弧與弧丑等以一小時之月實行相比得時分即初虧復圓距食甚之時分今求初虧復圓用時論理當於戊點食甚用時內減子戊弧所變時分得子點為初虧用時然後求初虧近時及真時但丁戊既為食甚真時之視緯則求初虧用時即於食甚真時內減初虧距食甚之時分得數為密故於癸點食甚真時內減與子戊弧相等之寅癸弧所變時分得寅點為初虧用時因初虧用時之東西差不同於食甚真時之東西差其視經度却在卯則己過初虧後夫食甚真時因東西差而見太陰在戊初虧用時又因東西差而見太陰在卯是自寅點初虧用時至癸點食甚真時止見太陰行卯戊之分故卯戊即為視行而不必又求初虧近時以卯戊視行與寅癸弧所變時分之比即同於子戊初虧距食甚之度與辰癸弧所變時分之比於癸點食甚真時內減之得辰點為初虧真時蓋初虧真時之東西差如辰子必使太陰實經度在辰而視經度乃在子方為人目所見日月兩周初切之時刻也復圓時刻倣此但與食甚時刻加減相反黃平象限白平象限之同異新法厯書推算日食三差以黃平象限為本黃平象限乃黃道在地平上半周折中之處東西距地平各一象限故名黃平象限又名九十度限今按三差並生於太陰而太陰之經緯度為白道經緯度用白道較之用黃道為密詳見下日食三差篇故今推算日食三差以白平象限為本白平象限即白道在地平上半周折中之處東西距地平亦各一象限然求白平象限諸數必由黃平象限諸數而得不合論之不見其同異不分論之不得其疏密今將黃平象限白平象限之同異詳具圖說如左如圖甲為天頂甲乙丙丁為子午圈乙丙為地平丁為赤極即北極戊巳庚為赤道按黃赤大距二十三度二十九分三十秒作辛壬負黃極圈任取癸點為黃極則子丑為黃道自黃極癸過天頂甲作癸甲子寅過黃極經圈則子點為黃平象限卯為黃道出地平之點辰為黃道入地平之點子卯子辰皆九十度黃道與赤道交於巳午己為春分午為秋分宗動天左旋惟赤極丁點不動自赤極丁過天頂甲之經圈即子午圈故赤道地平上半周折中之戊點常在正午若黃極則隨天左旋一曰繞赤極一周惟黃極正當赤極之上如辛或正當赤極之下如壬則黃赤大距當正午自黃極過天頂甲之黃道經圈即與子午圈合故黃平象限亦在正午今黃極癸在赤極西半周則自黃極癸過天頂甲所作之癸甲子寅經圈其南半周必在子午圈之東故黃平象限子點即在正午東出地卯點在赤道北入地辰點在赤道南春分後未點當正午而子未即黃平象限距正午東之度子寅即黃平象限距地平之髙也若黃極癸在赤極東半周則自黃極癸過天頂甲所作之癸甲子寅經圈其南半周必在子午圈之西故黃平象限子點即在正午西出地卯點在赤道南入地辰點在赤道北秋分前申點當正午而申子即黃平象限距正午西之度子寅即黃平象限距地平之髙也夫黃極隨天左旋一日既繞赤極一周則白極隨天左旋一日亦繞黃極一周今按朔望時黃白大距四度五十八分三十秒作酉戌負白極圈任取亥點為白極則乾坎為白道自白極亥過天頂甲作亥甲乾艮過白極經圈則乾點為白平象限震為白道出地平之點巽為白道入地平之點乾震乾巽皆九十度白道與黃道交於離坤離為正交坤為中交惟白極正當黃極之上如酉或正當黃極之下如戌則黃白大距當黃平象限自白極過天頂甲之白道經圈即與黃道經圈合故白平象限與黃平象限同度今白極亥在黃極西半周則自白極亥過天頂甲所作之亥甲乾艮經圈其南半周必在黃道經圈之東故白平象限乾點即在黃平象限東出地震點在黃道北入地巽點在黃道南正交後兊點當黃平象限而乾兊即白平象限距黃平象限東之度乾艮即白平象限距地平之髙也設太陰在乾兊之間則所當黃道度為限東視經度差而東其時刻宜減而白道度實為限西視經度差而西其時刻則宜加也若白極亥在黃極東半周則自白極亥過天頂甲所作之亥甲乾艮經圈其南半周必在黃道經圈之西故白平象限乾點即在黃平象限西出地震點在黃道南入地巽點在黃道北中交後亢點當黃平象限而乾亢即白平象限距黃平象限西之度乾艮即白平象限距地平之髙也設太陰在乾亢之間則所當黃道度為限西視經度差而西其時刻宜加而白道度實為限東視經度差而東其時刻則宜減也又白平象限距地平之乾艮弧髙於黃平象限距地平之子寅弧則白道直而昻黃道斜而低白道髙弧交角必小於黃道髙弧交角如白平象限距地平之乾艮弧低於黃平象限距地平之子寅弧則白道斜而低黃道直而昻白道髙弧交角必大於黃道髙弧交角也按京師赤極髙四十度弱黃平象限最髙者七十三度餘最低者二十六度餘白平象限最髙者七十八度餘最低者二十一度餘黃平象限距正午偏至二十四度餘白平象