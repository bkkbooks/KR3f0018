北差而無東西差則食甚用時即為食甚真時於午未南北差內減午壬實緯餘午未為視緯然以白道而論則應自白極癸過太陽壬作經圈截白道於戌戌壬為白道緯度戌為直角而戌壬近於午壬則太隂在戌為食甚用時而在午非食甚用時也待太陰由戌行至亥則實髙在亥視髙在申自白極癸至視髙申作經圈亦截白道於戌而截黃道於壬必過日月兩心其視經度正當食甚用時戌㸃故亥戌為東西差戌申為南北差於戌申南北差內減戌壬實緯餘壬申為視緯而壬申亦近於壬未則太陰在亥為食甚真時而在午非食甚真時也總之日月相距最近為食甚而近莫近於白道成直角故南北差亦必於白道成直角方可以定視緯又太陰在白平象限西則白道之勢東髙西下髙下差既變髙為下則俟太陰過用時之東其軌漸髙距日漸近故必用白平象限方可以定真時在限東者倣此又設赤極丁出地二十三度黃極戊當地平則庚辛黃道與髙弧合而黃平象限即在天頂丑寅白道在天頂南白平象限卯在正午之西食甚用時太陽在辰太陰實髙在巳巳辰為實緯在黃道北巳為直角視髙在午巳午為髙下差以黃道論之自黃極戊作兩經圈一過實髙巳截黃道於未一過視髙午截黃道於申未申略與巳午等午申略與巳未等故巳午髙下差即同於未申東西差而無南北差待太陰實經度當黃道之酉則視經度當黃道之辰與太陽同度而太陰行至酉㸃之時刻即為食甚真時然以白道而論則應自白極癸作兩經圈一過實髙巳一過視髙午截白道於戌則巳戌為東西差小於未申東西差戌午為南北差在白道南待太陰由巳行至亥則實髙在亥視髙在乾自白極癸至視髙乾作經圈截白道於巳截黃道於辰必過日月兩心其視經度正當食甚用時巳㸃故太陰行至亥㸃之時刻即為食甚真時而亥巳為真時東西差巳乾為真時南北差於巳乾真時南北差內減巳辰實緯餘辰乾為視緯在黃道南此白道亥巳東西差小於黃道酉辰東西差則時刻必差而早然東西差所差猶少而白道巳乾南北差較之黃道無南北差者則所差甚多此南北差差至三分則食分差一分故新法厯書又以亥巳為距時交周以加於實朔交周為定交周巳過中交坎㸃之後求得酉亥為實緯在黃道南因以黃道立算無南北差即以酉亥實緯為視緯亦略與辰乾視緯等此乃借補之法今以白道立算故即用巳辰為實緯而不用距時交周也求黃平象限及黃道髙弧交角并太陽髙弧東西南北二差生於髙下差而髙下差生於太陽太隂髙弧今求東西南北二差雖用白道然必先求黃平象限及黃道髙弧交角而求髙下差又止求太陽髙弧蓋因合朔時太陰與太陽同度其髙弧略等也夫黃道與赤道斜交赤道之髙度隨地不同故黃平象限及黃道髙弧交角並太陽髙弧亦隨地不同今求黃平象限所該諸數必按本地本時太陽距正午赤道度求得正午黃道經度及黃赤相距緯度併黃道與子午圈相交之角然後可推黃平象限距午東西與距地平之髙及黃道髙弧交角並太陽髙弧也設太陽實行在春分後一十五度為三宫一十五度食甚用時為申正初刻求黃平象限諸數如圖甲為天頂甲乙丙丁為子午圈乙丙為地平丁為赤極丁丙為京師赤極髙三十九度五十五分戊己庚為赤道戊乙為京師赤道髙五十度零五分辛為黃極壬癸子丑為黃道己為春分丑為交西地平之㸃壬為黃平象限距丑九十度癸為正午壬癸為黃平象限距正午之度壬寅為黃平象限距地平之度即丑角度子為太陽實行黃道經度子巳為距春分後一十五度子壬為太陽距黃平象限之度子卯為太陽髙弧丑子卯角為黃道髙弧交角辰為申正初刻戊辰為申正距午正六十度辰巳為赤道同升度一十三度四十八分二十三秒與戊辰距午正六十度相加得戊巳七十三度四十八分二十三秒為本時正午距春分赤道經度先用癸己戊正弧三角形求癸巳本時正午距春分黃道經度及癸戊本時正午黃赤相距緯度并黃道與子午圈相交之癸角此形有戊直角有己角為黃赤交角二十三度二十九分三十秒有戊己弧七十三度四十八分二十三秒求得癸己弧七十五度零五分一十秒用戊己弧察二躔黃赤升度表亦得即知正午癸㸃距春分後二宫一十五度零五分一十秒為黃道之五宫一十五度零五分一十秒也又求得癸角八十三度三十七分零四秒用癸己弧察日躔黃道赤經交角表亦得又求得癸戊本時正午黃赤距度二十二度三十九分一十九秒用癸己弧察黃赤距度表亦得與戊乙赤道髙五十度零五分相加得癸乙弧七十二度四十四分一十九秒為正午黃道距地平之度次用癸乙丑正弧三角形求丑角及癸丑弧此形有乙直角甲乙為子午圈與地平成直角有癸角八十三度三十七分零四秒有癸乙弧七十二度四十四分一十九秒求得丑角七十二度五十分五十六秒卿壬寅弧為黃平象限距地平之度又求得癸丑弧八十八度零一分一十八秒與壬丑弧九十度相減餘壬癸弧一度五十八分四十二秒為黃平象限距正午東之度以壬癸弧一度五十八分四十二秒與本時正午癸㸃黃道五宫一十五度零五分一十秒相加得五宫一十七度零三分五十二秒即黃平象限壬㸃之度內減太陽實行子㸃黃道經度三宫一十五度餘六十二度零三分五十二秒即壬子弧為太陽距黃平象限西之度也於是用丑子卯正弧三角形求子角為黃道髙弧交角及子卯弧為太陽髙弧此形有卯直角有丑角七十二度五十分五十六秒即黃平象限距地平之髙有子丑弧二十七度五十六分零八秒即太陽距黃平象限壬子弧之餘求得子角一十九度一十五分一十九秒即黃道髙弧交角又求得子卯弧二十六度三十五分三十秒即太陽髙