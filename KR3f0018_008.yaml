交周然此時太陽與太陰相距猶逺惟自白極過太陽作經圈與白道成直角太陰實經行至此直角之㸃則與太陽相距最近是為食甚用時其距交之經度為食甚交周其相距之緯度即食甚實緯法以太陽距交黃道度即實朔交周求其相當之白道度即為食甚交周求其距緯即為食甚實緯以食甚交周與實朔交周相減餘為交周升度差以一小時月實行相比得時分加減實朔用時即為食甚用時既有用時則可以東西差求近時與真時既有實緯則可以南北差求視緯故日食之時刻分秒雖不以用時與實緯而定而實以用時與實緯為入算之本也設實朔用時為申正一刻九分四十七秒實朔交周過正交後一十二度一小時月實行為三十三分求食甚用時及食甚交周食甚實緯如圖甲乙為黃道甲丙為白道甲為正交甲戊為實朔交周過正交後一十二度與甲丁等戊㸃為實朔用時之度己㸃為食甚用時之度甲己為食甚交周丁己為食甚實緯乃用甲丁己正弧三角形求甲己丁己二弧此形有己直角有甲角為黃白交角四度五十八分三十秒有甲丁弧一十二度與甲戊實朔交周等求得甲己弧一十一度五十七分二十二秒為食甚交周又求得丁己弧一度零一分五十九秒為食甚實緯以甲己食甚交周與甲戊實朔交周相減餘戊己二分三十八秒為交周升度差乃以一小時月實行三十三分與一小時六十分之比即同於戊己交周升度差二分三十八秒與食甚距實朔四分四十七秒之比而得戊己交周升度差所變時分因於實朔用時申正一刻九分四十七秒內減四分四十七秒得申正一刻五分即食甚用時也此食甚在兩交後太陰由甲向丙而甲戊實朔交周度多甲己食甚交周度少故於戊㸃實朔用時減戊己交周升度差所變時分為食甚用時若食甚在兩交前太陰由丙向甲而丙戊實朔交周度少丙己食甚交周度多則於戊㸃實朔用時加戊己交周升度差所變時分為食甚用時也求日食食甚真時及食甚視緯日食食甚時刻必以東西差加減用時方為真時而東西差之時分最為難定蓋太陰因視差之故其行度時時不同若以實行比例加減用時而其時又有東西差必不與用時之東西差相等自人視之或在食甚前或在食甚後猶非食甚真時也故欲定東西差之時分必以視行為比例其法以一小時月實行與一小時之比即同於用時東西差與近時距分之比以加減食甚用時為食甚近時太陰在白平象限西則加在白平象限東則減又以近時求得東西差與用時之東西差相較得差分以加減用時東西差為食甚視行用時之東西差小近時之東西差大則以差分減用時之東西差大近時之東西差小則以差分加或以用時之東西差倍之減近時之東西差所得亦同乃以食甚視行與近時距分之比即同於用時東西差與真時距分之比以加減食甚用時即為食甚真時也既得食甚真時則以真時求得南北差與食甚實緯相加減即得食甚視緯矣白平象限在天頂南者實緯在黃道南則加南北差而視緯仍為南實緯在黃道北則減南北差而視緯仍為北若實緯不足減南北差則反減而視緯即變為南白平象限在天頂北者反是設食甚用時為申正一刻五分而在白平象限西其東西差三分五十一秒一小時月實行為三十三分求食甚真時及食甚視緯如圖甲為天頂甲乙丙丁為過白極經圈乙丙為地平丁為白極戊己為白道戊為白平象限甲庚為髙弧食甚用時太陰在辛人從地面視之却見太陰在壬當白道之癸尚在食甚辛㸃之西三分五十一秒故辛癸為東西差夫太陰實經度在辛視經度既在癸待太陰行過辛㸃三分五十一秒時而實經度在子則視經度必應在辛故以一小時月實行三十三分計之行辛癸弧三分五十一秒須得時之七分則行子辛弧三分五十一秒亦須得時之七分是為近時距分因於食甚用時申正一刻五分內加七分得申正一刻十二分是為近時也然近時既遲於用時其時亦必有東西差乃以近時復推得東西差為四分五十一秒如子丑大於子辛弧一分然則依用時之東西差辛癸計之太陰在子視之應在辛而依近時之東西差子丑計之則太陰在子者視之必應在丑仍在食甚辛㸃之西一分如辛丑是自食甚用時至食甚近時止見太陰行丑癸之度故以辛丑為差分以減用時之東西差辛癸三分五十一秒餘丑癸二分五十一秒為視行夫行丑癸弧二分五十一秒既須時之七分則行辛癸弧三分五十一秒必須時之九分二十七秒矣故以九分二十七秒為真時距分以加食甚用時得申正一刻十四分二十七秒為食甚真時也蓋食甚用時實經度在辛視經度在癸而食甚近時實經度在子視經度在丑則食甚真時實經度必更在子㸃之東如寅人從地面視之却見太陰在卯其視經度正當食甚白道之辛故太陰行至寅㸃方為食甚真時乃以真時推得辛卯南北差為太陰白道緯差以加減白道實緯即為太陰距太陽之視緯也求日食初虧復圓用時欲求初虧復圓距食甚之時刻必先求初虧復圓距食甚之弧度其法以視緯為一邊以太陽太陰兩視半徑相併為一邊以視緯交白道之角為直角用正弧三角形求得初虧距食甚之弧亦即復圓距食甚之弧其理與月食同但月食初虧復圓距食甚之弧度等而時刻亦等日食因視差之故常變實行為視行其初虧復圓距食甚之弧度雖等而時刻則不等然不等者視行也而相等者實行也非先以實行求其相等之時刻無以求東西差而得視行故以一小時月實行與一小時之比即同於初虧復圓距食甚之度與初虧復圓距食甚時分之比以減食甚真時為初虧用時以加食甚真時為復圓用時既有初虧復圓用時則可以求初虧復圓真時故日食初虧復圓時刻雖不以用時為定而實以用時為入算之本也設食甚真時為申初初刻七分食甚視緯二十分太陽視半徑一十五分太陰視半徑一十六分一小時月實行為三十三分求初虧復圓用時如圖甲乙為黃道甲丙為白道丁為太陽丁戊為食甚視緯二十分食甚時大陰視經在戊初虧時太陰視經在己復圓時太陰視經在庚丁辛與丁壬皆太陽視半徑一十五分己辛與庚壬皆太陰視半徑一十六分丁己與丁庚皆併徑三十一分己戊為初虧距食甚之弧戊庚為復圓距食甚之弧其度相等故用丁戊己正弧三角形求己戊弧此形有戊直角有丁戊弧二十分有丁己弧三十一分求得己戊弧二十三分四十一秒為初虧距食甚之度亦即復圓距食甚之度也但己戊與戊庚之度雖等而大陰行此度之時刻則不等故先以一小時月實行三十三分與一小時六十分之比即同於己戊或戊庚二十三分四十一秒與初虧復圓距食甚時分四十四分二十四秒之比而得己戊或戊庚所變時分因於食甚真時申初初刻七分內減四十四分二十四秒得未正一刻七分三十六秒即初虧用時於食甚真時申初初刻七分加四十四分二十四秒得申初三刻六分二十四秒即復圓用時也求日食初虧復圓真時日食初虧復圓真時即以初虧復圓用時求之而得與求食甚真時又用近時者不同蓋食甚己有東西差則可相較得視行以為比例也其法以初虧復圓兩用時各按法求其東西差同限者以其東西差與食甚之東西差相減為差分以加減初虧復圓距食甚之度為初虧復圓時視行異限者以其東西差與食甚之東西差相併為差分以減初虧復圓距食甚之度為初虧復圓時視行初虧與食甚同在白平象限東而初虧東西差大於食甚東西差則以初虧差分減初虧東西差小於食甚東西差則以初虧差分加若初虧與食甚同在白平象限西則加減反是復圓與食甚同在白平象限東而復圓東西差大於食甚東西差則以復圓差分加復圓東西差小於食甚東西差則以復圓差分減若復圓與食甚同在白平象限西則加減反是若初虧在限東食甚在限西或食甚在限東復圓在限西則俱以差分減乃以初虧視行與初虧用時距食甚時分之比即同於初虧距食甚之度與初虧真時距食甚時分之比以減食甚真時即為初虧真時以復圓視行與復圓用時距食甚時分之比即同於復圓距食甚之度與復圓真時距食甚時分之比以加食甚真時即為復圓真時也設食甚真時為申初初刻七分而在白平象限西其東西差一十八分五十四秒初虧距食甚之弧為二十三分四十一秒比例得時分四十四分二十四秒初虧用時為未正一刻七分三十六秒求初虧真時如圖甲為天頂甲乙丙丁為過白極經圈乙丙為地平丁為白極戊己為白道戊為白平象限甲庚為髙弧食甚真時太陰在辛人從地面視之却見太陰在壬當白道之癸正當食甚之㸃辛癸為食甚東西差一十八分五十四秒子為初虧子癸為初虧距食甚之弧二十三分四十一秒夫太陰行過食甚癸㸃一十八分五十四秒時而實經度在辛視經度既在癸則太陰行過初虧子㸃一十八分五十四秒時而實經度在丑視經度必應在子是故丑子與辛癸等丑辛亦與子癸等丑㸃即為初虧用時然初虧在食甚前其時亦必有東西差乃以初虧用時復推得東西差為一十二分零二秒如丑寅小於丑子弧六分五十二秒然則依食甚之東西差辛癸計之太陰在丑視之應在子而依初虧之東西差丑寅計之則太陰在丑者視之必應在寅己過初虧子㸃之東六分五十二秒如子寅是自初虧用時至食甚真時止見太陰行寅癸之度故以子寅為差分以減初虧距食甚之子癸二十三分四十一秒餘寅癸一十六分四十九秒為視行夫行寅癸弧一十六分四十九秒既須時之四十四分二十四秒則行子癸弧二十三分四十一秒必須時之一時零二分五十秒矣故以一時零二分五十秒為初虧距時以減食甚真時得未正初刻四分一十秒為初虧真時蓋食甚真時實經度在辛視經度在癸而初虧用時實經度在丑視經度在寅則初虧真時實經度必更在丑㸃之西如卯人從地面視之却見太陰在辰其視經度正當初虧白道之子故太陰行至卯㸃方為初虧真時也復圓真時倣此日食分秒日食分秒以太陽與太陰兩視半徑相併內減食甚視緯餘為兩體相掩之分乃命太陽視徑為十分以視經度分與十分之比即同於減餘度分與十分中幾分之比而得食分為太陽視徑十分中之幾分也或食甚視緯大於併徑則兩周不相切為不食食甚視緯僅與併徑等則兩周相切而不相掩亦為不食或太陰正當黃道而無食甚視緯即以併徑為食分兩心相掩是為全食若遇太陰視徑小於太陽視徑則四周露光名為金環食也如圖甲乙丙為黃道丁戊己為白道乙為太陽心戊為太陰心乙戊為視緯庚辛為太陽視徑壬癸為太陰視徑乙癸為兩視半徑相併之數內減乙戊視緯餘戊癸與壬辛等為太陰掩太陽之分以太陽全徑庚辛作十分計之則壬辛得五分有餘為食分也又如庚辛為太陽視徑壬癸為太陰視徑乙戊為視緯與乙辛壬戊兩視半徑相併之數等則太陰與太陽兩周相切而不相掩其視緯大於併徑者則愈不相掩矣又如太陰視經度正在兩道之交而無緯度則太陰心與太陽心相合於乙全掩太陽之光是為全食或太陰之視徑壬癸小於太陽之視徑庚辛則大陽四周露光如金環也定日食方位厯來厯書定日食初虧復圓方位月在黃道北初虧西北復圓東北月在黃道南初虧西南復圓東南食八分以上初虧正西復圓正東此東西南北主黃道之經緯言與人目所見地平經度之東西南北頗不相合故今亦如月食之法定初虧復圓之㸃在日體之上下左右乃於仰觀為親切也其法亦從天頂作髙弧過日心至地平即分日體為左右兩半周又平分為上下兩象限即成左上左下右上右下四象限乃視月距黃道之南北距黃平象限之東西及交角之大小而初虧復圓之㸃可定矣如月在黃道上無緯度又在黃平象限上而交角滿九十度則初虧正右復圓正左在黃平象限西而交角在四十五度以上則初虧右稍偏下復圓左稍偏上交角在四十五度以下則初虧下稍偏右復圓上稍偏左在黃平象限東者反是若月在交前後有距緯則必求緯差角與交角相加減為定交角然後可定其上下左右也如圖甲乙丙為黃道一象限丁乙戊為髙弧乙為日心因在黃平象限西故黃道左昻右低己為日食初虧之月心庚為日食復圓之月心月心正在黃道上無距緯而甲乙戊或丙乙丁交角在四十五度以下其初虧辛㸃在日體之下稍偏右復圓壬㸃在日體之上稍偏左也若日在黃平象限東則黃道左低右昻而甲乙丁或丙乙戊交角在四十五度以上故初虧辛㸃在日體之右稍偏上復圓壬㸃在日體之左稍偏下也如日在黃平象限西而月在黃道北則初虧以己乙甲緯差角與甲乙戊交角相加得己乙戊為定交角在四十五度以上故初虧辛㸃在日體之右稍偏下復圓以庚乙丙緯差角與丙乙丁交角相減餘庚乙丁為定交角在四十五度以下故復圓壬㸃在日體之上稍偏左也若日在黃平象限東則初虧之緯差角為減復圓之緯差角為加與此相反求緯差角與加減之法並同月食如日在黃平象限西而月在黃道南則初虧以己乙甲緯差角與甲乙戊交角相減餘己乙戊為定交角在四十五度以下故初虧辛㸃在日體之下稍偏右復圓以庚乙丙緯差角與丙乙丁交角相加得庚乙丁為定交角在四十五度以上故復圓壬㸃在日體之左稍偏上也若日在黃平象限東則初虧之緯差角為加復圓之緯差角為減與此相反繪日食圖凡繪日食圖先作橫竪二線直角相交橫線當黃道竪線當黃道經圈用日半徑為度於中心作圜以當日體又以日月兩半徑相併為度作虛圈為初虧復圓之限次視實交周係初宫十一宫則於虛圈上周黃經線右取黃白大距五度作識實交周係五宫六宫則於虛圈上周黃經線左取黃白大距五度作識乃自所識作線過圜心至虛圈下周即為白道經圈於此線上自圜心取食甚視緯度作識即食甚時月心所在從此作橫線與白道經圈相交成直角即為白道而白道與虛圈右周相割之㸃即初虧時月心所在白道與虛圈左周相割之㸃即復圓時月心所在也末以初虧食甚復圓三㸃各為心月半徑為度各作一圜以當月體即初虧食甚復圓之象宛然在目矣如圖甲乙竪線如黃道經圈丙丁橫線如黃道戊巳庚圈如日體甲丙乙丁虛圈為初虧復圓之限其半徑丙辛為日月兩半徑之共數設實交周初宫或十一宫則於虛圈上周甲乙經線之右取黃白大距五度如甲壬從壬作線過圜心辛至下周癸為白道經圈於壬癸白道經圈上自圜心辛向下取食甚視緯度如辛子此子㸃即食甚時月心所在也此以實交周十一宫為例其緯在南故自圜心辛向下取子㸃若實交周是初宫其緯在北則自圜心辛向上取子㸃乃從子取直角作丑寅線與壬癸白道經圈相交即為白道而白道割虛圈右周丑㸃為初虧限割左周寅㸃為復圓限以丑子寅三㸃各為心月半徑為度作圜以象月體即見月心至丑其周切日日體將缺是為初虧從丑至子掩日最大是為食甚從子至寅月已離日日光全滿是為復圓也御製厯象考成上編卷八
