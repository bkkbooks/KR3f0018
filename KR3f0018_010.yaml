body:
  text: 欽定四庫全書御製厯象考成上編卷十五星厯理二専論土星土星平行度用土星三次衝日求本輪均輪半徑及最髙求初均數求次均數土星平行度測土星平行之法用前後兩測取其距恒星之度分等恒星有嵗差毎年五十一秒測時須加入計之距太陽之逺近左右亦等乃計其前後相距中積若干日時及星行滿次輪若干周即可得其毎日平行之率盖兩測距恒星之度既等則其行滿一周天而復於故處而距太陽之逺近左右又等則兩測之遲疾加減俱等而次輪之行亦滿全周而復其故處也新法厯書載古測定五十九平年又十六日十分日之三或二萬一千五百五十一日又十分日之三土星行次輪五十七周即㑹日五十七次衝日亦五十七次置中積二萬一千五百五十一日又十分日之三為實星行次輪周數五十七為法除之得周率三百七十八日八刻一十三分五十三秒三十八微四十一纎一十六忽四十八芒即三百七十八日零百分日之九分二九八二時厯作三百七十八日九一六乃以毎周三百六十度為實周率三百七十八日八刻一十三分五十三秒三十八微四十一纎一十六忽四十八芒為法除之得五十七分零七秒四十三微四十一纎四十四忽三十三芒為毎日土星距太陽之行即土星在次輪周毎日之行一名嵗行與毎日太陽平行五十九分零八秒一十九微四十九纎五十一忽三十九芒相減餘二分零三十六微零八纎零七忽零六芒為毎日土星平行經度即本輪心毎日之行既得毎日之平行用乘法可得毎年毎月之平行用除法可得毎時毎分之平行以立表用土星三次衝日求本輪均輪半徑及最髙土星之初均數生於本輪半徑而求本輪半徑須用三次衝日與月離用三月食同盖星衝日之時星在次輪最近㸃無次均數故測諸星本輪半徑者必俟此時也新法厯書載西人多録某於漢順帝時用土星三次衝日推得兩心差為本天半徑十萬分之一萬一千七百七十二用其四分之三為本輪半徑四分之一為均輪半徑最髙在大火宫二十三度永建二年丁夘後因其數與天行不合又改兩心差為本天半徑十萬分之一萬一千二百七十七至明正徳間西人歌白泥復用三測推得兩心差為本天半徑十萬分之一萬二千最髙在析木宫二十七度三十五分正徳九年甲戌相距一千三百八十七年而兩次所測最髙相差三十四度三十五分乃以三十四度三十五分為實一千三百八十七年為法除之得毎年最髙行一分二十九秒四十六微萬厯間西人第谷又測得兩心差為本天半徑十萬分之一萬一千六百二十八後又定兩心差為本天半徑千萬分之一百一十六萬二千本輪半徑為本天半徑千萬分之八十六萬五千五百八十七此四分之三小比三分之二大均輪半徑為本天半徑千萬分之二十九萬六千四百一十三比四分之一大比三分之一小最髙在析木宫二十六度二十分二十七秒萬厯十八年庚寅毎年最髙行一分二十秒一十二微用其數推算均數與天行密合今仍用其數而述其測法如左假如第一次衝日日躔娵訾宫一度零三分二十七秒土星在鶉尾宫一度零三分二十七秒如甲第二次衝日日躔娵訾宫二十一度四十七分三十九秒土星在鶉尾宫二十一度四十七分三十九秒如乙第三次衝日日躔降婁宫一十六度五十一分二十八秒土星在夀星宫一十六度五十一分二十八秒如丙第一次衝日距第二次衝日一萬一千三百四十三日五時三十六分其實行相距二十度四十四分一十二秒即鶉尾宫甲點距乙點之度亦即甲丁乙角於第二次實行度内減去第一次實行度即得其平行相距一十九度五十九分五十四秒以毎日平行度與距日相乗減去全周即得第二次衝日距第三次衝日七百五十五日二十時三十一分其實行相距二十五度零三分四十九秒即鶉尾宫乙點距夀星宫丙點之度亦即乙丁丙角於第三次實行度内減去第二次實行度即得其平行相距二十五度一十九分一十六秒乃用不同心圈立法算之任取戊點為心作己庚辛壬不同心圈則辛庚弧即第一次距第二次之平行度一十九度五十九分五十四秒庚巳􅓡即第二次距第三次之平行度二十五度一十九分一十六秒爰從戊點過地心丁至圜周二界作一線為最髙線戊丁即兩心差又引丙丁線至壬自壬至甲丁乙丁二線所割庚辛二點作壬庚壬辛二線自庚至辛又作庚辛線即成壬丁辛壬丁庚壬庚辛三三角形以求本天半徑與兩心差之比例先用壬丁辛三角形求壬辛邊此形有壬角二十二度三十九分三十五秒壬為界角當辛巳弧以辛庚庚巳兩弧相加折半即得有丁角一百三十四度一十一分五十九秒即甲丁丙角之餘設丁壬邊為一求得壬辛邊一八二四二六三九次用壬丁庚三角形求壬庚邊此形有壬角一十二度三十九分三十八秒以庚巳弧折半即得有丁角一百五十四度五十六分一十一秒即乙丁丙角之餘設丁壬邊為一求得壬庚邊一九七二二九五四末用壬庚辛三角形求庚角此形有壬辛邊一八二四二六三九有壬庚邉一九七二二九五四有壬角九度五十九分五十七秒以辛壬丁角與庚壬丁角相減即得求得庚角六十度五十八分四十秒倍之得一百二十一度五十七分二十秒為辛壬弧與辛巳弧四十五度一十九分一十秒相加得一百六十七度一十六分三十秒為己辛壬弧於是以本天半徑命為一各用八線表求其通弦則辛壬弧之通弦為一七四八八六三二己壬弧之通弦為一九八七六八一三乃用比例法變先設之丁壬邊為同比例數以先得之辛壬邊一八二四二六三九與先設之丁壬一之比即同於今所察之辛壬通弦一七四八八六三二與今所求之丁壬邊之比而得丁壬邊九五八六六七九又平分己辛壬弧於癸作戊癸線平分己壬通弦於子得子壬九九三八四七内減去丁壬九五八六六七九餘子丁三五一七二八又以己癸弧八十三度三十八分一十五秒與九十度相減餘六度二十一分四十五秒為戊巳子角戊巳子為直角三角形戊角當己癸􅓡故己角為己癸􅓡減象限之餘察其正弦得一一八一八五為戊子乃用戊子丁勾股形以戊子為股子丁為勾求得戊丁弦一一六二六六三為兩心差也求最髙之法亦用戊子丁直角三角形求丁角此形有三邊有子直角求得丁角七十二度二十三分二十八秒即第三次衝日土星距最髙丑點之度也求初均數土星之初均數授時厯名為盈縮差其盈差最大者八度二五五二三八二一縮差最大者六度二七九四七一四以周天三百六十度毎度六十分約之盈差得八度零八分一十一秒四十一微縮差得六度一十一分一十九秒三十八微衝合以外各段同用新法厯書最大之初均數為六度三十八分一十九秒零六微即六度零十分度之六分三八六三三惟星正當衝合之時止用此均數加減若在衝合前後仍有次均數之加減故此名初均數以别之如圖甲為地心即本天心乙丙丁為本天之一弧丙甲半徑為一千萬戊己庚為本輪戊丙半徑為八十六萬五千五百八十七戊為最髙庚為最卑辛壬癸為均輪辛戊半徑為二十九萬六千四百一十三辛為最逺去本輪心逺也癸為最近去本輪心近也本輪心循本天右旋自乙而丙而丁毎日行二分有餘即土星經度均輪心循本輪左旋自戊而已而庚毎日亦行二分有餘微不及經度之行毎年少一分二十秒一十二微即自行引數次輪心則循均輪右旋自癸而壬而辛毎日行四分有餘為倍引數也如均輪心在本輪之最髙戊為初宫初度則次輪心在均輪之最近癸或均輪心從本輪最髙戊向已行半周至最卑庚為六宫初度則次輪心亦從均輪最近癸厯壬辛行一周復至癸從地心甲計之俱成一直線無平行實行之差故自行初宫初度及六宫初度俱無均數也如均輪心從本輪最髙戊行三十度至子為一宫初度則次輪心從均輪最近癸行六十度至丑丑癸弧為戊子􅓡之倍度從地心甲計之當本天之寅寅丙弧為實行不及平行之度乃用丙癸夘直角三角形求癸夘夘丙二邉此形有夘直角有丙角三十度則癸角必六十度有癸丙邊五十六萬九千一百七十四本輪半徑内減去均輪半徑之數求得癸夘邊二十八萬四千五百八十七夘丙邊四十九萬二千九百一十九以夘丙與丙甲本天半徑一千萬相加得一千零四十九萬二千九百一十九為夘甲邊以癸夘邊與丑癸通弦二十九萬六千四百一十三相加即均輪丑癸弧六十度之通弦故與均輪半徑等若非六十度則用比例法以半徑一千萬為一率均輪丑癸弧折半察正弦為二率均輪子癸半徑為三率得四率倍之即丑癸通弦也得五十八萬一千為丑夘邊於是用甲丑夘直角三角形求得甲角三度一十分零九秒即寅丙弧為自行一宫初度之初均數是為減差以減於平行而得實行也凡求得初均角即求得丑甲邉為次輪心距地心之數存之為後求次均之用若均輪心從最髙戊向己厯庚行三百三十度至辰為十一宫初度則次輪心從均輪最近癸行一周復自最近癸厯壬辛行三百度至已從地心甲計之當本天之午午丙弧與寅丙弧等故自行十一宫初度之初均數與一宫初度等但為實行過於平行之度是為加差以加於平行而得實行也用此法求得最髙後三宫之減差初宫初度至二宫末度即得最髙前三宫之加差九宫初度至十一宫末度如均輪心從本輪最髙戊行一百二十度至未為四宫初度則次輪心從均輪最近癸厯壬辛行二百四十度至申從地心甲計之當本天之酉酉丙弧為實行不及平行之度乃用丙癸戌直角三角形求癸戌丙戌二邊此形有戌直角有丙角六十度則癸角必三十度癸丙邊為五十六萬九千一百七十四求得癸戌邊四十九萬二千九百一十九丙戌邊二十八萬四千五百八十七以丙戌邊與丙甲本天半徑一千萬相減餘九百七十一萬五千四百一十三為戌甲邊以癸戌邊與申癸通弦五十一萬三千四百零二相加即均輪申癸􅓡一百二十度之通弦得一百萬零六千三百二十一為申戌邊於是用甲申戌直角三角形求得甲角五度五十四分四十九秒即酉丙弧為自行四宫初度之初均數是為減差以減於平行而得實行也若均輪心從最髙戊向已厯庚行二百四十度至亥為八宫初度則次輪心從均輪最近癸行一周復自癸厯壬行一百二十度至子從地心甲計之當本天之丑丑丙弧與酉丙弧等故自行八宫初度之初均數與四宫初度等但為實行過於平行之度是為加差以加於平行而得實行也用此法求得最卑前三宫之減差三宫初度至五宫末度即得最卑後三宫之加差六宫初度至八宫末度求次均數土星與太陽衝合之後即有次均其數生於次輪盖星衝太陽之時在次輪之最近合伏之時在次輪之最逺與次輪心及地心參直故求初均數即以次輪心立算而無次均自衝合而外星行次輪周之左右其次輪周星體所在即次均數也新法厯書載西人多録某測得次輪半徑為本天半徑十萬分之一萬零八百三十三其後西人第谷又改為本天半徑千萬分之一百零四萬二千六百今從之如圖甲為地心即本天心乙丙丁為本天之一弧丙甲為本天半徑一千萬戊丙巳為本輪全徑戊丙半徑為八十六萬五千五百八十七戊為最髙己為最卑庚戊辛為均輪全徑庚戊半徑為二十九萬六千四百一十三庚為最逺辛為最近此逺近以距本輪心言壬辛癸為次輪全徑壬辛半徑為一百零四萬二千六百壬為最逺癸為最近此逺近以距地心言本輪心從本天冬至度右旋本天上與黄道冬至相對之度為經度均輪心從本輪最髙戊左旋為引數即自行度次輪心從均輪最近辛右旋為倍引數星從次輪最逺壬右旋行距日之度即本輪心距太陽之度如均輪心在本輪最髙戊為自行初宫初度次輪心在均輪最近辛合伏之時星在次輪之最逺壬衝太陽之時星在次輪之最近癸從地心甲計之與輪心同在一直線故無均數之加減若衝合以後則星在次輪周之左右衝太陽之後在次輪之右合伏之後在次輪之左而次均生矣如均輪心從最髙戊行三十度至子為自行一宫初度次輪心則從均輪最近辛行六十度至丑若星在次輪之最逺壬或在次輪之最近癸則與次輪心丑同在一直線從地心甲計之當本天之寅其丙甲寅角三度一十分零九秒即寅丙弧為初均數而無次均數若星從次輪最逺壬厯癸行三百度至夘從地心甲計之當本天之辰其寅甲辰角即次均數乃用丑甲夘三角形求甲角即辰寅􅓡此形有丑角一百二十度於壬癸夘弧三百度内減去壬癸半周餘癸夘􅓡即丑角度有夘丑半徑一百零四萬二千六百有丑甲邊一千零五十萬八千九百九十一求丑甲邉法見前求初均數篇求得甲角四度五十四分一十八秒即辰寅弧為次均數與初均數寅丙􅓡三度一十分零九秒相加得辰丙弧八度零四分二十七秒為實行不及平行之度是為減差以減於平行而得實行也若均輪心從最髙戊厯己行三百三十度至己為自行十一宫初度次輪心則從均輪最近辛行一周復行三百度至午星從次輪最逺壬行六十度至未則初均數丙甲申角與丙甲寅角等次均數申甲酉角與寅甲辰角等兩角相加之丙甲酉角亦與丙甲辰角等但為實行過於平行之度是為加差以加於平行而得實行也若測得平行實行之差及星距太陽之度以推次輪半徑亦用丑甲夘三角形求之如均輪心從最髙戊行一百二十度至子為自行四宫初度次輪心則從均輪最近辛厯庚行二百四十度至丑若星在次輪之最逺壬或在次輪之最近癸則與次輪心丑同在一直線從地心甲計之當本天之寅其丙甲寅角五度五十四分四十九秒即寅丙弧為初均數而無次均數若星從次輪最逺壬行四十五度至夘從地心甲計之當本天之辰其寅甲辰角即次均數乃用丑甲夘三角形求甲角即寅辰弧此形有丑角一百三十五度於半周内減去壬夘弧四十五度餘夘癸弧即丑角度有夘丑半徑一百零四萬二千六百有丑甲邊九百七十六萬七千三百九十二求得甲角四度零五十二秒即寅辰弧為次均數與初均數寅丙弧五度五十四分四十九秒相減因初均寅點在平行丙點之後而次均辰點在寅點之前故相减餘辰丙弧一度五十三分五十七秒為實行不及平行之度是為減差以減於平行而得實行也若均輪心從最髙戊厯己行二百四十度至己為自行八宫初度次輪心則從均輪最近辛行一周復行一百二十度至午星從次輪最逺壬厯癸行三百一十五度至未則初均數丙甲申角與丙甲寅角等次均數申甲酉角與寅甲辰角等兩角相減所餘之丙甲酉角亦與丙甲辰角等但為實行過於平行之度是為加差以加於平行而得實行也御製厯象考成上編卷十
