body:
  text: 欽定四庫全書御製歷象考成上編卷十一五星厯理三專論木星木星平行度用木星三次衝日求本輪均輪半徑及最髙求初均數求次均數木星平行度測木星平行之法亦用前後兩測與土星同新法厯書載古測定七十一平年又十二日千分日之六百一十七或二萬五千九百二十七日又千分日之六百一十七木星行次輪六十五周即會日六十五次衝日亦六十五次置中積二萬五千九百二十七日又千分日之六百一十七為實星行次輪周數六十五為法除之得周率三百九十八日八十五刻一分二十六秒一十五微二十一纖三十六忽即三百九十八日零十分日之八分八六四一五授時歷同數乃以每周三百六十度為實周率三百九十八日八十五刻一分二十六秒一十五微二十一纖三十六忽為法除之得五十四分零九秒零二微四十二纖四十七忽三十二芒為每日木星距太陽之行即木星在次輪周每日之行一名嵗行與每日太陽平行五十九分零八秒一十九微四十九纖五十一忽三十九芒相減餘四分五十九秒一十七微零七纖零四忽零七芒為每日木星平行經度即本輪心每日之行既得每日之平行用乘法可得每年每月之平行用除法可得每時每分之平行以立表用木星三次衝日求本輪均輪半徑及最髙測木星本輪半徑法與土星同新法厯書載西人多録某於漢順帝時推得兩心差為本天半徑十萬分之八千九百零二用其四分之三為本輪半徑四分之一為均輪半徑最髙在鶉尾宫一十一度陽嘉二年癸酉後因其數與天行不合又改兩心差為本天半徑十萬分之九千一百七十至明正德間西人歌白泥復推得兩心差為本天半徑十萬分之一萬一千九百三十最髙在壽星宫六度二十分嘉靖八年己丑相距一千三百九十六年而兩次所推最髙相差二十五度二十分因知每年最髙行一分零五秒二十微萬厯間西人第谷又測得兩心差為本天半徑十萬分之九千五百四十後又定兩心差為本天半徑千萬分之九十五萬三千三百本輪半徑為本天半徑千萬分之七十萬五千三百二十比四分之三小比三分之二大均輪半徑為本天半徑千萬分之二十四萬七千九百八十比四分之一大比三分之一小最髙在壽星宫八度四十分萬厯二十八年庚子每年最髙行五十七秒五十二微用其數推算均數與天行密合今仍用其數而述其測法如左假如第一次衝日日躔鶉尾宫七度三十一分四十九秒木星在娵訾宫七度三十一分四十九秒如甲第二次衝日日躔大火宫二十度五十六分木星在大梁宫二十度五十六分如乙第三次衝日日躔析木宫二十五度五十二分二十七秒木星在實沈宫二十五度五十二分二十七秒如丙第一次衝日距第二次衝日八百零四日一十五時三十五分其實行相距七十三度二十四分一十一秒即娵訾宫甲點距大梁宫乙點之度亦即甲丁乙角於第二次實行度內減去第一次實行度即得其平行相距六十六度五十三分二十秒以每日平行度與距日相乘即得第二次衝日距第三次衝日三百九十九日一十四時四十四分其實行相距三十四度五十六分二十七秒即大梁宫乙點距實沈宫丙點之度亦即乙丁丙角於第三次實行度內減去第二次實行度即得其平行相距三十三度一十三分零八秒乃用不同心圈立法算之任取戊點為心作己庚辛壬不同心圈則辛庚弧即第一次距第二次之平行度六十六度五十三分二十秒庚己弧即第二次距第三次之平行度三十三度一十三分零八秒爰從戊點過地心丁至圜周二界作一線為最髙線戊丁即兩心差又引丙丁線至壬自壬至甲丁乙丁二線所割庚辛二點作壬庚壬辛二線自庚至辛又作庚辛線即成壬丁辛壬丁庚壬庚辛三三角形以求本天半徑與兩心差之比例先用壬丁辛三角形求壬辛邊此形有壬角五十度零三分一十四秒壬為界角當辛己弧以辛庚庚己兩弧相加折半即得有丁角七十一度三十九分二十二秒即甲丁丙角之餘設丁壬邊為一求得壬辛邊一一一五七四三六次用壬丁庚三角形求壬庚邊此形有壬角一十六度三十六分三十四秒以庚巳弧折半即得有丁角一百四十五度零三分三十三秒即乙丁丙角之餘設丁壬邊為一求得壬庚邊一八二一九一末用壬庚辛三角形求庚角此形有壬辛邊一一一五七四三六有壬庚邊一八二一九一有壬角三十三度二十六分四十秒以辛壬丁角與庚壬丁角相減即得求得庚角三十四度三十八分二十八秒倍之得六十九度一十六分五十六秒為辛壬弧與辛巳弧一百度零六分二十八秒相加得一百六十九度二十三分二十四秒為己辛壬弧於是以本天半徑命為一各用八線表求其通弦則辛壬弧之通弦為一一三六八六八二己壬弧之通弦為一九九一四三三二乃用比例法變先設之丁壬邊為同比例數以先得之辛壬邊一一一五七四三六與先設之丁壬一之比即同於今所察之辛壬通弦一一三六八六八二與今所求之丁壬邊之比而得丁壬邊一一八九三三二又平分己辛壬弧於癸作戊癸線平分己壬通弦於子得子壬九九五七一六六與丁壬一一八九三三二相減餘子丁二三二一六六又以壬癸弧八十四度四十一分四十二秒與九十度相減餘五度一十八分一十八秒為戊壬子角戊壬子為直角三角形戊角當壬癸弧故壬角為壬癸弧減象限之餘察其正弦得九二四五七五為戊子乃用戊子丁勾股形以戊子為股子丁為勾求得戊丁弦九五三二七八為兩心差也求最髙之法亦用戊子丁直角三角形求丁角此形有三邊有子直角求得丁角七十五度五十四分一十五秒與半周相減餘一百零四度零五分四十五秒為戊丁巳角即第三次衝日木星距最髙丑點之度也求初均數木星之初均數授時厯名為盈縮差止用一表不分盈縮其最大者五度九九二九八二八以周天三百六十度每度六十分約之得五度五十四分二十四秒三十七微衝合以外各段同用新法歷書最大之初均數為五度二十七分零三秒五十四微即五度零十分度之四分五一八三三惟星正當衝合之時止用此均數加減若在衝合前後仍有次均數之加減故此名初均數以别之如圖甲為地心即本天心乙丙丁為本天之一弧丙甲半徑為一千萬戊己庚為本輪戊丙半徑為七十萬五千三百二十戊為最髙庚為最卑辛壬癸為均輪辛戊半徑為二十四萬七千九百八十辛為最逺去本輪心逺也癸為最近去本輪心近也本輪心循本天右旋自乙而丙而丁每日行四分五十九秒有餘即木星經度均輪心循本輪左旋自戊而已而庚每日亦行四分五十九秒有餘微不及經度之行每年少五十七秒五十二微即自行引數次輪心則循均輪右旋自癸而壬而辛每日行九分五十八秒有餘為倍引數也如均輪心在本輪之最髙戊為初宫初度則次輪心在均輪之最近癸或均輪心從本輪最髙戊向已行半周至最卑庚為六宫初度則次輪心亦從均輪最近癸厯壬辛行一周復至癸從地心甲計之俱成一直線無平行實行之差故自行初宫初度及六宫初度俱無均數也如均輪心從本輪最髙戊行三十度至子為一宫初度則次輪心從均輪最近癸行六十度至丑丑癸弧為戊子弧之倍度從地心甲計之當本天之寅寅丙弧為實行不及平行之度乃用丙癸卯直角三角形求癸卯卯丙二邊此形有卯直角有丙角三十度則癸角必六十度有癸丙邊四十五萬七千三百四十一本輪半徑內減去均輪半徑之數求得癸卯邊二十二萬八千六百七十一卯丙邊三十九萬六千零六十九以卯丙邊與丙甲本天半徑一千萬相加得一千零三十九萬六千零六十九為卯甲邊以癸卯邊與丑癸通弦二十四萬七千九百八十相加即均輪丑癸弧六十度之通弦故與均輪半徑等若非六十度則用比例法以半徑一千萬為一率均輪丑癸弧折半查正弦為二率均輪子癸半徑為三率得四率倍之即丑癸通弦也得四十七萬六十六百五十一為丑卯邊於是用甲丑卯直角三角形求得甲角二度三十七分三十秒即寅丙弧為自行一宫初度之初均數是為減差以減於平行而得實行也凡求得初均角即求得丑甲邊為次輪心距地心之數存之為後求坎均之用若均輪心從最髙戊向己厯庚行三百三十度至辰為十一宫初度則次輪心從均輪最近癸行一周復自最近癸厯壬辛行三百度至已從地心甲計之當本天之午午丙弧與寅丙弧等故自行十一宫初度之初均數與一宫初度等但為實行過於平行之度是為加差以加於平行而得實行也用此法求得最髙後三宫之減差初宫初度至二宫末度即得最髙前三宫之加差九宫初度至十一宫末度如均輪心從本輪最髙戊行一百二十度至未為四宫初度則次輪心從均輪最近癸厯壬辛行二百四十度至申從地心甲計之當本天之酉酉丙弧為實行不及平行之度乃用丙癸戌直角三角形求癸戌丙戌二邊此形有戌直角有丙角六十度則癸角必三十度癸丙邊為四十五萬七千三百四十一求得癸戌邊三十九萬六千零六十九丙戌邊二十二萬八千六百七十一以丙戌邊與丙甲本天半徑一千萬相減餘九百七十七萬一千二百二十九為戌甲邊以癸戌邊與申癸通弦四十二萬九千五百一十四相加即均輪申癸弧一百二十度之通弦得八十二萬五千五百八十三為申戌邊於是用甲申戌直角三角形求得甲角四度四十九分四十六秒即酉丙弧為自行四宫初度之初均數是為減差以減於平行而得實行也若均輪心從最髙戊向己厯庚行二百四十度至亥為八宫初度則次輪心從均輪最近癸行一周復自癸厯壬行一百二十度至子從地心甲計之當本天之丑丑丙弧與酉丙弧等故自行八宫初度之初均數與四宫初度等但為實行過於平行之度是為加差以加於平行而得實行也用此法求得最卑前三宫之減差三宫初度至五宫末度即得最卑後三宫之加差六宫初度至八宫末度求次均數木星與太陽衝合之後即有次均其數生於次輪蓋星衝太陽之時在次輪之最近合伏之時在次輪之最逺與次輪心及地心參直故求初均數即以次輪心立算而無次均自衝合而外星行次輪周之左右其次輪周星體所在即次均數也新法厯書載西人多録某測得次輪半徑為本天半徑十萬分之一萬九千一百九十四其後西人第谷又改為本天半徑千萬分之一百九十二萬九千四百八十今從之如圖甲為地心即本天心乙丙丁為本天之一弧丙甲為本天半徑一千萬戊丙巳為本輪全徑戊丙半徑為七十萬五千三百二十戊為最髙己為最卑庚戊辛為均輪全徑庚戊半徑為二十四萬七千九百八十庚為最逺辛為最近此逺近以距本輪心言壬辛癸為次輪全徑壬辛半徑為一百九十二萬九千四百八十壬為最逺癸為最近此逺近以距地心言本輪心從本天冬至度右旋本天上與黃道冬至相對之度為經度均輪心從本輪最髙戊左旋為引數即自行度次輪心從均輪最近辛右旋為倍引數星從次輪最逺壬右旋行距日之度即本輪心距太陽之度如均輪心在本輪最髙戊為自行初宫初度次輪心在均輪最近辛合伏之時星在次輪之最逺壬衝太陽之時星在次輪之最近癸從地心甲計之與輪心同在一直線故無均數之加減若衝合以後則星在次輪周之左右衝太陽之後在次輪之右合伏之後在次輪之左而次均生矣如均輪心從最髙戊行三十度至子為自行一宫初度次輪心則從均輪最近辛行六十度至丑若星在次輪之最逺壬或在次輪之最近癸則與次輪心丑同在一直線從地心甲計之當本天之寅其丙甲寅角二度三十七分三十秒即寅丙弧為初均數而無次均數若星從次輪最逺壬厯癸行三百度至卯從地心甲計之當本天之辰其寅甲辰角即次均數乃用丑甲卯三角形求甲角即辰寅弧此形有丑角一百二十度於壬癸卯弧三百度內減去壬癸半周餘癸卯弧即丑角度有卯丑半徑一百九十二萬九千四百八十有丑甲邊一千零四十萬六千九百八十九求丑甲邊法見前求初均數篇求得甲角八度二十一分三十三秒即辰寅弧為次均數與初均數寅丙弧二度三十七分三十秒相加得辰丙弧一十度五十九分零三秒為實行不及平行之度是為減差以減於平行而得實行也若均輪心從最髙戊厯己行三百三十度至己為自行十一宫初度次輪心則從均輪最近辛行一周復行三百度至午星從次輪最逺壬行六十度至未則初均數丙甲申角與丙甲寅角等次均數申甲酉角與寅甲辰角等兩角相加之丙甲酉角亦與丙甲辰角等但為實行過於平行之度是為加差以加於平行而得實行也若測得平行貫行之差及星距太陽之度以推次輪半徑亦用丑甲卯三角形求之如均輪心從最髙戊行一百二十度至子為自行四宫初度次輪心則從均輪最近辛厯庚行二百四十度至丑若星在次輪之最逺壬或在次輪之最近癸則與次輪心丑同在一直線從地心甲計之當本天之寅其丙甲寅角四度四十九分四十六秒即寅丙弧為初均數而無次均數若星從次輪最逺壬行四十五度至卯從地心甲計之當本天之辰其寅甲辰角即次均數乃用丑甲卯三角形求甲角即寅辰弧此形有丑角一百三十五度於半周內減去壬卯弧四十五度餘卯癸弧即丑角度有卯丑半徑一百九十二萬九千四百八十有丑甲邊九百八十萬六千一百四十四求得甲角六度五十七分四十九秒即辰寅弧為次均數與初均數寅丙弧四度四十九分四十六秒相減因初均寅點在平行丙點之後而次均辰點在寅點之前故相減餘辰丙弧二度零八分零三秒為實行過於平行之度是為加差以加於平行而得實行也若均輪心從最髙戊厯己行二百四十度至己為自行八宫初度次輪心則從均輪最近辛行一周復行一百二十度至午星從次輪最逺壬厯癸行三百一十五度至未則初均數丙甲申角與丙甲寅角等次均數申甲酉角與寅甲辰角等兩角相減所餘之丙甲酉角亦與丙甲辰角等但為實行不及平行之度是為減差以減於平行而得實行也御製厯象考成上編卷十一
