body:
  text: 欽定四庫全書御製厯象考成上編卷十二五星厯理四專論火星火星平行度用火星三次衝日求本輪均輪半徑及最髙求初均數求次均數火星平行度測火星平行之法亦用前後兩測與土木二星同新法厯書載古測定七十九平年又二十二日千分日之八百八十三或二萬八千八百五十七日又千分日之八百八十三火星行次輪三十七周即會日三十七次衝日亦三十七次置中積二萬八千八百五十七日又千分日之八百八十三為實星行次輪周數三十七為法除之得周率七百七十九日九十刻七分三十六秒二十七微零四纖一十九忽一十二芒即七百七十九日零十分日之九分四二七八三授時厯作七百七十九日九二九乃以每周三百六十度為實周率七百七十九日九十刻七分三十六秒二十七微零四纖一十九忽一十二芒為法除之得二十七分四十一秒三十九微三十七纖四十三忽五十五芒為每日火星距太陽之行即火星在次輪周每日之行一名嵗行與每日太陽平行五十九分零八秒一十九微四十九纖五十一忽三十九芒相減餘三十一分二十六秒四十微一十二纖零七忽四十四芒為每日火星平行經度即本輪心每日之行既得每日之平行用乘法可得每年每月之平行用除法可得每時每分之平行以立表用火星三次衝日求本輪均輪半徑及最髙測火星本輪半徑法與土木二星同新法厯書載西人多録某於漢順帝時推得兩心差為本天半徑十萬分之二萬一千八百六十一用其四分之三為本輪半徑四分之一為均輪半徑最髙在鶉首宫二十五度二十九分永和四年己卯後因其數與天行不合又改兩心差為本天半徑十萬分之二萬分至明正德間西人歌白泥復推得兩心差為本天半徑十萬分之一萬九千六百最髙在鶉火宫二十七度零一分嘉靖二年癸未相距一千三百八十四年而兩次所推最髙相差三十一度三十二分因知每年最髙行一分二十二秒零一微萬厯間西人第谷又測得兩心差為本天半徑千萬分之一百八十五萬五千本輪半徑為一百四十八萬四千兩心差之五分之四均輪半徑為三十七萬一千兩心差之五分之一最髙在鶉火宫二十八度五十九分二十四秒萬厯二十八年庚子每年最髙行一分零七秒用其數推算均數與天行密合今仍用其數而述其測法如左假如第一次衝日日躔元枵宫一十八度五十八分三十八秒火星在鶉火宫一十八度五十八分三十八秒如甲第二次衝日日躔娵訾宫二十三度二十二分火星在鶉尾宫二十三度二十二分如乙第三次衝日日躔大梁宫一度火星在大火宫一度如丙第一次衝日距第二次衝日七百六十四日一十二時三十二分其實行相距三十四度二十三分二十二秒即鶉火宫甲點距鶉尾宫乙點之度亦即甲丁乙角於第二次實行度內減去第一次實行度即得其平行相距四十度三十九分二十五秒以每日平行度與距日相乘減去全周即得第二次衝日距第三次衝日七百六十八日一十八時其實行相距三十七度三十八分即鶉尾宫乙點距大火宫丙點之度亦即乙丁丙角於第三次實行度內減去第二次實行度即得其平行相距四十二度五十二分三十五秒乃用不同心圈立法算之任取戊點為心作己庚辛壬不同心圈則辛庚弧即第一次距第二次之平行度四十度三十九分二十五秒庚巳弧即第二次距第三次之平行度四十二度五十二分三十五秒爰從戊點過地心丁至圜周二界作一線為最髙線戊丁即兩心差又引丙丁線至壬自壬至甲丁乙丁二線所割庚辛二點作壬辛壬庚二線自庚至辛又作庚辛線即成壬丁辛壬丁庚壬庚辛三三角形以求本天半徑與兩心差之比例先用壬丁辛三角形求壬辛邊此形有壬角四十一度四十六分壬為界角當辛巳弧以辛庚庚巳兩弧相加折半即得有丁角一百零七度五十八分三十八秒即甲丁丙角之餘設丁壬邊為一求得壬辛邊一八八七七六二次用壬丁庚三角形求壬庚邊此形有壬角二十一度二十六分一十七秒三十微以庚巳弧折半即得有丁角一百四十二度二十二分即乙丁丙角之餘設丁壬邊為一求得壬庚邊二一八九二六九末用壬庚辛三角形求庚角此形有壬辛邊一八八七七六二有壬庚邊二一八九二六九有壬角二十度一十九分四十二秒三十微以辛壬丁角與庚壬丁角相減即得求得庚角五十七度二十五分一十五秒倍之得一百一十四度五十分三十秒為辛壬弧與辛巳弧八十三度三十二分相加得一百九十八度二十二分三十秒為己辛壬弧於是以本天半徑命為一各用八線表求其通弦則辛壬弧之通弦為一六八五二九六五己壬弧之通弦為一九七四三四二二乃用比例法變先設之丁壬邊為同比例數以先得之辛壬邊一八八七七六二與先設之丁壬邊一之比即同於今所察之辛壬通弦一六八五二九六五與今所求之丁壬邊之比而得丁壬邊八九二七四八四又平分己壬弧於癸作戊癸線平分己壬通弦於子得子壬九八七一七一一內減去丁壬八九二七四八四餘子丁九四四二二七又以己癸弧八十度四十八分四十五秒以己辛壬弧與全周相減所餘折半即得與九十度相減餘九度一十一分一十五秒為戊己子角戊己子為宜角三角形戊角當己癸弧故己角為己癸弧減象限之餘察其正弦得一五九六六五八為戊子乃用戊子丁勾股形以戊子為股子丁為勾求得戊丁弦一八五四九六一為兩心差也求最髙之法亦用戊子丁直角三角形求丁角此形有三邊有子直角求得丁角五十九度二十四分零三秒即第三次衝日火星距最髙丑點之度也求初均數火星之初均數授時厯名為盈縮差止用一表不分盈縮其最大者二十五度六一九七七九七一以周天三百六十度每度六十分約之得二十五度一十五分零五秒三十微衝合以外各段同用新法厯書最大之初均數為一十度三十四分二十秒即一十度零十分度之五分七六六六惟星正當衝合之時止用此均數加減若在衝合前後仍有次均數之加減故此名初均數以别之如圖甲為地心即本天心乙丙丁為本天之一弧丙甲半徑為一千萬戊己庚為本輪戊丙半徑為一百四十八萬四千戊為最髙庚為最卑辛壬癸為均輪辛戊半徑為三十七萬一千辛為最逺去本輪心逺也癸為最近去本輪心近也本輪心循本天右旋自乙而丙而丁每日行三十一分二十六秒有餘即火星經度均輪心循本輪左旋自戊而己而庚每日亦行三十一分二十六秒有餘微不及經度之行每年少一分零七秒即自行引數次輪心則循均輪右旋自癸而壬而辛每日行一度零二分五十二秒有餘為倍引數也如均輪心在本輪之最髙戊為初宫初度則次輪心在均輪之最近癸或均輪心從本輪最髙戊向已行半周至最卑庚為六宫初度則次輪心亦從均輪最近癸厯壬辛行一周復至癸從地心甲計之俱成一直線無平行實行之差故自行初宫初度及六宫初度俱無均數也如均輪心從本輪最髙戊行三十度至子為一宫初度則次輪心從均輪最近癸行六十度至丑丑癸弧為戊子弧之倍度從地心甲計之當本天之寅寅丙弧為實行不及平行之度乃用丙癸卯直角三角形求癸卯卯丙二邊此形有卯直角有丙角三十度則癸角必六十度有癸丙邊一百一十一萬三千本輪半徑內減去均輪半徑之數求得癸卯邊五十五萬六千五百卯丙邊九十六萬三千八百八十六以卯丙邊與丙甲本天半徑一千萬相加得一千零九十六萬三千八百八十六為卯甲邊以癸卯邊與丑癸通弦三十七萬一千相加即均輪丑癸弧六十度之通弦故與均輪半徑等若非六十度則用比例法以半徑一千萬為一率均輪丑癸弧折半查正弦為二率均輪子癸半徑為三率得四率倍之即丑癸通弦也得九十二萬七千五百為丑卯邊於是用甲丑卯直角三角形求得甲角四度五十分零八秒即寅丙弧為自行一宫初度之初均數是為減差以減於平行而得實行也凡求得初均角即求得丑甲邊為次輪心距地心之數存之為後求次均之用若均輪心從最髙戊向己厯庚行三百三十度至辰為十一宫初度則次輪心從均輪最近癸行一周復自最近癸歷壬辛行三百度至巳從地心甲計之當本天之午午丙弧與寅丙弧等故自行十一宫初度之初均數與一宫初度等但為實行過於平行之度是為加差以加於平行而得實行也用此法求得最髙後三宫之減差初宫初度至二宫末度即得最髙前三宫之加差九宫初度至十一宫末度如均輪心從本輪最髙戊行一百二十度至未為四宫初度則次輪心從均輪最近癸厯壬辛行二百四十度至申從地心甲計之當本天之酉酉丙弧為實行不及平行之度乃用丙癸戌直角三角形求癸戌丙戌二邊此形有戌直角有丙角六十度則癸角必三十度癸丙邊為一百一十一萬三千求得癸戌邊九十六萬三千八百八十六丙戌邊五十五萬六千五百以丙戌邊與丙甲本天半徑一千萬相減餘九百四十四萬三千五百為戌甲邊以癸戌邊與申癸通弦六十四萬二千五百九十相加即均輪申癸弧二百四十度之通弦得一百六十萬零六千四百七十六為申戌邊於是用甲申戌直角三角形求得甲角九度三十九分一十六秒即酉丙弧為自行四宫初度之初均數是為減差以減於平行而得實行也若均輪心從最髙戊向己厯庚行二百四十度至亥為八宫初度則次輪心從均輪最近癸行一周復自癸厯壬行一百二十度至子從地心甲計之當本天之丑丑丙弧與酉丙弧等故自行八宫初度之初均數與四宫初度等但為實行過於平行之度是為加差以加於平行而得實行也用此法求得最卑前三宫之減差三宫初度至五宫末度即得最卑後三宫之加差六宫初度至八宫末度求次均數火星之次均數生於次輪與土木二星同但其次輪半徑有本天髙卑之差又有太陽髙卑之差髙則半徑大卑則半徑小無一定之數此則火星之所獨異也新法厯書載西人多録某測得次輪半徑為本天半徑十萬分之六萬五千八百以推次均數不合天行其後西人第谷等纍年密測方知次輪半徑有髙卑之不同其法於太陽火星同在最卑時測得次輪最小之半徑為本天半徑千萬分之六百三十萬二千七百五十又於太陽在最卑火星在最髙時測得次輪半徑為本天半徑千萬分之六百五十六萬一千二百五十與最小之半徑相較餘二十五萬八千五百此本天髙卑之大差也又於火星在最卑太陽在最髙時測得次輪半徑為本天半徑千萬分之六百五十三萬七千七百五十與最小之半徑相較餘二十三萬五千此太陽髙卑之大差也既得此兩髙卑之差則次輪由髙及卑之各半徑皆可以比例而得之矣如圖甲為地心即本天心乙丙丁為本天之一弧丙甲為本天半徑一千萬戊丙巳為本輪全徑戊丙半徑為一百四十八萬四千戊為最髙己為最卑庚戊辛為均輪全徑庚戊半徑為三十七萬一千庚為最逺辛為最近此逺近以距本輪心言壬辛癸為次輪全徑壬辛半徑之數隨時不同壬為最逺癸為最近此逺近以距地心言本輪心從本天冬至度右旋為經度均輪心從本輪最髙戊左旋為引數即自行度次輪心從均輪最近辛右旋為倍引數星從次輪最逺壬右旋行距日之度即本輪心距太陽之度如均輪心在本輪最髙戊為自行初宫初度次輪心在均輪最近辛合伏之時星在次輪之最逺壬衝太陽之時星在次輪之最近癸從地心甲計之與輪心同在一直線故無均數之加減若衝合以後星在次輪之左右而次均生矣如均輪心從最髙戊行三十度至子為自行一宫初度次輪心則從均輪最近辛行六十度至丑若星在次輪之最逺壬或在次輪之最近癸則與次輪心丑同在一直線從地心甲計之當本天之寅其丙甲寅角四度五十分零八秒即寅丙弧為初均數而無次均數若星從次輪最逺壬厯癸行三百度至卯從地心甲計之當本天之辰其寅甲辰角即次均數乃用丑甲卯三角形求甲角即辰寅弧此形有丑角一百二十度於壬癸卯弧三百度內減去壬癸半周餘癸卯弧即丑角度本時太陽在最髙後六十度火星均輪心在最髙後三十度卯丑次輪半徑為六百七十二萬零一百八十四於最小半徑六百三十萬零二千七百五十內加本天髙卑差二十四萬一千一百八十四又加太陽髙卑差一十七萬六千二百五十即得求差之法見後有丑甲邊一千一百萬零三千零四十九求丑甲邊法見前求初均數篇求得甲角二十二度零三分二十七秒即辰寅弧為次均數與初均數寅丙弧四度五十分零八秒相加得辰丙弧二十六度五十三分三十五秒為實行不及平行之度是為減差以減於平行而得實行也若均輪心從最髙戊厯己行三百三十度至己為自行十一宫初度次輪心則從均輪最近辛行一周復行三百度至午星從次輪最逺壬行六十度至未則初均數丙甲申角與丙甲寅角等次均數申甲酉角與寅甲辰角等兩角相加之丙甲酉角亦與丙甲辰角等但為實行過於平行之度是為加差以加於平行而得實行也若測得平行實行之差及星距太陽度以推次輪半徑亦用丑甲卯三角形求之如均輪心從最髙戊行一百二十度至子為自行四宫初度次輪心則從均輪最近辛厯庚行二百四十度至丑若星在次輪之最逺壬或在次輪之最近癸則與次輪心丑同在一直線從地心甲計之當本天之寅其丙甲寅角九度三十九分一十六秒即寅丙弧為初均數而無次均數若星從次輪最逺壬行一百四十度至卯從地心甲計之當本天之辰其寅甲辰角即次均數乃用丑甲卯三角形求甲角即寅辰弧此形有丑角四十度於半周內減去壬卯弧一百四十度餘卯癸弧即丑角度本時太陽在最髙前三十度火星均輪心在最卑前六十度卯丑次輪半徑為六百五十八萬六千六百三十三於最小半徑六百三十萬零二千七百五十內加本天髙卑差六萬四千六百二十五又加太陽髙卑差二十一萬九千二百五十八即得有丑甲邊九百五十七萬九千一百六十九求得甲角四十三度零二分三十二秒即辰寅弧為次均數與初均數寅丙弧九度三十九分一十六秒相減餘辰丙弧三十三度二十三分一十六秒為實行過於平行之度是為加差以加於平行而得實行也若均輪心從最髙戊厯己行二百四十度至己為自行八宫初度次輪心則從均輪最近辛行一周復行一百二十度至午星從次輪最逺壬厯癸行二百二十度至未則初均數丙甲申角與丙甲寅角等次均數申甲酉角與寅甲辰角等兩角相減所餘之丙甲酉角亦與丙甲辰角等但為實行不及平行之度是為減差以減於平行而得實行也求火星髙卑差法命火星本輪全徑為二千萬為一率本天髙卑大差二十五萬八千五百為二率火星自行距最卑之正矢為三率火星自行距最卑過象限則為大矢以半徑與餘弦相加即得得四率為所求本天髙卑差又以太陽本輪全徑為二千萬為一率太陽髙卑大差二十三萬五千為二率太陽自行距最卑之正矢為三率太陽自行距最卑過象限則為大矢以半徑與餘弦相加即得得四率為所求太陽髙卑差乃以次輪最小之半徑六百三十萬二千七百五十加所求本天髙卑差及太陽髙卑差即為本時次輪半徑也御製厯象考成上編卷十二
