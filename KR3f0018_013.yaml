body:
  text: 欽定四庫全書御製歷象考成上編卷十三五星歷理五專論金星金星平行度用金星距太陽前後極遠度求最髙及本輪均輪半徑求初均數求次均數金星平行度金星之平行經度即本輪心行度即太陽之平行經度蓋金星之本輪心即太陽之本輪心故其行度同也至其在次輪周每日之平行亦用前後兩測與土木二星同新法厯書載古測定七平年又三百六十四日千分日之六百六十七或二千九百一十九日又千分日之六百六十七金星行次輪五周即會日五次退合亦五次置中積二千九百一十九日又千分日之六百六十七為實星行次輪周數五為法除之得周率五百八十三日八十九刻九分零五秒四十五微三十六纖即五百八十三日零十分日之九分三三四授時歷作五百八十三日九二六乃以每周三百六十度為實周率五百八十三日八十九刻九分零五秒四十五微三十六纖為法除之得三十六分五十九秒二十五微五十二纖一十六忽四十四芒為每日金星在次輪周之平行一名伏見行既得每日之平行用乘法可得每年每月之平行用除法可得每時每分之平行以立表用金星距太陽前後極逺度求最髙及本輪均輪半徑測金星兩心差之法與土木火三星不同蓋土木火三星各有平行能與太陽衝故測三次衝日之度即可得兩心差及最髙所在金星即以太陽之平行為平行星繞太陽旋轉不得與太陽衝故必測其距太陽極逺之度先得最髙所在而後得兩心差其本輪均輪之半徑方可次第定焉其法於金星辰見時逐日測之取其距太陽極逺之度星自合伏後距太陽漸逺至極逺又復漸近故須逐日測之方得其極逺之度也夕見時亦逐日測之取其距太陽極逺之度但星距太陽極逺之度亦時時不同蓋本天有髙卑平行即輪心近最髙則距地逺而角小平行近最卑則距地近而角大必擇晨夕極逺度之相等者如晨測距太陽四十七度夕測亦距四十七度則其兩平行距髙卑左右之度亦等爰以兩平行所當宫度相加折半即最髙最卑線所當宫度然猶未能定其孰為最髙孰為最卑也乃再擇晨見時或夕見時距太陽極逺之度以相較若平行所當宫度近最髙其相距極逺之度較小近最卑其相距極逺之度較大既得最髙而兩心差可得矣法見後新法厯書載西人多録某於漢順帝陽嘉三年甲戌測得最髙在大梁宫二十五度兩心差為本天半徑十萬分之二千一百三十取其四分之三為本輪半徑四分之一為均輪半徑因其數與天行不合又改兩心差為本天半徑十萬分之四千一百四十八逮後西人第谷又於明萬厯十三年乙酉測得最髙在實沈宫二十九度一十六分三十九秒每年最髙行一分二十二秒五十七微定兩心差為本天半徑千萬分之三十二萬零八百一十四本輪半徑為二十三萬一千九百六十二比四分之三小比三分之二大均輪半徑為八萬八千八百五十二比四分之一大比三分之一小用其數推算均數與天行密合今仍用其數而述其測法如左求最髙之法用晨夕兩測取其平行實行之大差相等者用之假如第一次晨測得金星實行在娵訾宫八度二十三分四十七秒如甲太陽平行在降婁宫二十二度一十六分即金星之平行如乙甲乙弧四十三度五十二分一十三秒為平行實行之大差第二次夕測得金星實行在夀星宫二十五度三十分一十三秒如丙太陽平行在鶉尾宫一十一度三十八分即金星之平行如丁丁丙弧亦四十三度五十二分一十三秒為平行實行之大差兩測平行實行之大差既等則最髙最卑線必在兩平行宫度之中試取乙丁兩平行相距之弧折半於戊從戊過地心己至庚作戊庚線即為最髙最卑線而不同心天之心必在此線之上乃於戊庚線上任取辛點為心作壬癸子丑不同心天復從辛點作壬辛丑辛兩線與乙己丁巳平行即以壬丑兩點各為心作兩次輪切己甲線於寅切己丙線於卯第一次晨測時次輪心循不同心天行至壬以太陽平行計之當恆星天之乙乙距戊之度與壬距辰之度等故乙點為平行星循次輪周行至寅從地心己計之當恆星天之甲故甲點為實行甲乙相距之四十三度五十二分一十三秒即癸己寅角第二次夕測時次輪心循不同心天行至丑以太陽平行計之當恆星天之丁丁距戊之度與丑距辰之度等故丁點為平行星循次輪周行至卯從地心已計之當恆星天之丙故丙點為實行丁丙相距之四十三度五十二分一十三秒即子己卯角此癸己寅及子己卯兩角之大小因平行距最髙之逺近而殊蓋平行距最髙近則不同心天距地心之線長而角小平行距最髙逺則不同心天距地心之線短而角大也今兩已角既相等則癸巳與子巳距地心之兩線必等而乙點與丁點距最髙之度亦必等故以乙點之降婁宫二十二度一十六分與丁點之鶉尾宫一十一度三十八分相加折半得鶉首宫一度五十七分如戊其衝為星紀宫一度五十七分如庚得戊庚為最髙最卑之線也欲定其孰為最髙須再測之假如再用晨測得金星實行在星紀宫一十四度一十八分三十三秒如已太陽平行在娵訾宫初度如午巳午弧四十五度四十一分二十七秒為平行實行之大差試從辛點作辛未線與己午平行即以未點為心作次輪切己巳線於申次輪心循不同心天行至未以太陽平行計之當恆星天之午故午點為平行星循次輪周行至申從地心己計之當恆星天之已故已點為實行已午相距之四十五度四十一分二十七秒即酉己申角此前所測癸己寅角多一度四十九分一十四秒夫先測之平行乙點距鶉首宫戊點近而平行實行之差少是近最髙而差角小也後測之平行午點距鶉首宫戊點逺而平行實行之差多是逺最髙而差角大也然則鶉首宫戊點為最髙而星紀宫庚點為最卑可知矣求兩心差之法亦用兩測擇其平行度一當最髙一當最卑而距太陽極逺者用之假如太陽平行在鶉首宫一度五十七分正當金星最髙之點如戊於時測得金星實行為鶉火宫一十六度二十二分四十五秒如甲其平行實行之差為四十四度二十五分四十五秒即甲巳戊角又於太陽平行在星紀宫一度五十七分亦正當金星最卑之點如庚於時測得金星實行為大火宫一十三度四十分零四秒如乙其平行實行之差為四十八度一十六分五十六秒即乙己庚角乃以戊點為心切己甲線於丙庚點為心切己乙線於丁各作一金星次輪又從戊點至丙庚點至丁作兩半徑即成己丙戊己丁庚兩直角三角形用己丙戊直角三角形求戊己邊此形有丙直角有己角四十四度二十五分四十五秒命戊丙半徑為一求得戊巳邊一四二八五一六三又用己丁庚直角三角形求己庚邊此形有丁直角有己角四十八度一十六分五十六秒命庚丁半徑為一求得己庚邊一三三九七七五以戊己與己庚相加得戊庚二七六八二二三八為本天全徑半之得戊辛或辛庚一三八四一一一九為本天半徑辛庚半徑內減去己庚一三三九七七五餘辛巳四四四四四為兩心差乃用比例法變先所得之本天半徑為同比例數以先所得之本天半徑一三八四一一一九與先所得之兩心差四四四四四之比即同於今所設之本天半徑一與今所得之兩心差之比而得三二八一五為兩心差也求初均數金星之初均數授時歷亦名盈縮差止用一表不分盈縮其最大者二度一三六三二一三八以周天三百六十度每度六十分約之得二度零九分二十二秒零六微新法厯書最大之初均數為一度五十分一十五秒四十微即一度零十分度之八分三七六八五二惟星在次輪周之行度正當最逺最近二點之時止用此均數加減若在最逺最近前後仍有次均數之加減故此名初均數以别之如圖甲為地心即本天心乙丙丁為本天之一弧丙甲半徑為一千萬戊己庚為本輪戊丙半徑為二十三萬一千九百六十二戊為最髙庚為最卑辛壬癸為均輪辛戊半徑為八萬八千八百五十二辛為最逺去本輪心逺也癸為最近去本輪心近也本輪心循本天右旋自乙而丙而丁每日行五十九分零八秒有餘與太陽之平行同即金星經度均輪心循本輪左旋自戊而己而庚每日亦行五十九分零八秒有餘微不及於經度之行每年少一分二十二秒五十七微即自行引數次輪心則循均輪右旋自癸而壬而辛每日行一度五十八分一十六秒有餘為倍引數也如均輪心在本輪之最髙戊為初宫初度則次輪心在均輪之最近癸或均輪心從本輪最髙戊向己行半周至最卑庚為六宫初度則次輪心亦從均輪最近癸歷壬辛行一周復至癸從地心甲計之俱成一直線無平行實行之差故自行初宫初度及六宫初度俱無均數也如均輪心從本輪最髙戊行三十度至子為一宫初度則次輪心從均輪最近癸行六十度至丑丑癸弧為戊子弧之倍度從地心甲計之當本天之寅寅丙弧為實行不及平行之度乃用丙癸卯直角三角形求癸卯卯丙二邊此形有卯直角有丙角三十度則癸角必六十度有癸丙邊一十四萬三十一百一十本輪半徑內減去均輪半徑之數求得癸卯邊七萬一千五百五十五卯丙邊一十二萬三千九百三十七以卯丙邊與丙甲本天半徑一千萬相加得一千零一十二萬三千九百三十七為卯甲邊以癸卯邊與丑癸通弦八萬八千八百五十二相加即均輪丑癸弧六十度之通弦故與均輪半徑等若非六十度則用比例法以半徑一千萬為一率均輪丑癸弧折半察正弦為二率均輪子癸半徑為三率得四率倍之即丑癸通弦也得一十六萬零四百零七為丑卯邊於是用甲丑卯直角三角形求得甲角五十四分三十秒即寅丙弧為自行一宫初度之初均數是為減差以減於平行而得實行也凡求得初均角即求得丑甲邊為次輪心距地心之數存之為後求次均之用若均輪心從最髙戊向己厯庚行三百三十度至辰為十一宫初度則次輪心從均輪最近癸行一周復自最近癸厯壬辛行三百度至已從地心甲計之當本天之午午丙弧與寅丙弧等故自行十一宫初度之初均數與一宫初度等但為實行過於平行之度是為加差以加於平行而得實行也用此法求得最髙後三宫之減差初宫初度至二宫末度即得最髙前三宫之加差九宫初度至十一宫末度如均輪心從本輪最髙戊行一百二十度至未為四宫初度則次輪心從均輪最近癸厯壬辛行二百四十度至申從地心甲計之當本天之酉酉丙弧為實行不及平行之度乃用丙癸戌直角三角形求癸戌丙戌二邊此形有戌直角有丙角六十度則癸角必三十度癸丙邊為一十四萬三千一百一十求得癸戌邊一十二萬三千九百三十七丙戌邊七萬一千五百五十五以丙戌邊與丙甲本天半徑一千萬相減餘九百九十二萬八千四百四十五為戌甲邊以癸戌邊與申癸通弦一十五萬三千八百九十六相加即均輪申癸弧一百二十度之通弦得二十七萬七千八百三十三為申戌邊於是用甲申戌直角三角形求得甲角一度三十六分一十一秒即酉丙弧為自行四宫初度之初均數是為減差以減於平行而得實行也若均輪心從最髙戊向己厯庚行二百四十度至亥為八宫初度則次輪心從均輪最近癸行一周復自癸厯壬行一百二十度至子從地心甲計之當本天之丑丑丙弧與酉丙弧等故自行八宫初度之初均數與四宫初度等但為實行過於平行之度是為加差以加於平行而得實行也用此法求得最卑前三宫之減差三宫初度至五宫末度即得最卑後三宫之加差六宫初度至八宫末度求次均數金星之次均數亦生於次輪但星在次輪周之行度土木火三星皆自最逺起算金星則自平逺起算蓋土木火三星之次輪徑線與地心參直其次輪周之最逺點有分定星在次輪周又行距日度最逺即為合伏最近即為退衝故從最逺起算金星之次輪徑線不與地心參直而與本輪髙卑線平行從地心過本輪心之線其徑線逺地心之端為平逺近地心之端為平近理與太陰次輪徑線與均輪徑線平行者同蓋太陰次輪之逺近以距本輪心言則與均輪徑線平行金星次輪之逺近以距地心言則與髙卑線平行故最逺點無定分而平逺點有定分又金星之本輪即以太陽本輪心為心星在次輪周自行伏見度其合伏退合亦不定在逺近二點故從平逺起算惟次輪心正當髙卑線上即均輪心在最髙或最卑時則平逺點與最逺點合最髙後半周則平逺差而東最卑後半周則平逺差而西此兩逺點之差即初均數然求次均數之法必以最逺點為起算之端故均輪心在最髙後半周初均數為減者則於伏見度內加初均數為星距次輪最逺之度因其差而東也均輪心在最卑後半周初均數為加者則於伏見度減去初均數為星距次輪最逺之度因其差而西也是金星在次輪周之行度雖自平逺起算而求次均數之法仍自最逺起算也新法厯書載西人多録某測得次輪半徑為本天半徑千萬分之七百五十萬九千八百其後西人第谷又改為本天半徑千萬分之七百二十二萬四千八百五十今從之如圖甲為地心即本天心乙丙丁為本天之一弧丙甲為本天半徑一千萬戊丙巳為本輪全徑戊丙半徑為二十三萬一千九百六十二戊為最髙己為最卑庚戊辛為均輪全徑庚戊半徑為八萬八千八百五十二庚為最逺辛為最近此逺近以距本輪心言壬辛癸為次輪全徑壬辛半徑為七百二十二萬四千八百五十壬為最逺癸為最近此逺近以距地心言因均輪心在最髙故平逺點與最逺點合而壬亦即為平逺癸亦即為平近本輪心從本天冬至度右旋為經度即太陽平行度均輪心從本輪最髙戊左旋為引數即自行度次輪心從均輪最近辛右旋為倍引數星從次輪平逺點右旋行伏見度如均輪心在本輪最髙戊為自行初宫初度次輪心在均輪最近辛星在次輪之最逺壬或在次輪之最近癸從地心甲計之與輪心同在一直線故無均數之加減過此二點則星在次輪周之左右而次均生矣如均輪心從最髙戊行六十度至子為自行二宫初度次輪心則從均輪最近辛行一百二十度至丑從地心甲計之當本天之寅其丙甲寅角一度三十四分四十九秒即寅丙弧為初均數卯為平逺辰為平近壬為最逺癸為最近其平逺距最逺之卯丑壬角亦一度三十四分四十九秒即壬卯弧與初均數丙甲寅角等如星從平逺卯行三百五十八度二十五分一十一秒正當最逺壬或從平逺卯行一百七十八度二十五分一十一秒正當最近癸則與次輪心丑同在一直線而無次均數若星從次輪平逺卯厯辰行三百二十度至已則於卯癸辰巳弧三百二十度加壬卯弧一度三十四分四十九秒即初均數得壬卯癸辰巳弧三百二十一度三十四分四十九秒為星距次輪最逺之度從地心甲計之當本天之午其寅甲午角即次均數乃用丑甲巳三角形求甲角即午寅弧此形有丑角一百四十一度三十四分四十九秒於壬卯癸辰巳弧內減去壬卯癸半周即得有己丑半徑七百二十二萬四千八百五十有丑甲邊一千零七萬五千三百八十七求丑甲邊法見前求初均數篇求得甲角一十五度五十五分二十七秒即午寅弧為次均數與初均數寅丙弧一度三十四分四十九秒相加因初均寅點在平行丙點之後而次均午點又在寅點之後故相加得午丙弧一十七度三十分一十六秒為實行不及平行之度是為減差以減於平行而得實行也若均輪心從最髙戊厯己行三百度至未為自行十宫初度次輪心則從均輪最近辛行一周復行二百四十度至申星從次輪平逺卯行四十度至酉則初均數丙甲戌角與丙甲寅角等次均數戌甲亥角與寅甲午角等兩角相加之丙甲亥角亦與丙甲午角等但為實行過於平行之度是為加差以加於平行而得實行也若測得平行實行之差及伏見度以推次輪半徑亦用丑甲巳三角形求之如均輪心從最髙戊行一百二十度至子為自行四宫初度次輪心則從均輪最近辛行二百四十度至丑從地心甲計之當本天之寅其丙甲寅角一度三十六分一十一秒即寅丙弧為初均數卯為平逺辰為平近壬為最逺癸為最近其平逺距最逺之卯丑壬角亦一度三十六分一十一秒即壬卯弧與初均數丙甲寅角等如星從平逺卯行三百五十八度二十三分四十九秒正當最逺壬或從平逺卯行一百七十八度二十三分四十九秒正當最近癸則與次輪心丑同在一直線而無次均數若星從次輪平逺卯行七十度至已則於卯巳弧七十度加壬卯弧一度三十六分一十一秒即初均數得壬卯巳弧七十一度三十六分一十一秒為星距次輪最逺之度從地心甲計之當本天之午其寅甲午角即次均數乃用丑甲巳三角形求甲角即寅午弧此形有丑角一百零八度二十三分四十九秒於壬卯巳癸半周內減去壬卯巳弧即得有己丑半徑七百二十二萬四千八百五十有丑甲邊九百九十三萬一千五百一十求得甲角二十九度一十八分三十六秒即午寅弧為次均數與初均數寅丙弧一度三十六分一十一秒相減因初均寅點在平行丙點之後而次均午點在平行丙點之前故相減餘丙午弧二十七度四十二分二十五秒為實行過於平行之度是為加差以加於平行而得實行也若均輪心從最髙戊歷巳行二百四十度至未為自行八宫初度次輪心則從均輪最近辛行一周復行一百二十度至申星從次輪平逺卯行二百九十度至酉則初均數丙甲戌角與丙甲寅角等次均數戌甲亥角與寅甲午角等兩角相減所餘之丙甲亥角亦與丙甲午角等但為實行不及平行之度是為減差以減於平行而得實行也御製歷象考成上編卷十三
