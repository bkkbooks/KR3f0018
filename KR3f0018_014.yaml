body:
  text: 欽定四庫全書御製厯象考成上編卷十四五星厯理六專論水星水星平行度用水星距太陽前後極逺度求最髙及本輪均輪半徑求初均數求次均數水星平行度水星之平行經度即本輪心行度亦即太陽之平行經度其在次輪周每日之平行亦用前後兩測與金星同新法厯書載古測定四十六平年又十二日十分日之四或一萬六千八百零二日又十分日之四水星行次輪一百四十五周即會日一百四十五次退合亦一百四十五次置中積一萬六千八百零二日又十分日之四為實星行次輪周數一百四十五為法除之得周率一百一十五日八十四刻五分一十二秒五十一微一十五纖五十忽二十四芒即一百一十五日零十分日之八分七八六二授時歴作一百一十五日八七六乃以每周三百六十度為實周率一十一十五日八十四刻五分一十二秒五十一微一十五纖五十忽二十四芒為法除之得三度零六分二十四秒零六微五十九纖二十九忽二十二芒為每日水星在次輪周之平行一名伏見行既得毎日之平行用乘法可得每年每月之平行用除法可得毎時每分之平行以立表用水星距太陽前後極逺度求最髙及本輪均輪半徑測水星兩心差之法與金星同蓋其行旋繞太陽不得與太陽衝故亦須測其距太陽前後極逺之度先得最髙所在而後得兩心差也新法厯書載西人多録某於漢順帝永和三年戊寅測得最髙在壽星宫一十度一十五分兩心差為本天半徑十萬分之九千四百零七取其六分之五為本輪半徑六分之一為均輪半徑逮後西人第谷又於明萬厯十三年乙酉測得最髙在析木宫初度一十分一十七秒每年最髙行一分四十五秒一十四微定兩心差為本天半徑千萬分之六十八萬二千一百五十五本輪半徑為五十六萬七千五百二十三比六分之五微小均輪半徑為一十一萬四千六百三十二比六分之一微大用其數推算均數與天行密合今仍用其數而述其測法如左求最髙之法用晨夕兩測取其平行實行之大差相等者用之假如第一次晨測得水星實行在壽星宫一十度一十五分一十四秒如甲太陽平行在壽星宫二十九度三十二分即水星之平行如乙甲乙弧一十九度一十六分四十六秒為平行實行之大差第二次夕測得水星實行在星紀宫二十七度一十二分四十六秒如丙太陽平行在星紀宫七度五十六分即水星之平行如丁丁丙弧亦一十九度一十六分四十六秒為平行實行之大差兩測平行實行之大差既等則最髙最卑線必在兩平行宫度之中試取乙丁兩平行相距之弧折半於戊從戊過地心己至庚作戊庚線即為最髙最卑線而不同心天之心必在此線之上乃於戊庚線上任取辛點為心作壬癸子丑不同心天復從辛點作壬辛丑辛兩線與乙巳丁巳平行即以壬丑兩點各為心作兩次輪切己甲線於寅切己丙線於卯第一次晨測時次輪心循不同心天行至壬以太陽平行計之當恒星天之乙乙距戊之度與壬距辰之度等故乙點為平行星循次輪周行至寅從地心己計之當恒星天之甲故甲點為實行甲乙相距之一十九度一十六分四十六秒即癸巳寅角第二次夕測時次輪心循不同心天行至丑以太陽平行計之當恒星天之丁丁距戊之度與丑距辰之度等故丁點為平行星循次輪周行至卯從地心己計之當恒星天之丙故丙點為實行丁丙相距之一十九度一十六分四十六秒即子己卯角此癸巳寅及子己卯兩角之大小因平行距最髙之逺近而殊盖平行距最髙近則不同心天距地心之線長而角小平行距最髙逺則不同心天距地心之線短而角大也今兩已角既相等則癸巳與子巳距地心之兩線必等而乙點與丁點距最髙之度亦必等故以乙點之夀星宫二十九度三十二分與丁點之星紀宫七度五十六分相加折半得析木宫三度四十四分如戊其衝為實沈宫三度四十四分如庚得戊庚為最髙最卑之線也欲定其孰為最髙須再測之假如再用晨測得水星實行在鶉首宫一十六度四十二分五十四秒如已太陽平行在鶉火宫六度三十分如午巳午弧一十九度四十七分零六秒為平行實行之大差試從辛點作辛未線與巳午平行即以未點為心作次輪切己巳線於申次輪心循不同心天行至未以太陽平行計之當恒星天之午故午點為平行星循次輪周行至申從地心己計之當恒星天之巳故巳點為實行巳午相距之一十九度四十七分零六秒即酉己申角比前所測癸巳寅角多三十分二十秒夫先測之平行乙點距析木宫戊點近而平行實行之差少是近最髙而差角小也後測之平行午點距析木宫戊點逺而平行實行之差多是逺最髙而差角大也然則析木宫戊點為最髙而實沈宫庚點為最卑可知矣求兩心差之法亦用兩測擇其平行度一當最髙一當最卑而距太陽極逺者用之假如太陽平行在析木宫三度正當水星最髙之點如戊於時測得水星實行為析木宫二十三度四十八分三十二秒如甲其平行實行之差為二十度四十八分三十二秒即甲巳戊角又於太陽平行在實沈宫三度亦正當水星最卑之點如庚於時測得水星實行為大梁宫八度五十八分如乙其平行實行之差為二十四度零二分即乙己庚角乃以戊點為心切己甲線於丙庚點為心切己乙線於丁各作一水星次輪又從戊點至丙庚點至丁作兩半徑即成己丙戊己丁庚兩直角三角形用己丙戊直角三角形求戊己邊此形有丙直角有己角二十度四十八分三十二秒命戊丙半徑為一求得戊巳邊二八一四九三二又用己丁庚直角三角形求己庚邊此形有丁直角有己角二十四度零二分命庚丁半徑為一求得己庚邊二四五五三八五以戊己與己庚相加得戊庚五二七二八八二為本天全徑半之得戊辛或辛庚二六三五一四四一為本天半徑辛庚半徑内減去己庚三四五五三八五餘辛巳一七九七五九一為兩心差乃用比例法變先所得之本天半徑為同比例數以先所得之本天半徑二六三五一四四一與先所得之兩心差一七九七五九一之比即同於今所設之本天半徑一與今所得之兩心差之比而得六八二一六為兩心差也求初均數水星之初均數授時厯亦名盈縮差止用一表不分盈縮其最大者二度二八六一四八四七以周天三百六十度每度六十分約之得二度一十五分一十一秒五十一微新法厯書最大之初均數為三度三十四分二十秒二十三微即三度零十分度之五分七二三二八七惟星在次輪周之行度正當最逺最近二點之時止用此均數加減若在最逺最近前後仍有次均數之加減故此名初均數以别之如圖甲為地心即本天心乙丙丁為本天之一弧丙甲半徑為一千萬戊己庚為本輪戊丙半徑為五十六萬七千五百二十三戊為最髙庚為最卑辛壬癸為均輪辛戊半徑為一十一萬四千六百三十二辛為最逺去本輪心逺也癸為最近去本輪心近也本輪心循本天右旋自乙而丙而丁每日行五十九分零八秒有餘與太陽之平行同即水星經度均輪心循本輪左旋自戊而己而庚每月亦行五十九分零八秒有餘微不及於經度之行每年少一分四十五秒一十四微即自行引數次輪心則循均輪右旋自辛而壬而癸每日行二度五十七分有餘為三倍引數也土木火金四星之次輪心皆起均輪最近行倍引數惟水星則起均輪最逺行三倍引數如均輪心在本輪之最髙戊為初宫初度則次輪心在均輪之最逺辛或均輪心從本輪最髙戊向己行半周至最卑庚為六宫初度則次輪心亦從均輪最逺辛歴壬癸行一周至辛復自辛歴壬行半周至最近癸從地心甲計之俱成一直線無平行實行之差故自行初宫初度及六宫初度俱無均數也如均輪心從本輪最髙戊行三十度至子為一宫初度則次輪心從均輪最逺辛行九十度至丑辛丑弧為戊子弧之三倍從地心甲計之當本天之寅寅丙弧為實行不及平行之度乃用丙子丑三角形求丙角及丑丙邊此形有子角九十度當丑癸弧有子丙本輪半徑五十六萬七千五百二十三有丑子均輪半徑一十一萬四千六百三十二求得丙角一十一度二十五分一十秒丑丙邊五十七萬八千九百八十五以丙角一十一度二十五分一十秒與子丙庚角一百五十度相加當子庚弧為自行度減半周之餘得丑丙庚角一百六十一度二十五分一十秒於是用丑丙甲三角形求甲角此形有丙角一百六十一度二十五分一十秒有丑丙邊五十七萬八千九百八十五有丙甲本天半徑一千萬求得甲角一度零七秒即寅丙弧為自行一宫初度之初均數是為減差以減於平行而得實行也凡求得初均角即求得丑甲邊為次輪心距地心之數存之為後求次均之用若均輪心從最髙戊向己歴庚行三百三十度至卯為十一宫初度則次輪心從均輪最逺辛行二周復自最逺辛歴壬癸行二百七十度至辰從地心甲計之當本天之己巳丙弧與寅丙弧等故自行十一宫初度之初均數與一宫初度等但為實行過於平行之度是為加差以加於平行而得實行也用此法求得最髙後三宫之減差初宫初度至二宫末度即得最髙前三宫之加差九宫初度至十一宫末度如均輪心從本輪最髙戊行一百三十五度至午為四宫一十五度則次輪心從均輪最逺辛歴壬癸行一周復行四十五度至未從地心甲計之當本天之申申丙弧為實行不及平行之度乃用丙午未三角形求丙角及丙未邊此形有午角一百三十五度當癸未弧有丙午本輪半徑五十六萬七千五百二十三有午未均輪半徑一十一萬四千六百三十二求得丙角七度零七分二十五秒丙未邊六十五萬三千六百三十四以丙角七度零七分二十五秒與午丙庚角四十五度相加當午庚弧為自行度減半周之餘得未丙庚角五十二度零七分二十五秒於是用未丙甲三角形求甲角此形有丙角五十二度零七分二十五秒有丙未邊六十五萬三千六百三十四有丙甲本天半徑一千萬求得甲角三度零四分三十六秒即申丙弧為自行四宫一十五度之初均數是為減差以減於平行而得實行也若均輪心從最髙戊向已歴庚行二百二十五度至酉為七宫一十五度則次輪心從均輪最逺辛行一周復自辛歴壬癸行三百一十五度至戌從地心甲計之當本天之亥亥丙弧與申丙弧等故自行七宫一十五度之初均數與四宫一十五度等但為實行過於平行之度是為加差以加於平行而得實行也用此法求得最卑前三宫之減差三宫初度至五宫末度即得最卑後三宫之加差六宫初度至八宫末度求次均數求水星次均數之理與金星同新法厯書載西人多録某測得次輪半徑為本天半徑十萬分之三萬五千七百二十其後西人第谷又改為本天半徑千萬分之三百八十五萬今從之如圖甲為地心即本天心乙丙丁為本天之一弧丙甲為本天半徑一千萬戊丙巳為本輪全徑戊丙半徑為五十六萬七千五百二十三戊為最髙己為最卑庚戊辛為均輪全徑庚戊半徑為一十一萬四千六百三十二庚為最逺辛為最近此逺近以距本輪心言壬庚癸為次輪全徑壬庚半徑為三百八十五萬壬為最逺癸為最近此逺近以距地心言因均輪心在最髙故平逺點與最逺點合而壬亦即為平逺癸亦即為平近本輪心從本天冬至度右旋為經度即太陽平行度均輪心從本輪最髙戊左旋為引數即自行度次輪心從均輪最逺庚右旋為三倍引數星從次輪平遠點右旋行伏見度如均輪心在本輪最髙戊為自行初宫初度次輪心在均輪最逺庚星在次輪之最逺壬或在次輪之最近癸從地心甲計之與輪心同在一直線故無均數之加減過此二點則星在次輪周之左右而次均生矣如均輪心從最髙戊行六十度至子為自行二宫初度次輪心則從均輪最逺庚行一百八十度至辛從地心甲計之當本天之丑其丙甲丑角二度一十一分四十七秒即丑丙弧為初均數寅為平逺卯為平近壬為最逺癸為最近其平逺距最逺之寅辛壬角亦二度一十一分四十七秒即壬寅弧與初均數丙甲丑角等加星從平逺寅行三百五十七度四十八分一十三秒正當最逺壬或從平逺寅行一百七十七度四十八分一十三秒正當最近癸則與次輪心辛同在一直線而無次均數若星從次輪平逺寅歴卯行三百三十度至辰則於寅癸卯辰弧三百三十度加壬寅弧二度一十一分四十七秒即初均數得壬寅癸卯辰弧三百三十二度一十一分四十七秒為星距次輪最逺之度從地心甲計之當本天之己其丑甲巳角即次均數乃用辛甲辰三角形求甲角即己丑弧此形有辛角一百五十二度一十一分四十七秒於壬寅癸卯辰弧内減去壬寅癸半周即得有辰辛半徑三百八十五萬有辛甲邊一千零二十三萬三千九百六十五求辛甲邊法見前求初均數篇求得甲角七度三十分零二秒即己丑弧為次均數與初均數丑丙弧二度一十一分四十七秒相加因初均丑點在平行丙點之後而次均己點又在丑點之後故相加得己丙弧九度四十一分四十九秒為實行不及平行之度是為減差以減於平行而得實行也若均輪心從最髙戊歴己行三百度至午為自行十宫初度次輪心則從均輪最逺庚行二周復行一百八十度至辛星從次輪平逺寅行三十度至未則初均數丙甲申角與丙甲丑角等次均數申甲酉角與丑甲巳角等兩角相加之丙甲酉角亦與丙甲巳角等但為實行過於平行之度是為加差以加於平行而得實行也若測得平行實行之差及伏見度以推次輪半徑亦用辛甲辰三角形求之如均輪心從最髙戊行一百一十度至子為自行三宫二十度次輪心則從均輪最逺庚行三百三十度至丑從地心甲計之當本天之辰其丙甲辰角三度三十四分二十六秒即辰丙弧為初均數寅為平逺卯為平近壬為最逺癸為最近其平逺距最逺之寅丑壬角亦三度三十四分二十六秒即壬寅弧與初均數丙甲辰角等如星從平逺寅行三百五十六度二十五分三十四秒正當最逺壬或從平逺寅行一百七十六度二十五分三十四秒正當最近癸則與次輪心丑同在一直線而無次均數若星從次輪平逺寅行二百度至巳則於寅癸卯巳弧二百度加壬寅弧三度三十四分二十六秒即初均數得壬寅癸卯巳弧二百零三度三十四分二十六秒為星距次輪最逺之度從地心甲計之當本天之午其辰甲午角即次均數乃用丑甲巳三角形求甲角即午辰弧此形有丑角二十三度三十四分二十六秒於壬寅癸卯巳弧内減去壬寅癸半周即得有己丑半徑三百八十五萬有丑甲邊九百七十三萬七千零一十九求得甲角一十三度五十五分四十四秒即午辰弧為次均數與初均數辰丙弧三度三十四分二十六秒相加得午丙弧一十七度三十分一十秒為實行不及平行之度是為減差以減於平行而得實行也若均輪心從最髙戊歴己行二百五十度至未為自行八宫十度次輪心則從均輪最遠庚行二周復行三十度至申星從次輪平遠寅行一百六十度至酉則初均數丙甲戌角與丙甲辰角等次均數戌甲亥角與辰甲午角等兩角相加之丙甲亥角亦與丙甲午角等但為實行過於平行之度是為加差以加於平行而得實行也御製厯象考成上編卷十四
