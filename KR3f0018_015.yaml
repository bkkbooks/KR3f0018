body:
  text: 欽定四庫全書御製厯象考成上編卷十五五星厯理七五星合論五星交周土木火三星緯度金水二星緯度五星伏見五星視差五星交周五星交周名義雖與太隂同而其行之順逆實相反也太隂之交逆行五星之交順行然而本道與黃道交周土木火三星有之而金水二星則無何也土木火三星各有本道與黃道斜交其自黃道南過黃道北之㸃亦為正交自黃道北過黃道南之㸃亦為中交自交而後便生距度此本道與黃道相距所生之緯度也若夫金水二星則皆以黃道為本道因無二道之交㸃故亦無二道相距之緯度也其所以又有緯度者由於次輪之面不與本道平行星行次輪周凡離本道者皆生緯度此又非獨金水二星為然即土木火三星亦然也是故土木火三星本道與黃道相交之兩㸃仍名之曰交周自兩交㸃過地心作徑線名之曰交線自兩交之中過地心作徑線名之曰大距線其次輪面之東西徑線恆當本道之平面而與交線平行者曰樞線次輪面之南北徑線恆與本道斜交而與黃道平行者曰次輪大距線其樞線之兩端恆與本道相當遂成兩交㸃今名之曰次交㸃而金水二星次輪面之東西徑線亦曰樞線南北徑線亦曰次輪大距線其樞線之兩端亦與本道即黃道相當今亦名之曰次交㸃而與樞線平行之本道徑線仍名之曰交線交線之兩端仍名之曰交周金水二星本無交周因次輪最逺距次輪兩交㸃之度即次輪心距交線兩端之度故仍名曰交周又土木火三星之次輪面不與本道平行而金水二星之次輪面亦不與本道平行此五星之所同次輪心行至本道之兩交㸃則樞線與交線合次輪心行至本道兩交之中星又行至次輪兩交㸃之中則緯度極大故五星之交周㸃即緯度起算之端也新法厯書載崇禎元年戊辰土星正交在鶉首宫二十度四十一分五十二秒中交在星紀宫二十度四十一分五十二秒每年交行四十一秒五十三微本天與黃道相交之角為二度三十一分木星正交在鶉首宫七度零九分零八秒中交在星紀宫七度零九分零八秒每年交行一十三秒三十六微本天與黃道相交之角為一度一十九分四十秒火星正交在大梁宫一十七度零二分二十九秒中交在大火宫一十七度零二分二十九秒每年交行五十二秒五十七微本天與黃道相交之角為一度五十分金星正交恆距最髙一十六度在實沈宫一十四度一十六分零六秒中交在析木宫一十四度一十六分零六秒每年交行一分二十二秒五十七微水星正交恆與最卑同在實沈宫一度二十五分四十二秒舊作中交中交在析木宫一度二十五分四十二秒舊作正交每年交行一分四十五秒一十四微至於金水二星之次輪面與黃道相交之角則未載其數今按其緯度表推之金星次輪面交黃道之角為三度二十九分水星次輪心在正交當黃道北之角為五度零五分一十秒當黃道南之角為六度三十一分零二秒次輪心在中交當黃道北之角為六度一十六分五十秒當黃道南之角為四度五十五分三十二秒次輪心在兩交之中當黃道南北之角皆五度四十分夫五星之次輪面斜交本道其交角宜相等而輪心南北之角為交錯之角其度尤宜相等惟水星獨不等或因水星近日逼於陽光低昻不定亦未可知然其體甚微且不數見於其應見時謹候之隨見即𨼆無從測驗以得其確準也土木火三星交周如甲為地心乙丙丁戊為黃道乙巳丁庚為星本道丙巳戊庚為過二極經圈星本道之乙巳丁半周在黃道北丁庚乙半周在黃道南乙為正交丁為中交己丙與戊庚為大距當乙丁二交角土星為二度三十一分木星為一度一十九分四十秒火星為一度五十分乙丁為交線己庚為大距線辛壬癸子為次輪其面與本道斜交本道上有本輪均輪而次輪心在均輪周然本輪均輪皆與本道成一平面自地心作視線與本道參直故止將次輪畫於本道以便觀覽而與黃道平行辛壬癸半周在本道南低於本道之下癸子辛半周在本道北昻於本道之上其辛癸徑線恆當本道之平面而與乙丁交線平行今名之曰樞線樞線之辛癸兩端自地心甲視之恆當本道故與本道成兩交點今名之曰次交點辛為次輪正交癸為次輪中交其壬子徑線恆與本道面斜交壬子線本在兩交之中因與本道斜交非平行面故作旁視之形以顯交角若與本道面平行作丑寅線則壬己丑及寅巳子諸角即次輪面與本道面斜交之角與二道之交角等其壬子二點距本道最大故壬子線今名之曰次輪大距線次輪心在本道乙丁兩交點則無本道距黃道之緯度次輪心在己或在庚則本道距黃道之緯度極大星在次輪辛癸兩交點則無星距本道之緯度星在壬或在子則星距本道之緯度極大然星距次輪兩交之度實由次輪心距木道兩交之度而知蓋土木火三星行次輪周皆自合伏起算即次輪最逺而合伏距次輪正交之度即與次輪心距本道正交之度等試自地心過次輪心作卯辰逺近線卯為合伏時星當本道視線點辰為退衝時星當本道視線點次輪心行至本道正交乙則合伏所當本道視線卯點與次輪正交辛點合次輪心行至本道中交丁則合伏所當本道視線卯點與次輪中交癸點合次輪心行至本道大距己距正交乙九十度則合伏所當本道視線卯點距次輪正交辛點亦九十度次輪心行至本道大距庚距中交丁九十度則合伏所當本道視線卯點距次輪中交癸點亦九十度若次輪心距本道正交乙行四十五度至己則合伏所當本道視線卯點距次輪正交辛點亦四十五度是知次輪心距本道正交之度即合伏距次輪正交之度以星距合伏之度與次輪心距本道正交之度相加即得星距次輪正交之度故本道之乙丁兩交點為緯度起算之端也金水二星交周如甲為地心乙丙丁戊為星本道即黃道丙戊為過黃極經圈本道與黃道既為一體故無二道之交亦無相距之緯辛壬癸子為次輪與黃道斜交辛壬癸半周在黃道北昻於黃道之上癸子辛半周在黃道南低於黃道之下其辛癸徑線恆當黃道之平面任次輪心在黃道之何處其辛癸徑線皆相為平行今亦名之曰樞線樞線之辛癸兩端自地心甲視之恆當黃道故與黃道成兩交點今亦名之曰次交點辛為次輪正交癸為次輪中交因辛點為自黃道南過黃道北之點故名正交癸點為自黃道北過黃道南之點故名中交與土木火三星之本道兩交點相應與次交點相反其壬子徑線恆與黃道面斜交壬子線本在兩交之中因與黃道斜交非平行面故作旁視之形以顯交角若與黃道面平行作丑寅線則丑丙壬及寅丙子諸角即次輪面與黃道面斜交之角其壬子二點距黃道最大故壬子線今亦名之曰次輪大距線星在次輪辛癸兩交點則無星距黃道之緯度星在壬或在子則星距黃道之緯度極大然金水二星行次輪周自平逺起算而求次均與緯度皆自最逺起算其距次交點之度無由而知故與樞線平行作乙丁徑線亦名曰交線又自地心過次輪心作卯辰逺近線卯為最逺時星當本道視線點辰為最近時星當本道視線點次輪心行至交線乙則最逺所當本道視線卯點與次輪正交辛點合次輪心行至交線丁則最逺所當本道視線卯點與次輪中交癸點合次輪心距交線乙行九十度至丙則最逺所當本道視線卯點距次輪正交辛點亦九十度次輪心距交線丁行九十度至戊則最逺所當本道視線卯點距次輪中交癸點亦九十度若次輪心距交線乙行四十五度至己則最逺所當本道視線卯點距次輪正交辛點亦四十五度故乙點亦命為正交下點亦命為中交丙戊二點亦命為大距所以紀次輪最逺距次交點之度而為緯度起算之端其實無本道之交周點也土木火三星緯度土木火三星緯度之原有四一由本道與黃道斜交本輪心循本道右旋均輪次輪亦隨之而右旋次輪心雖不在本道然當本道之平面自地心計之與在本道等若次輪心適當二道之交則無緯度距交漸逺則緯度漸大今名之曰初緯乃初經度所當本道距黃道之緯度即次輪心距黃道之緯度也一由星循次輪周行其經度既因次均數之加減而不同於初經則緯度亦不同於初緯今名之曰實緯乃實經度所當本道距黃道之緯度也一由次輪面與本道斜交而與黃道平行半周在本道南半周在本道北又生緯度今名之曰次緯乃星距本道之緯度也一由緯度之角生於地心而次緯之角却生於次輪心必求得次緯當地心之角與實緯相加減方為星距黃道之緯度實緯在黃道北而次緯又在本道北或實緯在黃道南而次緯又在本道南則相加若實緯在黃道北而次緯却在本道南實緯在黃道南而次緯却在本道北則相減今名之曰視緯乃自地心作視線所得之真緯度也然如此立法則甚繁且實緯與黃道成直角而次緯却與本道成直角亦難於加減入算况次輪面與黃道平行星距地心之逺近雖不等而距黃道之逺近必與次輪心距黃道之逺近等夫既有次輪心距黃道之弧即可得星距黃道之邊再有星距地心之邊即可得視緯之角又不必以實緯與次緯相加減而得之也故今立法惟以次輪心距本道正交之度初經度內減正交度即得求得初緯即以次輪心距地心線與初緯之正弦為比例而得星距黃道線又以星距合伏之度即次輪最逺用三角形法求得星當黃道視線㸃距地心之逺與星距黃道線為比例而得視緯度要之初緯度小星在合伏前後則距地心逺而視緯度愈小初緯度大星又在退衝前後則距地心近而視緯度愈大也新法厯書載西人第谷測得次輪心在兩交之中星又在次輪最近其視緯極大兩交之中為二道之大距次輪心在此其初緯極大星又在次輪最近其距地心之線極短故視緯尤大土星北緯為二度四十八分南緯為二度四十九分木星北緯為一度三十八分南緯為一度四十分火星北緯為四度三十一分南緯為六度四十七分本輪有髙卑則次輪心距地有逺近逺則緯小近則緯大因次輪心在本道之北半周當最髙南半周當最卑故南緯大於北緯也如圖甲為地心乙丙丁戊為黃道乙巳丁庚為星本道丙巳戊庚為過二極經圈星本道之乙巳丁半周在黃道北丁庚乙半周在黃道南乙為正交丁為中交辛壬癸子為次輪次輪心所當宫度為初經度如次輪心行至正交乙或中交丁則無初緯度次輪心距本道正交乙行九十度至己或距本道中交丁行九十度至庚則己丙或庚戊為初緯度即大距度若次輪心距本道正交乙行四十五度至己則己年為初緯度當己甲午角其法以乙巳九十度之正弦與己丙大距度正弦之比即同於乙巳距交四十五度之正弦與巳午距緯度正弦之比也此即正弧三角形有黃赤交角有黃道求距緯之法蓋乙角即如黃赤交角乙巳即如黃道乙午即如赤道己午即如距緯也又如次輪心距本道正交乙行九十度至己星行至次輪中交癸當本道之未則未為實經度未申為實緯度當未甲申角其法亦以丁巳九十度之正弦與己丙大距度正弦之比即同於丁未距交度之正弦與未申距緯度正弦之比也與求初緯法同又如次輪心距本道正交乙行九十度至己星合伏時所當本道視線卯距次輪正交辛亦九十度其實經度仍當本道之己則己甲丙角為初緯度即己丙大距度亦即實緯度然次輪面與本道斜交自地心計之星雖與卯辰逺近線參直而星實在壬低於卯點之下壬巳卯角為次緯度壬酉線為星距本道視線之逺其當地心之角為己甲壬角與實緯己甲丙角相減餘壬甲丙角乃為視緯度也又如次輪心距本道正交乙行九十度至己星退衝時則當本道視線辰其實經度仍當本道之己則己甲丙角為初緯度即己丙大距度亦即實緯度然次輪面與本道斜交自地心計之星雖與卯辰逺近線參直而星實在子昻於辰點之上子己辰角為次緯度子戌線為星距本道視線之逺其當地心之角為子甲巳角與實緯己甲丙角相加得子甲丙角乃為視緯度也今立求視緯法先求初緯即求視緯而不用求實緯及次緯焉蓋次輪面與黃道平行星距黃道視線之逺近必與次輪心距黃道之逺近等如次輪心行至本道正交乙或中交丁其壬子次輪大距線正當黃道自地心視之則辛壬癸子次輪面與壬子次輪大距線合任星在次輪周之何處無初緯亦無視緯如次輪心行至本道大距己或本道大距庚其壬子次輪大距線與丙戊黃道徑線平行而辛壬癸子次輪面亦與壬子大距線平行任星在次輪周之何處其距黃道視線之逺近皆與輪心距黃道之逺近等惟求得星當黃道視線點距地心之逺與星距黃道之逺近為比例即得視緯之角其法甚便也如次輪心距本道正交乙行九十度至己則己甲丙角為初緯即己丙大距度星在合伏壬求視緯則以本天半徑與初緯己丙弧正弦之比即同於己甲次輪心距地心與己亥之比求次輪心距地心見前求初均數篇而得己亥與壬乾等為星距黃道視線之逺又以本天半徑與初緯己丙弧餘弦之比即同於己甲次輪心距地心與亥甲之比而得亥甲其乾亥一段即與壬巳次輪半徑等以乾亥與亥甲相加得乾甲為星當黃道視線點距地心之逺乃以乾甲與壬乾之比即同於半徑全數與壬甲乾角正切之比而得壬甲乾角為星在合伏壬之視緯度也如星在退衝子則星距黃道視線之逺為子坎仍與己亥等而亥坎亦與己子次輪半徑等以亥坎與亥甲相減餘坎甲為星當黃道視線點距地心之逺乃以坎甲與子坎之比即同於半徑全數與子甲坎角正切之比而得子甲坎角為星在退衝子之視緯度也如次輪心距本道正交乙行九十度至己則己甲丙角為初緯即己丙大距度星距合伏壬行六十度至艮其距黃道視線之逺為艮震與己亥等今所求之視緯即艮甲震角艮甲為星距地心之逺震甲為星當黃道視線點距地心之逺艮巽為艮壬弧六十度之正弦與震離等巽己為艮壬弧六十度之餘弦與離亥等而㢲離亦與己亥等故以半徑全數與六十度正弦之比即同於艮己次輪半徑與艮巽次輪六十度正弦之比而得艮巽又以半徑全數與六十度餘弦之比即同於艮己次輪半徑與巽己次輪六十度餘弦之比而得巽己又以半徑全數與初緯己丙弧餘弦之比即同於己甲次輪心距地心與亥甲之比而得亥甲其離亥一段原與巽己等以離亥與亥甲相加得離甲乃用震離甲勾股形求震甲離甲為股震離為勾求得震甲弦為星當黃道視線點距地心之逺於是以震甲與艮震之比即同於半徑全數與艮甲震角正切之比而得艮甲震角為星距合伏六十度艮之視緯度也如次輪心距本道正交乙行四十五度至己則先求得己甲午角為初緯即己午距緯度又與甲午黃道徑線平行作坤兌線即知合伏時星在坤低於卯辰逺近線之下退衝時星在兌昻於卯辰逺近線之上如星在合伏坤則以本天半徑與初緯己午弧正弦之比即同於己甲次輪心距地心與己亥之比而得己亥與坤乾等為星距黃道視線之逺又以本天半徑與初緯己午弧餘弦之比即同於己甲次輪心距地心與亥甲之比而得亥甲其乾亥一段即與坤己次輪半徑等以乾亥與亥甲相加得乾甲為星當黃道視線點距地心之逺乃以乾甲與坤乾之比即同於半徑全數與坤甲乾角正切之比而得坤甲乾角為星在合伏坤之視緯度也如星在退衝兌則星距黃道視線之逺為兌坎仍與己亥等而亥坎亦與巳兌次輪半徑等以亥坎與亥甲相減餘坎甲為星當黃道視線點距地心之逺乃以坎甲與兌坎之比即同於半徑全數與兌甲坎角正切之比而得兌甲坎角為星在退衝兌之視緯度也如次輪心距本道正交乙行四十五度至己則己甲午角為初緯星過退衝兌行七十度至艮其距黃道視線之逺為艮震與己亥等今所求之視緯即艮甲震角艮甲為星距地心之逺震甲為星當黃道視線點距地心之逺艮巽為艮兌弧七十度之正弦與震離等巽己為艮兌弧七十度之餘弦與離亥等而巽離亦與己亥等故以半徑全數與七十度正弦之比即同於艮己次輪半徑與艮巽次輪七十度正弦之比而得艮巽又以半徑全數與七十度餘弦之比即同於艮己次輪半徑與巽己次輪七十度餘弦之比而得巽己又以半徑全數與初緯己午弧餘弦之比即同於己甲次輪心距地心與亥甲之比而得亥甲其離亥一段原與巽己等以離亥與亥甲相減餘離甲乃用震離甲勾股形求震甲離甲為股震離為勾求得震甲弦為星當黃道視線點距地心之逺於是以震甲與艮震之比即同於半徑全數與艮甲震角正切之比而得艮甲震角為星過退衝七十度艮之視緯度也又求合伏退衝視緯捷法不用求星距黃道視線及星當黃道視線點距地心之逺即以初緯度與次輪心距地心及次輪半徑為三角形算之如次輪心在本道大距己星在合伏壬求視緯則用壬巳甲三角形此形有己甲次輪心距地心有壬巳次輪半徑有己角為初緯壬巳卯角之外角壬巳卯角與己甲丙角等求得甲壬己角與壬甲丙角等即星在合伏壬之視緯度也如星在退衝子求視緯則用子巳甲三角形此形有己甲次輪心距地心有己子次輪半徑有己角為初緯角子巳甲角與己甲丙角等求得己子甲角與半周相減餘甲子丑角與子甲丙角等即星在退衝子之視緯度也金水二星緯度金水二星緯度生於次輪本無初緯實緯蓋因其本道即黃道本輪心循黃道右旋均輪次輪亦隨之而右旋次輪心雖不在黃道然當黃道之平面自地心計之與在黃道等故無初緯星循次輪周行其實行所當本道經度亦即黃道度故無實緯也其次輪與黃道斜交半周在南半周在北乃生緯度今亦名之曰次緯次緯當地心之角即星距黃道之緯度今亦名之曰視緯今立法先以星距次輪正交之度以星距次輪最逺度與次輪心距黃道正交度相加即得求得次緯即以次輪半徑與次緯之正弦為比例而得星距黃道線又以星距次輪最逺之度用三角形法求得星當黃道視線點距地心之逺與星距黃道線為比例而得視緯度要之次緯度小星在最逺前後則距地心逺而視緯度愈小次緯度大星又在最近前後則距地心近而視緯度愈大也新法厯書載西人第谷測得次輪心在兩交之中星在次輪最近其緯度極大次輪心在兩交之中則最近即次輪之大距故緯度極大金星為九度零二分水星為三度三十三分金水二星本道之交點皆近最髙則兩交之中皆近中距故次輪心距地心之逺近皆等而南北之緯度亦等如圖甲為地心乙丙丁戊為星本道即黃道丙戊為過黃極經圈辛壬癸子為次輪次輪心所當宫度為初經度即黃道度故無初緯度也如次輪心距本道正交乙行九十度至丙星行至次輪正交辛當本道之己則己為實經度亦即黃道度故亦無實緯度也又如次輪心距本道正交乙行九十度至丙星在次輪最逺時所當本道視線卯距次輪正交辛亦九十度然次輪面與本道斜交自地心計之星雖與卯辰逺近線參直而星實在壬昻於卯點之上壬丙卯角為次緯度壬午線為星距黃道視線之逺其當地心之角為壬甲午角即視緯度也又如次輪心距本道正交乙行九十度至丙星在次輪最近時則當本道視線辰然次輪面與本道斜交自地心計之星雖與卯辰逺近線參直而星實在子低於辰點之下子丙辰角為次緯度子未線為星距黃道視線之逺其當地心之角為子甲未角即視緯度也今立求視緯法先求次緯如次輪心距本道正交乙行九十度至丙星在次輪最逺壬則次輪面與本道斜交之壬丙卯角即次緯以半徑全數與壬丙卯角正弦之比即同於壬丙次輪半徑與壬午之比而得壬午為星距黃道視線之逺又以半徑全數與壬丙卯角餘弦之比即同於壬丙次輪半徑與午丙之比而得午丙與丙甲次輪心距地心相加得午甲為星當黃道視線點距地心之逺乃以午甲與壬午之比即同於半徑全數與壬甲午角正切之比而得壬甲午角即星在次輪最逺壬之視緯度也如星在次輪最近子則次輪面與本道斜交之子丙辰角為次緯以半徑全數與子丙辰角正弦之比即同於子丙次輪半徑與子未之比而得子未為星距黃道視線之逺又以半徑全數與子丙辰角餘弦之比即同於子丙次輪半徑與未丙之比而得未丙與丙甲次輪心距地心相減餘未甲為星當黃道視線點距地心之逺仍以未甲與子未之比即同於半徑全數與子甲未角正切之比而得子甲未角為星在次輪最近子之視緯度也如次輪心距本道正交乙行九十度至丙星距次輪最逺壬行三十度至申則以星距最逺壬申弧三十度與最逺距次輪正交辛壬弧九十度相加辛壬弧與乙丙弧等得辛申弧一百二十度為星距次輪正交度與半周相減餘申癸弧六十度為星距次輪中交度先求次緯以半徑全數與次輪面斜交本道之壬丙卯角正弦之比即同於距交申癸弧之正弦與次緯申丙酉角正弦之比而得申丙酉角為次緯度復以半徑全數與次緯申丙酉角正弦之比即同於申丙次輪半徑與申酉之比而得申酉為星距黃道視線之逺今所求之視緯即申甲酉角申甲為星距地心之逺酉甲為星當黃道視線點距地心之逺申戌為壬申弧三十度之正弦與酉亥等戌丙為壬申弧三十度之餘弦而戌亥亦與申酉等故以半徑全數與三十度正弦之比即同於申丙次輪半徑與申戌次輪三十度正弦之比而得申戌又以半徑全數與三十度餘弦之比即同於申丙次輪半徑與戌丙次輪三十度餘弦之比而得戌丙又以半徑全數與次輪逺近線斜交本道逺近線之壬丙卯角餘弦之比因次輪最逺距次交點九十度故次輪面與本道斜交之壬丙卯角亦即為次輪逺近線斜交本道逺近線之角過此則先求次輪逺近線斜交本道逺近線之角詳見後即同於戌丙與亥丙之比而得亥丙與丙甲次輪心距地心相加得亥甲乃用酉亥甲勾股形求酉甲亥甲為股酉亥為勾求得酉甲弦為星當黃道視線點距地心之逺於是以酉甲與申酉之比即同於半徑全數與申甲酉角正切之比而得申甲酉角為星距次輪最逺三十度申之視緯度也如次輪心距本道正交乙行一百五十度至乾則次輪最逺所當本道視線卯點距次輪正交辛亦一百五十度而距次輪中交癸即三十度然次輪面與本道斜交最逺時星在坎昻於卯辰逺近線之上最近時星在艮低於卯辰逺近線之下如星在最逺坎則先以半徑全數與次輪面斜交本道之壬乾丑角正弦之比即同於最逺距交坎癸弧之正弦與最逺距黃道視線之正弦之比而得坎乾卯角為次輪逺近線與本道逺近線斜交之角即次緯度以半徑全數與坎乾卯角正弦之比即同於坎乾次輪半徑與坎震之比而得坎震為星距黃道視線之逺又以半徑全數與坎乾卯角餘弦之比即同於坎乾次輪半徑與震乾之比而得震乾與乾甲次輪心距地心相加得震甲為星當黃道視線點距地心之逺乃以震甲與坎震之比即同於半徑全數與坎甲震角正切之比而得坎甲震角即星在次輪最逺坎之視緯度也如星在次輪最近艮則次輪逺近線與本道逺近線斜交之艮乾辰角即次緯度以半徑全數與艮乾辰角正弦之比即同於艮乾次輪半徑與艮巽之比而得艮巽為星距黃道視線之逺又以半徑全數與艮乾辰角餘弦之比即同於艮乾次輪半徑與巽乾之比而得巽乾與乾甲次輪心距地心相減餘巽甲為星當黃道視線點距地心之逺乃以巽甲與艮巽之比即同於半徑全數與艮甲巽角正切之比而得艮甲巽角為星在次輪最近艮之視緯度也如次輪心距本道正交乙行一百五十度至乾星距次輪最逺坎行一百五十五度過最近艮一十五度至離則以星距最逺坎艮離弧一百九十五度與最逺距次輪正交辛壬坎弧一百五十度相加辛壬坎弧與乙丙乾弧等得三百四十五度為星距次輪正交度而距次輪正交前即一十五度先求次緯以半徑全數與次輪面斜交本道之子乾寅角正弦之比即同於距交離辛弧之正弦與次緯離乾坤角正弦之比而得離乾坤角為次緯度復以半徑全數與次緯離乾坤角正弦之比即同於離乾次輪半徑與離坤之比而得離坤為星距黃道視線之逺今所求之視緯即離甲坤角離甲為星距地心之逺坤甲為星當黃道視線㸃距地心之逺離兌為艮離弧一十五度之正弦略與坤亥等兌乾為艮離弧一十五度之餘弦而離坤亦略與兌亥等故以半徑全數與一十五度正弦之比即同於離乾次輪半徑與離兌次輪一十五度正弦之比而得離兌又以半徑全數與一十五度餘弦之比即同於離乾次輪半徑與兌乾次輪一十五度餘弦之比而得兌乾又以半徑全數與次輪逺近線斜交本道逺近線之艮乾辰角餘弦之比即同於兌乾與亥乾之比而得亥乾與乾甲次輪心距地心相減餘亥甲乃用坤亥甲勾股形求坤甲亥甲為股坤亥為勾求得坤甲弦為星當黃道視線㸃距地心之逺於是以坤甲與離坤之比即同於半徑全數與離甲坤角正切之比而得離甲坤角為距次輪最逺一百九十五度離之視緯度也又求最逺最近視緯捷法不用求星距黃道視線及星當黃道視線㸃距地心之逺即以次緯度與次輪心距地心及次輪半徑為三角形算之如次輪心距本道正交乙行九十度至丙星在次輪最逺壬求視緯則用壬丙甲三角形此形有丙甲次輪心距地心有壬丙次輪半徑有丙角為次緯壬丙卯角之外角求得丙甲壬角即星在次輪最逺壬之視緯度也如星在次輪最近子求視緯則用子丙甲三角形此形有丙甲次輪心距地心有丙子次輪半徑有丙角為次緯角求得子甲丙角即星在次輪最近子之視緯度也五星伏見五星近太陽則伏逺太陽則見而伏見遲速之故有三一由星體之大小一由黃道之斜正一由緯度之南北如星體大黃道正升正降緯度在北則速見遲伏星體小黃道斜升斜降緯度在南則遲見速伏要皆視太陽在地平下之度為準新法厯書載西人多録某測得金星當地平太陽在地平下五度即可見木星水星當地平太陽在地平下一十度方可見土星當地平太陽在地平下一十一度方可見火星當地平太陽在地平下一十一度三十分方可見蓋五星之體金星最大木水二星次之土星又次之火星最小星體大則太陽在地平下之度少即可見星體小則太陽在地平下之度多方可見夫太陽在地平下之度既不等則五星距太陽之度亦不等而伏見之遲速因之不等以此定為伏見之限加以黃道經緯度推之則五星在黃道之何宫度距太陽若干度則見若干度則伏皆可得而知矣如圖甲乙丙丁為過黃極經圈甲為天頂乙丁為地平戊為黃極己庚辛為黃道庚為星當地平又正當黃道無緯度壬為太陽癸壬為太陽距地平之度即伏見之限如庚為金星則癸壬為五度庚為木星水星則癸壬為一十度庚為土星則癸壬為一十一度庚為火星則癸壬為一十一度三十分既知癸壬伏見限度則用庚癸壬正弧三角形此形有癸壬弧有癸直角有庚角為黃道交地平之角知庚㸃為黃道之某宫某度即可求黃道與地平相交之角法詳交食厯理求黃平象限篇求得庚壬弧即星在黃道上距太陽伏見之限星距太陽之黃道度大於庚壬弧則見小於庚壬弧則伏癸壬弧五星既各不等則庚壬弧亦不等此因星體之大小而為伏見之遲速者也又癸壬伏見限五星各有定數而庚角則時時不同設黃道斜升斜降如子丑則庚角小庚角小則庚壬弧轉大設黃道正升正降如寅卯則庚角大庚角大則庚壬弧轉小此因黃道之斜正而為伏見之遲速者也又設星在黃道北如辰其距緯為辰庚其經度仍在庚正當地平而星己在地平之上則庚壬弧不足以定伏見之限試作辰己距等圈交地平於己從黃極戊過己作經圈截黃道於午則午壬弧為星距太陽伏見之限乃用庚巳午正弧三角形此形有午直角有庚角為黃道交地平之角有己午距緯與辰庚等求得庚午弧與庚壬弧相減餘午壬弧為伏見之限蓋星在辰其距太陽之黃道度大於午壬弧則見小於午壬弧則伏也設星在黃道南如未其距緯為庚未其經度仍在庚正當地平而星尚在地平之下則庚壬弧亦不足以定伏見之限試作未申距等圈交地平於申從黃極戊至申作經圈截黃道於酉則酉壬弧為星距太陽伏見之限乃用庚申酉正弧三角形此形有酉直角有庚角為黃道交地平之角有酉申距緯與庚未等求得酉庚弧與庚壬弧相加得酉壬弧為伏見之限蓋星在未其距太陽之黃道度大於酉壬弧則見小於酉壬弧則伏也此因緯度之南北而為伏見之遲速者也五星視差五星視差生於地半徑其測算之法並與太陽太隂同土木二星距地極逺地半徑與本天半徑之比例土星為一與一萬零九百五十三木星為一與五千九百一十八其最大之視差俱不滿一分可以不計火星在最髙之比例為一與三千一百二十三其最大之視差為一分六秒在中距之比例為一與一千七百四十四其最大之視差為一分五十八秒在最卑之比例為一與四百一十其最大之視差為八分二十三秒金星在最髙之比例為一與一千九百八十三其最大之視差為一分四十四秒在中距與太陽同在最卑之比例為一與三百零一其最大之視差為一十一分二十五秒水星在最髙之此例為一與一千六百三十三其最大之視差為二分零六秒在中距與太陽同在最卑之北例為一與六百五十一其最大之視差為五分一十七秒蓋五星距地之逺近不等故視差之大小亦不等今亦約為最髙中距最卑三限用火金水三星距地心與地半徑之比例數逐度各求地半徑差以立表御製歷象考成上編卷十五
