body:
  text: 欽定四庫全書御製厯象考成下編卷二月離厯法推月離用數推月離法用表推月離法推合朔弦望法推交宫時刻法推正升斜升橫升法推太陰出入時刻法推月離用數康熙二十三年甲子天正冬至為厯元周天三百六十度入算化作一百二十九萬六千秒周日一萬分周嵗三百六十五日二四二一八七五紀法六十太陰每日平行四萬七千四百三十五秒小餘二一一七七太陰每日平行一十三度一十分三十五秒零一微一十六纎一十四忽一十三芒以秒法通之即得太陰一小時平行一千九百七十六秒小餘四五九二一五七置每日太陰平行以二十四除之即得月孛每日平行四百零一秒小餘七七四七七月孛每日平行六分四十一秒零四微三十八纎五十四忽五十七芒以秒法通之即得正交每日平行一百九十秒小餘六四正交每日平行三分一十秒三十八微二十四纎以秒法通之即得太陰本天半徑一千萬太陰本輪半徑五十八萬太陰均輪半徑二十九萬太陰負圈半徑七十九萬七千次輪半徑二十一萬七千次均輪半徑一十一萬七千五百朔望黃白大距四度五十八分三十秒兩弦黃白大距五度一十七分三十秒黃白大距中數五度零八分以朔望大距與兩弦大距相加折半即得黃白大距半較九分三十秒以朔望大距與兩弦大距相減折半即得氣應七日六五六三七四九二六太陰平行應一宫零八度四十分五十七秒一十六微太陰平行應者厯元甲子年天正冬至次日子正初刻太陰本輪心距冬至之平行經度也太陽自冬至起算躔丑宫初度故以冬至為應太陰亦自冬至起算而不必躔丑宫初度故以冬至次日子正初刻為應上考往古則減太陰平行下推將來則加太陰平行皆以此為根也月孛應三宫零四度四十九分五十四秒零九微月孛應者厯元甲子年天正冬至次日子正初刻最髙過冬至之度分也太陽自最卑起算故以最卑為應太陰自最髙起算故以月孛為應上考往古則減月孛平行下推將來則加月孛平行皆以此為根也正交應六宫二十七度一十三分三十七秒四十八微正交應者厯元甲子年天正冬至次日子正初刻正交過冬至之度分也蓋黃道與白道斜交自黃道南過黃道北之㸃為正交自黃道北過黃道南之㸃為中交每日退行三分有餘故有當時正交之應上考往古則加正交平行下推將來則減正交平行皆以此為根也按康熙六十年辛丑十一月十五日壬寅夜子初三刻一十三分零五秒五十六微平望距本年天正冬至次日丙戌子正初刻為三百七十六日九九八六八一其十時太陰平行過冬至六宫一十一度五十七分五三秒五十微月孛過冬至六宫二十二度二十六分零五十一微正交過冬至六宫一十一度三十七分一十七秒四十九微自辛丑年上溯至甲子年共三十八年減一年餘三十七年為積年與周嵗三百六十五日二四二一八七五相乘得一萬三千五百二十一日六一七三一二四二六為中積分加厯元甲子年氣應分六五六三七四九二六減辛丑年天正冬至分六一七三一二四二六得一萬三千五百一十四日為積日又加辛丑年十一月平望距本年天正冬至次日子正初刻三百七十六日九九八六八一得一萬三千八百九十日九九八六八一為平望距厯元日分乃以平望距厯元日分與太陰每日平行四萬七千四百三十五秒二一一七七相乘滿周天去之餘五宫三度一十六分五十六秒三十四微與辛丑年十一月平望太陰過冬至六宫一十一度五十七分五十三秒五十微相減餘一宫零八度四十分五十七秒一十六微即甲子年太陰平行應也又以平望距厯元日分與月孛每日平行四百零一秒七七四七七相乘滿周天去之餘三宫一十七度三十六分零六秒四十二微與辛丑年十一月平望月孛過冬至六宫二十二度二十六分零五十一微相減餘三宫零四度四十九分五十四秒零九微即甲子年月孛應也又以平望距厯元日分與正交每日平行一百九十秒六四相乘滿周天去之餘一十五度三十六分一十九秒五十九微與辛丑年十一月平望正交過冬至六宫一十一度三十七分一十七秒四十九微相加得六宫二十七度一十三分三十七秒四十八微即甲子年正交應也推月離法求積年自厯元康熙二十三年甲子距所求之年共若干年減一年得積年求中積分以積年與周嵗三百六十五日二四二一八七五相乘得中積分求通積分置中積分加氣應七日六五六三七四九二六得通積分上考往古則置中積分減氣應得通積分求天正冬至置通積分其日滿紀法六十去之餘為天正冬至日分上考往古則以所餘轉與紀法六十相減餘為天正冬至日分求積日置中積分加氣應分六五六三七四九二六不用日減本年天正冬至分亦不用日得積日上考往古則置中積分減氣應分加本年天正冬至分得積日積日者厯元甲子年天正冬至距所求本年天正冬至之日數也中積分加氣應分則得厯元甲子年天正冬至子正初刻至本年天正冬至之日分故減本年天正冬至分即得厯元甲子年天正冬至子正初刻至本年天正冬至子正初刻之日數也上考往古反是日躔自天正冬至起算故止用天正冬至不用積日月離自天正冬至次日子正初刻起算故必兼用積日其餘皆與日躔同求太陰年根以積日與太陰每日平行四萬七千四百三十五秒二一一七七相乘滿周天一百二十九萬六千秒去之餘為積日太陰平行加太陰平行應一宫零八度四十分五十七秒一十五微得太陰年根上考往古則置太陰平行應減積日太陰平行得太陰年根太陰年根者乃所求本年天正冬至次日子正初刻太陰距冬至之平行經度也以積日與太陰每日平行相乘則得厯元甲子年天正冬至距本年天正冬至之太陰平行故上考往古則減下推將來則加即得本年天正冬至次日子正初刻太陰過冬至之平行經度也下倣此求月孛年根以積日與月孛每日平行四百零一秒七七四七七相乘滿周天一百二十九萬六千秒去之餘為積日月孛平行加月孛應三宫零四度四十九分五十四秒零七微得月孛年根上考往古則置月孛應減積日月孛平行得月孛年根求正交年根以積日與正交每日平行一百九十秒六四相乘滿周天一百二十九萬六千秒去之餘為積日正交平行與正交應六宫二十七度一十三分三十七秒四十八微相減正交應不足減者加十二宫減之得正交年根上考往古則置正交應加積日正交平行得正交年根太陰本輪與月孛皆順行帷正交逆行故上考反加下推反減求太陰日數以所設日數與太陰每日平行四萬七千四百三十五秒二一一七七相乘得數為秒以宫度分收之得太陰日數求月孛日數以所設日數與月孛每日平行四百零一秒七七四七七相乘得數為秒以宫度分收之得月孛日數求正交日數以所設日數與正交每日平行一百九十秒六四相乘得數為秒以度分收之得正交日數求太陰平行以太陰年根與太陰日數相加滿十二宫去之得太陰平行求月孛平行以月孛年根與月孛日數相加滿十二宫去之得月孛平行求正交平行置正交年根減正交日數不足減者加十二宫減之得正交平行正交逆行故於年根內減日數餘皆與日躔同求均數時差以本日太陽均數變時得均數時差一度變為四分十五分變為一分十五秒變為一秒均數為加者則為減均數為減者則為加求升度時差以本日太陽黃道經度與本日太陽赤道經度相減餘數變時得升度時差二分後為加二至後為減求時差總均數時差與升度時差同為加者則相加為時差總仍為加同為減者亦相加為時差總仍為減一為加一為減者則相減為時差總加數大為加減數大為減求時差行以三千六百秒為一率一小時太陰平行一千九百七十六秒四五九二一五七為二率時差總化秒為三率求得四率為秒以分收之得時差行時差總為加者則為減時差總為減者則為加求用時太陰平行置太陰平行加減時差行得用時太陰平行太陰平行獨求用時者因太陰行度甚疾必加減時差行方為子正初刻之平行度其餘諸平行所差甚微可以不計也其加減與時差總相反者時差加而遲則用時子正差而早故減時差減而早則用時子正差而遲故加求引數置用時太陰平行減月孛平行得引數引數者乃所求本日子正初刻均輪心過本輪最髙之行度也太陽自最卑起算故置平行減最卑行太陰自最髙起算故置平行減月孛行也求初均數均輪心自本輪最髙左旋自東而西行引數度太陰自均輪最近㸃右旋自西而東行倍引數度用兩三角形法求得地心之角為初均數法詳月離厯理求初均數篇引數初宫至五宫為減六宫至十一宫為加隨求太陰距地心之邊為求二均之用初均數者平行與初實行之差也太陰有二三均數故以初别之加減與日躔相反者自最髙起算故也求初實行置用時太陰平行加減初均數得初實行太陰有二三均數雖加減初均數不能即得實行故亦以初别之求月距日次引置初實行減本日太陽實行得月距日次引月距日者太陰距太陽之度也初實行自冬至起算月距日自太陽起算故置初實行減太陽實行得月距日名曰次引者以其為次輪周之行度也求二均數均輪心自負圈最髙左旋行引數度次輪心自均輪最近㸃右旋行倍引數度次均輪心自次輪最近㸃右旋次輪徑與均輪徑平行其近本輪心之一㸃為最近㸃行月距日之倍度用三角形法以次輪最近㸃距地心線為一邊即求初均數時所得太陰距地心之邊次輪月距日倍度之通弦為一邊半徑一千萬為一率月距日正弦為二率次輪半徑二十一萬七千為三率求得四率倍之即通弦以初均數與均輪心距最卑之度相加引數與半周相減即均輪心距最卑之度又加減月距日距象限度為所夾之角月距日與象限相減為月距日距象限度如月距日過二象限則減去二象限餘數又與象限相減為月距日距象限度其加減之法初均數為減者月距日過一象限或過三象限則加不過象限或過二象限則減初均數為加者月距日過一象限或過三象限則減不過象限或過二象限則加若初均數與均輪心距最卑相加之度不足減月距日距象限度則轉減餘為所夾之角若相減無餘則無角即無二均數若相加過半周則與全周相減餘為所夾之角若相加適足半周則無角亦無二均數若月距日為初度或一百八十度則無月距日倍度之通弦亦無二均數求得地心對通弦之角為二均數如無初均數者則以次輪心距地心線為一邊次輪半徑為一邊月距日倍度為所夾之角過半周者與全周相減用其餘在最髙為所夾之內角在最卑為所夾之外角求得地心對次輪半徑之角為二均數定加減之法以初均數與均輪心距最卑之度相加為次輪最近㸃距地心線與次輪徑所夾之角此角如不及九十度則倍之與半周相減餘為加減限初均數為減者月距日倍度在此限內則二均數反為加初均數為加者月距日倍度與全周相減餘數在此限內則二均數反為減此角如過九十度則與半周相減餘數倍之又與半周相減餘為加減限初均數為減者月距日倍度與全周相減餘數在此限內則二均數反為加初均數為加者月距日倍度在此限內則二均數反為減若不在限內或其角適足九十度則初均數為加者二均數亦為加初均數為減者二均數亦為減隨求次均輪心距地心之邊為求三均之用二均數者次輪所生也前以本輪均輪求初均數而太陰實在次均