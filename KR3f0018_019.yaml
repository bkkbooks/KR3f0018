大為減求時差行用月離周日平行表以時差總之時分秒各察其與平行相對之數而併之得時差行時差總為加者則為減時差總為減者則為加求用時太陰平行置太陰平行加減時差行得用時太陰平行求引數置用時太陰平行減月孛平行得引數求初均數用月離太陰初均數表以引數宫度分察其所對之度分秒得初均數并記加減號求初實行置用時太陰平行加減初均數得初實行求月距日次引置初實行減本日太陽實行得月距日次引求二三均數用月離太陰二三均數表以引數宫度及月距日次引宫度察其所對之度分秒得二三均數并記加減號太陰二三均數表乃合二均數與三均數加減所定故用表推算止求二三均數不必先求二均數與三均數也求白道實行置初實行加減二三均數得白道實行求黃白大距及交均用月離交均距限表以月距日次引宫度察其與距限相對之度分秒得黃白大距察其與交均相對之分秒得交均并記交均加減號求正交實行置正交平行加減交均得正交實行求中交實行置正交實行加減六宫不及六宫則加六宫過六宫則減六宫得中交實行求距交實行置白道實行減正交實行得距交實行求升度差用月離黃白升度差表以距交實行宫度察其所對之度分秒得升度差并記加減號求黃道實行置白道實行加減升度差得黃道實行求黃道緯度用月離黃白距度表以距交實行宫度按黃白大距相近者察其所對之度分秒得黃道緯度并記南北號求黃道宿度依日躔求宿度法求得本年黃道宿鈐察黃道實行足減本年黃道宿鈐內某宿度分則減之餘為黃道宿度求月孛宿度月孛平行足減本年黃道宿鈐內某宿度分則減之餘為月孛宿度求正交宿度正交實行足減本年黃道宿鈐內某宿度分則減之餘為正交宿度求中交宿度中交實行足減本年黃道宿鈐內某宿度分則減之餘為中交宿度推合朔弦望法太陰實行與太陽實行同宫同度為合朔限距三宫為上弦限距六宫為望限距九宫為下弦限詳月離厯理晦朔弦望篇皆以太陰未及限度為本日已過限度為次日如太陰未及太陽為合朔本日已過太陽為合朔次日太陰距太陽未及九十度為上弦本日已過九十度為上弦次日之類求時刻之法以本日太陽實行與次日太陽實行相減餘為太陽一日之實行以本日太陰實行與次日太陰實行相減餘為太陰一日之實行乃於太陰一日之實行內減太陽一日之實行餘為一率一千四百四十分為二率本日太陽實行加限度合朔同宫同度無可加上弦加三宫望加六宫下弦加九宫減本日太陽實行餘為三率求得四率為距子正之分數蓋以太陰距太陽一日之實行與一日之分數為比同於本日子正太陰距合朔弦望度分與距子正之分數為比也乃以六十分收為一小時十五分收為一刻得合朔弦望時刻如本日太陰實行與太陽實行適當合朔弦望限度而無相距度分則合朔弦望即為本日子正初刻推交宫時刻法太陰未過宫為交宫本日已過宫為交宫次日求時刻之法以本日太陰實行與次日太陰實行相減餘為一率一千四百四十分為二率本日太陰實行度不用宫與三十度相減餘為三率求得四率為距子正之分數蓋以太陰一日之實行與一日之分數為比同於本日子正太陰距某宫初度之度分與距子正之分數為比也乃以六十分收為一時十五分收為一刻得交宫時刻如本日太陰實行適當某宫初度而無餘分則交宫即為本日子正初刻推正升斜升橫升法合朔日太陰實行自子宫一十五度至酉宫一十五度為正升自酉宫一十五度至未宫初度自丑宫初度至子宫一十五度為斜升自未宫初度至寅宫一十五度為橫升自寅宫一十五度至丑宫初度亦為斜升月離厯理隱見遲疾篇言春分前後各三宫黃道斜升而正降秋分前後各三宫黃道正升而斜降乃以東方出地為升西方入地為降所以明太陰隱見之遲疾也此所謂升乃指西方地平方上之黃道升度所以定生明之方向也蓋太陰在戌宫初度當黃道之春分入地平時夏至在正午距地平七十三度餘西方地平上之黃道幾與地平經圈等故為正升春分前四十五度為子宫一十五度當黃道之立春春分後四十五度為酉宫一十五度當黃道之立夏立春入地平則立夏在正午立夏入地平則立秋在正午距地平皆六十六度餘西方地平上之黃道猶未斜倚故自子宫一十五度至酉宫一十五度皆為正升也立夏後四十五度為未宫初度當黃道之夏至立春前四十五度為丑宫初度當黃道之冬至夏至入地平則秋分在正午冬至入地平則春分在正午皆距地平五十度餘西方地平上之黃道即成斜倚故自酉宫一十五度至未宫初度自丑宫初度至子宫一十五度皆為斜升也太陰在辰宫初度當黃道之秋分入地平時冬至在正午距地平不過二十六度餘西方地平上之黃道斜倚已甚幾與地平緯圈等故為橫升秋分前九十度為未宫初度當黃道之夏至入地平時秋分在正午距地平五十度餘然夏至在赤道之極北入地平時緯度雖髙而經度橫亘故亦為橫升秋分後九十度為丑宫初度當黃道之冬至入地平時春分在正午距地平亦五十度餘然冬至在赤道之極南入地平時緯度既髙而經度復短不得為橫升故自未宫初度至寅宫一十五度為橫升自寅宫一十五度至丑宫初度復為斜升也正升時月體背正西而向正東斜升時月體背西北而向東南橫升時月體背正北而向正南皆以黃道方向為定太陰雖行白道然相距不過五度且黃白道之交無定在其緯度常與經度不合故以黃道定之則終古不易也推太陰出入時刻法用正弧三角形法以本日太陽黃道經度求其相當赤道經度又用斜弧三角形法以本日太陰距黃極度為一邊太陰在黃道北則以黃道緯度與九十度相減在黃道南則以黃道緯度與九十度相加得太陰距黃極度黃極距赤極即北極二十三度二十九分三十秒為一邉本日太陰距冬至黃道經度為所夾之外角過半周者與全周相減用其餘求得對邊為太陰距赤極度過九十度者減九十度餘為赤道南緯度不及九十度者與九十度相減餘為赤道北緯度并求得近赤極之角為太陰距冬至赤道經度與恆星厯理推恆星赤道經緯度之法同乃以半徑一千萬為一率北極髙度之正切線為二率太陰赤道緯度之正切線為三率求得四率為卯酉前後赤道度之正弦檢表得太陰出入在卯酉前後赤道度太陰在赤道北出在卯正前入在酉正後太陰在赤道南出在卯正後入在酉正前赤道出地為卯正入地為酉正乃太陰所臨時刻之方位非太陽所臨之時刻也與日躔厯理晝夜永短法同爰於太陰赤道經度內減太陽赤道經度不足減者加十二宫減之餘為太陰距太陽赤道度又加減太陰出地在卯正前後赤道度前減後加得數變時一度變為四分自卯正後計之得何時刻再加本時太陰行度所變之時刻約一小時行三十分變為時之二分即太陰出地時太陽所臨之時刻又以太陰距太陽赤道度加減太陰入地在酉正前後赤道度前減後加得數變時自酉正後計之得何時刻再加本時太陰行度所變之時刻即太陰入地時太陽所臨之時刻蓋時刻以太陽為定故推得太陽所臨之時刻即太陰出入之時刻也御製歷象考成下編卷二
