body:
  text: 欽定四庫全書御製厯象考成下編卷三月食厯法推月食用數推月食法用表推月食法推各省月食法推月食帶食法定望推平望法推月食用數康熙二十三年甲子天正冬至為厯元周天三百六十度入算化作一百二十九萬六千秒周日一萬分周嵗三百六十五日二四二一八七五紀法六十朔策二十九日五三五九三朔策者平朔相距之日分也其數二十九日五十刻一十四分零三秒一十四微零六纖四十三忽一十二芒以周日一萬分通之得二十九日五千三百零五分小餘九三望策一十四日七六五二九六五望策者平望距平朔之日分也以朔策折半即得太陽平行朔策一十萬四千七百八十四秒小餘三四三二四以太陽每日平行與朔策日分相乘即得以度分秒微收之得二十九度零六分二十四秒一十八微太陽引數朔策一十萬四千七百七十九秒小餘三五八八六五太陽引數者太陽均輪心在本輪周之行度也以太陽每日平行與最卑每日平行相減餘為太陽引數每日之平行與朔策日分相乘即得以度分秒微收之得二十九度零六分一十九秒二十二微太隂引數朔策九萬二千九百四十秒小餘二四八五九太隂引數者太隂均輪心在本輪周之行度也以太隂每日平行與月孛每日平行相減餘為太隂引數每日之平行與朔策日分相乘滿周天去之即得以度分秒微收之得二十五度四十九分零一十五微太隂交周朔策一十一萬零四百一十四秒小餘一六五七四太隂交周者太隂距正交之行度也以太隂每日平行與正交每日平行相加得太隂交周每日之平行與朔策日分相乘滿周天去之即得以宫度分秒微收之得一宫零四十分一十四秒零一微太陽平行望策一十四度三十三分一十二秒零九微太陽引數望策一十四度三十三分零九秒四十一微太隂引數望策六宫一十二度五十四分三十秒零七微太隂交周望策六宫一十五度二十分零七秒各以每日平行與望策日分相乘以宫度分秒微收之即得一小時太陽平行一百四十七秒小餘八四七一四九一小時太陽引數一百四十七秒小餘八四一二七一小時太隂引數一千九百五十九秒小餘七四七六五四二一小時太隂交周一千九百八十四秒小餘四二五四九各置每日平行以二十四除之即得一小時月距日平行一千八百二十八秒小餘六一二一一八月距日者太隂距太陽之行度也以太陽每日平行與太隂每日平行相減餘為月距日每日之平行以二十四除之即得太陽本天半徑一千萬太陽本輪半徑二十六萬八千八百一十二太陽均輪半徑九千六百零四太隂本天半徑一千萬太隂本輪半徑五十八萬太隂均輪半徑二十九萬太隂次均輪半徑一十一萬七千五百太陽光分半徑六百三十七太陽光分半徑為地半徑之六倍又百分之三十七今推月食命地半徑為一百分故太陽光分半徑即為六百三十七也太隂實半徑二十七太隂實半徑為地半徑百分之二十七今推月食命地半徑為一百分故太隂實半徑即為二十七也太陽最髙距地一千零一十七萬九千二百零八與地半徑之比例為一十一萬六千二百太陽最髙距地與地半徑之比例為一千一百六十二今推月食命地半徑為一百分故與地半徑之比例即為一十一萬六千二百也太隂最髙距地一千零一十七萬二千五百與地半徑之比例為五千八百一十六太隂最髙距地與地半徑之比例為五十八又百分之一十六今推月食命地半徑為一百分故與地半徑之比例即為五千八百一十六也黃赤大距二十三度二十九分三十秒黃白大距四度五十八分三十秒氣應七日六五六三七四九二六紀日八朔應二十六日三八五二六六六朔應者厯元甲子年首朔距天正冬至次日子正初刻之日分也諸曜皆自天正冬至起算故以天正冬至為應交食則自合朔起算故以首朔為應上考往古則於積日內加朔應日分下推將來則於積日內減朔應日分皆以此為根也按康熙六十年辛丑十一月十五日壬寅夜子初三刻一十三分零五秒五十六微平望距本年天正冬至次日子正初刻為三百七十六日九千九百八十六分小餘八一減一望策一十四日七六五二九六五又減十二月朔策三百五十四日三六七一一六餘七日八六六二六七六為辛丑年天正冬至後第一平朔距天正冬至次日子正初刻之日分即辛丑年首朔之應又自辛丑年天正冬至次日子正初刻上溯至甲子年天正冬正次日子正初刻得積日一萬三千五百一十四加辛丑年首朔應七日八六六二六七六得一萬三千五百二十一日八六六二六七六為通朔即辛丑年首朔距甲子年天正冬至次日子正初刻之日分以朔策二十九日五三五九三除之得四百五十七朔餘二十六日三八五二六六六為甲子年首朔距天正冬至次日子正初刻之日分即甲子年朔應也首朔太陽平行應初宫二十六度二十分四十二秒五十七微首朔太陽平行應者厯元甲子年首朔太陽本輪心距冬至之平行經度也合朔日月同度故不用太隂首朔太陽引數應初宫一十九度一十分二十七秒二十一微首朔太陽引數應者厯元甲子年首朔太陽均輪心距本輪最卑之行度也引數起於最卑行而太陽平行實行之差則專生於引數故不用最卑應而用引數應也首朔太隂引數應九宫一十八度三十四分二十六秒一十六微首朔太隂引數應者厯元甲子年首朔太隂均輪心距本輪最髙之行度也引數起於月孛行而太隂平行實行之差則專生於引數故不用月孛應而用引數應也首朔太隂交周應六宫初度三十分五十五秒一十四微首朔太隂交周應者厯元甲子年首朔太隂距正交之行度也交周起於正交行而太隂入食限則專生於距交故不用正交應而用交周應也按康熙六十年辛丑十一月平望太陽平行初宫一十一度五十七分五十三秒五十微自厯元甲子年首朔至辛丑年十一月平望計四百六十九朔策一望策乃於辛丑年十一月平望太陽平行內減四百六十九朔策一望策之太陽平行三十七周天外又十一宫一十五度三十七分一十秒五十三微餘初宫二十六度二十分四十二秒五十七微即甲子年首朔太陽平行應也又辛丑年十一月平望太陽引數初宫零四度零八分五十六秒二十微減四百六十九朔策一望策之太陽引數三十七周天外又十一宫一十四度五十八分二十八秒五十九微餘初宫一十九度一十分二十七秒二十一微即甲子年首朔太陽引數應也又辛丑年十一月平望太隂引數十一宫一十九度三十一分五十二秒五十九微減四百六十九朔策一望策之太隂引數五百零三周天外又二宫零五十七分二十六秒四十三微餘九宫一十八度三十四分二十六秒一十六微即甲子年首朔太隂引數應也又辛丑年十一月平望太隂交周平行初宫初度二十分三十六秒零一微減四百六十九朔策一望策之交周平行五百零八周天外又五宫二十九度四十九分四十秒四十七微餘六宫初度三十分五十五秒一十四微即甲子年首朔太隂交周應也推月食法推首朔諸平行及入交推首朔諸平行及入交為月食入算之首蓋本年逐月太陽太隂之行度必以首朔為根有首朔之日分然後可以求平望之日分有首朔諸平行然後可以求平望諸平行至於入交乃當食之月數太隂每嵗兩次入交閏月之嵗或三次入交其不入交之月不必算也月食必在望不用首望而用首朔者以天正冬至或在十一月望前或在十一月望後不若首朔之定為年前十二月朔也求積年自厯元康熙二十三年甲子距所求之年共若干年減一年得積年求中積分以積年與周嵗三百六十五日二四二一八七五相乘得中積分求通積分置中積分加氣應七日六五六三七四九二六得通積分上考往古則置中積分減氣應得通積分求天正冬至置通積分其日滿紀法六十去之餘為天正冬至日分上考往古則以所餘轉與紀法六十相減餘為天正冬至日分求紀日以天正冬至日數加一日得紀日求積日置中積分加氣應分六五六三七四九二六不用日減本年天正冬至分亦不用日得積日上考往古則置中積分減氣應分加本年天正冬至分得積日求通朔置積日減朔應二十六日三八五二六六六得通朔上考往古則置積日加朔應得通朔通朔者乃所求本年天正冬至次日子正初刻距歷元甲子年首朔之日分也積日原為本年天正冬至距厯元甲子年天正冬至之日數故下推將來則於積日內減朔應上考往古則於積日內加朔應得通朔也求積朔及首朔置通朔以朔策二十九日五三五九三除之得數加一為積朔餘數與朔策相減為首朔上考往古則置通朔以朔策除之得數為積朔餘數為首朔積朔者厯元甲子年首朔距所求本年首朔之月數而首朔者本年天正冬至後第一朔距本年天正冬至次日子正初刻之日分也下推將來以朔策除通朔得數為厯元甲子年首朔距本年天正冬至前一朔之月數故加一月為積朔其餘數亦為本年天正冬至次日子正初刻距前一朔之日分故與朔策相減方為首朔日分若上考往古則以朔策除通朔得數即厯元甲子年首朔距本年首朔之月數故即為積朔其餘數亦即本年首朔距本年天正冬至次日子正初刻之日分故亦即為首朔也求首朔太陽平行以積朔與太陽平行朔䇿一十萬四千七百八十四秒三四三二四相乘滿周天一百二十九萬六千秒去之餘為積朔太陽平行加首朔太陽平行應初宫二十六度二十分四十二秒五十七微得首朔太陽平行上考往古則置首朔太陽平行應減積朔太陽平行得首朔太陽平行首朔太陽平行者乃所求本年首朔太陽本輪心距冬至之平行經度也以積朔與太陽平行朔策相乘則得厯元甲子年首朔距本年首朔之太陽平行度故下推將來則置太陽平行應加積朔之太陽平行上考往古則置太陽平行應減積朔之太陽平行而得本年首朔之太陽平行也求首朔太陽引數以積朔與太陽引數朔䇿一十萬四千七百七十九秒三五八八六五相乘滿周天一百二十九萬六千秒去之餘為積朔太陽引數加首數太陽引數應初宫一十九度一十分二十七秒二十一微得首朔太陽引數上考往古則置首朔太陽引數應減積朔太陽引數得首朔太陽引數首朔太陽引數者乃所求本年首朔太陽均輪心距本輪最卑之自行度也餘與太陽平行同求首朔太隂引數以積朔與太隂引數朔策九萬二千九百四十秒二四八五九相乘滿周天一百二十九萬六千秒去之餘為積朔太隂引數加首朔太隂引數應九宫一十八度三十四分二十六秒一十六微得首朔太隂引數上考往古則置首朔太隂引數應減積朔太隂引數得首朔太隂引數首朔太隂引數者乃所求本年首朔太隂均輪心距本輪最髙之自行度也餘與太陽平行同求首朔太隂交周以積朔與太隂交周朔䇿一十一萬零四百一十四秒一六五七四相乘滿周天一百二十九萬六千秒去之餘為積朔太隂交周加首朔太隂交周應六宫初度三十分五十五秒一十四微得首朔太隂交周上考往古則置首朔太隂交周應減積朔太隂交周得首朔太隂交周首朔太隂交周者乃所求本年首朔太隂本輪心距正交之度也餘與太陽平行同求逐月望太隂交周置本年首朔太隂交周加太隂交周望䇿六宫一十五度二十分零七秒再以太隂交周朔䇿一宫零四十分一十四秒零一微遞加十三次得逐月望太隂交周逐月望太隂交周者乃所求本年逐年平望太隂本輪心距正交之行度也以首朔太隂交周加太隂交周望䇿則得年前十二月平望之太隂交周故遞加太隂交周朔策則得本年逐月平望之太隂交周也遞加十三次者其年或有閏月則十二月為第十三月也求太隂入交月數逐月望太隂交周自初宫初度至初宫一十四度五十四分自五宫一十五度零六分至六宫一十四度五十四分自十一宫一十五度零六分至十一宫三十度皆為太隂入交第幾月入交即第幾月有食太隂距交前後可食之限一十四度五十四分故逐月望太隂交周在此限以內者為入交詳交食厯理太隂食限篇推平望諸平行第一推平望諸平行為月食第一段蓋既知本月入交矣必求本月平望之日分然後可以求實望必求平望諸平行然後可以求實行太陽平行者所以定太陽之經度而太隂之經度即在其對衝太陽太隂引數者所以定本輪周之自行度為求均數之用也其不求平望太隂交周者因求入交月數已得本月平望太隂交周若知入交月數則不求逐月望太隂交周及入交即以入交月數與太隂交周朔策一十一萬零四百一十四秒一六五七四相乘得數加太隂交周望䇿六宫一十五度二十分零七秒與本年首朔太隂交周相加即平望太隂交周也求平望以太隂入交月數與朔䇿二十九日五三五九三相乘得數加望策一十四日七六五二九六五與本年首朔日分相加再加紀日滿紀法六十去之得平望自初日甲子起算得平望干支以周日一千四百四十分通其小餘得平望時分秒平望者本月太隂本輪心與太隂本輪心相對之日時也以入交月數與朔䇿相乘加望策日分則得平望距首朔之日分與首朔日分相加則得平望距天正冬至次日子正初刻之日分又加紀日則得平望距冬至前甲子日子正初刻之日分故滿紀法六十去之自初日甲子起算得平望干支以一千四百四十分通其小餘得平望時分也求平望太陽平行以太隂入交月數與太陽平行朔䇿一十萬四千七百八十四秒三四三二四相乘得數加太陽平行望䇿一十四度三十三分一十二秒零九微與本年首朔太陽平行相加得平望太陽平行求平望太陽引數以太隂入交月數與太陽引數朔䇿一十萬四千七百七十九秒三五八八六五相乘得數加太陽引數望䇿一十四度三十三分零九秒四十一微與本年首朔太陽引數相加得平望太陽引數求平望太隂引數以太隂入交月數與太隂引數朔䇿九萬二千九百四十秒二四八五九相乘得數加太隂引數望䇿六宫一十二度五十四分三十秒零七微與本年首朔太隂引數相加得平望太隂引數推日月相距第二推日月相距為月食第二段蓋平望固兩本輪心相對矣而日月皆有均數因生距弧既有距弧則必有距時也若兩均加減同度分亦同則無距弧亦無距時而平望即實望詳交食厯理朔望有平實之殊篇求太陽均數以平望太陽引數依日躔求均數法算之得太陽均數引數初宫至五宫為加六宫至十一宫為減求太隂均數以平望太隂引數依月離求初均數法算之得太隂均數引數初宫至五宫為減六宫至十一宫為加求距弧太陽太隂兩均數同為加或同為減者則相減得距弧一為加一為減者則相加得距弧距弧者日月相距之弧也兩均同為加或同為減者則相距為兩均之較故相減得距弧兩均一為加一為減者則相距為兩均之和故相加得距弧求距時以一小時月距日平行一千八百二十八秒六一二一一八為一厯三千六百秒為二厯距弧化秒為三厯一度化六十分一分化六十秒求得四厯為秒以時分收之得距時太陽太隂兩均數同為加者大陽加均大則距時為加太陽加均小則距時為減同為減者太陽減均大則距時為減太陽減均小則距時為加一為加一為減者太陽為加均則距時為加太陽為減均則距時為減距時者日月相距之時分也太陽均數為加太隂均數為減或同為加而太陽加均大或同為減而太陽減均小皆太陽在前太隂在後月未及與日相對故距時為加太陽均數為減太隂均數為加或同為加均而太陽加均小或同為減圴而太陽減均大皆太隂在前太陽在後月已過與日相對故距時為減推實引第三推實引為月食第三段蓋日月既有距時則此相距之時分內亦必有引數之自行故又以距時求得引弧以加減平望之引數為實引數也求太陽引弧以三千六百秒為一率一小時太陽引數一百四十七秒八四一七二為二率距時化秒為三率求得四率為秒以度分收之得太陽引弧距時為加者亦為加距時為減者亦為減求太隂引弧以三千六百秒為一厯一小時太隂引數一千九百五十九秒七四七六五四二為二厯距時化秒為三厯求得四厯為秒以度分收之得太隂引弧距時為加者亦為加距時為減者亦為減求太陽實引置平望太陽引數加減太陽引弧得太陽實引求太隂實引置平望太隂引數加減太隂引弧得太隂實引推實望第四推實望為月食第四段前求日月相距以得距時似可以加減平望而為實望矣然此相距之時分內引數既有微差則均數亦有微差而距弧與距時亦必有微差故又以實引推實均以求實距弧而得實距時然後加減平望為實望也求太陽實均以太陽實引依日纒求均數法算之得太陽實均實引初宫至五宫為加六宫至十一宫為減隨求太陽距地心之邊為求太陽距地之用求太隂實均以太隂實引依月離求初均數法算之得太隂實均實引初宫至五宫為減六宫至十一宫為加隨求太隂距地心之邊為求太隂距地之用求實距弧太陽太隂兩實均同為加或同為減者則相減得實距弧一為加一為減者則相加得實距弧求實距時以一小時月距日平行一千八百二十八秒六一二一一八為一厯三千六百秒為二率實距弧化秒為三厯求得四厯為秒以時