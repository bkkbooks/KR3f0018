body:
  text: 欽定四庫全書御製厯象考成下編卷四日食厯法推日食用數推日食法用表推日食法推各省日食法推日食帶食法推日食用數康熙二十三年甲子天正冬至為厯元周天三百六十度入算化作一百二十九萬六千秒周日一萬分周嵗三百六十五日二四二一八七五紀法六十朔策二十九日五三五九三太陽平行朔策一十萬四千七百八十四秒小餘三四三二四太陽引數朔策一十萬四千七百七十九秒小餘三五八八六五太隂引數朔策九萬二千九百四十秒小餘二四八五九太隂交周朔䇿一十一萬零四百一十四秒小餘一六五七四一小時太陽平行一百四十七秒小餘八四七一四九一小時太陽引數一百四十七秒小餘八四一二七一小時太隂引數一千九百五十九秒小餘七四七六五四二一小時太隂交周一千九百八十四秒小餘四二五四九一小時月距日平行一千八百二十八秒小餘六一二一一八太陽本天半徑一千萬太陽本輪半徑二十六萬八千八百一十二太陽均輪半徑八萬九千六百零四太隂本天半徑一千萬太隂本輪半徑五十八萬太隂均輪半徑二十九萬太隂次均輪半徑一十一萬七千五百太陽實半徑五百零七太陽實半徑為地半徑之五倍又百分之七今推日食命地半徑為一百分故太陽實半徑即為五百零七也太隂實半徑二十七太陽最髙距地一千零一十七萬九千二百零八與地半徑之比例為一十一萬六千二百太隂最髙距地一千零一十七萬二千五百與地半徑之比例為五千八百一十六黃赤大距二十三度二十九分三十秒黃白大距四度五十八分三十秒氣應七日六五六三七四九二六紀日八朔應二十六日三八五二六六六首朔太陽平行應初宫二十六度二十分四十二秒五十七微首朔太陽引數應初宫一十九度一十分二十七秒二十一微首朔太隂引數應九宫一十八度三十四分二十六秒一十六微首朔太隂交周應六宫初度三十分五十五秒一十四微推日食法推首朔諸平行及入交推首朔諸平行及入交為日食入算之首其理與月食同但日食在朔故皆不用望䇿求積年自厯元康熙二十三年甲子距所求之年共若干年減一年得積年求中積分以積年與周嵗三百六十五日二四二一八七五相乘得中積分求通積分置中積分加氣應七日六五六三七四九二六得通積分上考往古則置中積分減氣應得通積分求天正冬至置通積分其日滿紀法六十去之餘為天正冬至日分上考往古則以所餘轉與紀法六十相減餘為天正冬至日分求紀日以天正冬至日數加一日得紀日求積日置中積分加氣應分六五六三七四九二六不用日減本年天正冬至分亦不用日得積日上考往古則置中積分減氣應分加本年天正冬至分得積日求通朔置積日減朔應二十六日三八五二六六六得通朔上考往古則置積日加朔應得通朔求積朔及首朔置通朔以朔䇿二十九日五三五九三除之得數加一為積朔餘數與朔䇿相減為首朔上考往古則置通朔以朔䇿除之得數為積朔餘數為首數求首朔太陽平行以積朔與太陽平行朔䇿一十萬四千七百八十四秒三四三二四相乘滿周天一百二十九萬六千秒去之餘為積朔太陽平行加首朔太陽平行應初宫二十六度二十分四十二秒五十七微得首朔太陽平行上考往古則置首朔太陽平行應減積朔太陽平行得首朔太陽平行求首朔太陽引數以積朔與太陽引數朔策一十萬四千七百七十九秒三五八八六五相乘滿周天一百二十九萬六千秒去之餘為積朔太陽引數加首朔太陽引數應初宫一十九度一十分二十七秒二十一微得首朔太陽引數上考往古則置首朔太陽引數應減積朔太陽引數得首朔太陽引數求首朔太隂引數以積朔與太隂引數朔䇿九萬二千九百四十秒二四八五九相乘滿周天一百二十九萬六千秒去之餘為積朔太隂引數加首朔太隂引數應九宫一十八度三十四分二十六秒一十六微得首朔太隂引數上考往古則置首朔太隂引數應減積朔太隂引數得首朔太隂引數求首朔太隂交周以積朔與太隂交周朔策一十一萬零四百一十四秒一六五七四相乘滿周天一百二十九萬六千秒去之餘為積朔太隂交周加首朔太隂交周應六宫初度三十分五十五秒一十四微得首朔太隂交周上考往古則置首朔太隂交周應減積朔太隂交周得首朔太隂交周求逐月朔太隂交周置本年首朔太隂交周以太隂交周朔䇿一宫零四十分一十四秒零一微遞加十三次得逐月朔太隂交周求太隂入交月數逐月朔太隂交周自初宫初度至初宫二十度五十二分自五宫九度零八分至六宫八度五十一分自十一宫二十一度零九分至十一宫三十度皆為太隂入交第幾月入交即第幾月有食太隂距正交後中交前在黃道北可食之限二十度五十二分太隂距中交後正交前在黃道南可食之限八度五十一分故逐月朔太隂交周在此限以內者為入交詳交食厯理太陽食限篇推平朔諸平行第一推平朔諸平行為日食第一段其理亦與月食同求平朔以太隂入交月數與朔䇿二十九日五三五九三相乘得數與本年首朔日分相加再加紀日滿紀法六十去之得平朔自初日甲子起算得平朔干支以周日一千四百四十分通其小餘得平朔時分秒求平朔太陽平行以太隂入交月數與太陽平行朔䇿一十萬四千七百八十四秒三四三二四相乘得數與本年首朔太陽平行相加得平朔太陽平行求平朔太陽引數以太隂入交月數與太陽引數朔䇿一十萬四千七百七十九秒三五八八六五相乘得數與本年首朔太陽引數相加得平朔太陽引數求平朔太隂引數以太隂入交月數與太隂引數朔䇿九萬二千九百四十秒二四八五九相乘得數與本年首朔太隂引數相加得平朔太隂引數推日月相距第二推日月相距為日食第二段其理亦與月食同若兩均加減同度分亦同則無距弧亦無距時而平朔即實朔詳交食厯理朔望有平實之殊篇求太陽均數以平朔太陽引數依日躔求均數法算之得太陽均數引數初宫至五宫為加六宫至十一宫為減求太隂均數以平朔太隂引數依月離求初均數法算之得太隂均數引數初宫至五宫為減六宫至十一宫為加求距弧太陽太隂兩均數同為加或同為減者則相減得距弧一為加一為減者則相加得距弧求距時以一小時月距日平行一千八百二十八秒六一二一一八為一率三千六百秒為二率距弧化秒為三率求得四率為秒以時分收之得距時太陽太隂兩均數同為加者太陽加均大則距時為加太陽加均小則距時為減同為減者太陽減均大則距時為減太陽減均小則距時為加一為加一為減者太陽為加均則距時為加太陽為減均則距時為減推實引第三推實引為日食第三段其理亦與月食同求太陽引弧以三千六百秒為一率一小時太陽引數一百四十七秒八四一七二為二率距時化秒為三率求得四率為秒以度分收之得太陽引弧距時為加者亦為加距時為減者亦為減求太隂引弧以三千六百秒為一率一小時太隂引數一千九百五十九秒七四七六五四二為二率距時化秒為三率求得四率為秒以度分收之得太隂引弧距時為加者亦為加距時為減者亦為減求太陽實引置平朔太陽引數加減太陽引弧得太陽實引求太隂實引置平朔太隂引數加減太隂引弧得太隂實引推實朔第四推實朔為日食第四段其理亦與月食同求太陽實均以太陽實引依日躔求均數法算之得太陽實均實引初宫至五宫為加六宫至十一宫為減隨求太陽距地心之邊為求太陽距地之用求太隂實均以太隂實引依月離求初均數法算之得太隂實均實引初宫至五宫為減六宫至十一宫為加隨求太隂距地心之邊為求太隂距地之用求實距弧太陽太隂兩實均同為加或同為減者則相減得實距弧一為加一為減者則相加得實距弧求實距時以一小時月距日平行一千八百二十八秒六一二一一八為一率三千六百秒為二率實距弧化秒為三率求得四率為秒以時分收之得實距時定加減之法與距時同求實朔置平朔加減實距時得實朔加滿二十四時則實朔進一日不足減者借一日作二十四時則實朔退一日推實交周第五推實交周為日食第五段其理亦與月食同求交周距弧以三千六百秒為一率一小時太隂交周一千九百八十四秒四二五四九為二率實距時化秒為三率求得四率為秒以度分收之得交周距弧實距時為加者亦為加實距時為減者亦為減求實朔平交周置平朔太隂交周加減交周距弧得實朔平交周求實朔實交周置實朔平交周加減太隂實均得實朔實交周自初宫初度至初宫一十八度一十五分自五宫一十一度四十五分至六宫六度一十四分自十一宫二十三度四十六分至十一宫三十度皆入食限為有食不入此限者不食即不必算入限宫度乃實朔距交可食之限詳交食厯理太陽食限篇推太陽實經第六推太陽實經為日食第六段後求黃平象限皆以太陽經度為根非但為求時差之用而己餘與月食同求太陽距弧以三千六百秒為一率一小時太陽平行一百四十七秒八四七一四九為二率實距時化秒為三率求得四率為秒以度分收之得太陽距弧實距時為加者亦為加實距時為減者亦為減求實朔太陽平行置平朔太陽平行加減太陽距弧得實朔太陽平行求太陽黃道經度置實朔太陽平行加減太陽實均得太陽黃道經度求太陽赤道經度以半徑一千萬為一率黃赤大距二十三度二十九分三十秒之餘弦為二率太陽距春秋分黃道經度之正切線為三率太陽黃道經度不及三宫者與三宫相減過三宫者減三宫過六宫者與九宫相減過九宫者減九宫得太陽距春秋分黃道經度求得四率為赤道經度之正切線檢表得太陽距春秋分赤道經度以冬至起初宫命之得太陽赤道經度推實朔用時第七推食朔用時為日食第七段其理亦與月食同求均數時差以太陽實均變時得均數時差一度變為四分十五分變為一分十五秒變為一秒實均為加者則為減實均為減者則為加求升度時差以太陽黃道經度與太陽赤道經度相減餘數變時得升度時差二分後為加二至後為減求時差總均數時差與升度時差同為加者則相加為時差總仍為加同為減者亦相加為時差總仍為減一為加一為減者則相減為時差總加數大為加減數大為減求實朔用時置實朔加減時差總得實朔用時距日出前日入後五刻以內者可以見食五刻以外者則全在夜即不必算分晝夜之法以一小時月距日實行二十七分四十三秒為一率六十分為二率最大日半徑與最大月半徑相併得三十二分二十三秒三十微為三率求得四率七十分收作五刻實朔在日入後五刻以內日入前可見初虧實朔在日出前五刻以內日出後可見復圓若五刻以外雖食分最大時刻最久亦不見食矣故不必算推食甚實緯食甚用時第八推食甚實緯食甚用時為日食第八段詳交食厯理日食三限時刻及求日食食甚用時食甚交周食甚實緯篇求食甚實緯以半徑一千萬為一率黃白大距四度五十八分三十秒之正弦為二率實朔實交周之正弦為三率求得四率為食甚實緯之正弦檢表得食甚實緯實交周初宫五宫為北六宫十一宫為南求食甚交周以半徑一千萬為一率黃白大距四度五十八分三十秒之餘弦為二率實朔實交周之正切線為三率求得四率為食甚交周之正切線檢表得食甚交周求交周升度差以食甚交周與實朔