body:
  text: 欽定四庫全書御製厯象考成下編卷八金星厯法推金星用數推金星法用表推金星法推金星用數康熙二十三年甲子天正冬至為厯元周天三百六十度入算化作一百二十九萬六千秒周日一萬分周嵗三百六十五日二四二一八七五紀法六十金星每日平行三千五百四十八秒小餘三三五一六九與太陽平行同金星最髙每日平行十分秒之二又二七一九五金星最髙每嵗平行一分二十二秒五十七微以周嵗三百六十五日二四二一八七五除之得最髙每日平行一十三微三十七纎三十五忽四十芒以秒法通之即得金星伏見每日平行二千二百一十九秒小餘四三一一八八六金星伏見每日平行三十六分五十九秒二十五微五十二纎一十六忽四十四芒以秒法通之即得金星本天半徑一千萬金星本輪半徑二十三萬一千九百六十二金星均輪半徑八萬八千八百五十二金星次輪半徑七百二十二萬四千八百五十金星次輪面與黄道交角三度二十九分氣應七日六五六三七四九二六金星平行應二十分一十九秒一十八微與厯元甲子年天正冬至次日子正初刻太陽平行度同金星最髙應六宫零一度三十三分三十一秒零四微金星伏見應初宫一十八度三十八分一十三秒零六微按新法厯書載崇禎元年戊辰金星最髙距冬至六宫初度一十六分零六秒伏見行距次輪平逺初宫零九度一十一分零七秒自崇禎戊辰年天正冬至次日至厯元甲子年天正冬至次日積二萬零四百五十三日以積日各與每日平行相乗得數各與崇禎戊辰年諸應相加即厯元甲子年諸應也推金星法求積年自厯元康熙二十三年甲子距所求之年共若干年減一年得積年求中積分以積年與周嵗三百六十五日二四二一八七五相乘得中積分求通積分置中積分加氣應七日六五六三七四九二六得通積分上考往古則置中積分減氣應得通積分求天正冬至置通積分其日滿紀法六十去之餘為天正冬至日分上考往古則以所餘轉與紀法六十相減餘為天正冬至日分求積日置中積分加氣應分六五六三七四九二六不用日減本年天正冬至分亦不用日得積日上考往古則置中積分減氣應分加本年天正冬至分得積日求金星年根以積日與金星每日平行三千五百四十八秒三三五一六九相乗滿周天一百二十九萬六千秒去之餘為積日金星平行加金星平行應二十分一十九秒一十八微得金星年根上考往古則置金星平行應減積日金星平行得金星年根求最髙年根以積日與金星最髙每日平行十分秒之二又二七一九五相乘得數為積日最髙平行加金星最髙應六宫零一度三十三分三十一秒零四微得最髙年根上考往古則置金星最髙應減積日最髙平行得最髙年根求伏見年根以積日與金星伏見每日平行二千二百一十九秒四三一一八八六相乘滿周天一百二十九萬六千秒去之餘為積日伏見平行加金星伏見應初宫一十八度三十八分一十三秒零六微得伏見年根上考往古則置金星伏見應減積日伏見平行得伏見年根求金星日數以所設日數與金星每日平行三千五百四十八秒三三五一六九相乗得數為秒以官度分收之得金星日數求最髙日數以所設日數與金星最髙每日平行十分秒之二又二七一九五相乘得數為秒以分收之得最髙日數求伏見日數以所設日數與金星伏見每日平行二千二百一十九秒四三一一八八六相乘得數為秒以宫度分收之得伏見日數求金星平行以金星年根與金星日數相加得金星平行求最髙平行以最髙年根與最髙日數相加得最髙平行求伏見平行以伏見年根與伏見日數相加得伏見平行求正交平行置最髙平行減一十六度得正交平行金星正交恒距最髙前一十六度故置最髙平行減一十六度得正交平行也求引數置金星平行減最髙平行得引數求初均數均輪心自本輪最髙左旋行引數度次輪心自均輪最近㸃右旋行倍引數度用兩三角形法求得地心之角為初均數法詳五星厯理五求初均數篇引數初宫至五官為減六宫至十一宮為加隨求次輪心距地心之邊為求次均數之用求初實行置金星平行加減初均數得初實行求伏見實行置伏見平行加減初均數得伏見實行初均為減者則加初均為加者則減伏見平行為星距次輪平逺之度伏見實行為星距次輪最逺之度其相差之較即初均數而加減相反詳五星厯理五求次均數篇求次均數星自次輪最逺㸃右旋行伏見實行度用三角形法以次輪心距地心線為一邊即求初均數時所得次輪心距地心之邊次輪半徑七百二十二萬四千八百五十為一邊伏見實行度為所夾之外角過半周者與全周相減用其餘求得地心對次輪半徑之角為次均數伏見實行初宫至五宫為加六宮至十一宫為減隨求星距地心之邊為求視緯之用求黄道實行置初實行加減次均數得黄道實行金水二星本道即黄道故置初實行加減次均數即黄道實行無升度差也求距交實行置初實行減正交平行得距交實行求距次交實行以伏見實行與距交實行相加加滿全周去之用其餘得距次交實行距次交實行者星距次輪正交之度也伏見實行為星距次輪最逺之度而次輪最逺距次輪正交之度與次輪心距本道正交之度等故相加得距次交實行也詳五星厯理七五星交周及金水二星緯度篇求次緯以半徑一千萬為一率次輪面與黄道交角三度二十九分之正弦為二率距次交實行之正弦為三率求得四率為次緯之正弦檢表得次緯求星距黄道線以半徑一千萬為一率次緯之正弦為二率次輪半徑七百二十二萬四千八百五十為三率求得四率即星距黄道線求視緯以星距地心線為一率即求次均數時所得星距地心之邊星距黄道線為二率半徑一千萬為三率求得四率為視緯之正弦檢表得視緯距次交實行初宫至五宫為黄道北六宫至十一宫為黄道南求黄道宿度依日躔求宿度法求得本年黄道宿鈐察黄道實行足減本年黄道宿鈐内某宿度分則減之餘為黄道宿度用表推金星法求諸年根用金星年根表察本年距冬至分秒三十微進一秒下倣此得金星年根察本年最髙行宫度分秒得最髙年根察本年伏見行宫度分秒得伏見年根求諸日數用金星周嵗平行表察本日平行宫度分秒得金星日數察本日最髙行分秒得最髙日數察本日伏見行宫度分秒得伏見日數求金星平行以金星年根與金星日數相加得金星平行求最髙平行以最髙年根與最髙日數相加得最髙平行求伏見平行以伏見年根與伏見日數相加得伏見平行求正交平行置最髙平行減一十六度得正交平行求引數置金星平行減最髙平行得引數求初均及中分用金星均數表以引數宫度分察其與初均所對之度分秒得初均察其與中分所對之分秒得中分并記初均加減號求初實行置金星平行加減初均數得初實行求伏見實行置伏見平行加減初均數得伏見實行初均為減者則加初均為加者則減求次均及較分用金星均數表以伏見實行宫度分察其與次均所對之度分秒三十度進一官得次均察其與較分所對之度分秒得較分并記次均加減號求實次均以三千六百秒為一率較分化秒為二率中分化秒為三率求得四率為秒以度分收之為加差與次均相加得實次均加減號與次均同求黄道實行置初實行加減實次均得黄道實行求距交實行置初實行減正交平行得距交實行求距次交實行以伏見實行與距交實行相加加滿全周去之用其餘得距次交實行求星距黄道線用金星距黄道表以距次交實行宫度察其所對之數得星距黄道線并記南北號求星距地用金星距地表以伏見實行宫度察其與星距地所對之數得星距地求距地差用金星距地表以引數宫度察其與距地差所對之數得距地差求星距地用數置星距地減距地差得星距地用數星距地用數者求視緯所用星距地心之數也表中所列星距地數乃設次輪心在最髙所得星距地心之邊而次輪心距地心實有髙卑則是距地心之差亦與次輪心距地心之差等故以引數宫度求得次輪心距地心之邊與最髙距地心相減餘為距地差於星距地數内減之方為星實距地之數也土木二星星距黄道線即初緯之正弦而星距地心線亦以次輪心在中距立算故其比例同金水二星星距黄道線乃以次輪半徑與次緯正弦比例之數原無闗於本天之髙卑而星距地心線又以次輪心在最髙立算故減距地差為星距地用數其比例乃相當也求視緯以星距地用數為一率星距黄道線為二率半徑一千萬為三率求得四率為視緯之正弦檢表得視緯求黄道宿度依日躔求宿度法求得本年黄道宿鈐察黄道實行足減本年黄道宿鈐内某宿度分則減之餘為黄道宿度御製厯象考成下編卷八
