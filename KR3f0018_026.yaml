body:
  text: 欽定四庫全書御製厯象考成下編卷九水星厯法推水星用數推水星法用表推水星法附推五星伏見及交宮同度法推水星用數康熙二十三年甲子天正冬至為厯元周天三百六十度入算化作一百二十九萬六千秒周日一萬分周嵗三百六十五日二四二一八七五紀法六十水星每日平行三千五百四十八秒小餘三三五一六九與太陽平行同水星最髙每日平行十分秒之二又八八一一九三水星最髙每嵗平行一分四十五秒一十四微以周嵗三百六十五日二四二一八七五除之得最髙每日平行一十七微一十七纎一十三忽四十六芒以秒法通之即得水星伏見每日平行一萬一千一百八十四秒小餘一一六五二四八水星伏見每日平行三度零六分二十四秒零六微五十九纎二十九忽二十二芒以秒法通之即得水星本天半徑一千萬水星本輪半徑五十六萬七千五百二十三水星均輪半徑一十一萬四千六百三十二水星次輪半徑三百八十五萬水星次輪心在大距與黃道交角五度四十分水星次輪心在正交當黃道北交角五度零五分一十秒其與大距交角較三十四分五十秒水星次輪心在中交當黃道北交角六度一十六分五十秒其與大距交角較三十六分五十秒水星次輪心在正交當黃道南交角六度三十一分零二秒其與大距交角較五十一分零二秒水星次輪心在中交當黃道南交角四度五十五分三十二秒其與大距交角較四十四分二十八秒氣應七日六五六三七四九二六水星平行應二十分一十九秒一十八微與厯元甲子年天正冬至次日子正初刻太陽平行度同水星最髙應十一宫零三度零三分五十四秒五十四微水星伏見應十宫零一度一十三分一十一秒一十七微按新法厯書載崇禎元年戊辰水星最髙距冬至十一宫零一度二十五分四十二秒伏見行距次輪平逺三宫二十九度五十四分一十六秒自崇禎戊辰年天正冬至次日至厯元甲子年天正冬至次日積二萬零四百五十三日以積日各與每日平行相乘得數各與崇禎戊辰年諸應相加即厯元甲子年諸應也推水星法求積年自厯元康熙二十三年甲子距所求之年共若干年減一年得積年求中積分以積年與周歲三百六十五日二四二一八七五相乘得中積分求通積分置中積分加氣應七日六五六三七四九二六得通積分上考往古則置中積分減氣應得通積分求天正冬至置通積分其日滿紀法六十去之餘為天正冬至日分上考往古則以所餘轉與紀法六十相減餘為天正冬至日分求積日置中積分加氣應分六五六三七四九二六不用日減本年天正冬至分亦不用日得積日上考往古則置中積分減氣應分加本年天正冬至分得積日求水星年根以積日與水星每日平行三千五百四十八秒三三五一六九相乘滿周天一百二十九萬六千秒去之餘為積日水星平行加水星平行應二十分一十九秒一十八微得水星年根上考往古則置水星平行應減積日水星平行得水星年根求最髙年根以積日與水星最髙每日平行十分秒之二又八八一一九三相乘得數為積日最髙平行加水星最髙應十一宫零三度零三分五十四秒五十四微得最髙年根上考往古則置水星最髙應減積日最髙平行得最髙年根求伏見年根以積日與水星伏見每日平行一萬一千一百八十四秒一一六五二四八相乘滿周天一百二十九萬六千秒去之餘為積日伏見平行加水星伏見應十宫零一度一十三分一十一秒一十七微得伏見年根上考往古則置水星伏見應減積日伏見平行得伏見年根求水星日數以所設日數與水星每日平行三千五百四十八秒三三五一六九相乘得數為秒以宫度分收之得水星日數求最髙日數以所設日數與水星最髙每日平行十分秒之二又八八一一九三相乘得數為秒以分收之得最髙日數求伏見日數以所設日數與水星伏見每日平行一萬一千一百八十四秒一一六五二四八相乘得數為秒以宫度分收之得伏見日數求水星平行以水星年根與水星日數相加得水星平行求最髙平行以最髙年根與最髙日數相加得最髙平行求伏見平行以伏見年根與伏見日數相加得伏見平行求引數置水星平行減最髙平行得引數求初均數均輪心自本輪最髙左旋行引數度次輪心自均輪最逺㸃右旋行三倍引數度用兩三角形法求得地心之角為初均數法詳五星厯理六求初均數篇引數初宫至五宫為減六宫至十一宫為加隨求次輪心距地心之邊為求次均數之用求初實行置水星平行加減初均數得初實行求伏見實行置伏見平行加減初均數得伏見實行初均為減者則加初均為加者則減求次均數星自次輪最逺㸃右旋行伏見實行度用三角形法以次輪心距地心線為一邊即求初均數時所得次輪心距地心之邊次輪半徑三百八十五萬為一邊伏見實行度為所夾之外角過半周者與全周相減用其餘求得地心對次輪半徑之角為次均數伏見實行初宫至五宫為加六宫至十一宫為減隨求星距地心之邊為求視緯之用求黃道實行置初實行加減次均數得黃道實行求距交實行置初實行減最髙平行加減六宫得距交實行水星正交恆與最卑同則最髙平行即中交平行故置初實行減最髙平行又加減六宫方為距正交實行也求距次交實行以伏見實行與距交實行相加加滿全周去之用其餘得距次交實行初宫至五宫為黃道北六宫至十一宫為黃道南求交角距交實行九宫至二宫星在黃道北交角為五度零五分一十秒星在黃道南交角為六度三十一分零二秒距交實行九宫至二宫為次輪心在正交前後故其交角用次輪心在正交當黃道南北交角距交實行三宮至八宫星在黃道北交角為六度一十六分五十秒星在黃道南交角為四度五十五分三十二秒距交實行三宮至八宫為次輪心在中交前後故其交角用次輪心在中交當黃道南北交角求交角差以半徑一千萬為一率大距交角較化秒為二率距交實行九宫至二宫星在黃道北大距交角較為二千零九十秒星在黃道南大距交角較為三千零六十二秒距交實行三宫至八宫星在黃道北大距交角較為二千二百一十秒星在黃道南大距交角較為二千六百六十八秒距交實行之正弦為三率求得四率即交角差距交實行九宫至二宫星在黃道北為加星在黃道南為減距交實行三宫至八宫星在黃道北為減星在黃道南為加求實交角置交角加減交角差得實交角實交角者本日星在次輪周所當次輪面與黃道斜交之角也蓋水星次輪面與黃道斜交惟次輪心在大距其南北交角皆為五度四十分此外則黃道南與黃道北不同而正交與中交又不同次輪心在正交其黃道北交角最小距正交漸逺則交角漸大而黃道南交角最大距正交漸逺則交角漸小交次輪心在中交其黃道北交角最大距中交漸逺則角漸小而黃道南交角最小距中交漸逺則交角漸大故先以次輪心距正交前後或距中交前後及星在黃道南北定其交角然後加減交角差方為實交角也求次緯以半徑一千萬為一率實交角之正弦為二率距次交實行之正弦為三率求得四率為次緯之正弦檢表得次緯求星距黃道線以半徑一千萬為一率次緯之正弦為二率次輪半徑三百八十五萬為三率求得四率即星距黃道線求視緯以星距地心線為一率即求次均數時所得星距地心之邊星距黃道線為二率半徑一千萬為三率求得四率為視緯之正弦檢表得視緯求黃道宿度依日躔求宿度法求得本年黃道宿鈐察黃道實行足減本年黃道宿鈐內某宿度分則減之餘為黃道宿度用表推水星法求諸年根用水星年根表察本年距冬至分秒三十微進一秒下倣此得水星年根察本年最髙行宫度分秒得最髙年根察本年伏見行宫度分秒得伏見年根求諸日數用水星周嵗平行表察本日平行宫度分秒得水星日數察本日最髙行分秒得最髙日數察本日伏見行宫度分秒得伏見日數求水星平行以水星年根與水星日數相加得水星平行求最髙平行以最髙年根與最髙日數相加得最髙平行求伏見平行以伏見年根與伏見日數相加得伏見平行求引數置水星平行減最髙平行得引數求初均及中分用水星均數表以引數宫度分察其與初均所對之度分秒得初均察其與中分所對之分秒得中分并記初均加減號求初實行置水星平行加減初均數得初實行求伏見實行置伏見平行加減初均數得伏見實行初均為減者則加初均為加者則減求次均及較分用水星均數表以伏見實行宫度分察其與次均所對之度分秒得次均察其與較分所對之度分秒得較分并記次均加減號求實次均以三千六百秒為一率較分化秒為二率中分化秒為三率求得四率為秒以度分收之為加差與次均相加得實次均加減號與次均同求黃道實行置初實行加減實次均得黃道實行求距交實行置初實行減最髙平行加減六宫得距交實行求距次交實行以伏見實行與距交實行相加加滿全周去之用其餘得距次交實行初宫至五宫為黃道北六宫至十一宫為黃道南求實交角用水星距限表以距交實行宫度按黃道南北察其所對之度分秒得實交角水星距限表乃以交角差加減交角而得故用表推算即求實交角不用先求交角與交角差也求星距黃道線用水星距黃道表以距次交實行宫度按實交角相近者察其所對之數得星距黃道線求星距地用水星距地表以伏見實行宫度察其與星距地所對之數得星距地求距地差用水星距地表以引數宫度察其與距地差所對之數得距地差求星距地用數置星距地減距地差得星距地用數求視緯以星距地用數為一率星距黃道線為二率半徑一千萬為三率求得四率為視緯之正弦檢表得視緯求黃道宿度依日躔求宿度法求得本年黃道宿鈐察黃道實行足減本年黃道宿鈐內某宿度分則減之餘為黃道宿度推五星伏見及交宫同度法求土木火三星合伏時刻土木火三星黃道實行與太陽實行同宫同度為合伏皆以太陽實行未及星實行為合伏本日已過星實行為合伏次日求時刻之法以本日太陽實行與次日太陽實行相減餘為太陽一日之實行以本日星實行與次日星實行相減餘為星一日之實行乃於太陽一日之實行內減星一日之實行餘為一率一千四百四十分為二率本日星實行內減本日太陽實行餘為三率求得四率為距子正之分數以時刻收之得合伏時刻與月離求合朔之理同求土木火三星退衝時刻土木火三星黃道實行與太陽實行相距六宫為退衝亦名與太陽衝皆以相距未及六宫為退衝本日已過六宫為退衝次日求時刻之法以本日太陽實行與次日太陽實行相減餘為太陽一日之實行以次日星實行與本日星實行相減餘為星一日之實行乃以太陽一日之實行與星一日之實行相加為一率太陽順行星逆行則相距為兩實行之和故相加為一率一千四百四十分為二率本日星實行加六宫減本日太陽實行餘為三率求得四率為距子正之分數以時刻收之得退衝時刻求土木火三星晨夕伏見段目土木火三星合伏後距日漸逺為晨見東方順行土木火三星合伏後漸差而西日出前即可見故為晨見東方其行度在次輪上半周故恆為順行順行漸遲遲而忽退為留退初古名前留亦名順留因其順而忽留故曰順留因其留而初退故曰留退初距日半周為退衝退衝之次日為夕見退衝之後日入時可見日出時不見故曰夕見不曰夕見西方者因初夕見時星尚在東方也退行漸遲遲而忽順為留順初古名後留亦名退留因其退而忽留故曰退留因其留而初順故曰留順初順行漸疾復近合伏為夕不見求土木火三星晨夕伏見限度土星限為一十一度木星限為一十度火星限為一十一度三十分合伏前後某日太陽實行與本星實行相距近此限度即以本日本星實行宫度察五星伏見距日黃道度表取其與本星相對之數為距日黃道度又以本日本星實行宫度察五星伏見距日加減差表取其與本星緯度相對之數為距日加減差乃以距日加減差與距日黃道度相加減緯南則加緯北則減得伏見限度合伏前某日太陽實行與星實行相距近此限度即為某日夕不見合伏後某日近此限度即為某日晨見土星當地平太陽在地平下一十一度即可見木星當地平太陽在地平下一十度即可見火星當地平太陽在地平下一十一度三十分即可見此乃地平緯度因星之經緯逐日不同難以逐日推算故以地平緯度當黃道經度察表為省算也餘詳五星衝伏留退俱生於次輪及五星伏見篇求金水二星合伏時刻金水二星黃道實行與太陽同宫同度為合伏皆以星實行未及太陽實行為合伏本日已過太陽實行為合伏次日求時刻之法以本日太陽實行與次日太陽實行相減餘為太陽一日之實行以本日星實行與次日星實行相減餘為星一日之實行乃於星一日之實行內減太陽一日之實行餘為一率一千四百四十分為二率本日太陽實行內減星實行餘為三率求得四率為距子正之分數以時刻收之得合伏時刻金水二星行度合伏時速於太陽故與土木火三星相反而其理則同也求金水二星合退伏時刻金水二星退行與太陽實行同宫同度為合退伏亦名退合皆以太陽實行未及星實行為合退伏本日已過星實行為合退伏次日求時刻之法以本日太陽實行與次日太陽實行相減餘為太陽一日之實行以次日星實行與本日星實行相減餘為星一日之實行乃以太陽一日之實行與星一日之實行相加為一率一千四百四十分為二率本日星實行內減本日太陽實行餘為三率求得四率為距子正之分數以時刻收之得合退伏時刻求金水二星晨夕伏見段目金水二星合伏後距日漸逺為夕見西方順行金水二星合伏後漸差而東日入後即可見故曰夕見西方其行度在次輪上半周故恆為順行順行漸遲遲而忽退為留退初退行漸近太陽為夕不見復與太陽同度為合退伏自是又漸逺太陽為晨見東方退行金水二星合退伏後漸差而西日出前即可見故曰晨見東方其行度在次輪下半周故恆為退行退行漸遲遲而忽順為留順初順行漸疾復近合伏為晨不見求金水二星晨夕伏見限度金星限為五度水星限為一十度合伏前後或合退伏前後某日太陽實行與本星實行相距近此限度即以某日本星實行宫度察五星伏見距日黃道度表取其與本星相對之數為距日黃道度又以本日本星實行宫度察五星伏見距日加減差表取其與本星緯度相對之數為距日加減差乃以距日加減差與距日黃道度相加減緯南則加緯北則減得伏見限度合伏前某日太陽實行與星實行相距近此限度即為某日晨不見合伏後某日近此限度即為某日夕見合退伏前某日近此限度即為某日夕不見合退伏後某日近此限度即為某日晨見求五星交宫時刻以本星一日之實行為一率一千四百四十分為二率本星實行距某宫初度之度分為三率順行者以本日實行與三十度相減逆行者即用本日實行求得四率為距子正之分數以時刻收之得交宫時刻與太陰交宮之理同但太陰皆順行五星或有逆行耳求五星同度時刻以兩星一日之實行相加減為一率兩星皆順行或皆逆行者則相減一順一逆者則相加一千四百四十分為二率兩星相距為三率求得四率為距子正之分數以時刻收之得同度時刻與求合伏及退合之理同御製厯象考成下編卷九
