body:
  text: 欽定四庫全書御製厯象考成下編卷十恆星厯法推中星法推中星時刻法推凌犯法推凌犯視差法推中星法推中星及中星時刻亦可用三角形法推算但求太陽赤道經度已詳日食厯法求恆星赤道經度已詳恆星厯理而本年諸恆星赤道經度又須逐一推定然後可以求某星方中及偏東偏西之度數故立法用表以從簡易求本時太陽黃道經度以一千四百四十分為一率本日太陽實行與次日太陽實行相減餘為二率以所設時刻化分為三率求得四率與本日太陽實行相加得本時太陽黃道經度求本時太陽赤道經度用日躔黃赤升度表以本時太陽黃道經度察其所對之赤道宫度分秒得本時太陽赤道經度求本時太陽距午後赤道經度以所設時刻變赤道度一小時變為十五度一分變為十五分一秒變為十五秒加減半周不及半周則加半周過半周則減半周得本時太陽距午後赤道經度求本時正午赤道經度以本時太陽赤道經度與本時太陽距午後赤道經度相加加滿全周去之用其餘得本時正午赤道經度求中星用恆星赤道經緯度表察各星赤道經度又用恆星赤道經緯度嵗差表察各星經度嵗差與各星經度相加減為本年各星赤道經度乃察本年某星赤道經度與本時正午赤道經度相同即為某星方中如經度不相同則察其相近者與本時正午赤道經度相減餘為偏東偏西之度凡星之赤道經度大於正午赤道經度者為偏東小於正午赤道經度者為偏西推中星時刻法求星赤道經度用恆星赤道經緯度表察本星赤道經度又用赤道經緯度嵗差表察本星經度嵗差按嵗積之與本星赤道經度相加減得星赤道經度或用恆星黃道經緯度表察本星黃道經度自厯元甲子起算每年加嵗差五十一秒求得本年本星黃道經度又用黃赤經緯互推表以本年黃道經度及黃道緯度察其所對之赤道宫度分亦得星之赤道經度如黃道經緯度俱有零分者用中比例三次求之求太陽赤道經度用日躔黃赤升度表以本日太陽黃道經度察其所對之赤道宫度分秒得太陽赤道經度求太陽距午後赤道經度星赤道經度內減太陽赤道經度不及減者加十二宫減之餘為太陽距午後赤道經度求中星時刻以太陽距午後赤道經度加減半周不及半周者加半周過半周者減半周變時自子正初刻起算得中星時刻推中星用本時太陽赤道度而推中星時刻則用子正太陽赤道度因無時刻可設故即用子正耳又太陽每日東行一度變時約得四分雖有微差亦不甚逺若必欲按本時太陽赤道度立算則於所得中星時刻內每一小時減十秒則一日二十四時即減四分於理更密推凌犯法求凌犯入限太陰凌犯恆星以本日太陰經度與次日太陰經度察本年凌犯恆星經緯度表某星在此限內為凌犯入限復察其間各星緯度如太陰緯與星緯同在黃道北者太陰緯多為太陰在上太陰緯少為太陰在下太陰緯與星緯同在黃道南者太陰緯多為太陰在下太陰緯少為太陰在上一緯北一緯南者太陰緯北為太陰在上太緯緯南為太陰在下近天頂為上近地平為下太陰在上者相距二度以內取用太陰在下者相距一度以內取用太陰有地半徑差常變髙為卑太陰在上者雖相距二度或因地半徑差而相距一度故於二度以內取用若太陰在下者雖相距一度而加以地半徑差則相距益逺故止於一度以內取用也兩緯相距十七分以內為凌十八分以外為犯逼近為凌略逺為犯兩緯相同為掩太陰凌犯五星以本日太陰經度在星前次日太陰經度在星後為凌犯入限餘與凌犯恆星同五星凌犯恆星無論在上在下皆於相距一度以內取用五星地半徑差甚小故皆於一度以內取用兩緯相距三分以內為凌四分以外為犯五星光小故三分以內方為凌四分以外即為犯兩緯相同為掩餘與太陰凌犯恆星同五星自相凌犯以行速者為凌犯之星以行遲者為受凌犯之星如兩星行度相同而一順行一逆行者則以順行者為凌犯之星逆行者為受凌犯之星皆以本日此星經度在彼星前次日此星經度在彼星後為凌犯入限餘與五星凌犯恆星同求日行度太陰凌犯恆星以本日太陰經度與次日太陰經度相減得日行度日行度者乃太陰與恆星一日相距之行度因恆星之行甚遲有似不動故止以太陰之行度為日行度也太陰凌犯五星以本日太陰經度與次日太陰經度相減餘為太陰一日之行度又以本日星經度與次日星經度相減餘為星一日之行度星順行者則以兩數相減得日行度與交食月距日之理同星逆行者則以兩數相加得日行度與交食距交之理同五星凌犯恆星以本日星經度與次日星經度相減得日行度與太陰犯恆星之理同五星自相凌犯以本日此星經度與次日此星經度相減餘為此星一日之行度又以本日彼星經度與次日彼星經度相減餘為彼星一日之行度兩星俱順行或俱逆行者則以兩數相減得日行度兩星一順行一逆行者則以兩數相加得日行度與太陰犯五星之理同求相距度太陰凌犯恆星以本日太陰經度與恆星經度相減得相距度太陰凌犯五星以本日太陰經度與本日星經度相減得相距度五星凌犯恆星以本日星經度與恆星經度相減得相距度五星自相凌犯以本日兩星經度相減得相距度求凌犯時刻以日行度化分為一率一千四百四十分為二率相距度化分為三率求得四率為分以時刻收之得凌犯時刻推凌犯視差法凡太陰凌犯諸星夜所可見者則復推視差以求其凖與日食三差之理同其推之之法亦可用三角形立算因其理已詳日食故立法用表以從簡易其推可見不可見之法則以太陰出入時刻法求之或用天球比算亦得大槩至於五星凌犯恆星及五星自相凌犯其視差甚微可以不計不必復推矣求本時太陽黃道度以一千四百四十分為一率本日太陽實行與次日太陽實行相減餘為二率凌犯時刻化分為三率求得四率與本日太陽實行相加得本時太陽黃道度求春分距午時分用交食北極髙四十度黃平象限表以本時太陽黃道度察黃道宫度取其與時分所對之數為太陽距春分後時分又以凌犯時刻加減十二時不及十二時則加十二時過十二時則減十二時為太陽距午後時分兩數相加加滿二十四時去之用其餘得春分距午時分春分距午時分者即本時春分距午後之時分也與日食春分距午時分之理同求黃平象限宫度用交食北極髙四十度黃平象限表以春分距午時分察表內時分相近者取其與黃平象限相對之數得黃平象限宫度日食推黃平象限宫度與月距限同在一條凌犯視差有專用黃平象限宫度之處故另列一條以便於用求月距限以黃平象限宫度與星經度相減餘為月距限度凌犯時太陰與星同度故以星經度與黃平象限宫度相減餘即為月距限度星經度大於黃平象限宫度為限東小於黃平象限宫度為限西求限距地髙用交食北極髙四十度黃平象限表以春分距午時分察表內時分相近者取其與限距地髙相對之數得限距地髙求正交經度依月離厯法推得本時正交實行得正交經度求限距交黃平象限宫度內減正交經度不足減者加十二宫減之餘為限距交求限距緯用月離黃白距度表以限距交宫度按本日月離黃白大距相近限內察其所對之度分秒得限距緯并記南北號求白道髙度置限距地髙加減限距緯北加南減得白道髙度白道髙度者黃平象限上白道距地平之髙度雖黃白距緯與地平髙弧不同然數度之間相去不逺故先求得黃平象限距交之度以求其距緯乃與限距地髙相加減即為白平象限距地平之髙雖黃平象限與白平象限經度亦自不同而白平象限之髙與當黃平象限處略相等且以求白道髙弧交角所差無多故借用以從簡易求太陰髙弧用交食太陽髙􅋃表以月距限及白道髙度察其所對之度分秒八表以白道髙度當限距地髙得太陰髙􅋃求白道髙􅋃交角用交食黃道髙􅋃交角表以月距限及白道髙度察其所對之度分秒入表以白道髙度當限距地髙得白道髙􅋃交角黃道髙􅋃交角表以月距限及限距地髙立算今既以白道髙度當限距地髙故所得即為白道髙􅋃交角求太陰引數依月離厯法求得本時太陰平引得太陰引數求太陰距地用交食視半徑表以太陰引數宫度察其與月距地相對之數得太陰距地求髙下差用月離太陰地半徑差表以太陰髙􅋃按太陰距地限察其所對之數得髙下差恆星無視差故太陰地半徑差即髙下差若太陰凌犯火金水諸星則各用本星地半徑差表以太陰髙􅋃按本星引數宫限察得本星地半徑差與太陰地半徑差相減即髙下差與日食髙下差之理同求東西差及南北差用交食東西南北差表以白道髙􅋃交角及髙下差察其與東西差所對之數得東西差隨察其與南北差所對之數得南北差求太陰距交星經度內減正交經度不足減者加十二宫減之得太陰距交凌犯時太陰與星同度故於星經度內減正交經度即得太陰距交求太陰實緯用月離黃白距度表以太陰距交宫度按本日月離黃白大距相近限內察其所對之度分秒得太陰實緯并記南北號求太陰視緯置太陰實緯加減南北差得太陰視緯實緯在黃道南則加南北差而視緯仍為南實緯在黃道北則減南北差而視緯仍為北若實緯在黃道北而南北差大於實緯則反減而視緯即變為南求太陰距星視緯與星緯同在黃道南或同在黃道北者則相減得太陰距星一在黃道南一在黃道北者則相加得太陰距星相距一度以內者用相距一度以外者不用定太陰在上在下之法與取凌犯入限同求太陰實行用月離太陰實行表以太陰引數宫度察其所對之分秒得太陰實行求視時距分以太陰實行化秒為一率三千六百秒為二率東西差化秒為三率求得四率為秒以分收之得視時距分太陰距限西為加太陰距限東為減求凌犯視時置凌犯時刻加減視時距分得凌犯視時御製厯象考成下編卷十
