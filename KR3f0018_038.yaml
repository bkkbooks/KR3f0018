body:
  text: 欽定四庫全書御製厯象考成表卷六上交食表二黃平象限表上自北極髙十六度度至北極髙二十二黃平象限表黃平象限表自北極髙一十六度至北極髙四十六度按正午黃道宫度逐假列之三宫初度為春分故表從三宫初度起表名春分距午者乃春分距午赤道度所變之時分秒也每一度變時之四分每十五分變時之一分每十五秒變時之一秒春分距午宫度愈逺則所變時分愈多不因北極髙下而殊也黃平象限者乃本時黃平象限之宫度也限距地髙者乃本時黃平象限距地平之髙度也其過天頂之南北則以界線分之蓋中國地面在赤道北黃道恆在天頂南自北極髙一十六度至北極髙二十三度正午黃道近夏至則黃道過天頂北夏至後復過天頂南故界線所分即南北差之加減所由辨也用表之法設京師北極髙四十度太陽黃道經度三宫一十五度合朔距午後二時零三分求春分距午時分及黃平象限宫度并限距地髙則察本表正午黃道三宫一十五度與春分距午相對之數為五十五分一十四秒與合朔距午後二時零三分相加得二時五十八分一十四秒為所求春分距午時分乃以二時五十八分一十四秒察春分距午時分相近者得二時五十八分零六秒其與黃平象限相對之數為四宫二十三度五十三分四十四秒即所求之黃平象限宫度其與限距地髙相對之數為六十七度五十七分零四秒即所求之限距地髙也御製厯象考成表卷六上
