body:
  text: 欽定四庫全書御製厯象考成表卷八交食表四黄道髙弧交角表太陽髙弧表東西南北差表緯差角表黄道髙弧交角表黄道髙弧交角表以日距限及限距地髙縱横列之日距限自一度至九十度分三段列於前每段三十度限距地髙自二十度至八十九度分七段列於上每段一十度中列逐度之黄道髙弧交角用表之法以日距限之度對限距地髙之度其縱横相遇即所求之黄道髙弧交角也設日距限三十度限距地髙二十五度求黄道髙弧交角則察日距限三十度與限距地髙二十五度所對之數為七十六度五十二分三十二秒即所求之黄道髙弧交角也若日距限及限距地髙皆有零分者用中比例三次求之太陽髙弧表太陽髙弧表亦以日距限及限距地髙縱横列之日距限自一度至九十度分三段列於前每段三十度限距地髙自二十度至八十九度分七段列於上每段一十度中列逐度之太陽髙弧用表之法以日距限之度對限距地髙之度其縱横相遇即所求之太陽髙弧也設日距限六十一度限距地髙二十五度求太陽髙弧則察日距限六十一度與限距地髙二十五度所對之數為一十一度四十九分二十三秒即所求之太陽髙弧也若日距限及限距地髙皆有零分者亦用中比例三次求之東西南北差表東西南北差表以交角及髙下差分順逆列之交角自一度至四十五度順列於前自四十五度至八十九度逆列於後中按髙下差分數列逐度東西南北差之分秒順度用上東西南北差逆度用下東西南北差用表之法以髙下差之分對交角之度其縱横相遇即所求之東西南北差也設髙下差三分交角二十五度求東西南北差則察髙下差三分與交角二十五度所對之東西差為二分四十三秒即所求之東西差其南北差為一分一十六秒即所求之南北差也交角為順度故用上東西南北差若髙下差及交角皆有零分秒者用中比例三次求之緯差角表緯差角表以并徑及距緯縱横列之并徑自三十一分至六十四分列於前視緯自一分至六十四分列於上太陽最小之半徑一十四分五十九秒三十微太陰最小之半徑一十五分五十三秒三十微兩半徑相并得三十分五十三秒太陰最大之半徑一十六分五十一秒地影最大之半徑四十六分四十八秒兩半徑相并得六十三分三十九秒故并徑自三十一分起至六十四分止中列逐分之緯差角用表之法以并徑之分對距緯之分其縱横相遇即所求之緯差角也設并徑三十四分距緯三分求緯差角則察并徑三十四分與距緯三分所對之數為五度零三分四十四秒即所求之緯差角也若并徑及距緯有零秒者滿三十秒以上則進作一分不用中比例因逐分之緯差角雖有數度之差而定交食方位所差甚微故也御製厯象考成表卷八
