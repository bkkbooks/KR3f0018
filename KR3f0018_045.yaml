body:
  text: 欽定四庫全書御製厯象考成表卷十一火星表火星年根表火星周嵗平行表火星周日平行表火星均數表火星升度差表火星距黃道表火星地半徑差表火星年根表火星年根表以距冬至及最髙行正交行逐年列之前用紀年者乃厯元後逐年之干支也表名距冬至者乃逐年天正冬至次日子正火星平行距丑宫初度之宫度也求逐年距冬至法厯元甲子年天正冬至火星平行應二宫一十三度三十九分五十二秒一十五微即厯元甲子年火星平行距冬至之數此後用加法如本年為平年則加三百六十五日之火星平行六宫一十一度一十七分一十四秒三十三微四十七纖零二忽四十芒即得次年距冬至之數如本年為閏年則加三百六十六日之火星平行六宫一十一度四十八分四十一秒一十三微五十九纖一十忽二十四芒即得次年距冬至之數加滿十二宫者去之滿三十纖以上者進作一微不足三十纖者去之後倣此最髙行者乃逐年天正冬至次日子正最髙過冬至之宫度也求逐年最髙行法厯元甲子年天正冬至最髙應八宫零三十三分一十一秒五十四微即厯元甲子年最髙過冬至之數此後用加法如本年為平年則加三百六十五日之最髙行一分零六秒五十七微一十九纖五十六忽二十八芒即得次年最髙過冬至之數如本年為閏年則加三百六十六日之最髙行一分零七秒零八微二十纖一十九忽二十八芒即得次年最髙過冬至之數正交行者乃逐年天正冬至次日子正正交過冬至之宫度也求逐年正交行法厯元甲子年天正冬至正交應四宫一十七度五十一分五十四秒零七微即厯元甲子年正交過冬至之數此後用加法如本年為平年則加三百六十五日之正交行五十二秒五十四微五十三纖三十六忽零八芒即得次年正交過冬至之數如本年為閏年則加三百六十六日之正交五十三秒零三微三十五纖三十忽零九芒即得次年正交過冬至之數用表之法如求康熙六十一年壬寅之年根則察本表紀年自厯元甲子年後第一壬寅為所求之年乃視壬寅所對各數録之其距冬至為四宫二十七度一十八分零五秒四十微其最髙行為八宫零一度一十五分三十七秒五十一微其正交行為四宫一十八度二十五分二十六秒一十一微也火星周嵗平行表火星周嵗平行表以火星平行及最髙行正交行逐日列之其前用日數者自一日至三百六十六日之日數也表名平行者乃火星本輪自一日至三百六十六日之平行各數也火星每日平行三十一分二十六秒四十微一十二纖零七忽四十四芒纍加之即得逐日平行之各數最髙行者乃火星本天自一日至三百六十六日之最髙行各數也最髙每日行一十一微零二十三忽纍加之即得逐日最髙行之各數正交行者乃自一日至三百六十六日之正交行各數也正交每日行八微四十一纎五十四忽零一芒纍加之即得逐日正交行之各數用表之法如求冬至後三十一日之火星平行及最髙行正交行則察本表日數三十一所對之數録之其平行為一十六度一十四分四十六秒四十六微即三十一日火星平行之共數其最髙行為五秒四十一微即三十一日最髙行之共數其正交行為四秒三十微即三十一日正交行之共數也火星周日平行表火星周日平行表以一日內之時分秒遞降列之表分兩段第一段自一至三十者一時至三十時一分至三十分一秒至三十秒第二段三十一至六十者三十一時至六十時三十一分至六十分三十一秒至六十秒其所對之數則火星逐時逐分逐秒之平行數也火星每日之平行用二十四時除之得一分一十八秒三十六微四十纖三十忽一十九芒是為一時之平行纍加之為逐時之平行逐分逐秒之平行皆同數而遞降一位時之平行為度分秒微分之平行為分秒微纖秒之平行為秒微纖忽用表之法如求一十八時三十二分四十五秒之火星平行則察本表一十八時所對之數為二十三分三十五秒三十二分所對之數為四十一秒五十五微三十四纖四十五秒所對之數為五十八微五十七纖三十忽合計三數得二十四分一十七秒五十四微三十一纖三十忽即所求之火星平行也火星均數表火星均數表按引數宫度分順逆列之初宫至五宫依次順列於前六宫至十一宫依次逆列於後表名初均者火星本輪均輪所生之均數也順度為減逆度為加次輪心距地數者乃次輪心自最髙至最卑逐宫逐度距地心之數也次輪半徑本數者乃火星最小次輪半徑與逐宫逐度本天髙卑差相加之數也火星次輪半徑在本天最髙則大在本天最卑則小故以逐宫逐度之本天髙卑差與最小次輪半徑相加為次輪半徑本數太陽髙卑差數者乃太陽髙卑所生火星次輪半徑之差數也火星次輪半徑太陽在最髙時則大太陽在最卑時則小故以太陽引數求其逐宫逐度之差為太陽髙卑差數用表之法以引數之宫對引數之度分其縱橫相遇即所求之數也設火星引數為初宫四度五十分求初均及次輪心距地本天次輪半徑則察初宫四度五十分與初均所對之數為四十八分二十二秒其號為減即所求之初均其所對之次輪心距地數為一一一一一二六即所求之次輪心距地其所對之次輪半徑本數為六五六七八八即所求之本天次輪半徑也又設太陽引數為七宫二十度求太陽髙卑差則以太陽引數減六宫得一宫二十度太陽引數過六宫者減六宫不及六宫者加六宫因太陽引數初宫起最卑此表初宫起最髙故也察其所對之太陽髙卑差數為一九三二八即所求之太陽髙卑差也若引數有零分者亦按中比例法求之火星升度差表火星升度差表按兩交前後分順逆列之兩交後六宫列於上兩交前六宫列於下前後列距交本道度分順逆以别加減中列逐宫逐度之升度差火星距交實行在上六宫者用順度其號為減火星距交實行在下六宫者用逆度其號為加用表之法以距交實行之宫對距交實行之度其縱橫相遇即所求之升度差也設火星距交實行為一宫二十四度求升度差則察一宫二十四度所對之數為五十秒即所求之升度差其號為減是為減差也若距交實行有零分者亦按中比例法求之火星距黃道表火星距黃道表亦按兩交前後分順逆列之兩交後之各宫列於上初宫至二宫係正交後在黃道北六宫至八宫係中交後在黃道南其數同兩交前之各宫列於下三宫至五宫係中交前在黃道北九宫至十一宫係正交前在黃道南其數同前後列距交本道度中列逐宫逐度之星距黃道數即次輪心距黃道之數火星距交實行在上六宫者用順度火星距交實行在下六宫者用逆度用表之法以距交實行之宫對距交實行之度其縱橫相遇即所求之星距黃道線也設火星距交實行為初宫一十二度求星距黃道線則察初宫一十二度所對之數為六六五一六即所求之火星距黃道線也若距交實行有零分者亦按中比例法求之火星地半徑差表火星地半徑差表分最髙中距最卑三限列之其前列實髙度火星引數自十宫一十五度至一宫一十五度為最髙限自一宫一十五度至四宫一十五度自七宫一十五度至十宫一十五度皆為中距限自四宫一十五度至七宫一十五度為最卑限表內分秒即三限實髙度所生之地半徑差也用表之法如火星引數當最髙限推得實髙五十三度求地半徑差則察最髙限實髙五十三度所對之數為四十秒即所求之地半徑差與實髙五十三度相減餘五十二度五十九分二十秒為本時火星之視髙也如先測得火星視髙五十二度五十九分二十秒則以地半徑差四十秒與視髙相加得五十三度為本時火星之實髙也髙度有零分者滿三十分以上則進作一度不用中比例因逐度地半徑差所差甚微故也御製厯象考成表卷十一
