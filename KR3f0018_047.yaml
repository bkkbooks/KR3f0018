body:
  text: 欽定四庫全書御製厯象考成表卷十三水星表水星年根表水星周嵗平行表水星周日平行表水星均數表水星距限表水星距黃道表水星距地表水星地半徑差表五星伏見距日黃道度表附五星伏見距日加減差表附水星年根表水星年根表以距冬至及最髙行伏見行逐年列之前用紀年者乃厯元後逐年之干支也表名距冬至者乃逐年天正冬至次日子正水星平行距丑宫初度之分秒也水星平行亦與太陽平行同最髙行者乃逐年天正冬至次日子正最髙過冬至之宫度也求逐年最髙行法厯元甲子年天正冬至最髙應十一宫零三度零三分五十四秒五十四微即厯元甲子年最髙過冬至之數此後用加法如本年為平年則加三百六十五日之最髙行一分四十五秒零九微四十八纎四十六忽五十六芒即得次年最髙過冬至之數如本年為閏年則加三百六十六日之最髙行一分四十五秒二十七微零六纎零四十二芒即得次年最髙過冬至之數滿三十纎以上者進作一微不足三十纎者去之後倣此伏見行者乃逐年天正冬至次日子正水星距次輪平逺之宫度也求逐年伏見行法厯元甲子年天正冬至伏見應十宫零一度一十三分一十一秒一十七微即厯元甲子年伏見行距平逺之數此後用加法如本年為平年則加三百六十五日之伏見行三周又一宮二十三度五十六分四十二秒三十一微五十三纎三十八忽五十芒即得次年伏見行距平逺之數如本年為閏年則加三百六十六日之伏見行三周又一宫二十七度零三分零六秒三十八微五十三纎零八忽一十二芒即得次年伏見行距平逺之數加滿十二宫者去之用表之法如求康熙六十一年壬寅之年根則察本表紀年自厯元甲子年後第一壬寅為所求之年乃視壬寅所對各數録之其距冬至為八分一十八秒三十二微其最髙行為十一宫零四度一十分三十三秒四十三微其伏見行為七宫零九度零五分四十四秒三十二微也水星周嵗平行表水星周嵗平行表以水星平行及最髙行伏見行逐日列之其前用日數者自一日至三百六十六日之日數也表名平行者乃水星本輪自一日至三百六十六日之平行各數也最髙行者乃水星本天自一日至三百六十六日之最髙行各數也最髙每日行一十七微一十七纎一十三忽四十六芒纍加之即得逐日最髙行之各數伏見行者乃自一日至三百六十六日水星行次輪之各數也伏見行每日行三度零六分二十四秒零六微五十九纎二十九忽二十二芒纍加之即得逐日伏見行之各數用表之法如求冬至後二十九日之水星平行及最髙行伏見行則察本表日數二十九所對各數録之其平行為二十八度三十五分零一秒三十五微即二十九日水星平行之共數其最髙行為八秒二十一微即二十九日最髙行之共數其伏見行為三宫零五分三十九秒二十三微即二十九日伏見行之共數也水星周日平行表水星周日平行表以一日內之時分秒遞降列之表分兩假並與太陽平行同用表之法如求一十八時二十分三十二秒之水星平行則察本表一十八時所對之數為二度一十九分四十八秒零五微二十分所對之數為二分三十五秒二十微零六纎三十二秒所對之數為四秒零八微三十二纎零九忽合計三數得二度二十二分二十七秒三十三微三十八纎零九忽即所求之水星平行也水星均數表水星均數表以引數宫度求初均及中分以伏見實行宫度求次均及較分初宫至五宫依次順列於前六宫至十一宫依次逆列於後表名初均者乃水星本輪均輪所生之均數順度為減逆度為加中分者則逐宫逐度次輪心距地心與最髙距地心之較為六十分中之幾分也求中分之法以水星次輪心在最髙距地心之一六八二一五五與水星次輪心在最卑距地心之九五四七一九相減餘一一三五四六為一率六十分為二率逐宫逐度次輪心距地心與最髙距地心相減餘為三率求得四率即逐宫逐度之中分也求次輪心距地心之法詳厯理求初均數篇次均者乃次輪心當最髙水星行次輪周逐宫逐度之次均數順度為加逆度為減較分者則次輪心在最卑逐宫逐度之次均與次輪心在最髙逐宫逐度之次均相較之數也求較分之法與土星同用表之法設水星引數為初宫一十一度二十分求初均及中分則察初宫一十一度二十分與初均所對之數為二十一分四十三秒其號為減即所求之初均其與中分所對之數為一分零三秒即所求之中分也初宫在上故用順度又設伏見實行為二宫五度三十分求次均及較分則察二宫五度三十分與次均所對之數為一十五度五十五分二十七秒其號為加即所求之次均其與較分所對之數為一度三十一分四十秒即所求之較分也二宫在上故用順度若引數或伏見實行有零分者按中比例法求之水星距限表水星距限表按正交中交分順逆列之初宫至五宫為正交後列於上六宫至十一宫為中交後列於下水星距交實行在上六宫者用順度在下六宫者用逆度用表之法以距交實行之宫對距交實行之度其縱橫相遇即所求之距限也表分南北兩限依星在黃道之南北取用水星次輪面與黃道相交之角南北不同故分列兩表設水星距交實行一宫二十二度星在黃道北則察黃道北距限表一宫二十二度所對之數為五度三十二分三十七秒即所求之距限也距交實行有零分者滿三十分以上則進作一度不用中比例因逐度交角所差甚微故也水星距黃道表水星距黃道表按次輪兩交前後分順逆列之兩交後之各宫列於上初宫至二宫係正交後在黃道北六宫至八宫係中交後在黃道南其數同兩交前之各宫列於下三宫至五宫係中交前在黃道北九宫至十一宫係正交前在黃道南其數同前後列距次交實行度中列逐宫逐度之星距黃道數即次輪半徑與次緯正弦相比例之數水星距次交實行在上六宫者用順度水星距次交實行在下六宫者用逆度用表之法以距次交實行之宫對距次交實行之度其縱橫相遇即所求之星距黃道線也表分二十限依實交角相近者取用水星次輪面與黃道相交之角逐度不同故以最小之交角四度五十五分三十二秒與最大之交角六度三十一分零二秒均分為二十限各求其星距黃道數列表每限交角相差五分夫交角止差五分則星距黃道數所差甚微可以不計故依實交角相近者取用也設實交角五度零一分水星距次交實行為初宫二十二度求星距黃道線則察交角五度星距黃道表為與實交角五度零一分相近初宫二十二度所對之數為一二五六九九即所求之水星距黃道線也若距次交實行有零分者亦按中比例法求之水星距地表水星距地表以伏見實行宫度求星距地以引數宫度求距地差初宫至五宫列於上六宫至十一宫列於下前列順度後列逆度中列逐宫逐度之星距地及距地差星距地者次輪心在最髙水星行次輪周逐宫逐度之距地心線距地差者乃水星次輪心自最髙至最卑逐宫逐度之距地心線與最髙距地心線之較也宫在上者用順度宫在下者用逆度用表之法設水星伏見實行為初宫二十四度求星距地則察初宫二十四度與星距地所對之數為一四二八五三六即所求之星距地也又設水星引數為一宫二十六度求距地差則察一宫二十六度與距地差所對之數為四一二七八即所求之距地差也若伏見實行或引數有零分者亦按中比例法求之水星地半徑差表水星地半徑差表分最髙中距最卑三限列之其前列實髙度水星引數自十宫一十五度至一宫一十五度為最髙限自一宫一十五度至四宫一十五度自七宫一十五度至十宫一十五度皆為中距限自四宫一十五度至七宫一十五度為最卑限表內分秒即三限實髙所生之地半徑差也用表之法如水星引數當最卑限推得實髙一十九度求地半徑差則察最卑限實髙一十九度所對之數為五分即所求之地半徑差與實髙一十九度相減餘一十八度五十五分為本時水星之視髙也如先測得水星視髙一十八度五十五分則以地半徑差五分與視髙相加得一十九度為本時水星之實髙也髙度有零分者滿三十分以上則進作一度不用中比例因逐度地半徑差所差甚微故也五星伏見距日黃道度表五星伏見距日黃道度表以星之黃道宫度按晨夕列之初宫至二宫六宫至八宫列於上三宫至五宫九宫至十一宫列於下前後分順逆列星之黃道度中列各星之距日黃道度分宫在上者用順度宫在下者用逆度用表之法求晨見晨不見用晨宫求夕見夕不見用夕宫設土星當晨見限度其黃道經度為初宫一十二度求距日黃道度則察晨初宫一十二度與土星所對之數為一十七度一十一分即所求之距日黃道度也星經度有零分者滿三十分以上則進作一度不用中比例因逐度距日黃道度所差甚微故也五星伏見距日加減差表五星伏見距日加減差表亦以星之黃道宫度按晨夕列之初宫至二宫六宫至八宫列於上三宫至五宫九宫至十一宫列於下前後分順逆列星之黃道度中列各星黃道南北自一度至八度之距日加減差宫在上者用順度宫在下者用逆度南緯為加北緯為減用表之法求晨見晨不見用晨宫求夕見夕不見用夕宫設土星當夕不見限度其黃道經度為六宫二十四度緯度在黃道北二度求距日加減差則察夕六宫二十四度與緯二度所對之數為二度四十三分即所求之距日加減差其緯度在北即為減差也星經度有零分者滿三十分以上則進作一度緯度有零分者用中比例求之御製歷象考成表卷十三
