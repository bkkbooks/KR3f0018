body:
  text: 欽定四庫全書御製歴象考成上編卷三弧三角形下斜弧三角形論斜弧三角形邊角比例法斜弧三角形作垂弧法斜弧三角形用總較法次形法附斜弧三角形設例八則斜弧三角形論弧三角之有斜弧形猶直線三角之有銳鈍形也但直線三角之銳鈍形惟二種一種三角俱鋭一種一鈍兩銳而斜弧形則不然或三角俱銳或三角俱鈍或兩銳一鈍或兩鈍一銳其三邊或俱大過於九十度或俱小不及九十度或兩大一小或兩小一大參錯成形為類甚多而新法算書所載推算之法抑復繁雜難稽葢三角三邊各有八線但線與線之比例相當即可相求是故或同步一星或同推一數而所用之法彼此互異遂使學者莫知所從兹約以三法求之無論角之銳鈍邊之大小並視先所知之三件為斷其一先知之三件有相對之邊角又有對所求之邊角則用邊角比例法其一先知之三件有相對之邊角而無對所求之邊角或求角而無對角之邊或求邊而無對邊之角則用垂弧法其一先知之三件無相對之邊角或三邊求角或有兩邊一角而角在所知兩邊之間或三角求邊或有兩角一邊而邊在所知兩角之間則用總較法明此三法則斜弧之用已備而七政之升降出沒經緯之縱橫交加無不可推測而知矣斜弧三角形邊角比例法凡斜弧三角形先知之三件有相對之邊角又有對所求之邊角者則用邊角比例法如甲乙丙斜弧三角形有甲角有甲乙邊有乙丙邊而求丙角則乙丙為對所知之邊甲為所知之角甲乙為對所求之邊乃以對所知之乙丙邊正弦與對所求之甲乙邊正弦之比同於所知之甲角正弦與所求之丙角正弦之比也又如丁戊己斜弧三角形有丁角有己角有丁戊邊而求戊己邊則己角為對所知之角丁戊為所知之邊丁為對所求之角乃以對所知之己角正弦與對所求之丁角正弦之比同於所知之丁戊邊正弦與所求之戊己邊正弦之比也斜弧三角形作垂弧法凡斜弧三角形先知之三件有相對之邊角而無對所求之邊角者則用垂弧法如甲乙丙斜弧三角形有甲角有甲乙邊有乙丙邊而求乙角及甲丙邊乃自乙角作乙丁垂弧於形内分為甲乙丁丙乙丁兩正弧三角形算之先用甲乙丁形求乙丁垂弧甲丁分邊及乙分角葢此形有甲角有甲乙邊有丁直角以丁角正弦即半徑與甲角正弦之比同於甲乙邊正弦與乙丁垂弧正弦之比而得乙丁垂弧以半徑與甲角餘弦之比同於甲乙邊正切與甲丁邊正切之比而得甲丁分邊以甲乙邊正弦與甲丁邊正弦之比同於丁角正弦即半徑與乙分角正弦之比而得乙分角次用丙乙丁形求乙分角及丁丙分邊葢此形有乙丙邊有乙丁垂弧有丁直角以乙丙邊正切與乙丁垂弧正切之比同於半徑與乙分角餘弦之比而得乙分角以丁角正弦即半徑與乙分角正弦之比同於乙丙邊正弦與丁丙邊正弦之比而得丁丙分邊既得兩分角並之即乙角得兩分邊並之即甲丙邊也又如戊己庚斜弧三角形有戊角有庚角有己庚邊而求戊庚邊及己角乃自己角作己辛垂弧於形外將戊庚弧引長至辛作戊己辛庚己辛兩正弧三角形算之先用庚己辛形求己辛垂弧庚辛虚邊及己虚角葢此形有庚外角有己庚邊有辛直角以辛角正弦即半徑與庚角正弦之比同於己庚邊正弦與己辛垂弧正弦之比而得己辛垂弧以半徑與庚角餘弦之比同於己庚邊正切與庚辛虚邊正切之比而得庚辛虛邊以己庚邊正弦與庚辛邊正弦之比同於辛角正弦即半徑與己虚角正弦之比而得己虚角次用戊己辛形求戊辛總邊及己總角葢此形有戊角有己辛垂弧有辛直角以戊角正切與半徑之比同於己辛垂弧正切與戊辛邊弦弦之比而得戊辛總邊以己辛垂弧正弦與戊辛邊正弦之比同於戊角正弦與己角弦弦之比而得己總角既得戊辛總邊内減去庚辛虚邊即戊庚邊得己總角内減去己虚角即己角也斜弧三角形用總較法凡斜弧三角形知三邊求角者則用總較法以角傍之兩邊相加為總弧相減為較弧各取其餘弦相加減總弧較弧俱不過象限或俱過象限則兩餘弦相減若一過象限一不過象限則兩餘弦相加其或過二象限者與過一象限同過三象限者與不過象限同折半為中數又以對邊之矢與較弧之矢相減餘為矢較乃以中數與矢較為比同於半徑與所求角之正矢之比也如知兩邊一角而角在兩邊之間者以半徑與所知角之正矢為比同於中數與矢較之比既得矢較與較弧之矢相加即得對邊之矢也如甲乙丙斜弧三角形有三邊求甲角則以甲角傍之甲乙甲丙二邊相加得乙丁甲丙甲戊甲丁三弧同為丁戊距等圈所截故其度相等為總弧其正弦為丁己餘弦為己庚甲乙與甲丙相減餘乙戊為較弧其正弦為戊辛餘弦為辛庚兩餘弦相加得己辛乙丁總弧過象限乙戊較弧不過象限其兩餘弦在圜心之兩邊故相加折半得辛壬與癸子等為中數乙丙對邊與乙丑等乙丙與乙丑兩弧同為丑寅距等圈所截故其度相等其正弦為丑卯餘弦為卯庚正矢為乙卯以乙卯與乙戊較弧之正矢乙辛相減餘辛卯與辰巳等為矢較戊辰巳與戊癸子為同式兩勾股形故癸子與辰巳之比同於戊子與戊巳之比也又午庚為半徑戊子為距等圈之半徑午未與戊己兩段同為甲丙申大圈所分則戊子與戊己之比原同於午庚與午未之比是以中數癸子與矢較辰巳之比即同於半徑午庚與甲角正矢午未之比也以午未與午庚半徑相減餘未庚為甲角之餘弦檢表即得甲角所當午申弧之度也若先有甲角及甲乙甲丙二邊求乙丙對邊則以半徑午庚與甲角正矢午未之比即同於中數癸子與矢較辰巳之比既得辰巳與辛卯等與乙戊較弧之正矢乙辛相加得乙卯為乙丙對邊之正矢也如有甲乙甲丙乙丙三邊求乙角則以乙角傍甲乙乙丙二邊相加得甲丁乙丙乙丁乙戊三弧同為戊丁距等圈所截故其度相等為總弧其正弦為丁己餘弦為己庚甲乙與乙丙相減餘甲戊為較弧其正弦為戊辛餘弦為辛庚兩餘弦相減餘辛己甲丁總弧甲戊較弧皆不過象限其兩餘弦同在圜心之一邊故相減折半得辛壬與癸子等為中數甲丙對邊與甲丑等甲丙與甲丑兩弧同為寅丑距等圈所截故其度相等其正弦為丑卯餘弦為卯庚正矢為甲卯以甲卯與甲戊較弧之正矢甲辛相減餘辛卯與辰巳等為矢較戊癸子與戊辰巳為同式兩勾股形故癸子與辰巳之比同於戊子與戊巳之比也又午庚為半徑戊子為距等圈之半徑戊巳與午未兩段同為乙丙申大圈所分則戊子與戊巳之比原同於午庚與午未之比是以中數癸子與矢較辰巳之比即同於半徑午庚與乙角大矢午未之比也凡鈍角所用諸線皆與外角同惟矢則有正矢大矢之别如庚未為乙銳角所當申酉弧之餘弦亦為乙鈍角所當午申弧之餘弦檢表銳角即得本角度鈍角與半周相減亦即得本角度而未酉為乙銳角之正矢乃於酉庚半徑内減庚未餘弦午未為乙鈍角之大矢乃於午庚半徑加庚未餘弦也此正矢大矢之别過弧亦然於午未大矢内減午庚半徑餘庚未為乙角之餘弦檢表得乙外角度與半周相減餘即乙鈍角之度也若先有乙鈍角及甲乙乙丙二邊求甲丙對邊則以半徑午庚與乙角大矢午未之比即同於中數癸子與矢較辰巳之比既得辰巳與辛卯等與甲戊較弧之正矢甲辛相加得甲卯為甲丙對邊之正矢也斜弧三角形知三角求邊者則用次形法如甲乙丙形可易為丁戊己次形葢甲角之度當庚辛弧而庚辛與己戊等庚己與辛戊皆象限故庚辛與己戊等故本形之甲角即次形之己戊邊乙外角之度當壬癸弧而壬癸與己丁等壬己與癸丁皆象限故壬癸與己丁等故本形之乙外角即次形之己丁邊丙角之度當子丑弧而子丑與戊丁等子戊與丑丁皆象限故子丑與戊丁等故本形之丙角即次形之戊丁邊是本形之三角即次形之三邊也又次形丁角之度當癸丑弧而癸丑與乙丙等丙丑與乙癸皆象限故癸丑與乙丙等故次形之丁角即本形之乙丙邊戊外角之度當辛子弧而辛子與甲丙等丙子與甲辛皆象限故辛子與甲丙等故次形之戊外角即本形之甲丙邊己角之度當庚壬弧而庚壬與甲乙等乙壬與甲庚皆象限故庚壬與甲乙等故次形之己角即本形之甲乙邊是本形之三邊即次形之三角也故用丁己戊次形仍用總較法算之求得次形之三角即得本形之三邊也如有乙角丙角及乙丙邊而求甲角亦用丁戊己次形有己丁邊戊丁邊及丁角仍用總較法算之求得己戊邊即甲角也設如申正初刻測得太陽髙三十二度地平經度偏西八十一度四十二分四十八秒求太陽距赤道緯度幾何甲乙丙三角形甲為北極乙為天頂丙為太陽乙丁戊己為子午經圏乙丙癸戊為地平經圏丁己為地平庚辛為赤道庚壬為申正初刻距午正赤道六十度即甲角丙癸為太陽髙三十二度即地平緯度一名髙弧與乙癸象限相減餘太陽距天頂五十八度即乙丙邊丁癸為地平經度偏西八十一度四十二分四十八秒與丁己半周相減餘癸己九十八度一十七分一十二秒即乙角丙壬為太陽距赤道緯度與甲壬象限相減餘甲丙邊為太陽距北極度故用甲乙丙三角形有甲乙二角及乙丙邊求甲丙邊以甲角六十度為對所知之角其正弦八百六十六萬零二百五十四為一率乙角九十八度一十七分一十二秒為對所求之角其正弦九百八十九萬五千五百九十三為二率乙丙五十八度為所知之邊其正弦八百四十八萬零四百八十一為三率求得四率九百六十九萬零一百七十六為所求甲丙邊之正弦檢表得七十五度四十二分零一秒即甲丙弧之度與九十度相減餘一十四度一十七分五十九秒即太陽距赤道北之緯度也此法用邊角相比例與直線三角形同但直線三角形以角之正弦與邊相比見數理精藴第十七卷此以角之正弦與邊之正弦相比其比例之理一也又以正弧之理明之試將甲乙弧引長至丁自丙角作丙丁垂弧則成甲丁丙乙丁丙兩正弧三角形先求乙丁丙形丁角正弦即半徑為一率乙角正弦為二率乙丙正弦為三率丙丁正弦為四率此第一比例也次求甲丁丙形甲角正弦為一率丁角正弦即半徑為二率丙丁正弦為三率甲丙正弦為四率此第二比例也然第二比例之二率三率即第一比例之一率四率而二率三率相乘與一率四率相乘之數等故用第一比例之二率三率而用第二比例之一率即得第二比例之四率此有對角求對邊之法也設如太陽距赤道北一十四度一十七分五十九秒測得髙弧三十二度地平經度偏西八十一度四十二分四十八秒求係何時刻甲乙丙三角形甲為北極乙為天頂丙為太陽丙壬為太陽距赤道北一十四度一十七分五十九秒甲丙即為太陽距北極七十五度四十二分零一秒丙癸為太陽髙三十二度乙丙即為太陽距天頂五十八度丁癸為地平經度偏西八十一度四十二分四十八秒癸己為九十八度一十七分一十二秒即乙角庚壬為太陽距午正赤道度即甲角故用甲乙丙三角形有乙角及甲丙乙丙二邊求甲角以甲丙七十五度四十二分零一秒為對所知之邊其正弦九百六十九萬零一百七十六為一率乙丙五十八度為對所求之邊其正弦八百四十八萬零四百八十一為二率乙角九十八度一十七分一十二秒為所知之角其正弦九百八十九萬五千五百九十三為三率求得四率八百六十六萬零二百五十四為所求甲角之正弦檢表得六十度即甲角度以六十度變得二時從午正初刻後計之因偏西故為午正後為