八十度之通弦有丑角七十四度一十四分五十一秒丙申甲三角形以丙甲兩角相併與申外角等丑巳子次輪全徑原與癸辰壬均輪全徑平行則己丑甲角與壬申丑角為平行線之内外角其度必等故以申丙甲角一百二十度與丙甲申角四度一十四分五十一秒相加得一百二十四度一十四分五十一秒即為己丑甲角内減去己丑午角五十度餘七十四度一十四分五十一秒為午丑甲角也求得丑甲午角一度三十一分二十三秒為二均數又求得午甲邊一千零一十萬一千六百一十七復用午甲未三角形求三均數此形有午甲邊一千零一十萬一千六百一十七有午未邊一十一萬七千五百有午角八十度求得午甲未角三十九分二十七秒為三均數也此初均數二均數俱為加差而三均數為減差故於二均數内減去三均數餘五十一分五十六秒為二三均數仍為加差葢次輪之最近丑點與次均輪心午點俱在平行丙點之前而太隂未點却在次均輪心午點之後故以二均與三均相減餘丑甲未角為二三均數於平行外加初均數丙甲丑角復加二三均數丑甲未角即得本時之實行也若均輪心在最髙庚後六十度為自行二宫初度而太隂距太陽二百二十度為下弦前四日其初均數丙甲丑角及二三均數丑甲未角加與十宮初度之數相等但實行在平行之後故俱為減差以減於平行而得實行也兩月食定交周白道與黄道斜交月行天一周必兩次過交而交無定處每一交之中退天一度有餘故每日太隂距交行度常多於每日平行經度其較即為每日交行度測法亦擇用兩月食其兩食必須太陽之距最髙等太隂之自行度等食分等食在陽厯或在隂厯亦等黄道南為陽厯黄道北為隂厯乃可推月行若干交周而復於故處西人依巴谷用前法推得四百四十一平年又二百一十二日九十四刻零五分一十三秒為朔策五千四百五十八交周五千九百二十三因定太隂每日距交得一十三度一十三分四十五秒三十九微四十纎一十四忽一十三芒即一十三度零十分度之二分二九三五三二六九三與每日平行經度一十三度一十分三十五秒零一微一十六纖一十四忽一十三芒相減餘三分一十秒三十八微二十四纖即百分度之五分二九五五五五五五一授時厯作百分度之五分二三六以周天三百六十度約之得百分度之五分一六七為兩交每日左旋之度也今擇用兩月食以明其法如左第一食順治十三年丙申十一月庚申朢子正後一十八時四十四分一十五秒月食一十五分四十七秒在陽厯日躔星紀宫一十度三十九分在最卑後三度四十九分於時月自行為三宫二十七度四十六分第二食康熙十三年甲寅十二月丙午朢子正後三時二十三分二十六秒月食一十五分五十秒在陽厯日躔星紀宫二十一度五十二分在最卑後一十四度二十一分於時月自行為三宫二十五度二十四分兩次月食太陽距最髙差一十度餘然地景之大小無異月自行差二度半食分差三秒所差甚微俱可勿論以上兩次月食相距中積二百二十三月乃用朔策定數五千四百五十八為一率交終定數五千九百二十三為二率此二數依巴谷所定二百二十三月為三率得四率二百四十一又五千四百五十八分之五千四百五十一可收作二百四十二差千分之一可以不論為兩次月食相距之交終數又以兩次月食相距中積六千五百八十五日零八時三十九分一十秒與每日太隂平行經度相乗以交終數二百四十二除之得一百二十九萬零八百一十二秒小餘八七九五九八為每一交行度與周天一百二十九萬六千秒相減餘五千一百八十七秒小餘一二四二為每一交退行度又以交終數除兩次月食相距中積日分得二十七日二一二二三三為交周日分乃以交周日分除每一交退行度得三分一十秒三十七微為兩交每日退行度與每日平行經度一十三度一十分三十五秒零一微相加得一十三度一十三分四十五秒三十八微為太隂每日距交行度比舊數止少一微今仍用舊數各以日數乘之得十日百日之行度以時分除之得每時每分之行度以立表黄白大距度及交均白道與黄道相距之緯曰大距度而交均者乃兩交平行與自行之差是二者常相因也葢相距之度時少時多而自行之度有遲有疾故必測得距度極多極少之數而後交行之遲疾可推測大距之法推得月離黄道鶉首宫初度又在黄道北月在黄道北則近天頂而地半徑差最㣲可以勿論而距交適足九十度時俟至子午線上測之得地平髙度乃於髙度内減去赤道髙及黄赤距緯度其餘即為黄白大距度也厯家用此法測得朔朢時之大距為四度五十八分三十秒即四度零十分度之九分七五上下弦時之大距為五度一十七分三十秒即五度零十分度之二分九一六授時厯無分朔朢兩弦皆六度以周天三百六十度每度六十分約之得五度五十四分三十九秒既得二數乃用弧三角形法推得逐日之大距及交均以立表如圖甲為黄極乙丙丁戊為黄道用朔朢與上下弦兩距度相加折半得五度零八分為黄白大距之中數取中數為半徑如己甲作己庚辛壬圈為白極繞黄極本輪又取兩距度之較數一十九分折半得九分三十秒為半徑如己癸作癸子丑寅圈為負白極均輪其心循己庚辛壬本輪左旋從己向庚每日行三分一十秒有餘白極則循癸子丑寅均輪左旋從癸向子行倍離之度半月一周如癸子丑寅均輪心在己朔朢時白極在癸白道交黄道於丙於戊其卯乙弧為大距四度五十八分三十秒與癸甲弧等上下弦時白極在丑白道亦交黄道於丙於戊其辰乙弧為大距五度一十七分三十秒與丑甲弧等如癸子丑寅均輪心從本輪己行至庚朔朢時白極在癸白道交黄道於乙於丁其卯丙弧為大距四度五十八分三十秒與癸甲弧等上下弦時白極在丑白道亦交黄道於乙於丁其辰丙弧為大距五度一十七分三十秒與丑甲弧等惟朔朢與上下弦時白極俱在丑甲線上平行自行相合故無交均數如白極從癸向子交行漸遲至子距癸九十度為朔與上弦之間或朢與下弦之間其行極遲白道交黄道於巳於午其未申弧為大距與子甲弧等子甲為白極距黄極之弧故與未申大距弧等於是用子甲己正弧三角形求子甲弧此形有己甲弧五度零八分有己子弧九分三十秒有己直角九十度當癸子弧求得子甲弧五度零八分零九秒與未申弧等為黄白大距又求得甲角一度四十六分零八秒為交均即自行遲於平行極大之差從子向丑則遲行之度漸減至丑而合於平行矣如白極從丑向寅交行漸疾至寅距丑九十度為上弦與朢之間或下弦與朔之間其行極疾己甲寅角亦一度四十六分零八秒寅甲兩極距弧亦與子甲等從寅向癸則疾行之度漸減至癸而又合於平行矣要之從癸向子至丑為前半周所求之諸甲角俱為減差以減交之平行而得交之實行從丑向寅至癸為後半周諸甲角之度皆以前半周等但俱為加差以加交之平行而得交之實行故用弧三角形法以己庚辛壬圈之半徑五度零八分及癸子丑寅圈之半徑九分三十秒為常用之兩邊以極距癸點之逐度為角得弧三角形一百八十求得各對角之弧為兩極大距如子甲之類近黄極之角為交均在前半周為減差後半周為加差而大距及交均之表全矣至於有大距之數而求逐度之小距度與日躔求黄赤距緯之法同視差太隂之視差有四一為蒙氣差能升卑為髙其理與數皆與太陽同一為髙下差即地半徑差生於地之半徑能變髙為下其理亦與太陽同而數則過之葢太陽本天半徑與地半徑之比例為千餘分之一而太隂本天半徑與地半徑之此例為五六十分之一故其差角迥别不可同論也又有東西差即經度差南北差即緯度差皆由髙下差而生算交食用之詳載交食本篇兹不具論如圖甲為地心乙為地面甲乙為地半徑乙丙為地平丁戊己為太隂本天庚辛壬癸為恒星天戊為太隂人從地面乙測之對恒星天於壬其視髙為壬乙丙角若從地心甲計之則見太隂於戊者對恒心天於辛其真髙為辛甲癸角此兩髙之差為乙戊甲角即髙下差然亦時時不同者一因太隂距地平近則差角大漸髙則漸小一因太隂在本天最髙則差角小在本天最卑則差角大與日躔之理同今亦約為最髙最卑中距三限於朢時及兩弦各以所測地面上太隂之髙度求太隂距地心之甲戊線朢時測中距兩弦時測最髙及最卑葢月自行在中距朢時次均輪心在次輪之最近月在次均輪之最下微小於本天若兩弦時則次均輪心在次輪之最逺已在本天之外月又在次均輪之最上未免太過於本天故於朢時測中距也又月自行在最髙兩弦時月距地心比朢時髙一次輪全徑又髙一次均輪全徑故於此時測最髙月自行在最卑兩弦時月距地心北朢時卑一次輪全徑又髙一次均輪全徑猶在朢時月體之下故於此時測最卑也如暢春園測得太隂髙六十二度四十分五十一秒四十三微同時於廣東廣州府測得太隂高七十九度四十七分二十六秒一十二微廣東子午線在京師西三度三十三分然髙下差甚微可勿論於時月自行三宫初度月距日一百八十度即朢時以之立法甲為地心乙為京師地面庚為天頂子為廣州府地面丑為天頂戊為太隂寅為赤道寅庚弧三十九度五十九分三十秒為暢春園赤道距天頂之度寅丑弧二十三度一十分為廣州府赤道距天頂之度以兩處赤道距天頂度相減餘一十六度四十九分三十秒為庚丑弧即庚甲丑角以暢春園髙度與一象限相減餘二十七度一十九分零八秒一十七微為庚乙戊角以廣州府髙度與一象限相減餘一十度一十二分三十三秒四十八微為丑子戊角先用乙甲子三角形此形有甲角一十六度四十九分三十秒又有乙甲及子甲俱地半徑命為一千萬乃以甲角折半之正弦倍之得二九二五九七七為乙子邊又以甲角與半周相減餘數半之得八十一度三十五分一十五秒為乙角亦即子角次用乙戊子三角形此形有乙子邊二九二五九七七有戊乙子角七十一度零五分三十六秒四十三微以庚乙戊角與子乙甲角相加得一百零八度五十四分二十三秒一十七微以減半周即得有戊子乙角一百零八度三十七分一十八秒四十八微於半周内減去乙子甲角八十一度三十五分一十五秒加入戊子丑角一十度一十二分三十三秒四十八微即得即有乙戊子角一十七分零四秒二十九微求得戊乙邊五五八二六五二五四末用戊乙甲三角形此形有乙甲地半徑一千萬有戊乙邊五五八二六五二五四有戊乙甲角一百五十二度四十分五十一秒四十三微於半周内減去庚乙戊角二十七度一十九分零八秒一十七微即得求得乙戊甲角二十七分四十九秒零四微為中距限太隂髙六十二度四十分五十一秒四十三微之髙下差求得戊甲邊五六七一七一三三四為太隂在本天中距時距地心之逺以地半徑較之其比例為一千萬與五億六千七百一十七萬一千三百三十四若命地半徑為一則月距地心為五十六又百分之七十二也乃依此法於月自行初宫初度月距日九十度時即上下弦測之求得甲乙線與戊甲線之比例為一與六十一又百分之九十八即月在本天最髙距地心最逺之數又於月自行六宫初度月距日九十度時測之求得甲乙線與戊甲線之比例為一與五十三又百分之七十一即月在本天最卑距地心最近之數於是自最近五十三至最逺六十二之十數逐度求其髙下差以立表隠見遲疾合朔之後恒以三日月見於西方故尚書註月之三日為哉生明然有朔後二日即見者更有晦日之晨月見東方朔日之夕月見西方者唐厯家遂為進朔之法致日食乃在晦宋元史已辨其非而未明其故葢月之隠見遲疾固有一定之理可按數而推殆因乎天行由於地度無庸轉移遷就也至於漢魏厯家未明盈縮遲疾之差以平朔著厯故有晦而月見西方朔而月見東方者此則推步之疎不可以隠見遲疾論也隠見之遲疾其故有三今並詳於後一因黄赤道之升降有斜正也葢春分前後各三宫由星紀至實沈六宫黄道斜升而正降月離此六宫則朔後疾見秋分前後各三宫由鶉首至析木六宫黄道正升而斜降月離此六宫則朔後遲見如上二圖前圖日躔降婁初度月離降婁一十五度為正降日入時月在地平上髙一十四度餘即可見葢入地遲而見早也後圖日躔夀星初度月離夀星一十五度為斜降日入時月在地平上髙六度餘即不可見葢入地疾而見遲也若晦前月離正升六宫則隠遲斜升六宫則隠早其理亦同一因月距黄緯有南北也葢月距黄道北則朔後見早距黄道南則朔後見遲如圖日躔降婁初度月離降婁一十五度而月距黄道北則月距地平之度多入地遲而見早月距黄道南則月距地平之度少入地疾而見遲也若晦前距黄道北則隠遲距黄道南則隠早其理亦同一因月視行之度有遲疾也葢月視行為遲厯則朔後見遲晦前隠遲視行為疾厯則朔後見早晦前隠早也夫月離正降宮度距日一十五度即可見以每日平行一十二度有竒計之則朔後一日有餘即見生明於西是故合朔如在甲日亥子之間月離正升宮度距黄道北而又行遲厯則甲日太陽未出亦見東方月離正降宫度距黄道北而又行疾歴則乙日太陽已入亦見西方矣御製歴象考成上編卷五
