body:
  text: 欽定四庫全書御製歴象考成上編卷五月離歴理太隂各種行度太隂平行度太隂本輪遲疾四限三月食推本輪半徑及最髙晦朔弦朢太隂四輪總論求初均數求二三均數兩月食定交周黄白大距度及交均視差隱見遲疾太隂各種行度太隂行度共有九種而隨天西轉之行不與焉一曰平行葢太隂之本天帶一本輪本輪心循本天自西而東每日平行一十三度有竒二十七日有餘而行天一周即白道經度也二曰自行葢本輪心循白道行自西而東即平行經度太隂復依本輪周行自東而西每日亦行一十三度有竒㣲不及本輪心行而與本輪心之行順逆參錯人目視之遂生遲疾故名自行以别之授時厯名為轉周滿一周為轉終其所生之遲疾差名為初均數也三曰均輪行西人第谷言用一本輪以齊太隂之行往往與實測未合因將本輪半徑三分之存其二分為均輪半徑用其一分為均輪半徑均輪循本輪用行自東而西即自行轉周度太隂復依均輪周行自西而東每日行二十六度有竒為輪心行之倍度均輪心行一度月行均輪周二度也其所生之遲疾差即今所用之初均數也四曰次輪行葢用本輪均輪推得遲疾之最大差為四度有竒於朔朢時測之其數恰合而於上下弦時測之則不合其大差至七度有竒故厯家又於均輪之周復設一輪循均輪周行命為次輪次輪心自西而東太隂復依次輪周亦自西而東每日行二十四度有竒為本輪心距太陽行之倍度本輪心距太陽行一度月行次輪周二度也名為倍離倍離所生之遲疾差名為次均數也五曰次均輪行葢有初均次均以步朔朢以定兩弦則既合矣而於兩弦前後測之又多不合故新法厯書復有二三均數表之加減也細考其表中所列誠皆實測之數但總合二三均數加減之而為一表耳爰思次輪之上必更有一輪以消息乎次均之數今命之曰次均輪其心循次輪周自西而東行倍離之度而太隂則循此輪之周自東而西亦行倍離之度用其所生之差以加減次均數即與太隂兩弦前後所行恰合也六曰交行葢太隂行白道出入於黄道之内外大距五度有竒其自黄道南過黄道北之㸃名曰正交即如春分自赤道南過赤道北自黄道北過黄道南之㸃名曰中交即如秋分自赤道北過赤道南每交之終不能復依原次而不及一度有餘逐日計之退行三分有餘命為兩交左旋之度自東而西也亦名羅計行度也正交曰羅㬋中交曰計都七曰最髙行最髙者本輪之上半最逺地心之處而最髙行者平行與自行相較之分也均輪心從最高左旋㣲不及於平行每日六分有竒即命為最髙左旋之度亦名月孛行度也八曰距日行於每日平行度内減去太陽之行為每日太隂距太陽行二十九日有竒而復與日㑹是為朔䇿九曰距交行以每日平行度與每日交行相加得每日太隂距交度二十七日有竒而行交一周名為交周也要之太隂之去地甚近其行最著諸小輪之設雖無象可見而實有數可稽葢藉以推步度數期與實測相符而已至於大象寥廓其或然或不然則非智計之所能及也太隂平行度測太隂平行之法須用兩月食計其前後相距若干日時及月行天若干周用其度分為實中積日時為法除之即得每日平行之率葢月之視差甚大惟月食為月入闇虛無地心地面之殊又食甚時正與太陽衝故將太陽之經度加半周即太隂之經度其得數為真也然所用兩月食亦須詳審葢闇虚與月體有小大之分而行度有遲疾之異必須擇各率均齊之兩月食方可用也其擇之之法第一取兩食時之太陽距地等斯闇虚之大小相等太陽距地逺則影粗而長太陽距地近則影細而短詳交食第二取兩食時之太隂距地等斯月體之大小等而入影之粗細亦等闇虚為尖圓體近地粗漸逺地漸細以至於無故太隂距地近則當闇虚之粗處太隂距地逺則當闇虚之細處詳交食第三取兩食時之自行度等斯入轉之遲疾等而過影之時刻必等考之史志所書月食並無時刻分秒及躔離度數即西人交食考亦不載月轉遲疾無憑取用今依新法厯書載西人依巴谷法定為三百四十五平年平年者三百六十五日無餘分又八十二日四刻每日九十六刻或一十二萬六千零七日四刻為兩月食各率齊同之距於時㑹朢轉終皆復其始計其中積凡為㑹朢者四千二百六十七為轉終者四千五百七十三置中積一十二萬六千零七日四刻為實會朢數四千二百六十七為法除之得㑹朢策即朔䇿二十九日五十刻一十四分零三秒一十四微零六纎四十三忽一十二芒即二十九日零十分日之五分三五九三授時厯同乃以周天三百六十度為實㑹朢策二十九日五十刻一十四分零三秒一十四微零六纎四十三忽一十二芒為法除之得一十二度一十一分二十六秒四十一微二十六纎二十二忽三十四芒即一十二度零十分度之一分九七四七四五五八授時厯作一十二度三十六分八十七秒五十微以周天三百六十度每度六十分約之得一十二度一十一分二十七秋二十七微為每日太隂平行距太陽之度加太陽每日平行五十九分零八秒一十九微四十九纎五十一忽三十九芒得一十三度一十分三十五秒零一微一十六纎一十四忽一十三芒即一十三度零十分度之一分七六三九四七七一三八授時厯作一十三度三十六分八十七秒五十微以周天三百六十度每度六十分約之得一十三度一十分三十五秒二十四㣲為每日太隂平行經度即白道經度又置中積一十二萬六千零七日四刻為實以轉終數四千五百七十三為法除之得二十七日五十三刻零三分三十四秒四十㣲三十纖四十三忽一十二芒即二十七日零十分日之五分五四五六八授時厯作二十七日五五四六為轉終分乃以天周三百六十度為實以轉終分二十七日五十三刻零三分三十四杪四十微三十纖四十三忽一十二芒為法除之得一十三度零三分五十三秒五十六微三十七纖一十九忽一十六芒即一十三度零百分度之六分四九八四三六一二一為每日太隂自行度又以每日平行經度一十三度一十分三十五秒零一微一十六纖一十四忽一十三芒與每日自行度一十三度零三分五十三秒五十六微三十七纖一十九忽一十六芒相減餘六分四十一秒零四微三十八纖五十四忽五十七芒即十分度之一分一一四一四一一七為每日月孛之平行既得以上各種行度每日之平行遞加之得十日百日之平行遞析之得每時每分之平行以立表毎日二十四時每時六十分太隂本輪遲疾四限太隂之輪有四而本輪乃遲疾四限之所由生其餘皆所以消息遲疾之數故本輪為步月離之主如圖甲為地心即本天心乙丙丁戊為白道即太陰之本天己庚辛壬為本輪其心循白道右旋每日行一十三度一十分百奇自乙而丙而丁而戊而復至乙是為平行徑度太隂循本輪左旋每日行一十三度零三分有奇自己而庚而辛而壬而復至己是為自行度一名轉周一名引數太隂在本輪之己為最高即月孛在本輪之辛為最卑最髙最卑之㸃皆對本輪心與地心成一直線故平行實行同度為遲疾起算之端如太隂由己向庚為遲初限以其背輪心行能損右旋之度故較平行度為遲至半象限後所損漸少迨行滿一象限至庚則無所損然而積遲之多正在於庚葢平行在乙而太隂在庚從地心甲計之太陰當本天之癸癸乙弧以本輪半徑庚乙為正切為遲差之極大也從庚向辛為遲末限太隂行本輪之下半周順輪心行其實行漸疾然因有積遲之度方以次相補其實行仍在平行後迨行滿一象限至辛為極疾而積遲之度始補足無缺實行與平行乃合為一線故自最髙至最卑半周為遲厯也如太隂由辛向壬為疾初限以其順輪心行能益右旋之度故較平行度為疾至半象限後所益漸少迨行滿一象限至壬則無所益然而積疾之多正在於壬蓋平行在乙而太隂在壬從地心甲計之太隂當本天之子子乙弧以本輪半徑壬乙為正切為疾差之極大也從壬向己為疾末限太隂行本輪之上半周背輪心行其實行漸遲然因有積疾之度方以次相消其實行仍在平行前迨行滿一象限至己為極遲而積疾之度始消盡無餘實行與平行復合為一線故自最卑至最髙半周為疾厯也三月食推本輪半徑及最髙太隂初均數生於本輪半徑本輪半徑不定則實行不可得而定新法厯書載西人多録某用漢陽嘉永和間三次月食推得本輪半徑為本天半徑十萬分之八千七百零六月過最髙三百一十四度一十七分陽嘉二年三月朢西人歌白泥用明正徳嘉靖間三次月食推得本輪半徑為本天半徑十萬分之八千六百零四月過最髙一百八十三度五十一分正徳六年九月朢迨後西人第谷定本輪半徑為本天半徑十萬分之八千七百月離表定崇禎戊辰年天正冬至次日子正月過最髙二百零五度三十二分一十六秒交日表定崇禎戊辰年首朔即年前十二月朔月過最髙三十七度三十四分三十四秒其年首朔距天正冬至次日子正一十四日一十六時二十六分四十六秒以交日表所定首朔月過最髙之度推其年天正冬至次日子正月過最髙之度應得二百零五度四十二分四十九秒比月離表所定多一十分三十三秒又察其正交行度兩表差至二十餘分今以交食表推步月食其時刻之早晚食分之淺深俱與天行頗合故月過最髙之度宜以交食表為凖但用目下三月食推本輪半徑或微大或微小皆不能合八千七百之數葢用本輪以推實朢惟自行當三宮九宮初度之一㸃方合而目下所測月食其自行皆不正當三宮九宮初度之數用本輪半徑以推實朢既與實測不合則用實測之實朢以推本輪半徑亦必與原數不合因假設三月食以明其法如左設如第一食日躔鶉首宮七度三十五分四十七秒五十三微月離星紀宮七度三十五分四十七秒五十三微月行遲末限之初在本輪右半周之中如甲第二食日躔夀星宮初度月離降婁宮初度月行遲初限將半在本輪右半周之上如乙第三食日躔星紀宮二度五十四分零二秒四十九微月離鶉首宮二度五十四分零二秒四十九微月行疾末限之初在本輪左半周之中如丙第一食距第二食一千一百八十日二十二時一十四分零四秒實行相距八十二度二十四分一十二秒零七微即星紀宮丁㸃距降婁宮戊㸃之度於第二次月離度内減去第一次月離度即得平行相距八十度二十一分一十秒即星紀宫已㸃距降婁宫庚㸃之度以每日平行與距日相乘減去全周即得平行小於實行二度零三分零二秒零七微自行相距三百零八度四十七分零七秒二十七微以每日自行與距日相乘減去全周即得第二食距第三食一千九百一十八日二十三時零五分五十七秒實行相距九十二度五十四分零二秒四十九微即降婁宮戊㸃距鶉首宮辛㸃之度平行相距八十五度零二十五秒即降婁宮庚㸃距實沈宮壬㸃之度平行小於實行七度五十三分三十七秒四十九微自行相距二百三十一度一十二分五十二秒三十三微乃以三月食自行相距度列於一本輪之上立法算之如圖癸為地心即本天心丁戊己辛為本天之一弧己為本輪心從丁向戊右旋為平行度月體從本輪最高子向乙左旋為自行度第一食月在甲本天平行度在己實行度在丁從甲行三百零八度四十七分零七秒二十七微至乙即第一食距第二食之自行度第二食月在乙本天平行度在己實行度在戊丁戊弧二度零三分零二秒零七微即第一食距第二食平行實行之差從乙行二百三