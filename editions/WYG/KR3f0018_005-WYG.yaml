朢之前兩弦之後次均輪心從次輪周之最近子厯最逺未行至申太隂從次均輪周之最下戌厯最上酉行至亥從地心甲至次均輪之最上酉作酉甲過心線復從地心甲至次均輪之太隂所在亥作亥甲實行線則成子甲申與申甲亥兩三角形其子甲申角為二均數申甲亥角為三均數兩角相加得子甲亥角為二三均數也求初均數及二三均數法俱見後求初均數太隂之行因遲疾而生加減差朔望用之者名為初均數自最髙至最卑六宫為遲厯為減差自最卑至最髙六宫為疾厯為加差葢因最髙前三宫與後三宫相當最卑前三宫與後三宫相當其差數皆相等故求得最髙後六宫之差數而最卑後六宫之差數視此但加減不同耳如最髙前三十度與最髙後三十度其差數必等但在最髙前者為加差最髙後者為減差也授時厯名為遲疾差其最大者為五度四二九三四四以周天三百六十度每度六十分約之得五度二十一分零五秒朔朢兩弦同用今求得最大之差四度五十八分二十七秒即四度零十分度之九分七四二惟朔朢為然名之初均數者所以别於朔朢以外之二三均數也如圖甲為地心即本天心乙丙丁為本天之一弧丙甲半徑為一千萬戊己庚為本輪戊丙半徑為五十八萬戊為最髙庚為最卑辛壬癸為均輪辛戊半徑為二十九萬辛為最逺去本輪心逺也癸為最近去本輪心近也本輪心循本天右旋自乙而丙而丁每日行一十三度一十分三十五秒即白道經度均輪心循本輪左旋自戊而已而庚每日行一十三度零三分五十四秒即自行引數太隂則循均輪右旋自癸而壬而辛每日行二十六度零七分四十八秒為倍引數也如均輪心在本輪之最髙戊為初宫初度則太隂在均輪之最近癸從地心甲計之成一直線無平行實行之差故自行初宫初度無均數也如均輪心從本輪最髙戊向己行一百八十度至最卑庚為六宫初度則太隂從均輪最近癸厯壬辛行一周復至癸從地心甲計之亦成一直線無平行實行之差故自行六宫初度亦無均數也如均輪心從本輪最髙戊行三十度至子為一宫初度則太隂從均輪最近癸行六十度至丑丑癸弧為戊子弧之倍度從地心甲計之太隂當本天之寅寅丙弧為實行不及平行之度乃用丙癸卯直角三角形求癸卯卯丙二邊此形有卯直角有丙角三十度則癸角必六十度有癸丙本輪半徑之半二十九萬於子丙半徑五十八萬内減去子癸半徑二十九萬即得求得癸卯邊一十四萬五千卯丙邊二十五萬一千一百四十七以卯丙邊與丙甲半徑一千萬相加得一千零二十五萬一千一百四十七為卯甲邊以癸卯邊三因之得四十三萬五千為丑卯邊辛丑癸三角形與丙卯癸三角形為同式形葢癸為交角丑角立於圜界之一半為直角與卯角等則辛角必與丙角等是三角俱等也辛癸為均輪全徑為癸丙之二倍則丑癸亦必為癸卯之二倍故三因癸卯即得丑卯也於是用甲丑卯直角三角形求得甲角二度二十五分四十七秒即寅丙弧為太隂自行一宫初度之初均數是為減差以減於平行而得實行也凡求得初均角即求得丑甲邊為太隂距地心數存之為後求二均之用餘倣此若均輪心從最髙戊向己厯庚行三百三十度至辰為十一宮初度則太隂從均輪最近癸行一周復自最近癸厯辛行三百度至己癸巳弧為戊辰弧之倍度從地心甲計之太隂當本天之午午丙弧與寅丙弧等故自行十一宫初度之初均數與一宫初度等但為實行過於平行之數是為加差以加於平行而得實行也用此法求得最髙後三宫之減差初宫初度至二宫末度即得最髙前三宫之加差九宫初度至十一宫末度如均輪心從本輪最髙戊行九十二度至未為三宫二度則太隂從均輪最近癸歴辛行一百八十四度至申從地心甲計之太隂當本天之酉酉丙弧為實行不及平行之度乃用丙癸戌直角三角形求癸戌丙戌二邊此形有戌直角有丙角八十八度則癸角必二度癸丙邊為二十九萬求得癸戌邊二十八萬九千八百二十三丙戌邊一萬零一百二十一以丙戌邊與丙甲邊相減餘九百九十八萬九千八百七十九為戌甲邊以癸戌邊三因之得八十六萬九千四百六十九為申戌邊於是用甲申戌直角三角形求得甲角四度五十八分二十七秒即酉丙弧為太隂自行三宫二度之初均數是為極大之減差以減於平行而得實行也若均輪心從最髙戊厯庚行二百六十八度至亥為八宫二十八度則太隂從均輪最近癸行一周復自癸厯壬行一百七十六度至子從地心甲計之太隂當本天之丑丑丙弧與酉丙弧等故自行八宫二十八度之初均數與三宫二度等但為實行過於平行之數是為極大之加差以加於平行而得實行也用此法求得最卑前三宫之減差三宫初度至五宫末度即得最卑後三宫之加差六宫初度至八宫末度求二三均數太隂之加減差朔朢以外用者名為二均三均數其二均數之生於次輪全徑與三均數之生於次均輪半徑亦猶初均數之生於本輪及均輪半徑也故欲求二均三均之數必先定次輪及次均輪之徑而欲定次輪及次均輪之徑又須先測二均及三均之數也厯家於上下弦當自行三宫或九宫時累測之惟此時太隂距本輪心甚逺平行視行之差極大其極大之均數得七度二十五分四十六秒查其切線得一百三十萬四千内減去本輪均輪兩半徑之共數八十七萬餘四十三萬四千半之得二十一萬七千即次輪之半徑也於兩弦及朔朢之間約太隂距太陽四十五度時當自行三宮或九宫時累測之其均數常與推算不合差至四十一分零二秒是即次均輪所生之三均數也依法求其半徑得一十一萬七千五百既定次輪與次均輪之半徑乃逐度求其二均三均之數復用三均數以加減乎二均數是為二三