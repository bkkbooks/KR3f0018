body:
  text: 欽定四庫全書御製厯象考成上編卷九五星厯理一五星合論五星總論五星本天皆以地為心五星衝伏留退俱生於次輪五星次輪之上下兩弧皆非平分五星總論五星行度有平行有自行有距日行太槩與太隂同推歩之法或用兩心差或用小輪或用均輪於本天心或用均輪於本天周其法雖别而理實同月離論之已詳然五星之行雖相似而細較之亦有不同以平行言之土木火各有平行為一類而金水即以太陽之平行為平行是為一類以自行言之土木火金之次輪心皆行倍引數為一類而水星之次輪心則行三倍引數是獨為一類以次輪之大小言之土木金水之次輪半徑皆有定數為一類而火星之次輪在本天最髙則大最卑則小又視太陽在最髙則大最卑則小是獨為一類以次輪之行度言之土木火皆行距日度為一類而金水自有行度又為一類以緯行言之土木火皆有本天與黄道相交以生緯度次輪斜交本天其面又與黄道平行能加減其緯度為一類而金水之本天即為黄道本無緯度因次輪斜交黄道以生緯度又為一類以伏見言之土木火皆有合有衝為一類而金水則有合有退合而無衝是又為一類也如圖甲為地心乙丙丁為本天之一弧金水本天即為黄道丙為本輪心戊丙已為本輪全徑戊為最髙己為最卑庚戊辛為均輪全徑庚為最逺去本輪心逺也辛為最近去本輪心近也壬庚癸為次輪全徑土木火原名嵗輪金水原名伏見輪今俱名次輪從一例壬為最逺去地心逺也癸為最近去地心近也本輪心從本天冬至度右旋為平行經度均輪心從本輪最髙左旋為自行引數土木火金四星之次輪心從均輪最近右旋為倍引數獨水星之次輪心從均輪最逺右旋為三倍引數五星皆從次輪最逺右旋在土木火三星為本輪心距日度惟金水二星各有行度因其本輪即以日為心故無距日之度也又土木火三星之次輪皆斜立於本道半周在本道北半周在本道南其壬庚癸全徑恒與黄道之徑平行金水二星之次輪亦斜立於黄道半周在黄道北半周在黄道南其壬庚癸全徑却不與黄道之徑平行故金水雖行黄道而亦有緯度也又星與日與地參直而日在星與地之間則星為日掩是為合伏如地在星與日之間則星與日相距半周天正相對照如月之望是為衝如星在日與地之間則星正當日之下如月之朔此時星必在次輪下半退行故為退伏在土木火三星能距日半周天故有合有衝而無退合金水二星之本輪以日為心常繞日行不能與日相距半周天故止有合有退合而無衝也五星本天皆以地為心新法厯書言五星古圖以地為心新圖以日為心及觀西人第谷推歩均數土木金水四星仍以地為心惟火星以日為心嘗推火星亦以地為心立算其得數與彼相同乃知第谷之推歩火星不過虚立巧算之法非真謂火星天獨以日為心也然則新法厯書之新圖五星皆以日為心者何也盖金水二星以日為心者乃其本輪非本天也土木火三星以日為心者乃次輪上星行距日之跡亦非本天也土木火三星之次輪半徑最大與日天半徑畧等星距次輪最逺之度又與次輪心距日之度等以星行距日之跡觀之即成大圜而為繞日之形其理與日躔連本輪行度成不同心天者相似然星之自行又有髙卑其距日不無逺近謂其成繞日之形則可謂其成不同心天則不可也雖厯家巧算之術以次輪設於本天與以次輪設於地心成不同心天者理本相通然必次輪半徑與日距地半徑等方可以日為心作不同心天立算今土木二星之次輪半徑有定數而日距地則有髙卑火星次輪半徑雖有太陽髙卑差而又有本天髙卑差終與日距地半徑不等則與其設次輪於地心不如設次輪於本天之為便也由是觀之五星之本天皆以地為心可知矣新法厯書又言舊説有謂七政之左旋非七政之行乃地自西徂東日行一周治厯之家以為非理故無取焉而近日又有復理其説者殆欲以地之東行而齊諸曜之各行耳究之諸曜之行終不能齊何若以一静而驗諸動之易明乎古圖五星各有本天重重包裹土木火三星常在日上名為上三星金水常在日下名為下二星今考五星惟土木二星常在日上火金水三星能在日上亦能在日下則重重包裹之説特其大槩耳此古圖不如新圖之密也新圖五星皆以日為心土木二星圈甚大包日天之外故常在日上火星圈亦大但不能包日天而割入日天之内故有時在日之下金水二星圈甚小不惟不能包日天併不能包地故不能衝日然金水之本天即日天此圍日者乃其本輪也土木火亦各有本天此圍日者乃次輪上星行距日之迹也下圖詳之土木二星之本天大次輪小土星次輪半徑為本天半徑十分之一強木星次輪半徑為本天半徑十分之二弱如圖甲為地心乙丙為日本天丁戊為星本天己庚與辛壬皆為次輪如日在乙次輪心在丁星在己日行至丙星亦行至庚庚丙之相距與己乙之相距等也或日在丙次輪心在戊星在壬日行至乙星亦行至辛辛乙之相距與壬丙之相距等也星之距日既隨在皆相等則連其軌迹即成圍日之形矣試用己乙之距為半徑作圈即成己辛圈為星行軌迹所到而以乙日為心或用庚丙之距為半徑作圈即成庚壬圈亦為星行軌迹所到而亦以丙日為心也雖各星自行亦有髙卑其距日不無逺近之差要不能改其圍日之大致耳火星之本天小於土木二星之本天而次輪則大火星次輪半徑為本天半徑十分之六強如圖甲為地心乙丙為日本天丁戊為星本天己庚與辛壬皆為次輪己辛圈以乙日為心庚壬圈以丙日為心皆為次輪上星行軌迹所到悉與土木二星同但其次輪甚大割入日天之内星行至此即在日之下也五星衝伏留退俱生於次輪五星之有本輪次輪俱與太陰同太隂之朔望皆在次輪故五星之衝伏亦在次輪然太隂止有遲疾而五星則有留退何也盖太隂之平行甚疾而輪甚小太隂平行毎日一十三度餘合計本輪次輪之最大均數止七度餘當其在輪周退行之時但能稍減其平行之度故止見其遲而不見其退若五星之平行甚遲其本輪雖小而次輪則甚大五星平行毎日不足一度而次均之大者至五十餘度當其在輪之上弧則見其順行在輪之下弧則見其退行在輪之左右則見其留而不行也以土木火三星論之如圖甲為地心乙丙為太陽本天丁戊為土星本天以土星為例木火同理俱以甲為心己庚為本輪以丁為心辛壬為均輪以己為心癸子為次輪以壬為心太陽在乙本輪心在丁無距日度星在次輪之最逺癸自地心甲計之日在星與地之間成一直線星伏而不見為合伏設太陽在丑本輪心丁距日九十餘度則星從合伏癸亦行九十餘度至寅自地心甲計之星自上而下成一直線不見其行為前留或曰順留設太陽在丙本輪心丁距日半周則星從合伏癸亦行半周至最近子自地心甲計之地在星與日之間成一直線為衝設太陽在夘本輪心丁距日二百六十餘度則星從合伏癸亦行二百六十餘度至辰自地心甲計之星自下而上成一直線不見其行為後留或曰退留迨太陽復至乙與本輪心丁參直而星亦復至最逺癸又為合伏矣凡星在辰癸寅上弧則順輪心行自西而東故其行為順為疾星在寅子辰下弧則逆輪心行自東而西故其行為退為遲也以金水二星論之如圖甲為地心乙丙為太陽本天即金星本天水星之理與金星同亦以甲為心丁戊為本輪以乙太陽為心己庚為均輪以戊為心辛壬為次輪以庚為心太陽在乙星在次輪之最逺辛在太陽之上自地心甲計之成一直線星伏而不見為順合星在次輪之最近壬在太陽之下自地心甲計之亦成一直線星伏而不見為退合星從最逺辛行一百三十餘度至癸自地心甲計之星自上而下成一直線不見其行為前留星從最近壬行四十餘度至子自地心甲計之星自下而上成一直線不見其行為後留凡星行子辛癸上弧為順為疾行癸壬子下弧為退為遲與土木火三星同也五星次輪之上下兩弧皆非平分五星皆以兩留際分次輪為上下兩弧星行上弧為順為疾星行下弧為退為遲然此兩弧皆非平分上弧常多下弧常少而五星又各不同如土星上弧一百九十二度有餘下弧一百六十七度有餘木星上弧二百度有餘下弧一百五十九度有餘火星上弧或二百八九十度下弧或七八十度金星上弧二百七十度下弧九十度水星上弧二百二十二度下弧一百三十八度其所以參差不齊者盖因五星距地各有逺近而次輪又各有大小也自地心作兩視線至次輪周與次輪半徑成直角則此兩視線即為下半弧之切線其切輪周之㸃為留際即上下兩弧所由分而上弧之度必多於下弧但輪小而距地逺者其上下兩弧相差不甚逺如土木二星是也若輪大而近於地則上弧愈多下弧愈少如火金水三星是也又五星自行各有髙卑其上下兩弧之分亦有増減要之知輪心距地之逺近與輪徑之大小則上下兩弧之多少皆可得而推矣如圖甲為地心乙為次輪心乙丙乙丁皆次輪辛徑從甲作甲丙甲丁兩視線至次輪周與次輪半徑乙丙乙丁成直角則甲丙即為丙戊下半弧之切線甲丁即為丁戊下半弧之切線而乙甲丙與乙甲丁成相等之兩直角三角形此乙甲丙三角形之丙角既為直角九十度則乙角必不足九十度而所對之丙戊弧亦必不足九十度丙戊下半弧既不足九十度則兩半弧相合之丙戊丁弧亦必不足一百八十度此下弧之所以常少於上弧也又第一圖輪小而乙甲之距逺則兩視線長故甲角小而乙角大乙角大則所對之丙戊與戊丁兩弧亦大此丙戊丁下弧雖小於丙己丁上弧而猶不甚相逺也如第二圖輪大而乙甲之距近則兩視線短故甲角増而乙角減乙角減則所對之丙戊與戊丁兩弧亦從之而減此丙戊丁下弧所以愈少丙己丁上弧所以愈多也是故欲求各星次輪下弧之度以次輪心距地心之乙甲線與次輪半徑乙丙或乙丁之比同於半徑一千萬與乙角餘弦之比而得乙角度即丙戊弧或丁戊弧倍之得丙戊丁下弧之度為星退行之共度也御製厯象考成上編卷九
