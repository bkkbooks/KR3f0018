body:
  text: 欽定四庫全書御製厯象考成上編卷十六恒星厯理恒星總論恒星東行測恒星法三恒星比測考經度推恒星赤道經緯度七政宿度中星時刻恒星出入地平恒星總論恒星之名見於春秋而四仲中星及斗牽牛織女參昴箕畢大火農祥龍尾鳥帑天駟天黿之屬散見於尚書易詩左傳國語至周禮春官馮相氏掌二十八星之位而禮記月令太戴禮夏小正稍具諸星見伏之節葢古者敬天勤民因時出政皆以星為紀秦炬之後羲和舊術無復可稽其傳者惟史記天官書而所載簡畧後漢張衡云中外之官常明者百有二十四可名者三百二十為星二千五百而其書不傳至三國時太史令陳卓始列巫咸甘石三家所著星圖總二百八十三官一千四百六十四星隋丹元子作步天歌叙三垣二十八宿共一千四百六十七星為觀象之津梁然尚未有各星經緯度數自唐宋而後諸厯家以儀象考測始有各星入宿去極度數視古加密矣新法厯書恒星圖表共星一千二百六十六分為六等第一等星一十七第二等星五十七第三等星一百八十五第四等星三百八十九第五等星三百二十三第六等星二百九十五外無名不入等者四百五十九康熙壬子年欽天監新修儀象志恒星亦分六等而其數又與新法厯書微異第一等星一十六第二等星六十八第三等星一百零八第四等星五百一十二第五等星三百四十二第六等星七百三十二總計一千八百七十八葢觀星者以目之所能辨因其形體聨綴成象而命之名其微茫昬暗者多不可考故各家星官之學有古少而今多者亦有古多而今少者而惟列宿及諸大星則中外如一轍也今擇其近黄道諸星及星體之大者為推凌犯中星之用其黄道經緯則依儀象志加嵗差推算為厯元康熙二十三年甲子黄道經緯度云恒星東行恒星行即古嵗差也古厯俱謂恒星不動而黄道西移今謂黄道不動而恒星東行葢使恒星不動而黄道西移則恒星之黄道經緯度宜毎嵗不同而赤道經緯度宜終古不變今測恒星之黄道經度毎嵗東行而緯度不變至於赤道經度則逐嵗不同而緯度尤甚自星紀至鶉首六宮星在赤道南者緯度古多而今漸少在赤道北者緯度古少而今漸多自鶉首至星紀六宫星在赤道南者緯度古少而今漸多在赤道北者緯度古多而今漸少凡距赤道二十三度半以内之星在赤道北者皆可以過赤道南在赤道南者亦可以過赤道北則恒星循黄道東行而非黄道之西移明矣新法厯書載西人第谷以前恒星東行之數或云百年而行一度或云七十餘年而行一度或云六十餘年而行一度隨時修改訖無定數與古厯累改嵗差之意同迨至第谷殫精推測方定恒星毎嵗東行五十一秒約七十年有餘而行一度而元郭守敬所定亦為近之至今一百四十餘年驗之於天雖無差忒但星行微渺必厯多年其差乃見然則第谷所定之數亦未可泥為定率惟隨時測驗依天行以推其數可也測恒星法恒星東行既依黄道則測定一年之黄道經緯度而逐年之黄道經緯度皆視此矣然欲測諸恒星必以一星作距而欲測黄道經緯度必以赤道經緯度為宗葢諸曜隨天左旋惟赤極不動其經緯既與黄道相當又與地平相應時刻之早晚於是乎紀太陽之躔次於是乎辨非赤道則黄道無從而稽也其法擇恒星之大者測其方中時刻及正午髙弧乃以本時太陽赤道經度與太陽距午正赤道經度相加即星之赤道經度又以正午髙弧與赤道髙度相減即星之赤道緯度既得赤道經緯度則用弧三角法推得黄道經緯度既得一星之黄赤經緯度即以此一星作距或用黄道赤道諸儀測其相距之經緯或用地平象限諸儀測其偏度及髙弧而諸星之黄赤經緯度皆可得矣要之測恒星之法先測一星為準而此星經度必取定於太陽倘於時刻差四分則於天行差一度故須㕘互考驗方得密合或用太陰及太白比測者然皆有視差不如用太陽之確準也設如亥初初刻測得大角星方中正午髙弧七十度四十九分四十秒本時太陽赤道經度為實沈宫一十五度四十九分一十秒求大角星黄赤經緯度如圖甲為天頂甲乙丙丁為子午圈乙丙為地平丁為北極戊巳為赤道庚辛為黄道壬為大角星當赤道之戊戊乙為京師赤道髙五十度零五分壬乙為星髙弧七十度四十九分四十秒癸為太陽當赤道之子戊子為亥初初刻距午正赤道經度以亥初初刻距午正之九小時變作一百三十五度自子㸃實沈宫一十五度四十九分一十秒計之得戊㸃為大火宫初度四十九分一十秒即大角星赤道經度又以壬乙七十度四十九分四十秒與戊乙五十度零五分相減餘壬戊二十度四十四分四十秒即大角星距赤道北緯度乃用弧三角法推之即得大角星黄道經度為夀星宫二十度二十二分三十秒緯度距黄道北三十一度零三分也法與斜弧三角形設例第七則同設如以大角星作距用黄道儀測心宿第二星如圖甲乙為南北極丙丁為黄極軸甲丙乙丁為過二極經圈戊巳為地平庚辛為黄道庚為冬至辛為夏至壬為黄道心壬癸為黄道心緯表子㸃為夀星宫二十度二十二分三十秒即大角星黄道經度丑㸃為其對衝即降婁宫二十度二十二分三十秒於丑㸃安表耳對丙丁黄極軸見大角星如寅當黄道之子同時於丙卯丁辰黄道經圈辰㸃安表耳對壬癸緯表見心宿第二星如卯當黄道之己乃視己㸃為析木宫五度五十五分三十秒即心宿第二星黄道經度又視辰午四度二十七分與卯巳等即心宿第二星距黄道南之緯度也設如用赤道儀測之如圖甲乙為赤極軸甲丙乙丁為子午圈丙丁為地平戊巳為赤道庚為赤道心庚辛為赤道心緯表壬為心宿第二星正到子午圈上於癸㸃安表耳對庚辛緯表見心宿第二星當赤道之戊距赤道如戊壬同時以甲子乙丑經圈對大角星寅則當赤道之子乃視子戊相距三十二度二十分五十秒與大角星赤道經度大火宫初度四十九分一十秒相加因在距星東故加若在距星西則減得析木宫三度一十分即心宿第二星赤道經度又視戊壬二十五度四十三分二十秒即心宿第二星距赤道南之緯度既得赤道經緯度用弧三角法推之亦得心宿第二星黄道經度為析木宫五度五十五分三十秒緯度在黄道南四度二十七分也又隨時測恒星法設如子正初刻用地平儀測得室宿第一星地平經度偏西六十一度三十四分五十秒同時用象限儀測得髙弧五十二度五十三分四十五秒本時太陽赤道經度為夀星宫初度五十二分三十六秒正午赤道經度為降婁宫初度五十二分三十六秒求室宿第一星黄赤經緯度如圖甲為天頂甲乙丙丁為子午圈乙丙為地平丁為北極戊巳為赤道庚為室宿第一星當赤道之辛乙壬為地平經度偏西六十一度三十四分五十秒即壬甲乙角庚壬為髙弧五十二度五十三分四十五秒庚辛為赤道北緯度即丁庚之餘戊辛為距午正赤道經度即丁角乃用甲丁庚斜弧三角形求丁庚弧及丁角此形有甲丁弧五十度零五分為京師北極距天頂之度有甲庚弧三十七度零六分一十五秒為庚壬之餘有甲角一百一十八度二十五分一十秒為壬甲乙角之外角求得丁庚弧七十六度一十六分一十四秒與丁辛九十度相減餘庚辛一十三度四十三分四十六秒即室宿第一星距赤道北緯度又求得丁角三十度當戊辛弧即距午正赤道經度與戊㸃降婁宫初度五十二分三十六秒相減因星在午西故減若星在午東則加得辛㸃為娵訾宫初度五十二分三十六秒即室宿第一星赤道經度既有赤道經緯度則用弧三角法推之即得室宿第一星黄道經度為娵訾宫一十九度三十九分三十秒緯度在黄道北一十九度二十六分也此法或用月食時刻或用中星時刻隨時測量不必方中其所得太陽距正午赤道經度較準而所得之地平經緯度亦簡而易用距星測他星倣此三恒星比測考經度前用太陽經度推測各星經度尚恐所測未準又用左右兩星比測中一星以考驗之彼此分秒相符方為密合如原測得參宿第一星赤道經度實沈宫一十九度三十分南河第二星赤道經度鶉首宫一十八度零二分星宿第一星赤道經度鶉火宫一十八度三十一分今用赤道儀先測得參宿第一星與南河第二星相距二十八度三十二分以加參宿第一星赤道經度實沈宫一十九度三十分得南河第二星赤道經度為鶉首宫一十八度零二分又測得南河第二星與星宿第一星相距三十度二十九分以減星宿第一星赤道經度鶉火宫一十八度三十一分亦得南河第二星赤道經度為鶉首宫一十八度零二分彼此參互考驗其數相同方知其不誤也推恒星赤道經緯度恒星赤道經緯度逐嵗不同難以列表儀象志用加分算法固簡捷而理則未精葢二分之後黄道度多赤道度少二至之後黄道度少赤道度多恒星既依黄道東行則升度差亦有増減况黄道與赤道斜交夏至後赤道北之星漸差而近冬至後赤道北之星漸差而逺緯度既差則經度亦必有差今立法以厯元甲子年各星黄道經度加嵗差分得本年各星黄道經度然後用弧三角法推本年各星赤道經緯度設例如左設厯元甲子年河鼓第二星黄道經度為星紀宫二十七度一十分黄道北緯度二十九度二十二分求赤道經緯度如圖甲為赤極乙為黄極甲乙相距二十三度二十九分三十秒丙丁為赤道戊己為黄道戊為冬至己為夏至庚為河鼓第二星當黄道之辛當赤道之壬戊辛為黄道經度距冬至二十七度一十分即戊乙辛角庚辛為星距黄道北二十九度二十二分丙壬為距冬至赤道經度即丙甲壬角庚壬為赤道北緯度即甲庚之餘故用甲乙庚斜弧三角形求甲庚弧及甲角此形有甲乙邊二十三度二十九分三十秒有乙角一百五十二度五十分為戊乙辛角之外角有乙庚弧六十度三十八分為庚辛之餘求得甲庚弧八十一度五十四分五十六秒與九十度相減餘八度零五分零四秒即赤道北緯度又求得甲角二十三度四十一分五十八秒即距冬至赤道經度為星紀宫二十三度四十一分五十八秒也若用加分算依儀象志内載康熙十一年壬子河鼓第二星赤道經度為星紀宫二十三度三十七分緯度在赤道北八度九分自癸丑年起算每年經度加四十六秒一十二微緯度加七秒四十八微至康熙二十三年甲子計十二年經度應加九分一十四秒二十四微緯度應加一分三十三秒三十六微則甲子年河鼓第二星赤道經度為星紀宮二十三度四十六分一十四秒二十四微緯度在赤道北八度一十分三十三秒三十六微較細推所得之數經度多四分一十六秒二十四微緯度多五分二十九秒三十六微十二年之間雖所差無多然而積久則著也七政宿度日月五星皆有宿度古以十二宫定於二十八宿故宿度逐嵗不同者經度亦因而不同今以二十八宿厯於十二宫故宿度逐嵗有差而經度終古不變其法以嵗差五十一秒按嵗積之與各宿第一星黄道經度相加為本年黄道宿鈐乃於七政黄道經度内減去相當黄道宿度餘即七政黄道宿度葢七政恒星皆宗黄道故宿度亦以黄道推也至於日月交食則并用赤道宿因其闗於天行最著故於推算獨詳然各宿赤道經緯度逐嵗不同須按推恒星赤道經度法求得本年各宿第一星赤道經度為本年赤道宿鈐乃於太陽太陰赤道經度内減去相當赤道宿度餘即太陽太陰赤道宿度若夫測量中星每以大星作距儀象志載康熙壬子年二十八宿距星及諸大星赤道經緯度并每嵗經緯加減分為求赤道宿度及測量中星之用其加減分所差無多而各星赤道經緯度則以渾儀比測與推算多不合今用弧三角法推得厯元甲子年二十八宿及諸大星赤道經緯度并每嵗經緯加減分附恒星黄道經緯度表後以為推步之捷徑云中星時刻厯法最重中星有中星可以知時刻有時刻亦可以知中星中星與時刻相符則恒星之經度可稽太陽之躔次可驗而太陰與五星皆於是取徵焉中星求時刻者以中星赤道經度即本時正午赤道經度與本日太陽赤道經度相減餘數變時自午正後起算即得時刻時刻求中星者以本時太陽赤道經度與本時太陽距午正後赤道經度相加即得本時正午赤道經度視本年某星赤道經度與正午赤道經度相合即為某星方中若星之赤道經度小於正午赤道經度即為某星偏西大於正午赤道經度即為某星偏東也設心宿第二星康熙六十年赤道經度為析木宫三度一十分夏至日太陽赤道經度為鶉首宫初度求其方中之時刻如圖甲乙丙丁為子午圈乙丁為地平戊為北極甲丙為赤道己庚為黄道辛為心宿第二星當赤道之甲為析木宫三度一十分即正午赤道經度壬為太陽當赤道之癸為鶉首宫初度則於正午甲㸃析木宫三度一十分内減癸㸃太陽赤道經度鶉首宫初度餘甲癸弧五宫三度一十分變時得十小時一十二分四十秒自甲㸃午正初刻起算得亥正初刻一十二分四十秒即心宿第二星方中之時刻也如以時刻求中星則以本時太陽距正午十小時一十二分四十秒變赤道度得五宫三度一十分與本時太陽赤道經度鶉首宫初度相加得析木宫三度一十分為本時正午赤道經度與本年心宿第二星赤道經度相合即為心宿第二星方中也設本日心宿第二星偏西二度十五分求時刻則赤道經度偏西如甲子乃以子甲二度五十分與甲㸃析木宫三度一十分相加因偏西故加若偏東則減得子㸃為析木宫六度即正午赤道經度内減癸㸃太陽赤道經度鶉首宫初度餘子癸弧五宫六度變時得十小時二十四分自子㸃午正初刻起算得亥正一刻九分即心宿第二星偏西二度五十分之時刻也如以時刻求中星則以本時太陽距正午十小時二十四分變赤道度得五宫六度與本時太陽赤道經度鶉首宫初度相加得析木宫六度為本時正午赤道經度内減本年心宿第二星赤道經度析木宮三度一十分取本年恒星赤道經度相近者用之餘二度五十分即為心宿第二星偏西二度五十分也恒星出入地平恒星隨宗動天東出西入旋轉有常因節氣有冬夏晝夜有永短人居有南北故所見恒星出入地平之時刻因時各異隨地不同也夫逐時皆有出入地平之恒星逐星皆有出入地平之時刻可以測候而得亦可以推步而知其法用本地北極髙度及本星赤道經緯度求得本星與赤道同出入地平之度乃與本時太陽赤道經度相減即得本星出入地平之時刻也設如京師北極髙三十九度五十五分角宿第一星康熙六十年赤道經度為夀星宫一十七度四十分距赤道南緯度九度三十九分一十秒清明時太陽赤道經度為降婁宫一十五度求其出入地平之時刻則先求本星與赤道同出入地平之度如圖甲乙丙丁為子午圈乙丁為地平戊為北極戊丁為京師北極髙三十九度五十五分甲丙為赤道甲乙為京師赤道髙五十度零五分己為赤道出入地平之度即卯正酉正之位庚為角宿第一星當赤道之辛為夀星宫一十七度四十分庚辛為距赤道南緯度九度三十九分一十秒辛巳為星出入地平在卯後酉前分星在赤道南為卯後酉前分星在赤道北為卯前酉後分與太陽出入地平之理同乃用已辛庚正弧三角形求辛巳弧此形有辛直角有已角五十度零五分有庚辛弧九度三十九分一十秒求得辛巳弧八度一十分五十一秒以辛巳弧與辛㸃夀星宫一十七度四十分相加得夀星宫二十五度五十分五十一秒為星出地平時卯正赤道度因辛巳弧為卯後分故加若為卯前分則減又以辛巳弧與辛㸃夀星宫一十七度四十分相減得夀星宫九度二十九分零九秒為星入地平時酉正赤道度因辛巳弧為酉前分故減若為酉後分則加既得星出入地平時卯正酉正赤道度則於星出地平時卯正赤道度夀星宫二十五度五十分五十一秒内減本日太陽赤道經度降婁宫一十五度不及減者加十二宫減之餘六宫一十度五十分五十一秒變時得一十二小時四十三分二十三秒自卯正後計之為酉正二刻十三分二十三秒即角宿第一星出地平之時刻又於星入地平時酉正赤道度夀星宫九度二十九分零九秒内減本日太陽赤道經度降婁宫一十五度餘五宫二十四度二十九分零九秒變時得一十一小時三十七分五十七秒自酉正後計之為卯初二刻七分五十七秒即角宿第一星入地平之時刻也御製歴象考成上編卷十六
