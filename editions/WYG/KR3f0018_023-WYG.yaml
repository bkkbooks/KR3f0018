body:
  text: 欽定四庫全書御製厯象考成下編卷六木星厯法推木星用數推木星法用表推木星法推木星用數康熙二十三年甲子天正冬至為厯元周天三百六十度入算化作一百二十九萬六千秒周日一萬分周嵗三百六十五日二四二一八七五紀法六十木星每日平行二百九十九秒小餘二八五二九六八木星每日平行四分五十九秒一十七微零七纎零四忽零七芒以秒法通之即得木星最髙每日平行十分秒之一又五八四三三木星最髙每嵗平行五十七秒五十一微五十九纎五十八忽一十九芒以周嵗三百六十五日二四二一入七五除之得最髙每日平行九微三十纎二十一忽四十芒以秒法通之即得木星正交每日平行百分秒之三又七二三五五七木星正交每嵗平行一十三秒三十五微五十九纎五十九忽五十八芒以周嵗三百六十五日二四二一八七五除之得正交每日平行二微一十四纖零二忽五十三芒以秒法通之卽得木星本天半徑一千萬木星本輪半徑七十萬五千三百二十木星均輪半徑二十四萬七千九百八十木星次輪半徑一百九十二萬九千四百八十木星本道與黄道交角一度一十九分四十秒氣應七日六五六三七四九二六木星平行應八宫零九度一十三分一十三秒一十一微木星最髙應九宫零九度五十一分五十九秒二十七微木星正交應六宮零七度二十一分四十九秒三十五微按新法厯書載崇禎元年戊辰木星平行距冬至十一宫一十八度五十一分五十一秒最髙距冬至九宫零八度五十七分五十九秒正交距冬至六宫零七度零九分零八秒自崇禎戊辰年天正冬至次日至厯元甲子年天正冬至次日積二萬零四百五十三日以積日各與每日平行相乘得數各與崇禎戊辰年諸應相加即厯元甲子年諸應也推木星法求積年自厯元康熙二十三年甲子距所求之年共若干年減一年得積年求中積分以積年與周嵗三百六十五日二四二一八七五相乘得中積分求通積分置中積分加氣應七日六五六三七四九二六得通積分上考往古則置中積分減氣應得通積分求天正冬至置通積分其日滿紀法六十去之餘為天正冬至日分上考往古則以所餘轉與紀法六十相減餘為天正冬至日分求積日置中積分加氣應分六五六三七四九二六不用日減本年天正冬至分亦不用日得積日上考往古則置中積分減氣應分加本年天正冬至分得積日求木星年根以積日與木星每日平行二百九十九秒二八五二九六八相乘滿周天一百二十九萬六千秒去之餘為積日木星平行加木星平行應八宫零九度一十三分一十三秒一十一微得木星年根上考往古則置木星平行應減積日木星平行得木星年根求最髙年根以積日與木星最髙每日平行十分秒之一又五八四三三相乘得數為積日最髙平行加木星最髙應九宫零九度五十一分五十九秒二十七微得最髙年根上考往古則置木星最髙應減積日最髙平行得最髙年根求正交年根以積日與木星正交每日平行百分秒之三又七二三五五七相乘得數為積日正交平行加木星正交應六宫零七度二十一分四十九秒三十五微得正交年根上考往古則置木星正交應減積日正交平行得正交年根求木星日數以所設日數與木星每日平行二百九十九秒二八五二九六八相乘得數為秒以宫度分收之得木星日數求最髙日數以所設日數與木星最髙每日平行十分之一一又五八四三三相乗得最髙日數求正交日數以所設日數與木星正交每日平行百分秒之三又七二三五五七相乘得正交日數求木星平行以木星年根與木星日數相加得木星平行求最髙平行以最髙年根與最髙日數相加得最髙平行求正交平行以正交年根與正交日數相加得正交平行求引數置木星平行減最髙平行得引數求初均數均輪心自本輪最髙左旋行引數度次輪心自均輪最近㸃右旋行倍引數度用兩三角形法求得地心之角為初均數法詳五星厯理三求初均數篇引數初宫至五宫為減六宫至十一宫為加隨求次輪心距地心之邊為求次均數之用求初實行置木星平行加減初均數得初實行求星距日次引置本日太陽實行減初實行得星距日次引求次均數星自次輪最逺㸃右旋行距日度用三角形法以次輪心距地心線為一邊即求初均數時所得次輪心距地心之邊次輪半徑一百九十二萬九千四百八十為一邊星距日度為所夾之外角過半周者與全周相減用其餘求得地心對次輪半徑之角為次均數星距日初宫至五宫為加六宫至十一宫為減隨求星距地心之邊為求視緯之用求本道實行置初實行加減次均數得本道實行求距交實行置初實行減正交平行得距交實行求升度差以半徑一千萬為一率本道與黄道交角一度一十九分四十秒之餘弦為二率距交實行之正切線為三率求得四率為黄道之正切線檢表得黄道度與距交實行相減餘為升度差距交實行不過象限為減過象限為加過二象限為減過三象限為加求黄道實行置本道實行加減升度差得黄道實行求初緯以半徑一千萬為一率本道與黄道交角一度一十九分四十秒之正弦為二率距交實行之正弦為三率求得四率為初緯之正弦檢表得初緯求星距黄道線以半徑一千萬為一率初緯之正弦為二率次輪心距地心線為三率求得四率即星距黄道線求視緯以星距地心線為一率即求次均數時所得星距地心之邊星距黄道線為二率半徑一千萬為三率求得四率為視緯之正弦檢表得視緯距交實行初宫至五宫為黄道北六宫至十一宮為黄道南求黄道宿度依日躔求宿度法求得本年黄道宿鈐察黄道實行足減本年黄道宿鈐内某宿度分則減之餘為黄道宿度用表推木星法求諸年根用木星年根表察本年距冬至宫度分秒三十微進一秒下倣此得木星年根察本年最髙行宫度分秒得最髙年根察本年正交行宫度分秒得正交年根求諸日數用木星周嵗平行表察本日平行宫度分秒得木星日數察本日最髙行秒微得最髙日數察本日正交行秒微得正交日數求木星平行以木星年根與木星日數相加得木星平行求最髙平行以最髙年根與最髙日數相加得最髙平行求正交平行以正交年根與正交日數相加得正交平行求引數置木星平行減最髙平行得引數求初均及中分用木星均數表以引數宫度分察其與初均所對之度分秒得初均察其與中分所對之分秒得中分并記初均加減號求初實行置木星平行加減初均數得初實行求星距日次引置本日太陽實行減初實行得星距日次引求次均及較分用木星均數表以星距日次引宫度分察其與次均所對之度分秒得次均察其與較分所對之度分秒得較分并記次均加減號求實次均以三千六百秒為一率較分化秒為二率中分化秒為三率求得四率為秒以度分收之為加差與次均相加得實次均加減號與次均同求本道實行置初實行加減實次均得本道實行求距交實行置初實行減正交平行得距交實行求升度差用木星升度差表以距交實行官度察其所對之分秒得升度差并記加減號求黄道實行置本道實行加減升度差得黄道實行求星距黄道線用木星距黄道表以距交實行官度察其所對之數得星距黄道線并記南北號求星距地心線用木星距地表以星距日次引宫度察其所對之數得星距地心線求視緯以星距地心線為一率星距黄道線為二率半徑一千萬為三率求得四率為視緯之正弦檢表得視緯求黄道宿度依日躔求宿度法求得本年黄道宿鈐察黄道實行足減本年黄道宿鈐内某宿度分則減之餘為黄道宿度御製厯象考成下編卷六
