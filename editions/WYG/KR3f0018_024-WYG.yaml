body:
  text: 欽定四庫全書御製厯象考成下編卷七火星厯法推火星用數推火星法用表推火星法推火星用數康熙二十三年甲子天正冬至為厯元周天三百六十度入算化作一百二十九萬六千秒周日一萬分周嵗三百六十五日二四二一八七五紀法六十火星每日平行一千八百八十六秒小餘六七三五八火星每日平行三十一分二十六秒四十微一十二纎零七忽四十四芒以秒法通之即得火星最髙每日平行十分秒之一又八三四三九九火星最髙每嵗平行一分零七秒以周嵗三百六十五日二四二一八七五除之得最髙每日平行一十一微零二十三忽以秒法通之即得火星正交每日平行十分秒之一又四四九七二三火星正交每嵗平行五十二秒五十七微以周嵗三百六十五日二四二一八七五除之得正交每日平行八微四十一纎五十四忽零一芒以秒法通之即得火星本天半徑一千萬火星本輪半徑一百四十八萬四千火星均輪半徑三十七萬一千火星最小次輪半徑六百三十萬二千七百五十本天髙卑大差二十五萬八千五百太陽髙卑大差二十三萬五千火星本道與黄道交角一度五十分氣應七日六五六三七四九二六火星平行應二宫一十三度三十九分五十二秒一十五微火星最髙應八宫初度三十三分一十一秒五十四微火星正交應四宫一十七度五十一分五十四秒零七微按新法厯書載崇禎元年戊辰火星平行距冬至五宫零四度四十五分三十秒最髙距冬至七宫二十九度三十分四十秒正交距冬至四宫一十七度零二分二十九秒自崇禎戊辰年天正冬至次日至厯元甲子年天正冬至次日積二萬零四百五十三日以積日各與每日平行相乘得數各與崇禎戊辰年諸應相加即厯元甲子年諸應也推火星法求積年自厯元康熙二十三年甲子距所求之年共若干年減一年得積年求中積分以積年與周嵗三百六十五日二四二一八七五相乘得中積分求通積分置中積分加氣應七日六五六三七四九二六得通積分上考往古則置中積分減氣應得通積分求天正冬至置通積分其日滿紀法六十去之餘為天正冬至日分上考往古則以所餘轉與紀法六十相減餘為天正冬至日分求積日置中積分加氣應分六五六三七四九二六不用日減本年天正冬至分亦不用日得積日上考往古則置中積分減氣應分加本年天正冬至分得積日求火星年根以積日與火星每日平行一千八百八十六秒六七三五八相乘滿周天一百二十九萬六千秒去之餘為積日火星平行加火星平行應二宫一十三度三十九分五十二秒一十五微得火星年根上考往古則置火星平行應減積日火星平行得火星年根求最髙年根以積日與火星最髙每日平行十分秒之一又八三四三九九相乘得數為積日最髙平行加火星最髙應八宫初度三十三分一十一秒五十四微得最髙年根上考往古則置火星最髙應減積日最髙平行得最髙年根求正交年根以積日與火星正交每日平行十分秒之一又四四九七二三相乘得數為積日正交平行加火星正交應四宫一十七度五十一分五十四秒零七微得正交年根上考往古則置火星正交應減積日正交平行得正交年根求火星日數以所設日數與火星每日平行一千八百八十六秒六七三五八相乘得數為秒以官度分收之得火星日數求最髙日數以所設日數與火星最髙每日平行十分秒之一又八三四三九九相乘得數為秒以分收之得最髙日數求正交日數以所設日數與火星正交每日平行十分秒之一又四四九七二三相乘得正交日數求火星平行以火星年根與火星日數相加得火星平行求最髙平行以最髙年根與最髙日數相加得最髙平行求正交平行以正交年根與正交日數相加得正交平行求引數置火星平行減最髙平行得引數求初均數均輪心自本輪最髙左旋行引數度次輪心自均輪最近㸃右旋行倍引數度用兩三角形法求得地心之角為初均數法詳五星厯理四求初均數篇引數初官至五宫為減六宫至十一宫為加隨求次輪心距地心之邊為求次均數之用求初實行置火星平行加減初均數得初實行求星距日次引置本日太陽實行減初實行得星距日次引求本天髙卑差以火星本輪全徑命為二千萬為一率本天髙卑大差二十五萬八千五百為二率火星均輪心距最卑之正矢為三率引數與半周相減即均輪心距最卑之度其距最卑過九十度則為矢以半徑與餘弦相加即得求得四率即本天髙卑差求太陽髙卑差以太陽本輪半徑命為二千萬為一率太陽髙卑大差二十三萬五千為二率本日太陽引數之正矢為三率引數過半周者與全周相減用其餘求得四率即太陽髙卑差求次輪半徑置火星最小次輪半徑六百三十萬二千七百五十加本天髙卑差又加太陽髙卑差得次輪半徑火星次輪半徑時時不同故須加本天髙卑差及太陽髙卑差詳五星厯理四求次均數篇求次均數星自次輪最逺㸃右旋行距日度用三角形法以次輪心距地心線為一邊即求初均數時所得次輪心距地心之邊次輪半徑為一邊星距日度為所夾之外角過半周者與全周相減用其餘求得地心對次輪半徑之角為次均數星距日初宫至五宫為加六宫至十一宫為減隨求星距地心之邊為求視緯之用求本道實行置初實行加減次均數得本道實行求距交實行置初實行減正交平行得距交實行求升度差以半徑一千萬為一率本道與黄道交角一度五十分之餘弦為二率距交實行之正切線為三率求得四率為黄道之正切線檢表得黄道度與距交實行相減餘為升度差距交實行不過象限為減過象限為加過二象限為減過三象限為加求黄道實行置本道實行加減升度差得黄道實行求初緯以半徑一千萬為一率本道與黄道交角一度五十分之正弦為二率距交實行之正弦為三率求得四率為初緯之正弦檢表得初緯求星距黄道線以半徑一千萬為一率初緯之正弦為二率次輪心距地心線為三率求得四率即星距黄道線求視緯以星距地心線為一率即求次均數時所得星距地心之邊星距黄道線為二率半徑一千萬為三率求得四率為視緯之正弦檢表得視緯距交實行初宫至五宫為黄道北六宫至十一宫為黄道南求黄道宿度依日躔求宿度法求得本年黄道宿鈐察黄道實行足減本年黄道宿鈐内某宿度分則減之餘為黄道宿度用表推火星法求諸年根用火星年根表察本年距冬至宫度分秒三十微進一秒下倣此得火星年根察本年最髙行宫度分秒得最髙年根察本年正交行宫度分秒得正交年根求諸日數用火星周嵗平行表察本日平行宫度分秒得火星日數察本日最髙行分秒得最髙日數察本日正交行秒微得正交日數求火星平行以火星年根與火星日數相加得火星平行求最髙平行以最髙年根與最髙日數相加得最髙平行求正交平行以正交年根與正交日數相加得正交平行求引數置火星平行減最髙平行得引數求初均及次輪心距地用火星均數表以引數宫度分察其與初均所對之度分秒得初均察其所對之次輪心距地數得次輪心距地并記初均加減號次輪心距地者即次輪心距地心之邊蓋火星次輪半徑時時不同則次均數亦時時不同須用三角形推算故先求次輪心距地心之邊為求次均之用也其獨不用中分者因次均數時時不同不能以中分比例而得故表不列次均亦即不用中分也求本天次輪半徑用火星均數表以引數宫度分察其所對之次輪半徑本數得本天次輪半徑本天次輪半徑者乃火星最小次輪半徑加本天髙卑差之數故以引數察表則本天髙卑差已加在其中也求太陽髙卑差用火星均數表以本日太陽引數宫度分加減六宫不及六宮則加六宮過六宫則減六宫察其所對之太陽髙卑差數即太陽髙卑差太陽引數加減六宫者因火星自最髙起算太陽自最卑起算故加減六宫方與表相應求次輪實半徑置本天次輪半徑加太陽髙卑差得次輪實半徑次輪實半徑者即本日次輪半徑因先有本天次輪半徑故以實别之求初實行置火星平行加減初均數得初實行求星距日次引置本日太陽實行減初實行得星距日次引求半外角星距日次引不過半周者折半得半外角星距日次引過半周者與全周相減餘數折半得半外角求半較角以次輪實半徑與次輪心距地數相加為一率相減為二率半外角之正切線為三率求得四率為半較角之正切線檢表得半較角求次均數置半外角減半較角得次均數星距日初宫至五宫為加六宫至十一宫為減求本道實行置初實行加減次均數得本道實行求距交實行置初實行減正交平行得距交實行求升度差用火星升度差表以距交實行宫度察其所對之分秒得升度差并記加減號求黄道實行置本道實行加減升度差得黄道實行求星距黄道線用火星距黄道表以距交實行宫度察其所對之數得星距黄道線并記南北號求星距地心線以次均數之正弦為一率次輪實半徑為二率星距日次引之正弦為三率星距日次引過半周者減半周用其餘求得四率即星距地心線火星次輪半徑旣時時不同則星距地亦時時不同故不能列表而用三角形比例求之也求視緯以星距地心線為一率星距黄道線為二率次輪心距地為三率求得四率為視緯之正弦檢表得視緯前法以半徑為一率初緯正弦為二率次輪心距地心線為三率求得四率為星距黄道線此第一比例也又以星距地心線為一率星距黄道線為二率半徑為三率求得四率為視緯正弦此第二比例也因第一比例之一率四率即第二比例之二率三率一率四率相乗原與二率三率相乗之數等而表中所列星距黄道線又即初緯之正弦故即用第一比例之二率三率而用第二比例之一率即得第二比例之四率也求黄道宿度依日纏求宿度法求得本年黄道宿鈐察黄道實行足減本年黄道宿鈐内某宿度分則減之餘為黄道宿度御製厯象考成下編卷七
