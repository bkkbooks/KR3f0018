body:
  text: 欽定四庫全書御製厯象考成表卷九土星表土星年根表土星周歲平行表土星周日平行表土星均數表土星升度差表土星距黄道表土星距地表土星年根表土星年根表以距冬至及最高行正交行逐年列之前用紀年者乃厯元後逐年之干支也表名距冬至者乃逐年天正冬至次日子正土星平行距丑宫初度之宫度也求逐年距冬至法厯元甲子年天正冬至土星平行應七宫二十三度一十九分四十四秒五十五微即厯元甲子年土星平行距冬至之數此後用加法如本年為平年則加三百六十五日之土星平行一十二度一十三分三十九秒四十九微二十三纖一十一忽三十芒即得次年距冬至之數如本年為閏年則加三百六十六日之土星平行一十二度一十五分四十秒二十五微三十一纖一十八忽三十六芒即得次年距冬至之數加滿十二宫者去之滿三十纖以上者進作一微不足三十纖者去之後倣此最高行者乃逐年天正冬至次日子正最高過冬至之宫度也求逐年最高行法厯元甲子年天正冬至最高應十一宫二十八度二十六分零六秒零五微即厯元甲子年最高過冬至之數此後用加法如本年為平年則加三百六十五日之最高行一分二十秒零八微四十八纖三十二忽四十五芒即得次年最高過冬至之數如本年為閏年則加三百六十六日之最高行一分二十秒二十一微五十九纖零二忽零六芒即得次年最高過冬至之數正交行者乃逐年天正冬至次日子正正交過冬至之宫度也求逐年正交行法厯元甲子年天正冬至正交應六宫二十一度二十分五十七秒二十四微即厯元甲子年正交過冬至之數此後用加法如本年為平年則加三百六十五日之正交行四十一秒五十一微二十纖零五十七芒即得次年正交過冬至之數如本年為閏年則加三百六十六日之正交行四十一秒五十八微一十二纖五十忽一十四芒即得次年正交過冬至之數用表之法如求康熙六十一年壬寅之年根則察本表紀年自厯元甲子年後第一壬寅為所求之年乃視壬寅所對各數録之其距冬至為十一宫零八度一十七分零三秒三十七微其最高行為十一宫二十九度一十六分五十三秒三十八微其正交行為六宫二十一度四十七分二十八秒五十七微也土星周歲平行表土星周歲平行表以土星平行及最高行正交行逐日列之其前用日數者自一日至三百六十六日之日數也表名平行者乃土星本輪自一日至三百六十六日之平行各數也土星每日平行二分零三十六微零八纖零七忽零六芒累加之即得逐日平行之各數最高行者乃土星本天自一日至三百六十六日之最高行各數也最高每日行一十三微一十纖二十九忽二十一芒累加之即得逐日最高行之各數正交行者乃自一日至三百六十六日之正交行各數也正交每日行六微五十二纖四十九忽一十九芒累加之即得逐日正交行之各數用表之法如求冬至後二十八日之土星平行及最高行正交行則察本表日數二十八所對各數録之其平行為五十六分一十六秒五十二微即二十八日土星平行之共數其最高行為六秒零九微即二十八日最高行之共數其正交行為三秒一十三微即二十八日正交行之共數也土星周日平行表土星周日平行表以一日内之時分秒遞降列之表分兩段第一段自一至三十者一時至三十時一分至三十分一秒至三十秒第二段三十一至六十者三十一時至六十時三十一分至六十分三十一秒至六十秒其所對之數則土星逐時逐分逐秒之平行數也土星每日之平行用二十四時除之得五秒零一微三十纖二十忽一十八芒是為一時之平行累加之為逐時之平行逐分逐秒之平行皆同數而遞降一位時之平行為分秒微分之平行為秒微纖秒之平行為微纖忽用表之法如求一十六時二十五分三十六秒之土星平行則察本表一十六時所對之數為一分二十秒二十四微二十五分所對之數為二秒零五微三十八纖三十六秒所對之數為三微零五十四忽合計三數得一分二十二秒三十二微三十八纖五十四忽即所求之土星平行也土星均數表土星均數表以引數宫度求初均及中分以星距日次引宫度求次均及較分初宫至五宫依次順列於前六宫至十一宫依次逆列於後表名初均者乃土星本輪均輪所生之均數順度為減逆度為加中分者則逐宫逐度次輪心距地心與最高距地心之較為六十分中之㡬分也求中分之法以土星次輪心在最髙距地心之一五六九一七四與土星次輪心在最卑距地心之九四三八二六相減餘一一三八三四八為一率六十分為二率逐宫逐度次輪心距地心與最高距地心相減餘為三率求得四率即逐宫逐度之中分也求次輪心距地心之法詳厯理求初均數篇次均者乃次輪心在最高土星行次輪周逐宫逐度之次均數順度為加逆度為減較分者則次輪心在最卑逐宫逐度之次均與次輪心在最高逐宫逐度之次均相較之數也求較分之法設次輪心在最卑求得逐宫逐度之次均數與次輪心在最高逐宫逐度之次均數相減即得用表之法設土星引數為初宫四度一十分求初均及中分則察初宫四度一十分與初均所對之數為二十七分二十八秒其號為減即所求之初均其與中分所對之數為三秒即所求之中分也初宫在上故用順度又設星距日次引為十一宫二十五度求次均及較分則察十一宫二十五度與次均所對之數為二十六分五十五秒其號為減即所求之次均其與較分所對之數為二分五十五秒即所求之較分也十一宫在下故用逆度若引數或星距日次引有零分者按中比例法求之土星升度差表土星升度差表按兩交前後分順逆列之兩交後六宫列於上兩交前六宫列於下前後列距交本道度分順逆以别加減中列逐宫逐度之升度差土星距交實行在上六宫者用順度其號為減土星距交實行在下六宫者用逆度其號為加用表之法以距交實行之宫對距交實行之度其縱横相遇即所求之升度差也設土星距交實行為一宫八度求升度差則察一宫八度所對之數為一分三十七秒即所求之升度差其號為減是為減差也若距交實行有零分者亦按中比例法求之土星距黄道表土星距黄道表亦按兩交前後分順逆列之兩交後之各宫列於上初宫至二宫係正交後在黄道北六宫至八宫係中交後在黄道南其數同兩交前之各宫列於下三宫至五宫係中交前在黄道北九宫至十一宫係正交前在黄道南其數同前後列距交本道度中列逐宫逐度之星距黄道數即次輪心距黄道之數土星距交實行在上六宫者用順度土星距交實行在下六宫者用逆度用表之法以距交實行之宫對距交實行之度其縱横相遇即所求之星距黄道線也設土星距交實行為初宫五度求星距黄道線則察初宫五度所對之數為三八二七即所求之土星距黄道線也若距交實行有零分者亦按中比例法求之土星距地表土星距地表按星距日次引宫度分順逆列之初宫至五宫列於上六宫至十一宫列於下前後列星距日次引度中列逐宫逐度之星距地數星距地者乃次輪心在中距土星行次輪周逐宫逐度之距地心線土星距日次引在上六宫者用順度土星距日次引在下六宫者用逆度用表之法以星距日次引之宫對星距日次引之度其縱横相遇即所求之星距地心線也設土星距日次引為初宫一十二度求星距地心線則察初宫一十二度所對之數為一一二一九四八即所求之星距地心線也若星距日次引有零分者亦按中比例法求之御製厯象考成表卷九
