body:
  text: 欽定四庫全書御製厯象考成表卷十四恒星表恒星黄道經緯度表恒星赤道經緯度表恒星赤道經緯度歲差表凌犯恒星黄道經緯度表恒星黄道經緯度表恒星黃道經緯度表以厯元康熙二十三年甲子之黃道經緯度列之上列星名次列黃道經度次列黃道緯度下列星等用表之法設康熙甲子年日躔黃道初宮八度求黃道宿度則察恒星黃道經緯度表斗宿第一星黃道經度為初宮五度五十分取相近畧小者用與日躔黃道經度相減餘二度一十分即太陽入斗宿二度一十分也若求厯元後各年之黃道宿度則以所求之年距厯元若干年與歲差五十一秒相乘得數加於各宿黃道經度然後與諸曜黃道經度相減餘即為諸曜黃道宿度也恒星赤道經緯度表恒星赤道經緯度表亦以厯元康熙二十三年甲子之赤道經緯度列之上列星名次列赤道經度次列赤道緯度下列星等用表之法設康熙甲子年月離赤道一宮二度四十分求赤道宿度則察恒星赤道經度表牛宿第一星赤道經度為一宮初度五十一分取相近畧小者用與月離赤道經度相減餘一度四十九分即太陰入牛宿一度四十九分也若求厯元後各年之赤道宿度則以所求之年距厯元若干年與各星每年赤道歲差之數相乘察赤道歲差表得數加於各星赤道經度然後與諸曜赤道經度相減餘即為諸曜赤道宿度也恒星赤道經緯度歲差表恒星赤道經緯度歲差表以各星每年應加減之數列之上列星名次列經度歲差次列緯度歲差用表之法設康熙六十一年壬寅求斗宿第一星赤道經緯度則以壬寅年距厯元甲子年三十八年與斗宿經度歲差加五十七秒零八微相乘得三十六分一十一秒零四微即赤道經度應加之數與厯元甲子年斗宿第一星赤道經度初宮六度三十三分相加得初宮七度零九分一十一秒零四微即所求壬寅年斗宿第一星之赤道經度也又以三十八年與斗宿一星緯度歲差減二秒二十五微相乘得一分三十一秒五十微即赤道緯度應減之數與厯元甲子年斗宿第一星赤道緯度南二十七度一十二分相減餘二十七度一十分二十八秒一十微即所求壬寅年斗宿第一星之赤道南緯度也凌犯恒星黃道經緯度表凌犯恒星黃道經緯度表取黃道南北十度以内之恒星黃道經緯度列之葢七政出入黃道不過十度故列十度以内之恒星為取凌犯之用其經度皆以厯元康熙二十三年甲子為定若求厯元後各年之凌犯須依法每年加歲差五十一秒推之用表之法設本日太陰黃道經度申宮八度二十分次日太陰黃道經度申宮二十度三十一分緯度在黃道南二度一十分則察本表内自參旗第一星黃道經度五宮九度零三分起至天關星黃道經度五宮二十度二十二分止皆為本日太陰所經厯之星乃察其間各星緯度惟天高第一星緯度在黃道南一度五十分與太陰緯度相減餘二十分即為本日太陰犯天高第一星太陰在下相離二十分太陰在星之南故為下又天關星緯度在黄道南二度一十四分與太陰緯度相減餘四分即為本日太陰凌天關星太陰在上四分也太陰在星之北故為上其餘諸星雖與太陰有經度相同之時求時刻詳本法而緯度之南北相去甚遠不得相凌犯矣御製厯象考成表卷十四
