body:
  text: 欽定四庫全書御製厯象考成表卷十五黄赤經緯互推表上黄道緯北初度至十度黄赤經緯互推表黄赤經緯互推表以黄道經度與赤道經緯度按黄道緯度之南北逐段列之黄道北初度與黄道南初度皆正當黄道無距緯其赤道經度即黄赤升度其赤道緯度即黄赤距緯而距黄道南北有緯度者則赤道經緯逐度不同故以黄道北與黄道南分為上下二卷自黄道北初度至黄道北十度自黄道南初度至黄道南十度又各分為十段月五星距黄道皆在十度以内中列相當之赤道經緯度分用表之法按黄道緯度之南北察黄道經度其所對之數即所求之赤道經緯度也表以逐度為率若經緯度俱有零分者用中比例三次求之設黄道經度初宮一十二度二十分黄道北緯度一度二十四分求其相當之赤道經緯度則察本表黄道經度初宮一十二度與黄道緯北一度所對之赤道經度為一十二度五十七分零六秒與下層黄道經度初宮一十三度與黄道緯北一度所對之赤道經度一十四度零一分三十秒相減餘一度零四分二十四秒為黄經一度之較乃以一度化作六十分為一率較數一度零四分二十四秒化作三千八百六十四秒為二率設數二十分為三率求得四率一千二百八十八秒收作二十一分二十八秒與初宮一十二度所對之赤道經度一十二度五十七分零六秒相加因十三度之數大於十二度之數故相加反是則相減也得一十三度一十八分三十四秒為黄道經度初宮一十二度二十分黄道緯北一度之赤道經度又察黄道經度初宮一十二度與黄道緯北二度所對之赤道經度為一十二度五十一分二十二秒與下層黄道經度初宮一十三度與黄道緯北二度所對之赤道經度一十三度五十五分一十七秒相減餘一度零三分五十五秒為黄經一度之較乃以一度化作六十分為一率較數一度零三分五十五秒化作三千八百三十五秒為二率設數二十分為三率求得四率一千二百七十八秒收作二十一分一十八秒與初宮一十二度所對之赤道經度一十二度五十一分二十二秒相加得一十三度一十二分四十秒為黄道經度初宮一十二度二十分黄道緯北二度之赤道經度復以比例所得之兩赤道經度相減餘五分五十四秒為黄緯一度之較乃以一度化作六十分為一率較數五分五十四秒化作三百五十四秒為二率設數二十四分為三率求得四率一百四十二秒收作二分二十二秒與緯北一度之赤道經度一十三度一十八分三十四秒相減因二度之數小於一度之數故相減反是則相加也餘一十三度一十六分一十二秒即所求黄道經度初宮一十二度二十分黄道緯北一度二十四分相當之赤道經度也求赤道緯度倣此御製厯象考成表卷十五
